/* horizontal swipe on a card: left to remove, right to tick.
   Only engages once the movement is clearly sideways, so the list still scrolls. */
function attachSwipe(el,{onLeft,onRight,leftLabel,rightLabel}){
  let x0=0,y0=0,dx=0,live=false,decided=false;
  const TH=64;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    x0=e.clientX;y0=e.clientY;dx=0;live=true;decided=false;});
  el.addEventListener('pointermove',e=>{
    if(!live)return;
    const ax=e.clientX-x0, ay=e.clientY-y0;
    if(!decided){
      if(Math.abs(ay)>Math.abs(ax)){live=false;return;}
      if(Math.abs(ax)<10)return;
      decided=true; el.classList.add('swiping');
    }
    dx=ax;
    if((dx<0&&!onLeft)||(dx>0&&!onRight))dx=0;
    el.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)';
    el.dataset.swipe=dx<-TH?'left':dx>TH?'right':'';
  });
  const end=()=>{
    if(!live){el.style.transform='';el.classList.remove('swiping');return;}
    live=false; el.classList.remove('swiping'); el.style.transform='';
    const hit=el.dataset.swipe; el.dataset.swipe='';
    if(hit==='left'&&onLeft)onLeft();
    if(hit==='right'&&onRight)onRight();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}

async function resumeSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('ab-session')||'null'); }catch(e){}
  if(!s||!s.r)return false;
  try{
    const n=(s.exp&&s.exp>Date.now()+60000)?{access_token:s.t,refresh_token:s.r,expires_in:(s.exp-Date.now())/1000}
      :await auth('token?grant_type=refresh_token',{refresh_token:s.r});
    TOKEN=n.access_token;
    const me=await api('lod_members?user_id=eq.'+
      (n.user?n.user.id:(JSON.parse(atob(n.access_token.split('.')[1])).sub))+'&limit=1');
    if(!me.length){TOKEN=null;return false;}
    USER={id:me[0].user_id,email:me[0].email,name:me[0].name||me[0].email,role:me[0].role};
    if(me[0].prefs)loadPrefs(me[0].prefs);
    try{localStorage.setItem('ab-session',JSON.stringify(
      {t:n.access_token,r:n.refresh_token||s.r,exp:Date.now()+(n.expires_in||3600)*1000}));}catch(e){}
    return true;
  }catch(e){ TOKEN=null; try{localStorage.removeItem('ab-session');}catch(_){} return false; }
}

/* ---------- log a new submission cycle ---------- */
function revBasis(docId,leg){
  const rows=(HIST[docId]||[]).filter(x=>x.leg===leg&&x.submitted)
    .sort((a,b)=>String(a.submitted).localeCompare(String(b.submitted)));
  const label=leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden';
  if(!rows.length)return 'First '+label+' cycle — starting at '+(leg==='HESCO'?'V0':'A01')+'.';
  const last=rows[rows.length-1];
  return 'Next after '+esc(last.rev)+' on this leg, sent '+esc(last.submitted)+'.';
}
function nextRev(docId,leg){
  const rows=(HIST[docId]||[]).filter(x=>x.leg===leg);
  const nums=rows.map(x=>{const m=/(\d+)/.exec(x.rev||'');return m?+m[1]:-1;});
  const top=nums.length?Math.max(...nums):-1;
  if(leg==='HESCO')return top<0?'V0':'V'+String(top+1).padStart(2,'0');
  return 'A'+String((top<0?0:top)+1).padStart(2,'0');
}
const OUTCOMES={
  HESCO:['','RNC','RWC'],                       // AWPT's review of HESCO's work
  Maaden:['','Code A','Code B','Rejected']      // the Client's codes
};
const OUTCOME_HINT={
  HESCO:'RNC — AWPT reviewed with no comments; HESCO prepares the submittal to Maaden. RWC — returned to HESCO with comments.',
  Maaden:'Code A approved · Code B approved with comments · Rejected. Deemed approval is applied automatically after 10 working days on IFI documents.'
};
function editHistRow(r,id){
  if(!canEdit())return toast('Your account cannot edit');
  const all=(HIST[r.id]||[]);
  const c=all.find(x=>x.id===id); if(!c)return;
  const same=all.filter(x=>x.leg===c.leg);
  const isLatest=!same.some(x=>String(x.submitted||'')>String(c.submitted||''));
  msgBox((c.leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden')+' · '+(c.rev||''),'',
    `<div class="itemhd">${esc(r.title||'')}<span>${esc(r.docNumber||r.ref||'')}</span></div>
     <label class="fl">Sent</label>
     <input class="f big" id="ehSent" type="date" value="${esc(c.submitted||'')}">
     <label class="fl">Reply received</label>
     <input class="f big" id="ehResp" type="date" value="${esc(c.responded||'')}">
     <label class="fl">Outcome</label>
     <select class="f big" id="ehOut">
       ${OUTCOMES[c.leg].map(o=>`<option value="${esc(o)}"${o===c.status?' selected':''}>${
         o?esc(o):'— no reply yet —'}</option>`).join('')}
       ${c.status&&!OUTCOMES[c.leg].includes(c.status)
         ? `<option value="${esc(c.status)}" selected>${esc(c.status)}</option>`:''}
     </select>
     <div class="hint" style="margin-top:5px">${OUTCOME_HINT[c.leg]}</div>
     <div class="hint" id="ehNote" style="margin-top:10px"></div>`,
    [['Remove this cycle',()=>removeHistRow(r,id),'danger'],['Save',async()=>{
      const sent=document.getElementById('ehSent').value;
      const resp=document.getElementById('ehResp').value;
      const out=resp?document.getElementById('ehOut').value.trim():'';
      try{
        await api('lod_history?id=eq.'+id,{method:'PATCH',body:JSON.stringify({
          submitted:sent,responded:resp,status:out,
          days:(sent&&resp&&resp>=sent)?days(sent,resp):null})});
        await loadRevsFor(r.id);
        const fresh=await api('lod_docs?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        if(MOBILE)mobRender(); else refresh();
        toast((c.rev||'Cycle')+' updated');
      }catch(e){ toast('Could not save that cycle'); }
    },'primary']]);
  const enote=()=>{
    const el=document.getElementById('ehNote'); if(!el)return;
    const resp=document.getElementById('ehResp').value;
    const sel=document.getElementById('ehOut');
    sel.disabled=!resp; if(!resp)sel.value='';
    const out=sel.value;
    let st,hold;
    if(c.leg==='Maaden'){
      st=resp?(out||'Under review'):'Under review';
      hold=['Code A','Code B','Deemed'].includes(st)?'Closed'
           :st==='Rejected'?'HESCO':'Maaden';
    } else {
      st=resp?(out||'RWC'):'Under AWPT review';
      hold=resp?'HESCO':'AWPT';
    }
    el.innerHTML=isLatest
      ? `As the latest cycle, the document will read <b>${esc(st)}</b> with
         <b>${esc(hold)}</b> holding it.`
      : 'An earlier cycle — the document keeps the status its latest cycle gives it.';
  };
  ['ehSent','ehResp','ehOut'].forEach(id=>{
    const e=document.getElementById(id); if(e)e.onchange=enote;});
  enote();
}
function removeHistRow(r,id){
  const c=(HIST[r.id]||[]).find(x=>x.id===id); if(!c)return;
  const others=(HIST[r.id]||[]).filter(x=>x.id!==id&&x.submitted)
    .sort((a,b)=>String(a.submitted).localeCompare(String(b.submitted)));
  const next=others[others.length-1];
  const after=!next
    ? 'Nothing else has been recorded, so the document goes back to <b>Not issued</b> with no dates.'
    : `The document will follow <b>${esc(next.rev)}</b>
       (${next.leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden'}, sent ${esc(next.submitted)}${
        next.responded?', replied '+esc(next.responded):', no reply yet'}).`;
  msgBox('Remove '+(c.rev||'this cycle')+'?','',
    `<b>${esc(r.title||'')}</b><br><br>
     ${c.leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden'} · sent ${esc(c.submitted||'—')}${
       c.responded?', replied '+esc(c.responded):''}.<br><br>
     ${after}<br><br>
     <b>This cannot be undone.</b>`,
    [['Keep it',null,''],['Remove',async()=>{
      try{
        await api('lod_history?id=eq.'+id,{method:'DELETE'});
        await loadRevsFor(r.id);
        // the database re-derives the document from whatever cycles remain
        const fresh=await api('lod_docs?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        await logAct('edit',r,'cycle removed',(c.leg||'')+' '+(c.rev||''),'');
        if(MOBILE)mobRender(); else refresh();
        toast((c.rev||'Cycle')+' removed — now with '+(r.holder||''));
      }catch(e){ toast('Could not remove that cycle'); }
    },'danger']]);
}

    </select>
    <div class="hint" style="margin-top:5px">${OUTCOME_HINT[leg]}</div>
    <div class="hint" id="lgNote" style="margin-top:10px"></div>`;
  const note=()=>{
    const leg=document.getElementById('lgLeg').value;
    const resp=document.getElementById('lgResp').value;
    const out=document.getElementById('lgOut').value;
    const el=document.getElementById('lgNote'); if(!el)return;
    let holder,status;
    if(leg==='Maaden'){
      holder=resp?(['Code A','Code B'].includes(out)?'Closed':'HESCO'):'Maaden';
      status=resp?(out||'Under review'):'Under review';
    } else {
      holder=resp?'HESCO':'AWPT';        // RNC or RWC, it goes back to HESCO
      status=resp?(out||'RWC'):'Under AWPT review';
    }
    el.innerHTML=`The document will read <b>${esc(status)}</b> with
      <b>${esc(holder)}</b> holding it, and the day count restarts.`+
      (leg==='HESCO'&&resp&&out==='RNC'
        ?' AWPT has cleared it — HESCO now prepares the submittal to Maaden.':'');
  };
  const rebuild=()=>{
    const leg=document.getElementById('lgLeg').value;
    const box=document.getElementById('lgWrap');
    box.innerHTML=form(leg); wire();
  };
  const wire=()=>{
    const L=document.getElementById('lgLeg');
    L.onchange=rebuild;
    const re=document.getElementById('lgRevEdit');
    if(re)re.onclick=()=>{const f=document.getElementById('lgRev');
      f.removeAttribute('readonly'); f.focus(); f.select(); re.remove();};
    ['lgResp','lgOut'].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=note;});
    note();
  };
  msgBox('Log a submission','',`<div id="lgWrap">${form(leg0)}</div>`,
    [['Cancel',null,''],['Save',async()=>{
      const leg=document.getElementById('lgLeg').value;
      const rev=document.getElementById('lgRev').value.trim();
      const sent=document.getElementById('lgSent').value;
      const resp=document.getElementById('lgResp').value;
      const out=document.getElementById('lgOut').value;
      if(!rev||!sent)return toast('A revision and a date sent are needed');
      try{
        await api('lod_history',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({
          docId:r.id,leg,rev,submitted:sent,responded:resp||'',status:resp?(out||''):'',
          days:(resp&&sent&&resp>=sent)?days(sent,resp):null,
          source:(USER&&USER.email)||'app'})});
        // status, ball in court and the dates are derived by the database from
        // the cycles — the app records the cycle and reads the result back
        logAct('edit',r,'submission','',leg+' '+rev+' '+sent);
        await loadRevsFor(r.id);
        const fresh=await api('lod_docs?id=eq.'+r.id+'&limit=1');
        if(fresh&&fresh[0])Object.assign(r,fresh[0]);
        if(MOBILE)mobRender(); else refresh();
        toast(rev+' logged — now with '+(r.holder||''));
      }catch(e){
        if(e&&e.cur){ Object.assign(r,e.cur);
          msgBox('Someone else changed this document','',
            'Your submission was not logged because the document moved on. Reopen it and try again.',
            [['OK',null,'primary']]); }
        else toast('Could not log that submission');
      }
    },'primary']]);
  wire();
}

function paintCycles(w,r){
  w.el.querySelector('.wt').innerHTML=esc(r.docNumber||r.ref)+'<small>'+esc(r.title)+'</small>';
  w.body.innerHTML='<div class="dash"><div class="panel">'+
    (canEdit()?'<div class="planbar" style="margin-bottom:11px"><button class="btn primary" id="hlog">Log a submission</button></div>':'')+
    historyHTML(r)+'</div></div>';
  const lb=w.body.querySelector('#hlog'); if(lb)lb.onclick=()=>logCycle(r);
  if(canEdit())w.body.querySelectorAll('[data-hid]').forEach(el=>
    el.onclick=()=>editHistRow(r,+el.dataset.hid));
}
/* keep an open history window in step — otherwise a removed cycle lingers

function refreshHistory(){
  const w=[...WINS.values()].find(x=>x.kind==='hist');
  if(!w||!w.rowId)return;
  const r=AB.find(x=>x.id===w.rowId);
  if(r)paintCycles(w,r);
}

async function boot(){
  try{ const th=localStorage.getItem('ab-theme'); document.documentElement.dataset.theme=(th||'dark'); }catch(e){}
  loadPrefs();   /* whatever this browser last had, so there is no flash of the wrong theme */
  const ok=await resumeSession();
  if(ok){
    try{ await loadData(); startApp(); return; }
    catch(e){ console.warn('Could not load the register',e); }
  }
  document.getElementById('login').classList.add('on');
  loadDirectory();
}
