<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Action list</title>
<style>
/* ============================================================
   Action list — a spreadsheet, not a to-do app.
   Midnight violet, one file, no build step.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --page1:#150e26; --page2:#0a0613;
  --surface:#171029; --card:#1b1330; --card2:#221739; --chip:#251a42;
  --line:#332552; --line2:#3f2d67;
  --ink:#f5f2ff; --ink2:#bdb2d8; --ink3:#8b81a8;
  --violet:#a855f7; --violet2:#7c3aed; --violetDim:rgba(168,85,247,.16);
  --good:#34d399; --warn:#fbbf24; --hot:#f43f5e; --sky:#38bdf8;
  --p1:#f43f5e; --p2:#fb923c; --p3:#38bdf8; --p4:#8b81a8;
  --shadow:0 14px 40px rgba(10,4,26,.6),0 2px 10px rgba(10,4,26,.5);
  --glow:0 0 0 1px rgba(168,85,247,.22),0 18px 50px rgba(88,28,135,.45);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --rowh:32px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 12% -10%, rgba(124,58,237,.22), transparent 60%),
    radial-gradient(900px 520px at 88% 0%,  rgba(168,85,247,.16), transparent 62%),
    linear-gradient(180deg,var(--page1),var(--page2) 60%);
  background-attachment:fixed;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f2d67;border-radius:8px;border:2px solid transparent;
  background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#5b3fa0;background-clip:content-box}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;opacity:0;
  transition:opacity .45s var(--ease)}
#app.ready{opacity:1}

header{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--violet),var(--violet2));
  box-shadow:0 6px 18px rgba(124,58,237,.5);position:relative;overflow:hidden}
.brand .mark:after{content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5),transparent 70%);
  transform:translateX(-100%);animation:sheen 5.5s var(--ease) infinite}
@keyframes sheen{0%,72%{transform:translateX(-100%)}88%,100%{transform:translateX(120%)}}
.brand b{font-size:16px;letter-spacing:-.01em;display:block}
.brand small{display:block;color:var(--ink3);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.hgrow{flex:1}

/* ---------- toolbar ---------- */
.tools{display:flex;align-items:center;gap:7px;padding:0 20px 10px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:12.5px;
  font-weight:600;color:var(--ink2);transition:.18s var(--ease);display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap;background:rgba(27,19,48,.6)}
.tbtn:hover{border-color:var(--violet);color:#e9d5ff;transform:translateY(-1px)}
.tbtn:disabled{opacity:.38;cursor:default;transform:none;border-color:var(--line2);color:var(--ink3)}
.tbtn.primary{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.38)}
.tbtn.danger:hover{border-color:var(--hot);color:#fda4af}
.tsep{width:1px;height:22px;background:var(--line2);margin:0 3px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:210px;flex:1;
  max-width:340px;transition:.2s var(--ease)}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.13)}
.search input{flex:1;background:none;border:0;outline:none;font-size:13px;min-width:0}
.search input::placeholder{color:var(--ink3)}
.search .x{color:var(--ink3);font-size:15px;line-height:1}

/* ---------- the grid ---------- */
.gwrap{flex:1;overflow:auto;margin:0 20px;border:1px solid var(--line);
  border-radius:13px;background:rgba(23,16,41,.55);position:relative}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  table-layout:fixed;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-right:1px solid rgba(63,45,103,.55);
  border-bottom:1px solid rgba(51,37,82,.7);padding:0;overflow:hidden;position:relative}
table.g thead th{
  position:sticky;top:0;z-index:6;background:linear-gradient(180deg,#241a3f,#1d1533);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);text-align:left;height:36px;white-space:nowrap;user-select:none}
table.g thead th .hin{display:flex;align-items:center;gap:6px;padding:0 9px;height:100%}
table.g thead th .lb{overflow:hidden;text-overflow:ellipsis}
table.g thead th .sortmark{color:var(--violet);font-size:10px}
table.g thead th .fbtn{margin-left:auto;color:var(--ink3);font-size:10px;padding:2px 4px;
  border-radius:5px;line-height:1;flex:none}
table.g thead th .fbtn:hover{background:rgba(168,85,247,.2);color:#e9d5ff}
table.g thead th .fbtn.on{color:var(--violet);background:rgba(168,85,247,.18)}
.rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:8}
.rsz:hover{background:rgba(168,85,247,.45)}

table.g td{height:var(--rowh);vertical-align:middle;font-size:13px}
table.g td .cv{padding:0 9px;line-height:calc(var(--rowh) - 2px);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
table.g tbody tr:nth-child(even) td{background:rgba(255,255,255,.014)}
table.g tbody tr:hover td{background:rgba(168,85,247,.045)}
td.rowno,th.rowno{width:54px;text-align:center;color:var(--ink3);font-size:11.5px;
  background:linear-gradient(90deg,#211838,#1c1431);position:sticky;left:0;z-index:4;
  user-select:none;cursor:pointer}
thead th.rowno{z-index:7}
tr.picked td.rowno{background:rgba(168,85,247,.3);color:#e9d5ff}
td.c-title{position:sticky;left:54px;z-index:3;background:#1a1230}
thead th.c-title{left:54px;z-index:7}
tr:nth-child(even) td.c-title{background:#1c1433}
table.g td.sel{background:rgba(168,85,247,.16)!important;
  box-shadow:inset 0 0 0 1px rgba(168,85,247,.24)}
table.g td.cur{background:rgba(168,85,247,.22)!important;
  box-shadow:inset 0 0 0 2px var(--violet);z-index:2}
table.g td.ro .cv{color:var(--ink3)}
.cellin{position:absolute;inset:0;width:100%;height:100%;background:#120c21;
  border:2px solid var(--violet);outline:none;padding:0 7px;font-size:13px;color:var(--ink);
  z-index:12;border-radius:0}
select.cellin{padding:0 4px}
.dirty:after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;
  border-radius:50%;background:var(--warn)}

/* chips inside cells */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;
  font-size:11.5px;font-weight:650;line-height:18px}
.st-open{background:rgba(56,189,248,.15);color:#7dd3fc}
.st-prog{background:rgba(251,191,36,.15);color:#fcd34d}
.st-hold{background:rgba(139,129,168,.18);color:#c4bcda}
.st-closed{background:rgba(52,211,153,.15);color:#6ee7b7}
.pr{display:inline-block;width:20px;text-align:center;border-radius:6px;font-size:11.5px;
  font-weight:700;line-height:19px}
.pr1{background:rgba(244,63,94,.18);color:#fda4af}
.pr2{background:rgba(251,146,60,.18);color:#fdba74}
.pr3{background:rgba(56,189,248,.16);color:#7dd3fc}
.pr4{background:rgba(139,129,168,.16);color:#b8b0cd}
.late{color:#fda4af;font-weight:650}
.duetoday{color:var(--warn);font-weight:650}

/* ---------- filter menu ---------- */
.menu{position:fixed;z-index:90;background:linear-gradient(180deg,#241a3f,#191131);
  border:1px solid rgba(168,85,247,.28);border-radius:12px;box-shadow:var(--glow);
  padding:9px;width:236px;display:none;animation:rise .18s var(--ease)}
.menu.on{display:block}
.menu .mi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  font-size:12.5px;color:var(--ink2);width:100%;text-align:left}
.menu .mi:hover{background:var(--chip);color:var(--ink)}
.menu .msep{height:1px;background:var(--line);margin:6px 2px}
.menu input.f{width:100%;background:rgba(18,12,33,.85);border:1px solid var(--line2);
  border-radius:8px;padding:6px 9px;outline:none;font-size:12.5px;margin-bottom:6px}
.menu .vals{max-height:190px;overflow:auto;margin:2px 0}
.menu .vals label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  font-size:12.5px;color:var(--ink2);cursor:pointer}
.menu .vals label:hover{background:var(--chip)}
.menu .vals input{accent-color:var(--violet)}
.menu .row{display:flex;gap:6px;margin-top:6px}
.menu .row button{flex:1;border:1px solid var(--line2);border-radius:8px;padding:6px 0;
  font-size:12px;color:var(--ink2)}
.menu .row button:hover{border-color:var(--violet);color:#e9d5ff}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:center;gap:14px;padding:9px 22px calc(11px + var(--safe-b));
  font-size:12px;color:var(--ink3);flex-wrap:wrap}
.statusbar b{color:var(--ink2);font-weight:650}
.statusbar .kpi{display:inline-flex;align-items:center;gap:6px}
.statusbar .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,3,14,.66);
  backdrop-filter:blur(3px);display:none;place-items:center;padding:20px}
.scrim.on{display:grid}
.dlg{width:min(520px,100%);max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,rgba(35,25,62,.98),rgba(20,14,38,.99));
  border:1px solid rgba(168,85,247,.26);border-radius:18px;padding:24px;
  box-shadow:var(--glow);animation:rise .3s var(--ease)}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg p.d{margin:0 0 18px;color:var(--ink3);font-size:13px}
.dlg .fld{margin-bottom:14px}
.dlg label{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:rgba(18,12,33,.85);
  border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.dlg .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
@keyframes rise{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,26px);z-index:120;
  background:rgba(35,25,62,.97);border:1px solid rgba(168,85,247,.3);border-radius:13px;
  padding:11px 18px;font-size:13px;box-shadow:var(--glow);opacity:0;pointer-events:none;
  transition:.32s var(--ease);display:flex;align-items:center;gap:11px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .u{color:var(--violet);font-weight:700;cursor:pointer;pointer-events:auto}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:22px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(124,58,237,.25),transparent 65%),
             linear-gradient(180deg,var(--page1),var(--page2))}
#login.on{display:grid}
#login .box{width:min(400px,100%);
  background:linear-gradient(180deg,rgba(35,25,62,.96),rgba(20,14,38,.98));
  border:1px solid rgba(168,85,247,.25);border-radius:22px;padding:32px;box-shadow:var(--glow);
  animation:rise .55s var(--ease)}
#login h2{margin:0 0 6px;font-size:23px}
#login p{margin:0 0 22px;color:var(--ink3);font-size:13.5px}
#login input{width:100%;background:rgba(18,12,33,.8);border:1px solid var(--line2);
  border-radius:12px;padding:12px 14px;margin-bottom:11px;outline:none;transition:.2s}
#login input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
#login .tbtn{width:100%;justify-content:center;margin-top:6px;padding:12px}
#lerr{color:#fda4af;font-size:12.5px;min-height:18px;margin-top:9px}

@media (max-width:880px){
  header{padding:12px 12px 8px}
  .tools{padding:0 12px 8px}
  .gwrap{margin:0 10px}
  .statusbar{padding:8px 14px calc(10px + var(--safe-b));gap:10px}
  .search{min-width:150px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.06s!important}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2>Action list</h2>
    <p>Sign in to open your register.</p>
    <input id="lem" type="email" placeholder="Email" autocomplete="username">
    <input id="lpw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="tbtn primary" id="lgo">Sign in</button>
    <div id="lerr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div><b>Action list</b><small id="brandsub">register</small></div>
    </div>
    <div class="hgrow"></div>
    <div class="search">
      <span style="color:var(--ink3)">⌕</span>
      <input id="q" placeholder="Search every column…  Ctrl+F" autocomplete="off">
      <button class="x" id="qx" title="Clear">×</button>
    </div>
    <button class="tbtn" id="signout" title="Sign out">⎋</button>
  </header>

  <div class="tools">
    <button class="tbtn primary" id="badd">+ Add row</button>
    <button class="tbtn" id="bins">Insert above</button>
    <button class="tbtn danger" id="bdel">Delete rows</button>
    <div class="tsep"></div>
    <button class="tbtn" id="bcopy">Copy</button>
    <button class="tbtn" id="bpaste">Paste</button>
    <button class="tbtn" id="bfill">Fill down</button>
    <button class="tbtn" id="bundo" disabled>Undo</button>
    <div class="tsep"></div>
    <button class="tbtn" id="bxl">Export .xlsx</button>
    <button class="tbtn" id="bcsv">Export .csv</button>
    <button class="tbtn" id="bimp">Import</button>
    <div class="tsep"></div>
    <button class="tbtn" id="bclear">Clear filters</button>
    <button class="tbtn" id="bfit">Autofit</button>
    <input type="file" id="fimp" accept=".xlsx,.xls,.csv" style="display:none">
  </div>

  <div class="gwrap" id="gwrap" tabindex="0">
    <table class="g" id="grid"><thead id="ghead"></thead><tbody id="gbody"></tbody></table>
  </div>

  <div class="statusbar" id="sbar"></div>
</div>

<div class="menu" id="menu"></div>
<div class="scrim" id="scrim"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   Action list — spreadsheet register over task_items
   ============================================================ */
const SB_URL='https://ivmmnsjiekhjxkhllncb.supabase.co';
const SB_KEY='sb_publishable_RTHsaxZXVmRBQziLbFJX8g_PAaZzIbF';
const BUILD='ACTIONS 2026-08-27 · a1';

let SESSION=null, ROWS=[], VIEW=[], BUSY=false;
let SORT=null;                 /* {k,dir}  dir 1 asc, -1 desc              */
let FILT={};                   /* key -> {vals:Set|null, text:''}          */
let SEARCH='';
let CUR={r:0,c:1}, ANC={r:0,c:1};   /* focus cell and selection anchor     */
let EDIT=null;                 /* {r,c,el}                                 */
let UNDO=[];
let PREFS={w:{},rowh:32};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const isoDay=d=>{const x=(d instanceof Date)?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');};
const TODAY=()=>isoDay(new Date());

/* ---------- columns ---------- */
const STATUSES=['Open','In progress','On hold','Closed'];
const COLS=[
  {k:'__no',        lb:'No.',         w:54,  ro:true, kind:'no'},
  {k:'title',       lb:'Action',      w:330, kind:'text'},
  {k:'project',     lb:'Project',     w:135, kind:'text', suggest:true},
  {k:'responsible', lb:'Responsible', w:150, kind:'text', suggest:true},
  {k:'priority',    lb:'Priority',    w:92,  kind:'sel', opts:['1','2','3','4']},
  {k:'status',      lb:'Status',      w:126, kind:'sel', opts:STATUSES},
  {k:'raised',      lb:'Raised on',   w:112, kind:'date'},
  {k:'due',         lb:'Due',         w:112, kind:'date'},
  {k:'done_at',     lb:'Closed on',   w:112, kind:'date', ro:true},
  {k:'notes',       lb:'Notes',       w:300, kind:'text'}
];
const colOf=k=>COLS.findIndex(c=>c.k===k);
const FIRSTC=1;                                     /* No. is not editable */

/* ============================================================
   Talking to the database
   ============================================================ */
async function api(path,opts={},tries=0){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    apikey:SB_KEY,
    Authorization:'Bearer '+(SESSION?SESSION.access_token:SB_KEY),
    'Content-Type':'application/json',
    Prefer:'return=representation',
    ...(opts.headers||{})}});
  if(r.ok){const t=await r.text();return t?JSON.parse(t):null;}
  const body=await r.text();
  /* the token can be minted a moment ahead of the database's clock */
  if(/PGRST303|issued at future/.test(body)&&tries<4){
    await new Promise(res=>setTimeout(res,900+tries*700));
    return api(path,opts,tries+1);
  }
  if(r.status===401&&tries<1&&await resume())return api(path,opts,tries+1);
  throw new Error(friendly(body,r.status));
}
function friendly(body,status){
  try{const j=JSON.parse(body);
    if(/issued at future/.test(j.message||''))
      return 'The clock on this device is out of step with the server. Check the date and time, then try again.';
    if(j.message)return j.message;
  }catch(e){}
  return body.slice(0,140)||('Request failed ('+status+')');
}
async function signIn(email,pw){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pw})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Could not sign in');
  SESSION=d; save(); return d;
}
const save=()=>{try{localStorage.setItem('task-session',JSON.stringify(SESSION));}catch(e){}};
async function resume(){
  let s=null; try{s=JSON.parse(localStorage.getItem('task-session')||'null');}catch(e){}
  if(!s||!s.refresh_token)return false;
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok)return false;
  SESSION=await r.json(); save(); return true;
}

/* ---------- preferences (own storage key — the trackers share this domain) */
function loadPrefs(){
  try{const p=JSON.parse(localStorage.getItem('task-prefs')||'null');
    if(p&&p.w)PREFS=Object.assign(PREFS,p);}catch(e){}
  COLS.forEach(c=>{if(PREFS.w[c.k])c.w=PREFS.w[c.k];});
  document.documentElement.style.setProperty('--rowh',(PREFS.rowh||32)+'px');
}
function savePrefs(){
  PREFS.w={}; COLS.forEach(c=>PREFS.w[c.k]=c.w);
  try{localStorage.setItem('task-prefs',JSON.stringify(PREFS));}catch(e){}
}

/* ============================================================
   Loading
   ============================================================ */
const FIELDS='id,title,project,responsible,priority,status,raised,due,done,done_at,notes,sort,deleted_at';
async function loadAll(){
  const rows=await api('task_items?select='+FIELDS+'&deleted_at=is.null&order=sort.asc,id.asc');
  ROWS=rows||[];
  ROWS.forEach((r,i)=>{if(r.sort==null||r.sort===0)r.sort=i+1;});
}

/* ============================================================
   Filtering, sorting, searching
   ============================================================ */
function cellText(row,c){
  if(c.kind==='no')return '';
  const v=row[c.k];
  return v==null?'':String(v);
}
function passes(row){
  if(SEARCH){
    const hay=COLS.filter(c=>c.kind!=='no').map(c=>cellText(row,c)).join(' ').toLowerCase();
    if(!hay.includes(SEARCH))return false;
  }
  for(const k in FILT){
    const f=FILT[k]; if(!f)continue;
    const c=COLS[colOf(k)]; const v=cellText(row,c);
    if(f.vals&&!f.vals.has(v))return false;
    if(f.text&&!v.toLowerCase().includes(f.text.toLowerCase()))return false;
  }
  return true;
}
function rebuild(){
  VIEW=ROWS.filter(passes);
  if(SORT){
    const c=COLS[colOf(SORT.k)];
    VIEW.sort((a,b)=>{
      let x=cellText(a,c), y=cellText(b,c);
      if(c.kind==='sel'&&c.k==='priority'){x=+x||9;y=+y||9;}
      else if(c.kind==='date'){x=x||'9999';y=y||'9999';}
      else {x=x.toLowerCase();y=y.toLowerCase();}
      return (x<y?-1:x>y?1:0)*SORT.dir;
    });
  }else{
    VIEW.sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));
  }
  if(CUR.r>=VIEW.length)CUR.r=Math.max(0,VIEW.length-1);
  if(ANC.r>=VIEW.length)ANC.r=CUR.r;
}

/* ============================================================
   Drawing
   ============================================================ */
function head(){
  let h='<tr>';
  COLS.forEach((c,i)=>{
    const cls=(c.kind==='no'?'rowno':'')+(c.k==='title'?' c-title':'');
    const mark=SORT&&SORT.k===c.k?(SORT.dir>0?'▲':'▼'):'';
    const on=FILT[c.k]?'on':'';
    h+='<th class="'+cls+'" style="width:'+c.w+'px" data-c="'+i+'">'
      +'<div class="hin">'
      +(c.kind==='no'?'<span class="lb">'+esc(c.lb)+'</span>'
        :'<span class="lb" data-sort="'+c.k+'">'+esc(c.lb)+'</span>'
         +'<span class="sortmark">'+mark+'</span>'
         +'<button class="fbtn '+on+'" data-menu="'+c.k+'" title="Sort and filter">▼</button>')
      +'</div>'
      +(c.kind==='no'?'':'<div class="rsz" data-rsz="'+i+'"></div>')
      +'</th>';
  });
  return h+'</tr>';
}
function stCls(s){
  return s==='Closed'?'st-closed':s==='In progress'?'st-prog':s==='On hold'?'st-hold':'st-open';
}
function cellHTML(row,c,ri){
  if(c.kind==='no')return '<span class="cv">'+(ri+1)+'</span>';
  const v=row[c.k]==null?'':String(row[c.k]);
  if(c.k==='status')
    return '<span class="cv"><span class="st '+stCls(v)+'">'+esc(v||'Open')+'</span></span>';
  if(c.k==='priority')
    return '<span class="cv">'+(v?'<span class="pr pr'+esc(v)+'">'+esc(v)+'</span>':'')+'</span>';
  if(c.k==='due'&&v&&row.status!=='Closed'){
    const cls=v<TODAY()?'late':v===TODAY()?'duetoday':'';
    return '<span class="cv '+cls+'">'+esc(v)+'</span>';
  }
  return '<span class="cv">'+esc(v)+'</span>';
}
function body(){
  if(!VIEW.length)
    return '<tr><td colspan="'+COLS.length+'" style="height:120px;text-align:center;'
      +'color:var(--ink3)">Nothing to show. '
      +(Object.keys(FILT).length||SEARCH?'Clear the filters, or ':'')
      +'add a row.</td></tr>';
  const box=selBox();
  let h='';
  VIEW.forEach((row,ri)=>{
    const picked=ri>=box.r1&&ri<=box.r2;
    h+='<tr'+(picked?' class="picked"':'')+' data-r="'+ri+'">';
    COLS.forEach((c,ci)=>{
      const inBox=ri>=box.r1&&ri<=box.r2&&ci>=box.c1&&ci<=box.c2;
      const isCur=ri===CUR.r&&ci===CUR.c;
      const cls=[c.kind==='no'?'rowno':'', c.k==='title'?'c-title':'', c.ro?'ro':'',
                 inBox&&c.kind!=='no'?'sel':'', isCur?'cur':''].filter(Boolean).join(' ');
      h+='<td class="'+cls+'" data-r="'+ri+'" data-c="'+ci+'">'+cellHTML(row,c,ri)+'</td>';
    });
    h+='</tr>';
  });
  return h;
}
function paint(){
  rebuild();
  $('ghead').innerHTML=head();
  $('gbody').innerHTML=body();
  sbar();
  $('bundo').disabled=!UNDO.length;
}
function repaintBody(){ $('gbody').innerHTML=body(); sbar(); }

function selBox(){
  return {r1:Math.min(CUR.r,ANC.r), r2:Math.max(CUR.r,ANC.r),
          c1:Math.max(FIRSTC,Math.min(CUR.c,ANC.c)), c2:Math.max(CUR.c,ANC.c)};
}
function sbar(){
  const open=ROWS.filter(r=>r.status!=='Closed').length;
  const closed=ROWS.length-open;
  const late=ROWS.filter(r=>r.status!=='Closed'&&r.due&&r.due<TODAY()).length;
  const b=selBox();
  const n=(b.r2-b.r1+1)*(b.c2-b.c1+1);
  const pct=ROWS.length?Math.round(closed/ROWS.length*100):0;
  $('sbar').innerHTML=
     '<span><b>'+ROWS.length+'</b> actions</span>'
    +'<span><b>'+VIEW.length+'</b> shown</span>'
    +'<span class="kpi"><i class="dot" style="background:var(--sky)"></i>Open <b>'+open+'</b></span>'
    +'<span class="kpi"><i class="dot" style="background:var(--good)"></i>Closed <b>'+closed+'</b> ('+pct+'%)</span>'
    +(late?'<span class="kpi"><i class="dot" style="background:var(--hot)"></i>Past due <b>'+late+'</b></span>':'')
    +'<span class="hgrow"></span>'
    +(VIEW.length?'<span>'+(n>1?n+' cells selected':'Row '+(CUR.r+1)+' · '+COLS[CUR.c].lb)+'</span>':'')
    +'<span style="opacity:.55">'+BUILD+'</span>';
}

/* ============================================================
   Saving a cell
   ============================================================ */
function coerce(c,val){
  let v=String(val==null?'':val).trim();
  if(c.kind==='date'){
    if(!v)return '';
    const d=parseDate(v);
    return d||v;
  }
  if(c.k==='priority'){
    const n=parseInt(v,10);
    return (n>=1&&n<=4)?n:4;
  }
  if(c.k==='status'){
    if(!v)return 'Open';
    const hit=STATUSES.find(s=>s.toLowerCase()===v.toLowerCase());
    if(hit)return hit;
    if(/^(done|complete|completed|closed)$/i.test(v))return 'Closed';
    if(/^(wip|ongoing|in-progress)$/i.test(v))return 'In progress';
    return v;
  }
  return v;
}
function parseDate(v){
  v=String(v).trim();
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(v);        /* d/m/y */
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];
    return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  if(/^\d{5}$/.test(v)){                                  /* an Excel serial */
    const d=new Date(Date.UTC(1899,11,30+ +v));
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'
          +String(d.getUTCDate()).padStart(2,'0');
  }
  const d=new Date(v);
  return isNaN(d)?'':isoDay(d);
}
/* writes a set of {row,col,value} and records one undo step */
async function applyEdits(list,label){
  const back=[], byId={};
  list.forEach(e=>{
    const c=COLS[e.c], row=e.row;
    if(c.ro||c.kind==='no')return;
    const nv=coerce(c,e.v);
    if(String(row[c.k]??'')===String(nv))return;
    back.push({id:row.id,k:c.k,v:row[c.k]});
    row[c.k]=nv;
    (byId[row.id]=byId[row.id]||{})[c.k]=nv;
  });
  if(!back.length)return;
  UNDO.push({t:'cells',back,label:label||'edit'});
  if(UNDO.length>60)UNDO.shift();
  repaintBody(); $('bundo').disabled=false;
  for(const id in byId){
    try{
      const out=await api('task_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify(byId[id])});
      if(out&&out[0])Object.assign(ROWS.find(r=>r.id==id)||{},out[0]);
    }catch(err){ toast('Could not save: '+err.message); }
  }
  repaintBody();
}
async function undo(){
  const step=UNDO.pop(); if(!step)return;
  $('bundo').disabled=!UNDO.length;
  if(step.t==='cells'){
    const byId={};
    step.back.forEach(b=>{
      const row=ROWS.find(r=>r.id===b.id); if(!row)return;
      row[b.k]=b.v; (byId[b.id]=byId[b.id]||{})[b.k]=b.v;
    });
    repaintBody();
    for(const id in byId){
      try{const out=await api('task_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify(byId[id])});
        if(out&&out[0])Object.assign(ROWS.find(r=>r.id==id)||{},out[0]);}catch(e){}
    }
  }else if(step.t==='add'){
    for(const id of step.ids){
      try{await api('task_items?id=eq.'+id,{method:'PATCH',
        body:JSON.stringify({deleted_at:new Date().toISOString()})});}catch(e){}
      ROWS=ROWS.filter(r=>r.id!==id);
    }
  }else if(step.t==='del'){
    for(const r of step.rows){
      try{const out=await api('task_items?id=eq.'+r.id,{method:'PATCH',
        body:JSON.stringify({deleted_at:null})});
        if(out&&out[0])ROWS.push(out[0]);}catch(e){}
    }
  }
  paint(); toast('Undone');
}

/* ============================================================
   Editing a cell
   ============================================================ */
function tdAt(r,c){ return $('gbody').querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); }
function suggestions(k){
  const s=new Set(); ROWS.forEach(r=>{const v=(r[k]||'').trim(); if(v)s.add(v);});
  return [...s].sort();
}
function beginEdit(seed){
  if(EDIT)return;
  const c=COLS[CUR.c]; if(c.ro||c.kind==='no')return;
  const row=VIEW[CUR.r]; if(!row)return;
  const td=tdAt(CUR.r,CUR.c); if(!td)return;
  let el;
  if(c.kind==='sel'){
    el=document.createElement('select'); el.className='cellin';
    const cur=String(row[c.k]??'');
    c.opts.forEach(o=>{
      const op=document.createElement('option'); op.value=o; op.textContent=o;
      if(o===cur)op.selected=true; el.appendChild(op);
    });
  }else{
    el=document.createElement('input'); el.className='cellin';
    el.type=c.kind==='date'?'date':'text';
    el.value=seed!=null?seed:(row[c.k]==null?'':String(row[c.k]));
    if(c.suggest){
      const id='dl-'+c.k;
      let dl=$(id);
      if(!dl){dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl);}
      dl.innerHTML=suggestions(c.k).map(v=>'<option value="'+esc(v)+'">').join('');
      el.setAttribute('list',id);
    }
  }
  td.appendChild(el);
  EDIT={r:CUR.r,c:CUR.c,el,row};
  el.focus();
  if(el.tagName==='INPUT'&&seed==null&&el.type==='text')el.select();
  el.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();commitEdit();move(1,0,false);}
    else if(ev.key==='Escape'){ev.preventDefault();cancelEdit();}
    else if(ev.key==='Tab'){ev.preventDefault();commitEdit();move(0,ev.shiftKey?-1:1,false);}
    ev.stopPropagation();
  });
  if(c.kind==='sel')el.addEventListener('change',()=>commitEdit());
  el.addEventListener('blur',()=>{ setTimeout(()=>{ if(EDIT&&EDIT.el===el)commitEdit(); },120); });
}
function commitEdit(){
  if(!EDIT)return;
  const {el,row,c}=EDIT, col=COLS[EDIT.c], v=el.value;
  EDIT=null;
  if(el.parentNode)el.parentNode.removeChild(el);
  applyEdits([{row,c:colOf(col.k),v}]);
  $('gwrap').focus();
}
function cancelEdit(){
  if(!EDIT)return;
  const el=EDIT.el; EDIT=null;
  if(el.parentNode)el.parentNode.removeChild(el);
  repaintBody(); $('gwrap').focus();
}

/* ============================================================
   Moving about
   ============================================================ */
function move(dr,dc,extend){
  const r=Math.max(0,Math.min(VIEW.length-1,CUR.r+dr));
  const c=Math.max(FIRSTC,Math.min(COLS.length-1,CUR.c+dc));
  CUR={r,c}; if(!extend)ANC={r,c};
  repaintBody(); scrollIntoView();
}
function goto_(r,c,extend){
  CUR={r:Math.max(0,Math.min(VIEW.length-1,r)),c:Math.max(FIRSTC,Math.min(COLS.length-1,c))};
  if(!extend)ANC={...CUR};
  repaintBody(); scrollIntoView();
}
function scrollIntoView(){
  const td=tdAt(CUR.r,CUR.c); if(!td||!td.scrollIntoView)return;
  const w=$('gwrap'), tr=td.getBoundingClientRect(), wr=w.getBoundingClientRect();
  if(tr.top<wr.top+38)w.scrollTop-=(wr.top+38-tr.top);
  if(tr.bottom>wr.bottom)w.scrollTop+=(tr.bottom-wr.bottom);
  if(tr.left<wr.left+190)w.scrollLeft-=(wr.left+190-tr.left);
  if(tr.right>wr.right)w.scrollLeft+=(tr.right-wr.right);
}

/* ============================================================
   Clipboard
   ============================================================ */
function selTSV(){
  const b=selBox(); const out=[];
  for(let r=b.r1;r<=b.r2;r++){
    const line=[];
    for(let c=b.c1;c<=b.c2;c++){
      const col=COLS[c];
      let v=col.kind==='no'?String(r+1):(VIEW[r]?(VIEW[r][col.k]??''):'');
      v=String(v).replace(/\t/g,' ').replace(/\r?\n/g,' ');
      line.push(v);
    }
    out.push(line.join('\t'));
  }
  return out.join('\n');
}
async function doCopy(){
  const t=selTSV();
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e2){} ta.remove();
  }
  toast('Copied');
}
async function doPasteText(text){
  if(!text)return;
  const grid=text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  const b=selBox();
  const need=b.r1+grid.length-VIEW.length;
  if(need>0)await addRows(need,false);
  const edits=[];
  grid.forEach((line,i)=>{
    const row=VIEW[b.r1+i]; if(!row)return;
    line.forEach((v,j)=>{
      const ci=b.c1+j; if(ci>=COLS.length)return;
      if(COLS[ci].ro||COLS[ci].kind==='no')return;
      edits.push({row,c:ci,v});
    });
  });
  await applyEdits(edits,'paste');
  ANC={r:b.r1,c:b.c1};
  CUR={r:Math.min(VIEW.length-1,b.r1+grid.length-1),
       c:Math.min(COLS.length-1,b.c1+grid[0].length-1)};
  repaintBody();
  toast('Pasted '+grid.length+' row'+(grid.length>1?'s':''));
}
async function doPasteButton(){
  try{ const t=await navigator.clipboard.readText(); await doPasteText(t); }
  catch(e){ toast('Press Ctrl+V (or ⌘V) — the browser will not let a button read the clipboard'); }
}
async function clearSel(){
  const b=selBox(), edits=[];
  for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++){
    if(COLS[c].ro||COLS[c].kind==='no')continue;
    if(VIEW[r])edits.push({row:VIEW[r],c,v:''});
  }
  await applyEdits(edits,'clear');
}
async function fillDown(){
  const b=selBox(); if(b.r2===b.r1)return;
  const edits=[];
  for(let c=b.c1;c<=b.c2;c++){
    if(COLS[c].ro||COLS[c].kind==='no')continue;
    const src=VIEW[b.r1]?VIEW[b.r1][COLS[c].k]:'';
    for(let r=b.r1+1;r<=b.r2;r++)if(VIEW[r])edits.push({row:VIEW[r],c,v:src});
  }
  await applyEdits(edits,'fill down');
  toast('Filled down');
}

/* ============================================================
   Rows
   ============================================================ */
async function addRows(n,focus=true,at){
  const base=ROWS.length?Math.max(...ROWS.map(r=>r.sort||0)):0;
  const payload=[];
  for(let i=0;i<n;i++)
    payload.push({title:'',status:'Open',priority:4,raised:TODAY(),
      sort:(at!=null?at+ (i+1)/(n+1) : base+i+1)});
  try{
    const out=await api('task_items',{method:'POST',body:JSON.stringify(payload)});
    (out||[]).forEach(r=>ROWS.push(r));
    UNDO.push({t:'add',ids:(out||[]).map(r=>r.id)});
    rebuild();
    if(focus&&out&&out[0]){
      const ri=VIEW.findIndex(r=>r.id===out[0].id);
      if(ri>=0){CUR={r:ri,c:1};ANC={...CUR};}
    }
    paint();
    if(focus){scrollIntoView();beginEdit('');}
  }catch(e){ toast('Could not add: '+e.message); }
}
async function insertAbove(){
  const row=VIEW[CUR.r];
  if(!row)return addRows(1);
  const prev=CUR.r>0?VIEW[CUR.r-1]:null;
  const at=prev?(prev.sort+row.sort)/2-0.5:(row.sort-1);
  await addRows(1,true,at);
}
async function deleteRows(){
  const b=selBox();
  const rows=VIEW.slice(b.r1,b.r2+1);
  if(!rows.length)return;
  const ok=await confirmBox('Delete '+rows.length+' row'+(rows.length>1?'s':'')+'?',
    'They go to the bin — Undo brings them straight back.');
  if(!ok)return;
  const keep=rows.map(r=>({...r}));
  const stamp=new Date().toISOString();
  for(const r of rows){
    try{ await api('task_items?id=eq.'+r.id,{method:'PATCH',
      body:JSON.stringify({deleted_at:stamp})}); }catch(e){}
    ROWS=ROWS.filter(x=>x.id!==r.id);
  }
  UNDO.push({t:'del',rows:keep});
  paint();
  toast('Deleted '+rows.length+' row'+(rows.length>1?'s':''),'Undo',undo);
}

/* ============================================================
   Column width, autofit, row height
   ============================================================ */
function setW(i,w){
  COLS[i].w=Math.max(46,Math.min(680,Math.round(w)));
  const th=$('ghead').querySelector('th[data-c="'+i+'"]');
  if(th)th.style.width=COLS[i].w+'px';
  savePrefs();
}
function autofit(i){
  const c=COLS[i];
  const cv=document.createElement('canvas').getContext('2d');
  cv.font='13px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
  let w=cv.measureText(c.lb).width+46;
  VIEW.slice(0,500).forEach(r=>{
    const t=c.kind==='no'?'000':String(r[c.k]??'');
    w=Math.max(w,cv.measureText(t).width+30);
  });
  setW(i,w);
}
function autofitAll(){ COLS.forEach((c,i)=>{ if(c.kind!=='no')autofit(i); }); toast('Columns fitted'); }
function wireResize(){
  $('ghead').addEventListener('mousedown',e=>{
    const h=e.target.closest('[data-rsz]'); if(!h)return;
    e.preventDefault(); e.stopPropagation();
    const i=+h.dataset.rsz, x0=e.clientX, w0=COLS[i].w;
    const mv=ev=>setW(i,w0+(ev.clientX-x0));
    const up=()=>{document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  $('ghead').addEventListener('dblclick',e=>{
    const h=e.target.closest('[data-rsz]'); if(!h)return;
    e.preventDefault(); e.stopPropagation(); autofit(+h.dataset.rsz);
  });
}

/* ============================================================
   Header menu — sort and filter
   ============================================================ */
let MENUK=null;
function openMenu(k,anchor){
  MENUK=k;
  const c=COLS[colOf(k)];
  const vals=[...new Set(ROWS.map(r=>cellText(r,c)))].sort();
  const f=FILT[k]||{vals:null,text:''};
  let h='<button class="mi" data-act="asc">▲ Sort A → Z</button>'
       +'<button class="mi" data-act="desc">▼ Sort Z → A</button>'
       +'<button class="mi" data-act="nosort">↕ Original order</button>'
       +'<div class="msep"></div>'
       +'<input class="f" id="mfind" placeholder="Contains…" value="'+esc(f.text||'')+'">'
       +'<div class="vals" id="mvals">';
  vals.forEach(v=>{
    const on=!f.vals||f.vals.has(v);
    h+='<label><input type="checkbox" value="'+esc(v)+'"'+(on?' checked':'')+'>'
      +'<span>'+(v===''?'<i style="color:var(--ink3)">(blank)</i>':esc(v))+'</span></label>';
  });
  h+='</div><div class="row"><button data-act="all">All</button>'
    +'<button data-act="none">None</button>'
    +'<button data-act="apply" style="border-color:var(--violet);color:#e9d5ff">Apply</button></div>';
  const m=$('menu'); m.innerHTML=h; m.classList.add('on');
  const b=anchor.getBoundingClientRect();
  m.style.left=Math.min(window.innerWidth-248,Math.max(8,b.left-190))+'px';
  m.style.top=(b.bottom+6)+'px';
}
function closeMenu(){ $('menu').classList.remove('on'); MENUK=null; }
function menuAct(act){
  const k=MENUK; if(!k)return;
  if(act==='asc'){SORT={k,dir:1};closeMenu();paint();return;}
  if(act==='desc'){SORT={k,dir:-1};closeMenu();paint();return;}
  if(act==='nosort'){SORT=null;closeMenu();paint();return;}
  const boxes=[...$('menu').querySelectorAll('#mvals input')];
  if(act==='all'){boxes.forEach(b=>b.checked=true);return;}
  if(act==='none'){boxes.forEach(b=>b.checked=false);return;}
  if(act==='apply'){
    const text=($('mfind').value||'').trim();
    const on=boxes.filter(b=>b.checked).map(b=>b.value);
    if(on.length===boxes.length&&!text)delete FILT[k];
    else FILT[k]={vals:on.length===boxes.length?null:new Set(on),text};
    closeMenu(); paint();
  }
}

/* ============================================================
   Export and import
   ============================================================ */
function sheetData(){
  const head=COLS.map(c=>c.lb);
  const rows=VIEW.map((r,i)=>COLS.map(c=>c.kind==='no'?i+1:(r[c.k]??'')));
  return [head,...rows];
}
function exportXLSX(){
  if(typeof XLSX==='undefined')return toast('The spreadsheet library did not load — try again online');
  const ws=XLSX.utils.aoa_to_sheet(sheetData());
  ws['!cols']=COLS.map(c=>({wpx:c.w}));
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:VIEW.length,c:COLS.length-1}})};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Action list');
  XLSX.writeFile(wb,'Action list '+TODAY()+'.xlsx');
  toast('Exported '+VIEW.length+' rows');
}
function exportCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=sheetData().map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='Action list '+TODAY()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Exported '+VIEW.length+' rows');
}
async function importFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined')return toast('The spreadsheet library did not load — try again online');
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  if(!aoa.length)return toast('That file looks empty');
  /* match the header row to our columns, by label, loosely */
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const map=aoa[0].map(h=>{
    const n=norm(h);
    const c=COLS.find(c=>norm(c.lb)===n||norm(c.k)===n
      ||(n==='action'&&c.k==='title')||(n==='task'&&c.k==='title')
      ||(n==='owner'&&c.k==='responsible')||(n==='duedate'&&c.k==='due'));
    return c&&c.kind!=='no'&&!c.ro?colOf(c.k):-1;
  });
  if(!map.some(i=>i>=0))
    return toast('No matching column headings — the first row must name the columns');
  const lines=aoa.slice(1).filter(r=>r.some(v=>String(v).trim()!==''));
  if(!lines.length)return toast('No rows to import');
  const ok=await confirmBox('Import '+lines.length+' row'+(lines.length>1?'s':'')+'?',
    'They are added to the bottom of the register. Nothing already here is changed.');
  if(!ok)return;
  const base=ROWS.length?Math.max(...ROWS.map(r=>r.sort||0)):0;
  const payload=lines.map((line,i)=>{
    const rec={title:'',status:'Open',priority:4,raised:TODAY(),sort:base+i+1};
    map.forEach((ci,j)=>{ if(ci<0)return;
      const c=COLS[ci]; rec[c.k]=coerce(c,line[j]); });
    if(!rec.raised)rec.raised=TODAY();
    return rec;
  });
  try{
    const out=await api('task_items',{method:'POST',body:JSON.stringify(payload)});
    (out||[]).forEach(r=>ROWS.push(r));
    UNDO.push({t:'add',ids:(out||[]).map(r=>r.id)});
    paint(); toast('Imported '+lines.length+' rows','Undo',undo);
  }catch(e){ toast('Import failed: '+e.message); }
}

/* ============================================================
   Small UI helpers
   ============================================================ */
let toastT=null;
function toast(msg,action,fn){
  const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<span class="u">'+esc(action)+'</span>':'');
  t.classList.add('on');
  if(action&&fn)t.querySelector('.u').onclick=()=>{t.classList.remove('on');fn();};
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),action?6000:2600);
}
function confirmBox(title,note){
  return new Promise(res=>{
    $('dlg').innerHTML='<h3>'+esc(title)+'</h3><p class="d">'+esc(note||'')+'</p>'
      +'<div class="acts"><button class="tbtn" id="dno">Cancel</button>'
      +'<button class="tbtn primary" id="dyes">Yes</button></div>';
    $('scrim').classList.add('on');
    const done=v=>{$('scrim').classList.remove('on');res(v);};
    $('dno').onclick=()=>done(false);
    $('dyes').onclick=()=>done(true);
    $('scrim').onclick=e=>{if(e.target===$('scrim'))done(false);};
  });
}

/* ============================================================
   Wiring
   ============================================================ */
let DRAG=false;
function wireGrid(){
  const gb=$('gbody');
  gb.addEventListener('mousedown',e=>{
    if(e.target.closest('.cellin'))return;
    const td=e.target.closest('td'); if(!td)return;
    const r=+td.dataset.r, c=+td.dataset.c;
    if(EDIT)commitEdit();
    if(COLS[c].kind==='no'){                       /* row number picks the row */
      CUR={r,c:FIRSTC}; ANC={r,c:COLS.length-1}; repaintBody(); return;
    }
    if(e.shiftKey){CUR={r,c};}
    else{CUR={r,c};ANC={r,c};}
    DRAG=true; repaintBody(); $('gwrap').focus();
  });
  gb.addEventListener('mouseover',e=>{
    if(!DRAG)return;
    const td=e.target.closest('td'); if(!td)return;
    const c=+td.dataset.c; if(COLS[c].kind==='no')return;
    CUR={r:+td.dataset.r,c}; repaintBody();
  });
  document.addEventListener('mouseup',()=>{DRAG=false;});
  gb.addEventListener('dblclick',e=>{
    const td=e.target.closest('td'); if(!td||e.target.closest('.cellin'))return;
    CUR={r:+td.dataset.r,c:+td.dataset.c}; ANC={...CUR};
    repaintBody(); beginEdit();
  });

  $('ghead').addEventListener('click',e=>{
    const mb=e.target.closest('[data-menu]');
    if(mb){e.stopPropagation();openMenu(mb.dataset.menu,mb);return;}
    const s=e.target.closest('[data-sort]');
    if(s){
      const k=s.dataset.sort;
      SORT=(SORT&&SORT.k===k)?(SORT.dir>0?{k,dir:-1}:null):{k,dir:1};
      paint();
    }
  });
  $('menu').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(b){e.stopPropagation();menuAct(b.dataset.act);}
    e.stopPropagation();
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#menu')&&!e.target.closest('[data-menu]'))closeMenu();
  });

  $('gwrap').addEventListener('keydown',onKey);
  document.addEventListener('paste',e=>{
    if(EDIT)return;
    if(document.activeElement&&document.activeElement.tagName==='INPUT'
       &&document.activeElement.id==='q')return;
    const t=(e.clipboardData||window.clipboardData).getData('text');
    if(t){e.preventDefault();doPasteText(t);}
  });
}
function onKey(e){
  if(EDIT)return;
  const mod=e.ctrlKey||e.metaKey;
  const k=e.key;
  if(mod&&(k==='c'||k==='C')){e.preventDefault();doCopy();return;}
  if(mod&&(k==='x'||k==='X')){e.preventDefault();doCopy().then(clearSel);return;}
  if(mod&&(k==='z'||k==='Z')){e.preventDefault();undo();return;}
  if(mod&&(k==='d'||k==='D')){e.preventDefault();fillDown();return;}
  if(mod&&(k==='a'||k==='A')){e.preventDefault();ANC={r:0,c:FIRSTC};
    CUR={r:VIEW.length-1,c:COLS.length-1};repaintBody();return;}
  if(mod&&(k==='f'||k==='F')){e.preventDefault();$('q').focus();return;}
  if(k==='ArrowUp'){e.preventDefault();move(-1,0,e.shiftKey);return;}
  if(k==='ArrowDown'){e.preventDefault();move(1,0,e.shiftKey);return;}
  if(k==='ArrowLeft'){e.preventDefault();move(0,-1,e.shiftKey);return;}
  if(k==='ArrowRight'){e.preventDefault();move(0,1,e.shiftKey);return;}
  if(k==='Tab'){e.preventDefault();move(0,e.shiftKey?-1:1,false);return;}
  if(k==='Home'){e.preventDefault();goto_(mod?0:CUR.r,FIRSTC,e.shiftKey);return;}
  if(k==='End'){e.preventDefault();goto_(mod?VIEW.length-1:CUR.r,COLS.length-1,e.shiftKey);return;}
  if(k==='PageDown'){e.preventDefault();move(12,0,e.shiftKey);return;}
  if(k==='PageUp'){e.preventDefault();move(-12,0,e.shiftKey);return;}
  if(k==='Enter'||k==='F2'){e.preventDefault();beginEdit();return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel();return;}
  if(k==='Escape'){ANC={...CUR};repaintBody();return;}
  if(!mod&&!e.altKey&&k.length===1){e.preventDefault();beginEdit(k);}
}
function wireTools(){
  $('badd').onclick=()=>addRows(1);
  $('bins').onclick=insertAbove;
  $('bdel').onclick=deleteRows;
  $('bcopy').onclick=doCopy;
  $('bpaste').onclick=doPasteButton;
  $('bfill').onclick=fillDown;
  $('bundo').onclick=undo;
  $('bxl').onclick=exportXLSX;
  $('bcsv').onclick=exportCSV;
  $('bimp').onclick=()=>$('fimp').click();
  $('fimp').onchange=e=>{importFile(e.target.files[0]);e.target.value='';};
  $('bfit').onclick=autofitAll;
  $('bclear').onclick=()=>{FILT={};SEARCH='';SORT=null;$('q').value='';paint();};
  let qt=null;
  $('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{
    SEARCH=e.target.value.trim().toLowerCase();paint();},160);};
  $('qx').onclick=()=>{$('q').value='';SEARCH='';paint();$('q').focus();};
  $('signout').onclick=()=>{
    try{localStorage.removeItem('task-session');}catch(e){}
    location.reload();
  };
}

/* ============================================================
   Boot
   ============================================================ */
async function startApp(){
  loadPrefs();
  await loadAll();
  paint();
  wireGrid(); wireTools(); wireResize();
  $('app').classList.add('ready');
  $('gwrap').focus();
}
async function boot(){
  $('lgo').onclick=async()=>{
    $('lerr').textContent='';
    const em=$('lem').value.trim(), pw=$('lpw').value;
    if(!em||!pw){$('lerr').textContent='Both fields, please.';return;}
    $('lgo').disabled=true; $('lgo').textContent='Signing in…';
    try{
      await signIn(em,pw);
      $('login').classList.remove('on');
      await startApp();
    }catch(err){
      $('lerr').textContent=err.message;
      $('lgo').disabled=false; $('lgo').textContent='Sign in';
    }
  };
  $('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click();});
  if(await resume()){
    try{ await startApp(); return; }
    catch(e){ console.error(e); }
  }
  $('login').classList.add('on');
  $('lem').focus();
}
boot();
