<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Action list</title>
<style>
/* ============================================================
   Action list b29. macOS look (Tahoe): frosted sidebar, unified toolbar,
   white content, system blue. Every colour is a token set by the two
   themes below; nothing else in this file carries a literal colour
   (the printed reports at the end are the one exception, they are paper).
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --winbg:linear-gradient(155deg,#e6ebf5 0%,#efeff4 45%,#f5f5f7 100%);
  --surface:#ffffff; --card:#ffffff; --card2:#f7f7f9; --hover:#f0f0f4;
  --chip:#eeeef1; --field:#ffffff;
  --glass:rgba(246,246,248,.72); --glass2:rgba(255,255,255,.80); --pop:rgba(250,250,252,.92);
  --line:#e5e5ea; --line2:#d1d1d6; --grid:#ececf0;
  --ink:#1d1d1f; --ink2:#515154; --ink3:#6e6e73;
  --accent:#007aff; --accent2:#0062cc; --accent-d:#0058b8; --on-accent:#ffffff;
  --violet:var(--accent); --violet2:var(--accent2); --sky:var(--accent);
  --good:#34c759; --warn:#ff9500; --hot:#ff3b30;
  --good-t:#1e8a3a; --warn-t:#a85a00; --hot-t:#d70015;
  --on-rgb:255,255,255; --accent-rgb:0,122,255; --good-rgb:52,199,89; --warn-rgb:255,149,0;
  --hot-rgb:255,59,48; --mute-rgb:142,142,147; --ink-rgb:0,0,0;
  --p1:var(--hot-t); --p2:var(--warn-t); --p3:var(--accent2); --p4:var(--ink3);
  --sel:#e1eeff; --cur:#cfe3ff; --band:rgba(0,0,0,.022);
  --scrim:rgba(30,30,34,.28); --shadowc:rgba(0,0,0,.20);
  --ovl:rgba(0,0,0,.62); --lbbg:rgba(14,14,16,.94); --lbk:rgba(255,255,255,.14);
  --c-blue:#007aff; --c-red:#ff3b30; --c-orange:#ff9500; --c-green:#34c759;
  --c-purple:#af52de; --c-teal:#30b0c7; --c-gray:#8e8e93;
  --room-wall:#e3e8f2; --room-wall-edge:#c3cbdb; --room-base:#a4adc0; --room-tray:rgba(247,249,253,.98);
  --room-floor:#aeb6c7; --room-floor2:#c2c9d8; --room-seam:rgba(40,50,80,.10);
  --room-card:#ffffff; --room-tag:rgba(255,255,255,.92);
  --room-cardsh:0 1px 1px rgba(30,40,70,.22),0 5px 12px rgba(30,40,70,.20);
  --room-cardlift:0 2px 3px rgba(30,40,70,.2),0 14px 26px rgba(30,40,70,.30);
  --ring:0 0 0 3px rgba(var(--accent-rgb),.35);
  --pshadow:0 0 0 .5px rgba(0,0,0,.12),0 12px 36px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --ease:cubic-bezier(.22,1,.36,1);
  --rowh:30px; --tabh:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --winbg:linear-gradient(155deg,#2a2c33 0%,#232326 45%,#1c1c1e 100%);
  --surface:#1e1e1e; --card:#242426; --card2:#272729; --hover:#2d2d30;
  --chip:#3a3a3c; --field:#2c2c2e;
  --glass:rgba(44,44,46,.72); --glass2:rgba(40,40,42,.80); --pop:rgba(48,48,50,.92);
  --line:#38383a; --line2:#48484a; --grid:#2e2e30;
  --ink:#f5f5f7; --ink2:#c7c7cc; --ink3:#98989f;
  --accent:#0a84ff; --accent2:#409cff; --accent-d:#0060d0; --on-accent:#ffffff;
  --good:#30d158; --warn:#ff9f0a; --hot:#ff453a;
  --good-t:#32d74b; --warn-t:#ffb340; --hot-t:#ff6961;
  --accent-rgb:10,132,255; --good-rgb:48,209,88; --warn-rgb:255,159,10;
  --hot-rgb:255,69,58; --mute-rgb:152,152,159; --ink-rgb:255,255,255;
  --sel:#1c3a63; --cur:#24497d; --band:rgba(255,255,255,.028);
  --scrim:rgba(0,0,0,.5); --shadowc:rgba(0,0,0,.6);
  --c-blue:#0a84ff; --c-red:#ff453a; --c-orange:#ff9f0a; --c-green:#30d158;
  --c-purple:#bf5af2; --c-teal:#40c8e0; --c-gray:#8e8e93;
  --room-wall:#3d414c; --room-wall-edge:#1f2127; --room-base:#4a4e59; --room-tray:rgba(38,40,46,.98);
  --room-floor:#17181c; --room-floor2:#26282e; --room-seam:rgba(255,255,255,.06);
  --room-card:#2f3036; --room-tag:rgba(46,48,54,.94);
  --room-cardsh:0 1px 1px rgba(0,0,0,.5),0 5px 12px rgba(0,0,0,.5);
  --room-cardlift:0 2px 3px rgba(0,0,0,.5),0 14px 28px rgba(0,0,0,.65);
  --pshadow:0 0 0 .5px rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
}

html,body{height:100%;margin:0}
body{
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--winbg);background-attachment:fixed;
  overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{letter-spacing:-.01em}
:focus-visible{outline:none;box-shadow:var(--ring)}
.ic{flex:none;display:inline-block;vertical-align:middle;stroke-width:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--mute-rgb),.45);border-radius:8px;border:3px solid transparent;
  background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--mute-rgb),.75);background-clip:content-box}
.muted{color:var(--ink3)}
.hgrow{flex:1}

/* ---------- controls ---------- */
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  height:28px;padding:0 13px;border-radius:14px;font-size:13px;font-weight:500;color:var(--ink);
  background:var(--surface);border:1px solid var(--line2);
  box-shadow:0 1px 1px rgba(var(--ink-rgb),.05);transition:background .12s,border-color .12s}
.tbtn:hover{background:var(--hover)}
.tbtn:active{background:var(--chip)}
.tbtn:disabled{opacity:.4;cursor:default;background:var(--surface)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:none}
.tbtn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.tbtn.danger{color:var(--hot-t)}
.tbtn.danger:hover{background:rgba(var(--hot-rgb),.10)}
.tbtn.active{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.5);color:var(--accent)}
.tsep{width:1px;height:18px;background:var(--line2);margin:0 4px;flex:none}
input,select,textarea{background:var(--field);border:1px solid var(--line2);border-radius:8px;
  padding:6px 10px;outline:none;transition:border-color .12s,box-shadow .12s}
select{padding-right:26px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);padding:0;box-shadow:none}
/* toggle switch */
.bar label.tg{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;
  padding:0 2px;background:none;border:0;box-shadow:none}
.bar label.tg input{-webkit-appearance:none;appearance:none;width:34px;height:20px;border-radius:10px;
  background:rgba(var(--mute-rgb),.4);border:0;position:relative;flex:none;cursor:pointer;
  transition:background .18s;padding:0}
.bar label.tg input:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--on-accent);box-shadow:0 1px 3px rgba(var(--ink-rgb),.3);transition:transform .18s var(--ease)}
.bar label.tg input:checked{background:var(--good)}
.bar label.tg input:checked:after{transform:translateX(14px)}
/* segmented control */
.seg,#qchips{display:inline-flex;gap:0;padding:2px;border-radius:9px;background:var(--chip);flex-wrap:nowrap;
  max-width:100%}
.seg .qchip,#qchips .qchip,.seg .segb{padding:0 12px;height:24px;border-radius:7px;font-size:12.5px;font-weight:500;
  color:var(--ink2);white-space:nowrap;border:0;background:none;display:inline-flex;align-items:center;
  transition:background .12s,color .12s}
.qchip .n{margin-left:6px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.qchip:hover{color:var(--ink)}
.qchip[aria-pressed="true"],.segb[aria-checked="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 0 0 .5px rgba(var(--ink-rgb),.12),0 1px 3px rgba(var(--ink-rgb),.14)}
.qchip[aria-pressed="true"] .n{color:var(--ink2)}
.iconbtn{width:30px;height:30px;border-radius:15px;display:inline-grid;place-items:center;
  color:var(--ink2);position:relative;flex:none}
.iconbtn:hover{background:rgba(var(--ink-rgb),.06);color:var(--ink)}
.iconbtn .cnt{position:absolute;top:-1px;right:-2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--hot);color:var(--on-accent);font-size:10px;font-weight:700;line-height:16px;
  text-align:center;padding:0 4px}
.kbd{font:500 11px/1 inherit;color:var(--ink3);border:1px solid var(--line2);border-radius:6px;
  padding:4px 6px;white-space:nowrap;background:var(--surface)}
.kbd:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;
  font-size:12px;font-weight:500;line-height:18px;background:rgba(var(--mute-rgb),.16);
  color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.good{background:rgba(var(--good-rgb),.16);color:var(--good-t)}
.chip.warn{background:rgba(var(--warn-rgb),.16);color:var(--warn-t)}
.chip.hot{background:rgba(var(--hot-rgb),.14);color:var(--hot-t)}
.chip.acc{background:rgba(var(--accent-rgb),.13);color:var(--accent)}
button.chip{cursor:pointer;border:0}
button.chip:hover{filter:brightness(.96)}
.chip svg{fill:none}
.empty{padding:48px 16px;text-align:center;color:var(--ink3);font-size:13px}
.kstar{color:var(--warn);display:inline-flex;vertical-align:-2px}
.kstar svg{fill:currentColor}

/* ---------- window shell ---------- */
#app{display:flex;flex-direction:row;height:100%;padding:8px;gap:8px;opacity:0;transition:opacity .35s var(--ease)}
#app.ready{opacity:1}
#side{width:226px;flex:none;display:flex;flex-direction:column;gap:1px;padding:14px 10px 10px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid rgba(var(--ink-rgb),.12);border-radius:16px;overflow:hidden;z-index:5;
  transition:width .22s var(--ease)}
#side .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px}
.brand .mark{width:26px;height:26px;border-radius:7px;flex:none;background:var(--accent);position:relative}
.brand .mark:before{content:"";position:absolute;left:7px;top:6px;width:12px;height:7px;
  border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg);
  border-radius:1px}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--ink3);font-size:11px}
.sgrp{padding:12px 10px 4px;font-size:11px;font-weight:600;color:var(--ink3)}
.sidei{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:8px;
  font-size:13px;font-weight:500;color:var(--ink);text-align:left;white-space:nowrap;position:relative}
.sidei:hover{background:rgba(var(--ink-rgb),.05)}
.sidei[aria-current="page"]{background:rgba(var(--accent-rgb),.16)}
.sidei .icb{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:var(--c-gray);color:var(--on-accent)}
.sidei .icb svg{stroke-width:1.9}
.sidei[data-view="register"] .icb{background:var(--c-blue)}
.sidei[data-view="inbox"] .icb{background:var(--c-red)}
.sidei[data-view="emails"] .icb{background:var(--c-teal)}
.sidei[data-view="points"] .icb{background:var(--c-orange)}
.sidei[data-view="closures"] .icb{background:var(--c-green)}
.sidei[data-view="dash"] .icb{background:var(--c-purple)}
.sidei .bd{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:9px;
  background:rgba(var(--mute-rgb),.25);color:var(--ink2);font-size:11px;line-height:18px;text-align:center;
  font-weight:600;font-variant-numeric:tabular-nums}
#side .grow{flex:1}
#side.min{width:62px;padding-left:8px;padding-right:8px}
#side.min .lbl,#side.min .brand div:last-child,#side.min .bd,#side.min .sgrp{display:none}
#side.min .sidei{justify-content:center;padding:0}
#side.min .brand{justify-content:center;padding-left:0;padding-right:0}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--surface);
  border:.5px solid rgba(var(--ink-rgb),.12);border-radius:16px;overflow:hidden;position:relative}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:0 14px;height:52px;flex:none;border-bottom:1px solid var(--line);
  background:var(--glass2);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.tl-l,.tl-r{display:flex;align-items:center;gap:8px;min-width:0}
.tl-r{justify-content:flex-end}
#vtitle{font-size:14px;font-weight:600;margin:0;white-space:nowrap;text-align:center}
.brand.mbrand{display:none}
.search{display:flex;align-items:center;gap:7px;background:rgba(var(--ink-rgb),.05);border-radius:16px;
  padding:0 10px;height:30px;width:260px;min-width:0;flex:0 1 260px;color:var(--ink3);
  border:1px solid transparent;transition:border-color .12s,box-shadow .12s,background .12s}
.search:focus-within{background:var(--field);border-color:var(--accent);box-shadow:var(--ring)}
.search input{flex:1;background:none;border:0;border-radius:0;box-shadow:none;outline:none;padding:0;
  font-size:13px;min-width:0;color:var(--ink)}
.search input:focus{box-shadow:none}
.search .x{color:var(--ink3);font-size:15px;line-height:1;width:18px}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex;flex-direction:column}
.vscroll{flex:1;min-height:0;overflow:auto;padding:22px 26px 40px}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.vhead h2{margin:0;font-size:22px;font-weight:700}
.vhead p{margin:3px 0 0;color:var(--ink3);font-size:13px;max-width:70ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.bar select,.bar input[type=search],.bar input[type=text]{height:28px;padding-top:0;padding-bottom:0;font-size:13px;max-width:100%}

/* ---------- register: command row ---------- */
#v-register .tools{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;flex-wrap:wrap;position:relative}
.tgroup{display:inline-flex;border-radius:14px;box-shadow:0 1px 1px rgba(var(--ink-rgb),.05)}
.tgroup .tbtn{border-radius:0;box-shadow:none;margin-left:-1px;padding:0 12px}
.tgroup .tbtn:first-child{border-radius:14px 0 0 14px;margin-left:0}
.tgroup .tbtn:last-child{border-radius:0 14px 14px 0}
#tmorewrap{position:relative;margin-left:auto}
#tmore{display:none;position:absolute;right:0;top:34px;z-index:60;width:244px;padding:5px;
  background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:10px;box-shadow:var(--pshadow);flex-direction:column;gap:0}
#tmore.on{display:flex}
#tmore .tbtn{justify-content:flex-start;height:28px;border:0;background:none;border-radius:6px;box-shadow:none;
  padding:0 10px;width:100%;font-weight:400}
#tmore .tbtn:hover{background:var(--accent);color:var(--on-accent)}
#tmore .tbtn kbd,#ctx .mi kbd{margin-left:auto;font:inherit;opacity:.6;padding-left:14px}
#tmore .tsep{width:auto;height:1px;margin:5px 4px}
#v-register #qchips{margin:6px 16px 10px;align-self:flex-start}
.gwrap{flex:1;overflow:auto;margin:0;border-top:1px solid var(--line);background:var(--surface);position:relative}
.gwrap:focus,.gwrap:focus-visible{outline:none;box-shadow:none}
.statusbar{display:flex;align-items:center;gap:16px;padding:7px 18px calc(8px + var(--safe-b));
  font-size:12px;color:var(--ink3);flex-wrap:wrap;border-top:1px solid var(--line);flex:none}
.statusbar b{color:var(--ink2);font-weight:600}
.statusbar .kpi{display:inline-flex;align-items:center;gap:6px}
.statusbar .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- register: grid, as a Finder list ---------- */
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  table-layout:fixed;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);
  padding:0;overflow:hidden;position:relative}
table.g thead th{position:sticky;top:0;z-index:6;background:var(--glass2);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  font-size:12px;font-weight:600;color:var(--ink2);text-align:left;height:30px;white-space:nowrap;
  user-select:none;border-bottom:1px solid var(--line)}
table.g thead th .hin{display:flex;align-items:center;gap:6px;padding:0 9px;height:100%}
table.g thead th .lb{overflow:hidden;text-overflow:ellipsis}
table.g thead th .sortmark{color:var(--accent);font-size:9px}
table.g thead th .fbtn{margin-left:auto;color:var(--ink3);font-size:10px;padding:2px 5px;border-radius:5px;line-height:1;flex:none}
table.g thead th .fbtn:hover{background:rgba(var(--ink-rgb),.08);color:var(--ink)}
table.g thead th .fbtn.on{color:var(--accent);background:rgba(var(--accent-rgb),.14)}
.rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:8}
.rsz:hover{background:rgba(var(--accent-rgb),.35)}
/* the height sits on the CELLS: on a <tr> it is ignored, on a td it is a minimum */
table.g td{height:var(--rh,var(--rowh));vertical-align:middle;font-size:13px}
table.g td .cv{padding:0 9px;line-height:calc(var(--rh,var(--rowh)) - 2px);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
body.wrap table.g td{vertical-align:top}
body.wrap table.g td .cv{white-space:normal;line-height:17px;padding-top:6px;padding-bottom:5px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--rl,var(--rowlines,2));
  overflow:hidden;text-overflow:clip}
body.wrap table.g td .cv.nocell{display:flex}
body.wrap table.g td .cv.acts{-webkit-line-clamp:unset}
body.wrap table.g td .st,body.wrap table.g td .pr,body.wrap table.g td .hbtn{margin-top:1px}
.dgrip{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:12px;height:22px;
  text-align:center;font:700 11px/22px system-ui;letter-spacing:-2px;color:var(--ink3);cursor:grab;
  opacity:.35;z-index:4;user-select:none;border-radius:4px}
tr.irow:hover .dgrip,.dgrip:hover{opacity:1}
.dga{flex:none;width:9px;margin-top:1px;font:700 10px/15px system-ui;letter-spacing:-2px;
  color:var(--ink3);cursor:grab;opacity:0;user-select:none;text-align:center}
.aline:hover .dga,.dga:hover{opacity:1}
.dragging-row td{opacity:.45}
.aline.dragging-line{opacity:.4}
tr.irow.dropb td{box-shadow:inset 0 3px 0 var(--accent)}
tr.irow.dropa td{box-shadow:inset 0 -3px 0 var(--accent)}
.aline.dropb{box-shadow:0 -2px 0 var(--accent)}
.aline.dropa{box-shadow:0 2px 0 var(--accent)}
body.dragmode,body.dragmode *{cursor:grabbing!important;user-select:none!important}
.rgrip{position:absolute;left:0;right:0;bottom:-3px;height:7px;cursor:row-resize;z-index:5}
.rgrip:hover{background:rgba(var(--accent-rgb),.35)}
table.g tbody tr:nth-child(even) td{background:var(--card2)}
table.g tbody tr:nth-child(odd) td{background:var(--surface)}
table.g tbody tr:hover td{background:var(--hover)}
/* the two frozen columns must out-specify `table.g th,table.g td{position:relative}` */
table.g td.rowno,table.g th.rowno{width:54px;text-align:center;color:var(--ink3);font-size:12px;
  position:sticky;left:0;z-index:4;user-select:none;cursor:pointer}
table.g thead th.rowno{z-index:7}
table.g td.c-title{position:sticky;left:var(--nol,54px);z-index:3}
table.g thead th.c-title{position:sticky;left:var(--nol,54px);z-index:7}
table.g td.spacer,table.g th.spacer{border-right:0;background:transparent!important}
table.g td.c-title .cv{color:var(--ink);font-weight:600}
table.g td.ro .cv{color:var(--ink3)}
.nocell{display:flex;align-items:center;justify-content:center;padding:0 4px}
/* selection: the row you are on is filled with the accent, as in a Finder list */
table.g tbody tr.picked td{background:var(--accent);color:var(--on-accent);border-color:rgba(var(--ink-rgb),.08)}
table.g tbody tr.picked td *:not(svg):not(.cellin){color:inherit!important}
table.g tbody tr.picked td .aline .an,table.g tbody tr.picked td .aline .aw{background:rgba(var(--on-rgb),.22)}
table.g tbody tr.picked td .st:before{background:var(--on-accent)!important}
table.g td.sel{background:var(--accent)!important}
table.g td.cur{background:var(--accent-d)!important;box-shadow:inset 0 0 0 2px var(--on-accent);z-index:2}
table.g tbody tr:not(.picked) td.sel{background:var(--sel)!important}
table.g tbody tr:not(.picked) td.cur{background:var(--cur)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.cellin{position:absolute;inset:0;width:100%;height:100%;background:var(--field);color:var(--ink);
  border:2px solid var(--accent);outline:none;padding:0 7px;font-size:13px;z-index:12;border-radius:0;box-shadow:none}
select.cellin{padding:0 4px}
textarea.cellin.textin{height:auto;min-height:100%;resize:none;line-height:17px;padding:5px 8px;
  white-space:pre-wrap;font-family:inherit;overflow:auto}
.dirty:after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
/* the numbered action list drawn inside the item's cell */
.cv.acts{white-space:normal!important;display:block!important;padding:5px 9px 4px;line-height:17px;
  overflow:hidden;text-overflow:clip}
.cv.acts.empty{color:var(--ink3);font-size:12px}
.cv.multi{white-space:pre!important;line-height:17px!important;padding-top:6px;padding-bottom:5px;display:block;text-overflow:clip}
body.wrap .cv.multi{white-space:pre-wrap!important}
.aline{display:flex;align-items:flex-start;gap:7px;line-height:17px;padding:0 0 0 14px;font-weight:400}
.aline .an{flex:none;min-width:18px;height:16px;margin-top:1px;border-radius:5px;background:var(--chip);
  color:var(--ink2);font-size:11px;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.aline .an:hover{background:var(--accent);color:var(--on-accent)}
.aline .an.od{background:rgba(var(--hot-rgb),.14);color:var(--hot-t)}
.aline .an.ok{background:rgba(var(--good-rgb),.16);color:var(--good-t)}
.aline .at{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.aline .ad{flex:none;font-size:11px;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
.aline .ad.od{color:var(--hot-t)}
.aline.done .at{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(var(--mute-rgb),.6)}
.aline.done .ad{color:var(--ink3);text-decoration:none}
.aline .aw{display:inline-block;margin-left:7px;padding:0 7px;border-radius:6px;font-size:11px;line-height:16px;
  vertical-align:1px;background:var(--chip);color:var(--ink2)}
.aline.done .aw{opacity:.55}
.aline .kstar{margin-top:1px}
.aline .src{font-size:11px;color:var(--ink3);margin-left:6px}
table.g td.c-title .kstar{margin-right:5px}
/* status: a small dot and plain text */
.st{display:inline-flex;align-items:center;gap:7px;padding:0;font-size:13px;line-height:18px;color:inherit}
.st:before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--c-gray)}
.st-open:before{background:var(--accent)}
.st-prog:before{background:var(--warn)}
.st-hold:before{background:var(--c-gray)}
.st-closed:before{background:var(--good)}
.pr{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:700;line-height:19px}
.pr1{color:var(--p1)}.pr2{color:var(--p2)}.pr3{color:var(--p3)}.pr4{color:var(--p4)}
.late{color:var(--hot-t);font-weight:600}
.duetoday{color:var(--warn-t);font-weight:600}
button.mailb{display:inline-flex;align-items:center;gap:5px;padding:0 9px;height:100%;width:100%;
  justify-content:center;color:var(--ink2);font-size:12px;font-weight:600}
button.mailb:hover{color:var(--accent)}
button.mailb.zero{opacity:.45}
table.g td.c-mail .cv{padding:0}
table.g td.c-mail{vertical-align:top}
/* several people on one action */
.people{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border-radius:8px;padding:4px 6px;min-height:30px}
.ptag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:6px;
  padding:1px 3px 1px 8px;font-size:12px;color:var(--ink)}
.ptag button{color:var(--ink3);font-size:14px;line-height:1;padding:0 3px}
.ptag button:hover{color:var(--hot-t)}
.people .padd{flex:1;min-width:90px;border:0;background:transparent;box-shadow:none;outline:none;padding:2px}

/* ---------- popovers: filter menu, context menu, alerts ---------- */
.menu,#alerts,#ctx{background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);border-radius:10px;box-shadow:var(--pshadow)}
.menu{position:fixed;z-index:90;padding:8px;width:240px;display:none;animation:pop .14s var(--ease)}
.menu.on{display:block}
.menu .mi,#alerts .mi{display:flex;align-items:center;gap:9px;padding:0 10px;height:28px;border-radius:6px;
  font-size:13px;color:var(--ink);width:100%;text-align:left}
.menu .mi:hover:not(:disabled),.menu .mi:focus-visible,#alerts .mi:hover,#alerts .mi:focus-visible{
  background:var(--accent);color:var(--on-accent);box-shadow:none}
.menu .msep{height:1px;background:var(--line);margin:5px 4px}
.menu input.f{width:100%;height:28px;margin-bottom:6px;font-size:13px}
.menu .vals{max-height:200px;overflow:auto;margin:2px 0}
.menu .vals label{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.menu .vals label:hover{background:var(--hover)}
.menu .row{display:flex;gap:6px;margin-top:8px}
.menu .row button{flex:1;height:26px;border-radius:13px;border:1px solid var(--line2);font-size:12px;background:var(--surface)}
.menu .row button:hover{background:var(--hover)}
#ctx{width:250px;padding:5px}
#ctx .mi:disabled{opacity:.4;cursor:default}
#ctx .mi svg{color:var(--ink3)}
#ctx .mi:hover:not(:disabled) svg,#ctx .mi:focus-visible svg{color:var(--on-accent)}
#alerts{position:fixed;z-index:91;width:min(340px,calc(100vw - 20px));display:none;padding:5px}
#alerts.on{display:block}
#alerts .mi{height:auto;padding:8px 10px}
#alerts .mi b{min-width:22px;font-variant-numeric:tabular-nums}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- sheets: dialog, side panels ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);-webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);display:none;place-items:center;padding:20px}
.scrim.on{display:grid}
.dlg{width:min(480px,100%);max-height:86vh;overflow:auto;background:var(--pop);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border-radius:14px;padding:22px;box-shadow:var(--pshadow);animation:rise .22s var(--ease)}
.dlg.wide{width:min(640px,100%)}
.dlg h3{margin:0 0 4px;font-size:16px;font-weight:600}
.dlg p.d{margin:0 0 16px;color:var(--ink3);font-size:13px}
.dlg .fld,.sheet .fld,#drawer .fld{margin-bottom:14px}
.dlg label,.sheet label,#drawer label.l,.dlg label.l{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.dlg input,.dlg select,.dlg textarea,.sheet input,.sheet select,.sheet textarea,
#drawer input,#drawer select,#drawer textarea{width:100%;font-size:13px;font-family:inherit}
.dlg input[type=checkbox],.dlg input[type=radio],.sheet input[type=checkbox],#drawer input[type=checkbox],#drawer input[type=radio]{width:auto}
.dlg textarea,.sheet textarea,#drawer textarea{resize:vertical}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg .acts .tbtn{min-width:76px}
.dlg .derr{color:var(--hot-t);font-size:12.5px;min-height:18px;margin-top:8px}
.sheet{position:fixed;top:8px;right:8px;bottom:8px;width:min(430px,calc(100% - 16px));z-index:95;
  background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border-radius:16px;box-shadow:var(--pshadow);transform:translateX(110%);transition:transform .34s var(--ease);
  display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.sheet .sb{flex:1;overflow:auto;padding:16px}
.sheet .hd{margin:0 0 14px;font-size:14px;color:var(--ink);line-height:1.5}
.sheet .under{margin:0 0 16px;font-size:12px;color:var(--ink3);border-left:2px solid var(--line2);padding-left:10px;line-height:1.5}
.sheet input:disabled{color:var(--ink3)}
.sheet .two,.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .prow{display:flex;gap:8px;margin:4px 0 6px}
.sheet .prow .tbtn{flex:1;justify-content:center}
.sheet .sh .tbtn{height:26px;padding:0 10px;font-size:12px}
.sheet .sf{display:flex;gap:8px;padding:12px 16px calc(14px + var(--safe-b));border-top:1px solid var(--line)}
.sheet .sf input{flex:1}
.sheet .none{color:var(--ink3);font-size:13px;margin:0 0 18px}
.sheet .addbox{border-top:1px solid var(--line);padding-top:16px}
.sheet .addbox>label{font-size:12px;color:var(--ink2);margin-bottom:10px}
.sheet .hint{font-size:12px;color:var(--ink3);line-height:1.5;margin:12px 0 0}
table.alist{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
table.alist th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:0 8px 7px;white-space:nowrap}
table.alist td{padding:8px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
table.alist tbody tr{cursor:pointer}
table.alist tbody tr:hover td{background:var(--hover)}
table.alist td.n{width:24px;color:var(--ink3);font-variant-numeric:tabular-nums}
table.alist td.t{color:var(--ink);line-height:1.45}
table.alist td.late{color:var(--hot-t)}
table.alist tr.done td{color:var(--ink3)}
table.alist tr.done td.t{text-decoration:line-through;text-decoration-color:rgba(var(--mute-rgb),.65)}
.agi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.agi .agh{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:600;color:var(--ink);margin:0}
.agi .agh input{width:auto;flex:none;margin-top:2px}
.agi .agm{font-size:12px;color:var(--ink3);margin:5px 0 0 25px}
.agi .agn{font-size:12px;color:var(--ink2);margin:6px 0 0 25px;line-height:1.45}
.agi .aga{margin:8px 0 0 25px;display:flex;flex-direction:column;gap:6px}
.agi .aga label{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--ink2);margin:0}
.agi .aga input{width:auto;flex:none;margin-top:2px}
.agi .aga i{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:1px}
.agontorow{display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;font-size:13px;font-weight:400;color:var(--ink2);cursor:pointer}
.agontorow input{width:auto;flex:none;margin-top:2px}
.agontorow span{flex:1;min-width:0}
.agi .agtag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;margin-right:7px;
  background:var(--chip);color:var(--ink3)}
.agi .agtag.new{background:rgba(var(--accent-rgb),.15);color:var(--accent)}
.agi .agtx{flex:1;min-width:0}
.agi .aga label.agupd .agwas{text-decoration:line-through;color:var(--ink3)}
.agontorow i{display:block;font-style:normal;font-weight:400;color:var(--ink3);font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.agshots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.agshots .agsh{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.agshots .agsh img{width:100%;height:100%;object-fit:cover;display:block}
.agshots .agsh button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;
  background:var(--ovl);color:var(--on-accent);font-size:13px;line-height:19px}
.agadds{margin:10px 0 0}
.agadds .tbtn{width:100%}
.hrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .hk{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:var(--c-gray)}
.hrow .hk.k-opened{background:var(--accent)}
.hrow .hk.k-closed{background:var(--good)}
.hrow .hk.k-reopened{background:var(--warn)}
.hrow .hk.k-note{background:var(--c-purple)}
.hrow .hn{font-size:13px;color:var(--ink2);line-height:1.45}
.hrow .ht{font-size:12px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- toast: a banner, top right ---------- */
#toast{position:fixed;right:20px;top:68px;z-index:140;max-width:min(380px,calc(100vw - 24px));
  background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:14px;padding:11px 16px;font-size:13px;box-shadow:var(--pshadow);opacity:0;
  pointer-events:none;transform:translateY(-10px);transition:opacity .25s var(--ease),transform .25s var(--ease);
  display:flex;align-items:center;gap:14px}
#toast.on{opacity:1;transform:none}
#toast .u{color:var(--accent);font-weight:600;cursor:pointer;pointer-events:auto;white-space:nowrap}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:22px;background:var(--winbg)}
#login.on{display:grid}
#login .box{width:min(380px,100%);background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(180%);
  backdrop-filter:blur(40px) saturate(180%);border-radius:18px;padding:30px;box-shadow:var(--pshadow);animation:rise .4s var(--ease)}
#login h2{margin:0 0 6px;font-size:22px}
#login p{margin:0 0 20px;color:var(--ink3);font-size:13px}
#login input{width:100%;height:36px;margin-bottom:10px}
#login .tbtn{width:100%;margin-top:6px;height:34px;border-radius:17px}
#lerr{color:var(--hot-t);font-size:12.5px;min-height:18px;margin-top:9px}

/* ---------- cards: key inbox ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  display:flex;flex-direction:column;gap:10px;min-width:0}
.ecard .eh{display:flex;gap:11px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--ink2);
  display:inline-grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.key{background:rgba(var(--accent-rgb),.15);color:var(--accent)}
.ecard .eh b{display:block;font-size:13.5px;font-weight:600}
.ecard .sub{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ecard h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
.ecard .esum{margin:0;font-size:13px;line-height:1.5;color:var(--ink2);display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.ecard .esum.open{-webkit-line-clamp:unset}
.ecard .more{font-size:12px;color:var(--accent);align-self:flex-start}
.thumbrow{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:104px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--field);padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.thumb .plus{position:absolute;right:4px;bottom:4px;background:var(--ovl);color:var(--on-accent);font-size:11px;
  font-weight:600;border-radius:8px;padding:0 6px;line-height:17px}
.thumb:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}

/* ---------- emails ---------- */
.dayh{display:flex;align-items:baseline;gap:10px;margin:22px 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
.dayh:first-child{margin-top:0}
.dayh span{font-weight:400;color:var(--ink3)}
.erow{display:grid;grid-template-columns:52px 190px minmax(0,1fr) auto;gap:14px;align-items:center;
  width:100%;text-align:left;padding:9px 12px;border-radius:8px}
.erow:nth-child(even){background:var(--band)}
.erow:hover{background:var(--hover)}
.erow.sel{background:var(--accent);color:var(--on-accent)}
.erow.sel .tm,.erow.sel .sj small,.erow.sel .bg{color:var(--on-accent);opacity:.85}
.erow .tm{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.erow .fr{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .sj{min-width:0}
.erow .sj b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .sj small{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .bg{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:12px}
.erow .bg span{display:inline-flex;align-items:center;gap:3px}
.erow.done .fr,.erow.done .sj b{color:var(--ink2);font-weight:400}

/* ---------- points ---------- */
.mgroup{margin:0 0 26px}
.mgroup>h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mgroup>h3 small{font-size:12px;color:var(--ink3);font-weight:400}
.mcount{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.prow2{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:11px 6px;
  border-bottom:1px solid var(--line);align-items:start}
.prow2 .ref{font-size:12px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px}
.prow2 .tx{font-size:13px;line-height:1.5;min-width:0;word-break:break-word}
.prow2 .tx .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.prow2 .acts2{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.prow2 select{height:26px;padding-top:0;padding-bottom:0;font-size:12px;border-radius:13px}
.prow2.flash{background:rgba(var(--accent-rgb),.12)}

/* ---------- ledger table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:0 10px 8px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.reop td{color:var(--ink3)}
.tbl .ev{display:flex;gap:8px;align-items:center}
.tbl .ev .thumb{width:64px;height:44px}
.tbl small{display:block;color:var(--ink3);font-size:12px}
.tblwrap{overflow-x:auto}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 0 24px}
.tile{padding:14px 16px;text-align:left;display:block;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tile:hover{background:var(--hover)}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{display:block;margin-top:4px;font-size:12px;color:var(--ink3)}
.tile.hot b{color:var(--hot-t)}
.tile.key b{color:var(--accent)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.dgrid .card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.dgrid .full{grid-column:1/-1}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;cursor:pointer;font-size:13px}
.dl li:first-child{border-top:0}
.dl li:hover .dt{color:var(--accent)}
.dl .dn{flex:none;min-width:36px;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.dl .dt{flex:1;min-width:0;word-break:break-word}
.dl .dd{flex:none;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dl .dd.hot{color:var(--hot-t)}
svg.chart text{font:12px -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;fill:var(--ink2)}
svg.chart .val{fill:var(--ink3);font-size:11px}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .bo{fill:var(--accent)}
svg.chart .bc{fill:var(--ink3);opacity:.5}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink3);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.o{background:var(--accent)}
.legend i.c{background:var(--ink3);opacity:.5}

/* ---------- settings ---------- */
.themes{display:inline-flex;gap:0;padding:2px;border-radius:9px;background:var(--chip);max-width:100%;flex-wrap:wrap}
.themec{padding:0 16px;height:26px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2);text-align:center}
.themec[aria-checked="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 0 0 .5px rgba(var(--ink-rgb),.12),0 1px 3px rgba(var(--ink-rgb),.14)}
.themenote{margin:10px 0 0;font-size:12.5px;color:var(--ink3);max-width:60ch}
.setrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.vscroll h3.sec{margin:28px 0 12px;font-size:15px;font-weight:600}
.vscroll h3.sec:first-of-type{margin-top:6px}

/* ---------- drawer: an inspector panel ---------- */
#drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(580px,calc(100% - 16px));z-index:94;
  background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border-radius:16px;box-shadow:var(--pshadow);transform:translateX(110%);transition:transform .34s var(--ease);
  display:flex;flex-direction:column;visibility:hidden}
#drawer.on{transform:none;visibility:visible}
#drawer:focus{outline:none}
#drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 10px}
#drawer .dh h2{margin:0;font-size:16px;font-weight:600;line-height:1.35;flex:1;min-width:0;word-break:break-word}
#drawer .dh small{display:block;color:var(--ink3);font-size:12px;font-weight:400;margin-bottom:2px}
.tabs{display:flex;gap:0;margin:0 16px 4px;padding:2px;border-radius:9px;background:var(--chip);
  overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:0 10px;height:24px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 0 0 .5px rgba(var(--ink-rgb),.12),0 1px 3px rgba(var(--ink-rgb),.14)}
.tab .n{font-size:11px;color:var(--ink3);margin-left:5px}
#drawer .db{flex:1;overflow:auto;padding:14px 18px 28px;min-height:0}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.arow .an2{font-size:12px;font-weight:600;color:var(--ink3);padding-top:2px;font-variant-numeric:tabular-nums}
.arow .at2{font-size:13px;line-height:1.45;word-break:break-word}
.arow .at2 .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.arow.done .at2>span.t{color:var(--ink3);text-decoration:line-through}
.arow .rb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
.arow .rb .tbtn{height:26px;padding:0 10px;font-size:12px}
#drawer .arow select{width:auto;height:24px;padding:0 24px 0 10px;font-size:12px;border-radius:12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--c-gray);flex:none;margin-top:6px}
.tl .dot.good{background:var(--good)}.tl .dot.acc{background:var(--accent)}
.tl .dot.warn{background:var(--warn)}.tl .dot.mail{background:var(--c-teal)}
.tl .when{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.shot{display:flex;flex-direction:column;gap:5px;min-width:0}
.shot .thumb{width:100%;height:92px}
.shot small{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropz{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);
  font-size:13px;margin-top:12px;cursor:pointer;transition:.15s}
.dropz.over,.dropz:focus-visible{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.07)}
.lnk{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.lnk .t{flex:1;min-width:0;word-break:break-word}
.lnk button.x{color:var(--ink3);padding:2px 6px;border-radius:6px}
.lnk button.x:hover{color:var(--hot-t)}
.sub2{font-size:13px;font-weight:600;color:var(--ink);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
#drawer .sub2+.fld,#drawer .sub2+.two2{margin-top:2px}
.plist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--field)}
.plist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;font-size:13px;cursor:pointer;
  font-weight:400;color:var(--ink2);border-bottom:1px solid var(--line);margin:0}
.plist label:last-child{border-bottom:0}
.plist label:hover{background:var(--hover)}
.plist label small{display:block;color:var(--ink3);font-size:12px}
.plist label.grp{font-weight:600;color:var(--ink);background:var(--card2)}
.plist label.sub{padding-left:30px}
.plist .gh{padding:8px 10px;font-weight:600;font-size:13px;background:var(--card2);border-bottom:1px solid var(--line);color:var(--ink)}
.plist .gh small{font-weight:400;color:var(--ink3);margin-left:6px}
.plist [hidden]{display:none}
.pv{display:flex;gap:10px;align-items:center;margin-top:10px}
.pv .thumb{width:90px;height:62px}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:125;background:var(--lbbg);-webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);display:none;flex-direction:column;color:var(--on-accent)}
#lb.on{display:flex}
#lb .lbt{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
#lb .lbt .tbtn{background:var(--lbk);color:var(--on-accent);border-color:transparent;box-shadow:none}
#lb .lbt .cnt{font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums}
#lb .lbt input{flex:1;min-width:140px;background:var(--lbk);color:var(--on-accent);border-color:transparent}
#lb .lbw{position:relative;flex:1;min-height:0;display:flex}
#lb .stage{flex:1;min-height:0;overflow:auto;display:flex;position:relative}
#lb .stage img{margin:auto;display:block;max-width:100%;max-height:100%;object-fit:contain}
#lb .stage.zoom img{max-width:none;max-height:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:21px;
  color:var(--on-accent);background:var(--lbk);font-size:22px;z-index:2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#lb .nav.p{left:12px}#lb .nav.n{right:12px}
#lb .nav:disabled{opacity:.2}

/* ---------- command palette ---------- */
#pal{position:fixed;inset:0;z-index:110;background:var(--scrim);display:none;align-items:flex-start;
  justify-content:center;padding:12vh 16px 16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#pal.on{display:flex}
#pal .pbox{width:min(600px,100%);background:var(--pop);-webkit-backdrop-filter:blur(40px) saturate(180%);
  backdrop-filter:blur(40px) saturate(180%);border-radius:14px;box-shadow:var(--pshadow);overflow:hidden;
  display:flex;flex-direction:column;max-height:70vh}
#pal input{width:100%;height:50px;padding:0 18px;font-size:16px;border:0;border-radius:0;background:transparent;
  box-shadow:none;border-bottom:1px solid var(--line)}
#pal input:focus{box-shadow:none}
#pal ul{list-style:none;margin:0;padding:6px;overflow:auto}
#pal li{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px}
#pal li[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
#pal li .g{flex:none;width:64px;font-size:12px;color:var(--ink3)}
#pal li[aria-selected="true"] .g,#pal li[aria-selected="true"] small{color:var(--on-accent);opacity:.85}
#pal li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pal li small{color:var(--ink3);font-size:12px;flex:none}

#tabs{display:none}
#printarea{display:none}
#mob{display:none}
#mmore{display:none}

/* ============================================================
   Phone. The grid is a desktop instrument, so the phone gets cards
   over the same data, and a bottom bar in place of the sidebar.
   ============================================================ */
@media (max-width:900px){
  body{overflow:hidden}
  #app{padding:0;gap:0}
  #main{border:0;border-radius:0}
  #side{display:none}
  header{grid-template-columns:1fr;padding:0 12px;gap:8px}
  .tl-l{display:none}
  #vtitle{display:none}
  .tl-r{justify-content:stretch}
  .search{flex:1 1 0;width:auto}
  .brand.mbrand{display:flex}
  .brand.mbrand .mark{width:26px;height:26px}
  #kbtn,#signout,#sidetog{display:none}
  #mmore{display:inline-grid}
  .vscroll{padding:14px 14px calc(var(--tabh) + var(--safe-b) + 24px)}
  .tools,.gwrap,.statusbar,#qchips{display:none!important}
  #mob{display:flex;flex-direction:column;flex:1;min-height:0}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(var(--tabh) + var(--safe-b));
    padding-bottom:var(--safe-b);background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--line)}
  #tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10px;font-weight:500;color:var(--ink3);position:relative;padding:4px 0}
  #tabs button[aria-current="page"]{color:var(--accent)}
  #tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;
    background:var(--hot);color:var(--on-accent);font-size:10px;line-height:16px;padding:0 4px;font-weight:600;text-align:center}
  #toast{top:60px;right:12px;left:12px;max-width:none}
  .mchips{display:flex;gap:7px;padding:10px 14px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
  .mchips::-webkit-scrollbar{display:none}
  .mchip{flex:none;border-radius:15px;padding:0 13px;height:28px;font-size:13px;font-weight:500;color:var(--ink2);
    white-space:nowrap;background:var(--chip)}
  .mchip.on{background:var(--accent);color:var(--on-accent)}
  .mchip .n{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
  .mlist{flex:1;overflow-y:auto;padding:2px 14px 150px;-webkit-overflow-scrolling:touch}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .mcard:active{background:var(--hover)}
  .mcard.done{opacity:.7}
  .mhead{display:flex;gap:9px;align-items:flex-start}
  .mno{flex:none;min-width:22px;height:22px;border-radius:7px;background:var(--chip);color:var(--ink3);
    font-size:12px;font-weight:600;line-height:22px;text-align:center}
  .mdesc{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35;white-space:pre-wrap;word-break:break-word}
  .mcard.done .mdesc{text-decoration:line-through;text-decoration-color:rgba(var(--mute-rgb),.55)}
  .mmeta{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0;padding-left:31px}
  .mtag{border-radius:6px;padding:1px 8px;font-size:12px;line-height:17px;background:var(--chip);color:var(--ink2)}
  .mtag.due.od{background:rgba(var(--hot-rgb),.13);color:var(--hot-t)}
  .mtag.who{background:rgba(var(--accent-rgb),.13);color:var(--accent)}
  .macts{margin:10px 0 0;padding-left:31px;display:flex;flex-direction:column;gap:6px}
  .macts .aline{gap:9px;font-size:13px;line-height:18px;padding-left:0}
  .macts .aline .an{min-width:21px;height:21px;line-height:21px;font-size:12px}
  .macts .aline .at{white-space:normal;overflow:visible;text-overflow:clip}
  .mnone{padding-left:31px;margin-top:8px;font-size:12px;color:var(--ink3)}
  .mbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b));z-index:60;display:flex;
    align-items:center;gap:10px;padding:9px 14px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--line)}
  .mbar .cnt{flex:1;font-size:12px;color:var(--ink3);line-height:1.4}
  .mbar .cnt b{color:var(--ink2)}
  .mbar .tbtn{height:34px;padding:0 18px;font-size:14px;border-radius:17px}
  .msheet .mrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);
    font-size:14.5px;color:var(--ink);text-align:left}
  .msheet .mrow:last-child{border-bottom:0}
  .msheet .mrow .ic{width:26px;text-align:center;font-size:16px;color:var(--accent)}
  .msheet .mrow small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
  .msheet .mrow.danger .ic{color:var(--hot-t)}
  .sheet{top:0;right:0;bottom:0;width:100%;border-radius:0}
  .sheet .sb{padding:16px 15px}
  .sheet .two,.two2{grid-template-columns:1fr}
  #drawer{top:0;right:0;bottom:0;width:100%;border-radius:0}
  .dlg{border-radius:14px;padding:18px}
  .erow{grid-template-columns:44px minmax(0,1fr);gap:4px 10px}
  .erow .fr{grid-column:2}
  .erow .sj,.erow .bg{grid-column:1/-1}
  .prow2{grid-template-columns:36px minmax(0,1fr)}
  .prow2 .acts2{grid-column:1/-1;justify-content:flex-start}
  .arow{grid-template-columns:24px minmax(0,1fr)}
  .arow .rb{grid-column:1/-1;max-width:none;justify-content:flex-start}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:14px}
  .cards{gap:12px}
  #pal{padding-top:8vh}
  .acttbl{font-size:12px}
  .tab{padding:0 5px;font-size:12px}
  .tabs{margin-left:12px;margin-right:12px}
  .tab .n{margin-left:3px}
}
@media (max-width:900px) and (orientation:landscape){.mlist{padding-bottom:130px}}
@media (max-width:600px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:12px 2px;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:3px 0;text-align:left!important}
  .tbl td.num{text-align:left}
}
@media (max-width:420px){.vhead h2{font-size:19px}.tile b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.06s!important}}

/* ---------- print: the A4 reports (paper, so literal colours) ---------- */
/* ---------- b30: groups by project ---------- */
.seg{display:inline-flex;align-items:center;border-radius:9px;background:var(--chip);padding:2px;max-width:100%}
.segl{font-size:12px;color:var(--ink3);padding:0 8px}
.segb{border:0;background:transparent;border-radius:7px;padding:3px 12px;font-size:12.5px;cursor:pointer;color:var(--ink2);height:24px}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(var(--ink-rgb),.18)}
.segb:focus-visible,.pchip:focus-visible,.pgh:focus-visible{outline:none;box-shadow:var(--ring)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.pchip{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:2px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);height:26px}
.pchip span{color:var(--ink3);margin-left:4px;font-variant-numeric:tabular-nums}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pchip[aria-pressed="true"] span{color:var(--on-accent);opacity:.85}
#epchips:empty{display:none}
#epchips .pchips{margin-bottom:14px}
.pgrp{margin:0 0 22px}
.pgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line);padding:6px 2px 9px;margin:0 0 14px;cursor:pointer;color:var(--ink);border-radius:4px}
.pgh b{font-size:15px;font-weight:600}
.pgh .chev{display:inline-flex;color:var(--ink3)}
.pgh .chev svg{transform:rotate(-90deg);transition:transform .18s var(--ease)}
.pgh[aria-expanded="false"] .chev svg{transform:rotate(180deg)}
.pgc{color:var(--ink3);font-size:12.5px}
.pgh .cbadge{margin-left:auto}
.pgrp.closed .pgh{margin-bottom:0}
.glist{display:block}
.erow.cb{box-shadow:inset 3px 0 0 var(--accent)}
.ctag{flex:none}
.tgroup .tbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* ---------- b30: the Room ---------- */
.sidei[data-view="room"] .icb{background:var(--c-teal)}
#v-room{overflow:hidden}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);flex:none}
.rcount{color:var(--ink3);font-size:12.5px}
.rhint{color:var(--ink3);font-size:12px}
.rstage{flex:1;min-height:0;overflow:auto;position:relative;background:var(--room-wall)}
.room{position:relative;width:100%;perspective:2000px;perspective-origin:50% 22%;overflow:hidden}
.rwalls{position:absolute;left:0;top:0;display:block;pointer-events:none}
.rwalls .wb{fill:url(#gwb)}
.rwalls .wl{fill:url(#gwl)}
.rwalls .wr{fill:url(#gwr)}
.rwalls stop.s0{stop-color:var(--room-wall-edge)}
.rwalls stop.s1{stop-color:var(--room-wall)}
.rwalls .wbase{stroke:var(--room-base);stroke-width:3;stroke-linecap:square}
.rfloor{position:absolute;left:0;bottom:0;transform-origin:50% 100%;transform:rotateX(46deg);
  background:repeating-linear-gradient(90deg,transparent 0 119px,var(--room-seam) 119px 120px),
    repeating-linear-gradient(0deg,transparent 0 239px,var(--room-seam) 239px 240px),
    linear-gradient(0deg,var(--room-floor2),var(--room-floor))}
.cm{position:absolute;width:2px;height:2px;pointer-events:none;opacity:0}
.cm[data-c="0"]{left:0;top:0}.cm[data-c="1"]{right:0;top:0}.cm[data-c="2"]{left:0;bottom:0}.cm[data-c="3"]{right:0;bottom:0}
.pile{position:absolute;width:176px;height:116px;outline:none;cursor:grab;touch-action:none;transition:opacity .3s}
.pile.moving{cursor:grabbing;z-index:60}
.pile.fan{z-index:50;cursor:default}
.ftray{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;background:var(--room-tray);
  box-shadow:0 0 0 1px var(--room-base),var(--room-cardsh);opacity:0;pointer-events:none;transition:opacity .3s}
.pile.fan .ftray{opacity:1;pointer-events:auto}
.pile.carding .ftray{opacity:0;pointer-events:none}
.pcards{position:absolute;left:0;top:0;width:100%;height:100%}
.rc{position:absolute;left:0;top:0;width:176px;height:116px;padding:6px 9px 6px;display:flex;flex-direction:column;gap:3px;

  transition:transform .55s var(--ease),opacity .25s,box-shadow .25s}
.rc.cb{background:linear-gradient(rgba(var(--accent-rgb),.13),rgba(var(--accent-rgb),.13)),var(--room-card);
  border-color:rgba(var(--accent-rgb),.5);border-top:3px solid var(--accent);padding-top:4px}
.rc.done{opacity:.5;filter:saturate(.25)}
.rc.off{opacity:0;pointer-events:none}
.rc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pile:not(.fan):hover .rc.top,.pile:not(.fan):focus-visible .rc.top{

.pile.fan .rc{cursor:pointer}
.pile.fan .rc:hover{box-shadow:var(--room-cardlift);transform:translate(var(--ox,0px),calc(var(--oy,0px) - 4px))}
.rc.drag{transition:none;z-index:300!important;pointer-events:none;box-shadow:var(--room-cardlift);cursor:grabbing}
.pile.carding .rc:not(.drag){opacity:.16;pointer-events:none}
.hasfan .pile:not(.fan){opacity:.45}
.hasfan:has(.carding) .pile:not(.fan){opacity:1}
.hasfan:has(.carding) .pile:not(.fan):hover .plabel{outline:2px solid var(--accent);outline-offset:2px}
.pile:focus-visible .plabel{outline:2px solid var(--accent);outline-offset:2px}
.rc.more{align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;color:var(--accent);
  background:var(--room-tag);border-style:dashed;cursor:pointer}
.plabel{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:var(--room-tag);border-radius:6px;padding:2px 9px;white-space:nowrap;font-size:13px;color:var(--ink);

.plabel b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.plabel .pn{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:12px}
.plabel .pc{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:12px;font-weight:600}
.plabel .pc svg{fill:var(--accent);stroke:var(--accent)}
.plabel .po{color:var(--hot-t);font-size:12px;font-weight:600}
.pile.fan .plabel{left:var(--lx,0px);top:var(--ly,0px);transform:none;transition:left .5s var(--ease),top .5s var(--ease)}
.rl1{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2);font-weight:600;min-width:0;flex:none}
.rfrom{display:flex;align-items:center;gap:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rfrom svg,.rno svg{fill:var(--accent);stroke:var(--accent);flex:none}
.rtag{flex:none;font-size:9.5px;font-weight:600;color:var(--accent);background:rgba(var(--accent-rgb),.16);padding:0 5px;border-radius:4px}
.rth{display:block;height:30px;border-radius:3px;overflow:hidden;background:var(--chip);flex:none}
.rth img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.rsubj{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:600;flex:1;min-height:0;word-break:break-word}
.rsubj{max-height:45px}
.rth+.rsubj{-webkit-line-clamp:2;max-height:30px}
.rl3{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}

.room.fresh .rc{animation:rdrop .75s var(--ease) backwards;animation-delay:calc(var(--pi,0)*70ms + var(--i,0)*45ms)}
@keyframes rdrop{from{opacity:0;transform:translate(var(--ox,0px),calc(var(--oy,0px) - 170px)) rotate(calc(var(--r,0deg) + 16deg)) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.room.fresh .rc{animation:none}.rc,.pile.fan .plabel{transition:none}}
/* phone: one column of piles, a fan opens as a list */

.room.flat .pile.fan .pcards{margin-left:0}
@media (max-width:900px){.rhint{display:none}.rbar{padding:10px 14px}}

<script>
/* ============================================================
   Action list — a two-level register.
   An ITEM has a description; ACTIONS hang beneath it as sub-rows,
   each with its own due date, closure and history.
   The item's due date is the LONGEST due among its open actions,
   and the item closes itself once none are open. Both are done by
   database triggers, so they hold whatever writes the row.
   ============================================================ */
const SB_URL='https://ivmmnsjiekhjxkhllncb.supabase.co';
const SB_KEY='sb_publishable_RTHsaxZXVmRBQziLbFJX8g_PAaZzIbF';
const BUILD='ACTIONS 2026-11-15 · b30';

let SESSION=null, ITEMS=[], ACTS=[], VIEW=[], LOGS={};
let SORT=null, FILT={}, SEARCH='';
let CUR={r:0,c:1}, ANC={r:0,c:1};
let EDIT=null, UNDO=[], SHUT=new Set();
let PREFS={w:{},rowh:32,wrap:false,rowhs:{}};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const isoDay=d=>{const x=(d instanceof Date)?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');};
const TODAY=()=>isoDay(new Date());

/* ---------- columns ----------
   `on` says which row kind the column belongs to; a cell that is not on
   this row's kind is greyed and cannot be typed into. */
const STATUSES=['Open','In progress','On hold','Closed'];
const COLS=[
  {k:'__no',        lb:'No.',         w:54,  ro:true, kind:'no'},
  {k:'description', lb:'Description', w:280, kind:'text'},
  {k:'__acts',      lb:'Actions',     w:360, kind:'acts'},
  {k:'__mail',      lb:'Emails',      w:76,  ro:true, kind:'mail'},
  {k:'project',     lb:'Project',     w:130, kind:'text', suggest:true},
  {k:'responsible', lb:'Responsible', w:145, kind:'text', suggest:true},
  {k:'priority',    lb:'Priority',    w:86,  kind:'sel',  opts:['1','2','3','4']},
  {k:'status',      lb:'Status',      w:124, kind:'sel',  opts:STATUSES},
  {k:'due',         lb:'Due',         w:110, kind:'date'},
  {k:'closed',      lb:'Closed on',   w:110, kind:'date'},
  {k:'notes',       lb:'Notes',       w:240, kind:'text'}
];
const colOf=k=>COLS.findIndex(c=>c.k===k);
const FIRSTC=1;

function get(node,c){
  if(c.kind==='no'||c.kind==='mail')return '';
  if(c.kind==='acts')return (node.acts||[]).map(a=>a.text||'').join('\n');
  if(c.k==='closed')return node.rec.done_at||'';
  /* once a row has actions, Responsible is everyone named on them — each
     person once, in action order, whether their action is finished or not.
     It used to list only the open ones, so a closed item showed nobody. */
  if(c.k==='responsible'&&(node.acts||[]).length)return openNames(node.acts);
  return node.rec[c.k]==null?'':String(node.rec[c.k]);
}
function openNames(acts){
  const seen=new Set(), out=[];
  acts.forEach(a=>{
    nameList(a.responsible).forEach(v=>{
      const k=v.toLowerCase();
      if(!seen.has(k)){seen.add(k);out.push(v);}
    });
  });
  return out.join(', ');
}
/* an item that owns actions has its due date and status computed for it */
function locked(node,c){
  if(c.ro||c.kind==='no')return true;
  if(node.kids>0&&(c.k==='due'||c.k==='status'||c.k==='responsible'||c.k==='closed'))
    return true;
  /* a row that is not closed has no closing date to set */
  if(c.k==='closed'&&node.rec.status!=='Closed')return true;
  return false;
}

/* ============================================================
   Talking to the database
   ============================================================ */
async function api(path,opts={},tries=0){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    apikey:SB_KEY,
    Authorization:'Bearer '+(SESSION?SESSION.access_token:SB_KEY),
    'Content-Type':'application/json',
    Prefer:'return=representation',
    ...(opts.headers||{})}});
  if(r.ok){const t=await r.text();return t?JSON.parse(t):null;}
  const body=await r.text();
  if(/PGRST303|issued at future/.test(body)&&tries<4){
    await new Promise(res=>setTimeout(res,900+tries*700));
    return api(path,opts,tries+1);
  }
  if(r.status===401&&tries<1&&await resume())return api(path,opts,tries+1);
  throw new Error(friendly(body,r.status));
}
function friendly(body,status){
  try{const j=JSON.parse(body);
    if(/issued at future/.test(j.message||''))
      return 'The clock on this device is out of step with the server. Check the date and time, then try again.';
    if(j.message)return j.message;
  }catch(e){console.warn('ignored',e);}
  return body.slice(0,140)||('Request failed ('+status+')');
}
async function signIn(email,pw){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pw})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Could not sign in');
  SESSION=d; save(); return d;
}
const save=()=>{try{localStorage.setItem('task-session',JSON.stringify(SESSION));}catch(e){console.warn('ignored',e);}};
/* A dropped connection makes fetch REJECT rather than return a bad response.
   Unguarded, that exception escaped boot() and neither the app nor the sign-in
   screen was ever shown — a blank white page, and no way to tell why. */
async function resume(){
  let s=null; try{s=JSON.parse(localStorage.getItem('task-session')||'null');}catch(e){console.warn('ignored',e);}
  if(!s||!s.refresh_token)return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok)return false;
    SESSION=await r.json(); save(); return true;
  }catch(e){ throw new Error('offline'); }
}
function loadPrefs(){
  try{const p=JSON.parse(localStorage.getItem('task-prefs')||'null');
    if(p&&p.w)PREFS=Object.assign(PREFS,p);
    if(p&&p.shut)SHUT=new Set(p.shut);}catch(e){console.warn('ignored',e);}
  if(!PREFS.rowhs)PREFS.rowhs={};
  COLS.forEach(c=>{if(PREFS.w[c.k])c.w=PREFS.w[c.k];});
  applyWrap();
}
function savePrefs(){
  PREFS.w={}; COLS.forEach(c=>PREFS.w[c.k]=c.w); PREFS.shut=[...SHUT];
  try{localStorage.setItem('task-prefs',JSON.stringify(PREFS));}catch(e){console.warn('ignored',e);}
}
/* --- wrapped text and row heights ---------------------------------------
   Height has to go on the CELLS: min-height does nothing on a <tr>, and on a
   td a height behaves as a minimum. The number of lines shown is derived from
   the height, so a taller row reveals more text instead of more white space. */
const LINEH=17, PADV=11;
const rowKey=node=>'item:'+node.rec.id;
function linesFor(h){ return Math.max(1,Math.floor((h-PADV)/LINEH)); }
function applyWrap(){
  const r=document.documentElement;
  r.style.setProperty('--rowh',(PREFS.rowh||32)+'px');
  r.style.setProperty('--rowlines',linesFor(PREFS.rowh||32));
  document.body.classList.toggle('wrap',!!PREFS.wrap);
  const b=$('bwrap'); if(b)b.classList.toggle('active',!!PREFS.wrap);
}
/* a row must be tall enough to show its whole action list, unless the user has
   set that row's height by hand */
function naturalH(node){
  const n=(node.acts||[]).length;
  let lines=1;
  COLS.forEach(c=>{
    if(c.kind!=='text')return;
    const v=get(node,c);
    if(v)lines=Math.max(lines,v.split('\n').length);
  });
  return Math.max(PREFS.rowh||32, n?n*LINEH+PADV:0, lines>1?lines*LINEH+PADV:0);
}
function applyRowSizes(){
  const gb=$('gbody'); if(!gb)return;
  gb.querySelectorAll('tr[data-r]').forEach(tr=>{
    const node=VIEW[+tr.dataset.r]; if(!node)return;
    const h=PREFS.rowhs[rowKey(node)]||naturalH(node);
    tr.style.setProperty('--rh',h+'px');
    tr.style.setProperty('--rl',linesFor(h));
  });
}
function setRowH(node,h,all){
  h=Math.max(24,Math.min(400,Math.round(h)));
  if(all){PREFS.rowh=h;PREFS.rowhs={};applyWrap();}
  else PREFS.rowhs[rowKey(node)]=h;
  savePrefs(); applyRowSizes();
}
function resetRowH(node,all){
  if(all){PREFS.rowh=32;PREFS.rowhs={};applyWrap();}
  else delete PREFS.rowhs[rowKey(node)];
  savePrefs(); applyRowSizes();
}
function toggleWrap(){
  PREFS.wrap=!PREFS.wrap;
  if(PREFS.wrap&&(PREFS.rowh||32)<50)PREFS.rowh=66;   /* room for ~3 lines */
  if(!PREFS.wrap)PREFS.rowh=32;
  applyWrap(); savePrefs(); applyRowSizes();
  toast(PREFS.wrap?'Text wraps — drag a row number\u2019s bottom edge to change the height'
                  :'Text on one line');
}

const IFIELDS_B='id,description,title,project,responsible,priority,status,raised,due,done,done_at,notes,sort,deleted_at';
const AFIELDS_B='id,item_id,text,responsible,due,status,closed_at,sort,created_at,deleted_at';
/* b28 adds key_origin / source / merged_into. If the database has not got them the
   first read says so, and the app falls back to the b27 columns for good. */
let EXT_ON=true;
let IFIELDS=IFIELDS_B+',key_origin', AFIELDS=AFIELDS_B+',source,key_origin,merged_into';
async function loadAll(){
  const rd=()=>Promise.all([
    api('task_items?select='+IFIELDS+'&deleted_at=is.null&order=sort.asc,id.asc'),
    api('task_actions?select='+AFIELDS+'&deleted_at=is.null&order=sort.asc,id.asc')]);
  let it,ac;
  try{[it,ac]=await rd();}
  catch(e){
    if(!EXT_ON||!/column|does not exist|42703|PGRST20[0-9]/i.test(String(e.message)))throw e;
    EXT_ON=false; IFIELDS=IFIELDS_B; AFIELDS=AFIELDS_B;
    [it,ac]=await rd();
  }
  ITEMS=(it||[]).map(r=>({...r,description:r.description||r.title||''}));
  ACTS=ac||[];
  ITEMS.forEach((r,i)=>{if(r.sort==null||r.sort===0)r.sort=i+1;});
}
const kidsOf=id=>ACTS.filter(a=>a.item_id===id);

/* ============================================================
   Filtering, sorting, flattening
   ============================================================ */
function textOf(node){
  return COLS.filter(c=>c.kind!=='no').map(c=>get(node,c)).join(' ').toLowerCase();
}
function matches(node){
  if(SEARCH&&!textOf(node).includes(SEARCH))return false;
  if(!qfMatch(node))return false;
  for(const k in FILT){
    const f=FILT[k]; if(!f)continue;
    const v=get(node,COLS[colOf(k)]);
    if(f.vals){
      const parts=k==='responsible'?(v?v.split(', '):['']):[v];
      if(!parts.some(p=>f.vals.has(p)))return false;
    }
    if(f.text&&!v.toLowerCase().includes(f.text.toLowerCase()))return false;
  }
  return true;
}
function rebuild(){
  const items=ITEMS.slice();
  if(SORT){
    const c=COLS[colOf(SORT.k)];
    const nd=r=>({kind:'item',rec:r,kids:0,acts:kidsOf(r.id)});
    items.sort((a,b)=>{
      let x=get(nd(a),c), y=get(nd(b),c);
      if(c.k==='priority'){x=+x||9;y=+y||9;}
      else if(c.kind==='date'){x=x||'9999';y=y||'9999';}
      else {x=x.toLowerCase();y=y.toLowerCase();}
      return (x<y?-1:x>y?1:0)*SORT.dir;
    });
  }else items.sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));

  VIEW=[];
  items.forEach(it=>{
    const acts=kidsOf(it.id).slice().sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));
    const node={kind:'item',rec:it,acts,kids:acts.length,no:0};
    if(matches(node))VIEW.push(node);
  });
  VIEW.forEach((node,i)=>node.no=i+1);
  if(CUR.r>=VIEW.length)CUR.r=Math.max(0,VIEW.length-1);
  if(ANC.r>=VIEW.length)ANC.r=CUR.r;
}

/* ============================================================
   Drawing
