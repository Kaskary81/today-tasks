<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>Action list</title>
<style>
/* ============================================================
   Action list — a spreadsheet, not a to-do app.
   Midnight violet, one file, no build step.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --page1:#150e26; --page2:#0a0613;
  --surface:#171029; --card:#1b1330; --card2:#221739; --chip:#251a42;
  --line:#332552; --line2:#3f2d67;
  --ink:#f5f2ff; --ink2:#bdb2d8; --ink3:#8b81a8;
  --violet:#a855f7; --violet2:#7c3aed; --violetDim:rgba(168,85,247,.16);
  --good:#34d399; --warn:#fbbf24; --hot:#f43f5e; --sky:#38bdf8;
  --p1:#f43f5e; --p2:#fb923c; --p3:#38bdf8; --p4:#8b81a8;
  --shadow:0 14px 40px rgba(10,4,26,.6),0 2px 10px rgba(10,4,26,.5);
  --glow:0 0 0 1px rgba(168,85,247,.22),0 18px 50px rgba(88,28,135,.45);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --rowh:32px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0}
body{
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 12% -10%, rgba(124,58,237,.22), transparent 60%),
    radial-gradient(900px 520px at 88% 0%,  rgba(168,85,247,.16), transparent 62%),
    linear-gradient(180deg,var(--page1),var(--page2) 60%);
  background-attachment:fixed;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f2d67;border-radius:8px;border:2px solid transparent;
  background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#5b3fa0;background-clip:content-box}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;opacity:0;
  transition:opacity .45s var(--ease)}
#app.ready{opacity:1}

header{display:flex;align-items:center;gap:12px;padding:14px 20px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--violet),var(--violet2));
  box-shadow:0 6px 18px rgba(124,58,237,.5);position:relative;overflow:hidden}
.brand .mark:after{content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5),transparent 70%);
  transform:translateX(-100%);animation:sheen 5.5s var(--ease) infinite}
@keyframes sheen{0%,72%{transform:translateX(-100%)}88%,100%{transform:translateX(120%)}}
.brand b{font-size:16px;letter-spacing:-.01em;display:block}
.brand small{display:block;color:var(--ink3);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.hgrow{flex:1}

/* ---------- toolbar ---------- */
.tools{display:flex;align-items:center;gap:7px;padding:0 20px 10px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:12.5px;
  font-weight:600;color:var(--ink2);transition:.18s var(--ease);display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap;background:rgba(27,19,48,.6)}
.tbtn:hover{border-color:var(--violet);color:#e9d5ff;transform:translateY(-1px)}
.tbtn:disabled{opacity:.38;cursor:default;transform:none;border-color:var(--line2);color:var(--ink3)}
.tbtn.primary{background:linear-gradient(180deg,var(--violet),var(--violet2));
  border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.38)}
.tbtn.danger:hover{border-color:var(--hot);color:#fda4af}
.tsep{width:1px;height:22px;background:var(--line2);margin:0 3px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:210px;flex:1;
  max-width:340px;transition:.2s var(--ease)}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.13)}
.search input{flex:1;background:none;border:0;outline:none;font-size:13px;min-width:0}
.search input::placeholder{color:var(--ink3)}
.search .x{color:var(--ink3);font-size:15px;line-height:1}

/* ---------- the grid ---------- */
.gwrap{flex:1;overflow:auto;margin:0 20px;border:1px solid var(--line);
  border-radius:13px;background:rgba(23,16,41,.55);position:relative}
table.g{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  table-layout:fixed;font-variant-numeric:tabular-nums}
table.g th,table.g td{border-right:1px solid rgba(63,45,103,.55);
  border-bottom:1px solid rgba(51,37,82,.7);padding:0;overflow:hidden;position:relative}
table.g thead th{
  position:sticky;top:0;z-index:6;background:linear-gradient(180deg,#241a3f,#1d1533);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);text-align:left;height:36px;white-space:nowrap;user-select:none}
table.g thead th .hin{display:flex;align-items:center;gap:6px;padding:0 9px;height:100%}
table.g thead th .lb{overflow:hidden;text-overflow:ellipsis}
table.g thead th .sortmark{color:var(--violet);font-size:10px}
table.g thead th .fbtn{margin-left:auto;color:var(--ink3);font-size:10px;padding:2px 4px;
  border-radius:5px;line-height:1;flex:none}
table.g thead th .fbtn:hover{background:rgba(168,85,247,.2);color:#e9d5ff}
table.g thead th .fbtn.on{color:var(--violet);background:rgba(168,85,247,.18)}
.rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:8}
.rsz:hover{background:rgba(168,85,247,.45)}

/* the height must sit on the CELLS — on a <tr> it is ignored, on a td it acts
   as a minimum. --rh is the per-row override, --rowh the default. */
table.g td{height:var(--rh,var(--rowh));vertical-align:middle;font-size:13px}
table.g td .cv{padding:0 9px;line-height:calc(var(--rh,var(--rowh)) - 2px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* wrapped: the row height decides how many lines show */
body.wrap table.g td{vertical-align:top}
body.wrap table.g td .cv{white-space:normal;line-height:17px;padding-top:6px;
  padding-bottom:5px;display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:var(--rl,var(--rowlines,2));overflow:hidden;text-overflow:clip}
body.wrap table.g td .cv.nocell{display:flex}
body.wrap table.g td .cv.acts{-webkit-line-clamp:unset}
body.wrap table.g td .st,body.wrap table.g td .pr,body.wrap table.g td .hbtn{
  margin-top:1px}
/* the grip that drags a row taller */
.rgrip{position:absolute;left:0;right:0;bottom:-3px;height:7px;cursor:row-resize;z-index:5}
.rgrip:hover{background:rgba(168,85,247,.45)}
.tbtn.active{border-color:var(--violet);color:#e9d5ff;background:rgba(168,85,247,.16)}
table.g tbody tr:nth-child(even) td:not(.c-title):not(.rowno){background:rgba(255,255,255,.014)}
table.g tbody tr:hover td:not(.c-title):not(.rowno){background:rgba(168,85,247,.045)}
table.g tbody tr:hover td.c-title{background:#241a3f}
/* the two frozen columns: these selectors MUST out-specify
   `table.g th,table.g td{position:relative}` above, or the browser leaves them
   relative and the left offset shunts the whole cell sideways. */
table.g td.rowno,table.g th.rowno{width:54px;text-align:center;color:var(--ink3);
  font-size:11.5px;background:linear-gradient(90deg,#211838,#1c1431);
  position:sticky;left:0;z-index:4;user-select:none;cursor:pointer}
table.g thead th.rowno{z-index:7}
table.g tbody tr.picked td.rowno{background:rgba(168,85,247,.3);color:#e9d5ff}
table.g td.c-title{position:sticky;left:var(--nol,54px);z-index:3;background:#1a1230}
table.g thead th.c-title{position:sticky;left:var(--nol,54px);z-index:7}
table.g tbody tr:nth-child(even) td.c-title{background:#1c1433}
table.g td.spacer,table.g th.spacer{border-right:0;background:transparent}

table.g td.c-title .cv{color:var(--ink);font-weight:600}
table.g td.ro .cv{color:var(--ink3)}
.nocell{display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---- the numbered action list, drawn inside the item's cell ---- */
.cv.acts{white-space:normal!important;display:block!important;padding:5px 9px 4px;
  line-height:17px;overflow:hidden;text-overflow:clip}
.cv.acts.empty{color:var(--ink3);font-style:italic;font-size:12px}
.aline{display:flex;align-items:flex-start;gap:7px;line-height:17px;
  padding:0;font-weight:400}
.aline .an{flex:none;min-width:17px;height:15px;margin-top:1px;border-radius:5px;
  background:var(--chip);color:var(--ink2);font-size:10.5px;line-height:15px;
  text-align:center;font-variant-numeric:tabular-nums;border:1px solid transparent;
  transition:.15s var(--ease)}
.aline .an:hover{background:var(--violet);color:#fff;transform:scale(1.08)}
.aline .an.od{background:rgba(244,63,94,.22);color:#fda4af}
.aline .an.ok{background:rgba(52,211,153,.18);color:#6ee7b7}
.aline .at{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.aline .ad{flex:none;font-size:10.5px;color:var(--ink3);margin-top:1px;
  font-variant-numeric:tabular-nums}
.aline .ad.od{color:#fda4af}
.aline.done .at{color:var(--ink3);text-decoration:line-through;
  text-decoration-color:rgba(139,129,168,.6)}
.aline.done .ad{color:var(--ink3);text-decoration:none}
textarea.cellin.textin{height:auto;min-height:100%;resize:none;
  line-height:17px;padding:5px 8px;white-space:pre-wrap;font-family:inherit;
  overflow:auto}
/* a cell holding line breaks shows them; --rh keeps the room for them */
.cv.multi{white-space:pre!important;line-height:17px!important;padding-top:6px;
  padding-bottom:5px;display:block;text-overflow:clip}
body.wrap .cv.multi{white-space:pre-wrap!important}
table.g td.sel{background:rgba(168,85,247,.16)!important;
  box-shadow:inset 0 0 0 1px rgba(168,85,247,.24)}
table.g td.cur{background:rgba(168,85,247,.22)!important;
  box-shadow:inset 0 0 0 2px var(--violet);z-index:2}
table.g td.ro .cv{color:var(--ink3)}
.cellin{position:absolute;inset:0;width:100%;height:100%;background:#120c21;
  border:2px solid var(--violet);outline:none;padding:0 7px;font-size:13px;color:var(--ink);
  z-index:12;border-radius:0}
select.cellin{padding:0 4px}
.dirty:after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;
  border-radius:50%;background:var(--warn)}

/* chips inside cells */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;
  font-size:11.5px;font-weight:650;line-height:18px}
.st-open{background:rgba(56,189,248,.15);color:#7dd3fc}
.st-prog{background:rgba(251,191,36,.15);color:#fcd34d}
.st-hold{background:rgba(139,129,168,.18);color:#c4bcda}
.st-closed{background:rgba(52,211,153,.15);color:#6ee7b7}
.pr{display:inline-block;width:20px;text-align:center;border-radius:6px;font-size:11.5px;
  font-weight:700;line-height:19px}
.pr1{background:rgba(244,63,94,.18);color:#fda4af}
.pr2{background:rgba(251,146,60,.18);color:#fdba74}
.pr3{background:rgba(56,189,248,.16);color:#7dd3fc}
.pr4{background:rgba(139,129,168,.16);color:#b8b0cd}
.late{color:#fda4af;font-weight:650}
.duetoday{color:var(--warn);font-weight:650}

/* ---------- filter menu ---------- */
.menu{position:fixed;z-index:90;background:linear-gradient(180deg,#241a3f,#191131);
  border:1px solid rgba(168,85,247,.28);border-radius:12px;box-shadow:var(--glow);
  padding:9px;width:236px;display:none;animation:rise .18s var(--ease)}
.menu.on{display:block}
.menu .mi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  font-size:12.5px;color:var(--ink2);width:100%;text-align:left}
.menu .mi:hover{background:var(--chip);color:var(--ink)}
.menu .msep{height:1px;background:var(--line);margin:6px 2px}
.menu input.f{width:100%;background:rgba(18,12,33,.85);border:1px solid var(--line2);
  border-radius:8px;padding:6px 9px;outline:none;font-size:12.5px;margin-bottom:6px}
.menu .vals{max-height:190px;overflow:auto;margin:2px 0}
.menu .vals label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  font-size:12.5px;color:var(--ink2);cursor:pointer}
.menu .vals label:hover{background:var(--chip)}
.menu .vals input{accent-color:var(--violet)}
.menu .row{display:flex;gap:6px;margin-top:6px}
.menu .row button{flex:1;border:1px solid var(--line2);border-radius:8px;padding:6px 0;
  font-size:12px;color:var(--ink2)}
.menu .row button:hover{border-color:var(--violet);color:#e9d5ff}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:center;gap:14px;padding:9px 22px calc(11px + var(--safe-b));
  font-size:12px;color:var(--ink3);flex-wrap:wrap}
.statusbar b{color:var(--ink2);font-weight:650}
.statusbar .kpi{display:inline-flex;align-items:center;gap:6px}
.statusbar .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,3,14,.66);
  backdrop-filter:blur(3px);display:none;place-items:center;padding:20px}
.scrim.on{display:grid}
.dlg{width:min(520px,100%);max-height:86vh;overflow:auto;
  background:linear-gradient(180deg,rgba(35,25,62,.98),rgba(20,14,38,.99));
  border:1px solid rgba(168,85,247,.26);border-radius:18px;padding:24px;
  box-shadow:var(--glow);animation:rise .3s var(--ease)}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg p.d{margin:0 0 18px;color:var(--ink3);font-size:13px}
.dlg .fld{margin-bottom:14px}
.dlg label{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:rgba(18,12,33,.85);
  border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.dlg .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
@keyframes rise{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}

/* ---------- history panel ---------- */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:95;
  background:linear-gradient(180deg,rgba(34,23,57,.99),rgba(20,14,38,.99));
  border-left:1px solid rgba(168,85,247,.22);box-shadow:-30px 0 80px rgba(5,2,14,.6);
  transform:translateX(102%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px;
  border-bottom:1px solid var(--line);font-size:15px}
.sheet .sb{flex:1;overflow:auto;padding:16px 18px}
.sheet .hd{margin:0 0 14px;font-size:14px;color:var(--ink);line-height:1.5}
.sheet .under{margin:0 0 16px;font-size:12px;color:var(--ink3);
  border-left:2px solid var(--line2);padding-left:10px;line-height:1.5}
.sheet .fld{margin-bottom:14px}
.sheet label{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.sheet input,.sheet select,.sheet textarea{width:100%;background:rgba(18,12,33,.85);
  border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;
  font-size:13px;font-family:inherit;resize:vertical}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--violet);
  box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.sheet input:disabled{color:var(--ink3);background:rgba(18,12,33,.4)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .prow{display:flex;gap:8px;margin:4px 0 6px}
.sheet .prow .tbtn{flex:1;justify-content:center}
/* the actions register inside the window */
table.alist{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:18px}
table.alist th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);padding:0 8px 7px;white-space:nowrap}
table.alist td{padding:8px;border-top:1px solid rgba(51,37,82,.7);vertical-align:top;
  color:var(--ink2)}
table.alist tbody tr{cursor:pointer;transition:.15s var(--ease)}
table.alist tbody tr:hover td{background:rgba(168,85,247,.09)}
table.alist td.n{width:24px;color:var(--ink3);font-variant-numeric:tabular-nums}
table.alist td.t{color:var(--ink);line-height:1.45}
table.alist td.late{color:#fda4af}
table.alist tr.done td{color:var(--ink3)}
table.alist tr.done td.t{text-decoration:line-through;
  text-decoration-color:rgba(139,129,168,.65)}
.sheet .none{color:var(--ink3);font-size:12.5px;font-style:italic;margin:0 0 18px}
.sheet .addbox{border-top:1px solid var(--line);padding-top:16px}
.sheet .addbox>label{font-size:11px;color:var(--ink2);margin-bottom:10px}
.sheet .hint{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:12px 0 0}
.sheet .sh .tbtn{padding:5px 9px;font-size:11.5px}
.sheet .sf{display:flex;gap:8px;padding:12px 18px calc(14px + var(--safe-b));
  border-top:1px solid var(--line)}
.sheet .sf input{flex:1;background:rgba(18,12,33,.85);border:1px solid var(--line2);
  border-radius:10px;padding:9px 12px;outline:none;font-size:13px}
.sheet .sf input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.hrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid rgba(51,37,82,.5)}
.hrow .hk{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;
  background:var(--ink3)}
.hrow .hk.k-opened{background:var(--sky)}
.hrow .hk.k-closed{background:var(--good)}
.hrow .hk.k-reopened{background:var(--warn)}
.hrow .hk.k-note{background:var(--violet)}
.hrow .hn{font-size:13px;color:var(--ink2);line-height:1.45}
.hrow .ht{font-size:11px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,26px);z-index:120;
  background:rgba(35,25,62,.97);border:1px solid rgba(168,85,247,.3);border-radius:13px;
  padding:11px 18px;font-size:13px;box-shadow:var(--glow);opacity:0;pointer-events:none;
  transition:.32s var(--ease);display:flex;align-items:center;gap:11px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .u{color:var(--violet);font-weight:700;cursor:pointer;pointer-events:auto}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:22px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(124,58,237,.25),transparent 65%),
             linear-gradient(180deg,var(--page1),var(--page2))}
#login.on{display:grid}
#login .box{width:min(400px,100%);
  background:linear-gradient(180deg,rgba(35,25,62,.96),rgba(20,14,38,.98));
  border:1px solid rgba(168,85,247,.25);border-radius:22px;padding:32px;box-shadow:var(--glow);
  animation:rise .55s var(--ease)}
#login h2{margin:0 0 6px;font-size:23px}
#login p{margin:0 0 22px;color:var(--ink3);font-size:13.5px}
#login input{width:100%;background:rgba(18,12,33,.8);border:1px solid var(--line2);
  border-radius:12px;padding:12px 14px;margin-bottom:11px;outline:none;transition:.2s}
#login input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
#login .tbtn{width:100%;justify-content:center;margin-top:6px;padding:12px}
#lerr{color:#fda4af;font-size:12.5px;min-height:18px;margin-top:9px}

/* ============================================================
   Phone. The grid is a desktop instrument — twelve columns, drag to
   resize, range selection. None of that works under a thumb, so the
   phone gets cards over the same data instead.
   ============================================================ */
#mob{display:none}
#mmore{display:none}
@media (max-width:900px){
  #mmore{display:inline-flex;font-size:18px;line-height:1;padding:7px 12px}
  .msheet .mrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;
    border-bottom:1px solid rgba(51,37,82,.6);font-size:14.5px;color:var(--ink2);
    text-align:left}

<script>
/* ============================================================
   Action list — a two-level register.
   An ITEM has a description; ACTIONS hang beneath it as sub-rows,
   each with its own due date, closure and history.
   The item's due date is the LONGEST due among its open actions,
   and the item closes itself once none are open. Both are done by
   database triggers, so they hold whatever writes the row.
   ============================================================ */
const SB_URL='https://ivmmnsjiekhjxkhllncb.supabase.co';
const SB_KEY='sb_publishable_RTHsaxZXVmRBQziLbFJX8g_PAaZzIbF';
const BUILD='ACTIONS 2026-08-28 · b7';

let SESSION=null, ITEMS=[], ACTS=[], VIEW=[], LOGS={};
let SORT=null, FILT={}, SEARCH='';
let CUR={r:0,c:1}, ANC={r:0,c:1};
let EDIT=null, UNDO=[], SHUT=new Set();
let PREFS={w:{},rowh:32,wrap:false,rowhs:{}};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const isoDay=d=>{const x=(d instanceof Date)?d:new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+
         String(x.getDate()).padStart(2,'0');};
const TODAY=()=>isoDay(new Date());

/* ---------- columns ----------
   `on` says which row kind the column belongs to; a cell that is not on
   this row's kind is greyed and cannot be typed into. */
const STATUSES=['Open','In progress','On hold','Closed'];
const COLS=[
  {k:'__no',        lb:'No.',         w:54,  ro:true, kind:'no'},
  {k:'description', lb:'Description', w:280, kind:'text'},
  {k:'__acts',      lb:'Actions',     w:360, kind:'acts'},
  {k:'project',     lb:'Project',     w:130, kind:'text', suggest:true},
  {k:'responsible', lb:'Responsible', w:145, kind:'text', suggest:true},
  {k:'priority',    lb:'Priority',    w:86,  kind:'sel',  opts:['1','2','3','4']},
  {k:'status',      lb:'Status',      w:124, kind:'sel',  opts:STATUSES},
  {k:'raised',      lb:'Raised on',   w:110, kind:'date'},
  {k:'due',         lb:'Due',         w:110, kind:'date'},
  {k:'closed',      lb:'Closed on',   w:110, kind:'date'},
  {k:'notes',       lb:'Notes',       w:240, kind:'text'}
];
const colOf=k=>COLS.findIndex(c=>c.k===k);
const FIRSTC=1;

function get(node,c){
  if(c.kind==='no')return '';
  if(c.kind==='acts')return (node.acts||[]).map(a=>a.text||'').join('\n');
  if(c.k==='closed')return node.rec.done_at||'';
  /* once a row has actions, Responsible is whoever the OPEN ones are with —
     several names run together, each listed once, in list order */
  if(c.k==='responsible'&&(node.acts||[]).length)return openNames(node.acts);
  return node.rec[c.k]==null?'':String(node.rec[c.k]);
}
function openNames(acts){
  const seen=new Set(), out=[];
  acts.filter(a=>a.status!=='Closed').forEach(a=>{
    const v=(a.responsible||'').trim();
    if(v&&!seen.has(v)){seen.add(v);out.push(v);}
  });
  return out.join(', ');
}
/* an item that owns actions has its due date and status computed for it */
function locked(node,c){
  if(c.ro||c.kind==='no')return true;
  if(node.kids>0&&(c.k==='due'||c.k==='status'||c.k==='responsible'||c.k==='closed'))
    return true;
  /* a row that is not closed has no closing date to set */
  if(c.k==='closed'&&node.rec.status!=='Closed')return true;
  return false;
}

/* ============================================================
   Talking to the database
   ============================================================ */
async function api(path,opts={},tries=0){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{
    apikey:SB_KEY,
    Authorization:'Bearer '+(SESSION?SESSION.access_token:SB_KEY),
    'Content-Type':'application/json',
    Prefer:'return=representation',
    ...(opts.headers||{})}});
  if(r.ok){const t=await r.text();return t?JSON.parse(t):null;}
  const body=await r.text();
  if(/PGRST303|issued at future/.test(body)&&tries<4){
    await new Promise(res=>setTimeout(res,900+tries*700));
    return api(path,opts,tries+1);
  }
  if(r.status===401&&tries<1&&await resume())return api(path,opts,tries+1);
  throw new Error(friendly(body,r.status));
}
function friendly(body,status){
  try{const j=JSON.parse(body);
    if(/issued at future/.test(j.message||''))
      return 'The clock on this device is out of step with the server. Check the date and time, then try again.';
    if(j.message)return j.message;
  }catch(e){}
  return body.slice(0,140)||('Request failed ('+status+')');
}
async function signIn(email,pw){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password:pw})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Could not sign in');
  SESSION=d; save(); return d;
}
const save=()=>{try{localStorage.setItem('task-session',JSON.stringify(SESSION));}catch(e){}};
/* A dropped connection makes fetch REJECT rather than return a bad response.
   Unguarded, that exception escaped boot() and neither the app nor the sign-in
   screen was ever shown — a blank white page, and no way to tell why. */
async function resume(){
  let s=null; try{s=JSON.parse(localStorage.getItem('task-session')||'null');}catch(e){}
  if(!s||!s.refresh_token)return false;
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok)return false;
    SESSION=await r.json(); save(); return true;
  }catch(e){ throw new Error('offline'); }
}
function loadPrefs(){
  try{const p=JSON.parse(localStorage.getItem('task-prefs')||'null');
    if(p&&p.w)PREFS=Object.assign(PREFS,p);
    if(p&&p.shut)SHUT=new Set(p.shut);}catch(e){}
  if(!PREFS.rowhs)PREFS.rowhs={};
  COLS.forEach(c=>{if(PREFS.w[c.k])c.w=PREFS.w[c.k];});
  applyWrap();
}
function savePrefs(){
  PREFS.w={}; COLS.forEach(c=>PREFS.w[c.k]=c.w); PREFS.shut=[...SHUT];
  try{localStorage.setItem('task-prefs',JSON.stringify(PREFS));}catch(e){}
}
/* --- wrapped text and row heights ---------------------------------------
   Height has to go on the CELLS: min-height does nothing on a <tr>, and on a
   td a height behaves as a minimum. The number of lines shown is derived from
   the height, so a taller row reveals more text instead of more white space. */
const LINEH=17, PADV=11;
const rowKey=node=>'item:'+node.rec.id;
function linesFor(h){ return Math.max(1,Math.floor((h-PADV)/LINEH)); }
function applyWrap(){
  const r=document.documentElement;
  r.style.setProperty('--rowh',(PREFS.rowh||32)+'px');
  r.style.setProperty('--rowlines',linesFor(PREFS.rowh||32));
  document.body.classList.toggle('wrap',!!PREFS.wrap);
  const b=$('bwrap'); if(b)b.classList.toggle('active',!!PREFS.wrap);
}
/* a row must be tall enough to show its whole action list, unless the user has
   set that row's height by hand */
function naturalH(node){
  const n=(node.acts||[]).length;
  let lines=1;
  COLS.forEach(c=>{
    if(c.kind!=='text')return;
    const v=get(node,c);
    if(v)lines=Math.max(lines,v.split('\n').length);
  });
  return Math.max(PREFS.rowh||32, n?n*LINEH+PADV:0, lines>1?lines*LINEH+PADV:0);
}
function applyRowSizes(){
  const gb=$('gbody'); if(!gb)return;
  gb.querySelectorAll('tr[data-r]').forEach(tr=>{
    const node=VIEW[+tr.dataset.r]; if(!node)return;
    const h=PREFS.rowhs[rowKey(node)]||naturalH(node);
    tr.style.setProperty('--rh',h+'px');
    tr.style.setProperty('--rl',linesFor(h));
  });
}
function setRowH(node,h,all){
  h=Math.max(24,Math.min(400,Math.round(h)));
  if(all){PREFS.rowh=h;PREFS.rowhs={};applyWrap();}
  else PREFS.rowhs[rowKey(node)]=h;
  savePrefs(); applyRowSizes();
}
function resetRowH(node,all){
  if(all){PREFS.rowh=32;PREFS.rowhs={};applyWrap();}
  else delete PREFS.rowhs[rowKey(node)];
  savePrefs(); applyRowSizes();
}
function toggleWrap(){
  PREFS.wrap=!PREFS.wrap;
  if(PREFS.wrap&&(PREFS.rowh||32)<50)PREFS.rowh=66;   /* room for ~3 lines */
  if(!PREFS.wrap)PREFS.rowh=32;
  applyWrap(); savePrefs(); applyRowSizes();
  toast(PREFS.wrap?'Text wraps — drag a row number\u2019s bottom edge to change the height'
                  :'Text on one line');
}

const IFIELDS='id,description,title,project,responsible,priority,status,raised,due,done,done_at,notes,sort,deleted_at';
const AFIELDS='id,item_id,text,responsible,due,status,closed_at,sort,created_at,deleted_at';
async function loadAll(){
  const [it,ac]=await Promise.all([
    api('task_items?select='+IFIELDS+'&deleted_at=is.null&order=sort.asc,id.asc'),
    api('task_actions?select='+AFIELDS+'&deleted_at=is.null&order=sort.asc,id.asc')]);
  ITEMS=(it||[]).map(r=>({...r,description:r.description||r.title||''}));
  ACTS=ac||[];
  ITEMS.forEach((r,i)=>{if(r.sort==null||r.sort===0)r.sort=i+1;});
}
const kidsOf=id=>ACTS.filter(a=>a.item_id===id);

/* ============================================================
   Filtering, sorting, flattening
   ============================================================ */
function textOf(node){
  return COLS.filter(c=>c.kind!=='no').map(c=>get(node,c)).join(' ').toLowerCase();
}
function matches(node){
  if(SEARCH&&!textOf(node).includes(SEARCH))return false;
  for(const k in FILT){
    const f=FILT[k]; if(!f)continue;
    const v=get(node,COLS[colOf(k)]);
    if(f.vals){
      const parts=k==='responsible'?(v?v.split(', '):['']):[v];
      if(!parts.some(p=>f.vals.has(p)))return false;
    }
    if(f.text&&!v.toLowerCase().includes(f.text.toLowerCase()))return false;
  }
  return true;
}
function rebuild(){
  const items=ITEMS.slice();
  if(SORT){
    const c=COLS[colOf(SORT.k)];
    const nd=r=>({kind:'item',rec:r,kids:0,acts:kidsOf(r.id)});
    items.sort((a,b)=>{
      let x=get(nd(a),c), y=get(nd(b),c);
      if(c.k==='priority'){x=+x||9;y=+y||9;}
      else if(c.kind==='date'){x=x||'9999';y=y||'9999';}
      else {x=x.toLowerCase();y=y.toLowerCase();}
      return (x<y?-1:x>y?1:0)*SORT.dir;
    });
  }else items.sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));

  VIEW=[];
  items.forEach(it=>{
    const acts=kidsOf(it.id).slice().sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));
    const node={kind:'item',rec:it,acts,kids:acts.length,no:0};
    if(matches(node))VIEW.push(node);
  });
  VIEW.forEach((node,i)=>node.no=i+1);
  if(CUR.r>=VIEW.length)CUR.r=Math.max(0,VIEW.length-1);
  if(ANC.r>=VIEW.length)ANC.r=CUR.r;
}

/* ============================================================
   Drawing
   ============================================================ */
function head(){
  let h='<tr>';
  COLS.forEach((c,i)=>{
    const cls=(c.kind==='no'?'rowno':'')+(c.k==='description'?' c-title':'');
    const mark=SORT&&SORT.k===c.k?(SORT.dir>0?'▲':'▼'):'';
    const on=FILT[c.k]?'on':'';
    h+='<th class="'+cls+'" style="width:'+c.w+'px" data-c="'+i+'">'
      +'<div class="hin">'
      +(c.kind==='no'?'<span class="lb">'+esc(c.lb)+'</span>'
        :'<span class="lb" data-sort="'+c.k+'">'+esc(c.lb)+'</span>'
         +'<span class="sortmark">'+mark+'</span>'
         +(c.kind==='hist'?'':'<button class="fbtn '+on+'" data-menu="'+c.k
            +'" title="Sort and filter">▼</button>'))
      +'</div>'
      +(c.kind==='no'?'':'<div class="rsz" data-rsz="'+i+'"></div>')
      +'</th>';
  });
  h+='<th class="spacer"></th>';
  return h+'</tr>';
}
const stCls=s=>s==='Closed'?'st-closed':s==='In progress'?'st-prog'
              :s==='On hold'?'st-hold':'st-open';
const shortDay=d=>{
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); if(!m)return '';
  return m[3]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1];
};
/* the actions sit inside the item's cell as a numbered list; the number itself
   is the button that opens that action's detail and history */
function actsHTML(node){
  const acts=node.acts||[];
  if(!acts.length)
    return '<span class="cv acts empty">— no actions yet —</span>';
  return '<span class="cv acts">'+acts.map((a,i)=>{
    const closed=a.status==='Closed';
    const overdue=!closed&&a.due&&a.due<TODAY();
    return '<span class="aline'+(closed?' done':'')+'">'
      +'<button class="an'+(overdue?' od':'')+(closed?' ok':'')+'" data-act="'+a.id+'" '
      +'title="Open this action">'+(i+1)+'</button>'
      +'<span class="at">'+esc(a.text||'—')+'</span>'
      +(a.due?'<span class="ad'+(overdue?' od':'')+'">'+esc(shortDay(a.due))+'</span>':'')
      +'</span>';
  }).join('')+'</span>';
}
function cellHTML(node,c){
  if(c.kind==='no')
    return '<span class="cv nocell"><b>'+node.no+'</b></span>'
      +'<i class="rgrip" data-rgrip="1"></i>';
  if(c.kind==='acts')return actsHTML(node);
  const v=get(node,c);
  if(c.k==='status')
    return '<span class="cv"><span class="st '+stCls(v)+'">'+esc(v||'Open')+'</span></span>';
  if(c.k==='priority')
    return '<span class="cv">'+(v?'<span class="pr pr'+esc(v)+'">'+esc(v)+'</span>':'')+'</span>';
  if(c.k==='due'&&v&&get(node,COLS[colOf('status')])!=='Closed'){
    const cls=v<TODAY()?'late':v===TODAY()?'duetoday':'';
    return '<span class="cv '+cls+'">'+esc(v)+'</span>';
  }
  const multi=v.indexOf('\n')>=0;
  return '<span class="cv'+(multi?' multi':'')+'">'+esc(v)+'</span>';
}
function body(){
  if(!VIEW.length)
    return '<tr><td colspan="'+(COLS.length+1)+'" style="height:120px;text-align:center;'
      +'color:var(--ink3)">Nothing to show. '
      +(Object.keys(FILT).length||SEARCH?'Clear the filters, or ':'')+'add a row.</td></tr>';
  const box=selBox();
  let h='';
  VIEW.forEach((node,ri)=>{
    const picked=ri>=box.r1&&ri<=box.r2;
    h+='<tr class="irow'+(picked?' picked':'')+'" data-r="'+ri+'">';
    COLS.forEach((c,ci)=>{
      const inBox=ri>=box.r1&&ri<=box.r2&&ci>=box.c1&&ci<=box.c2;
      const isCur=ri===CUR.r&&ci===CUR.c;
      const cls=[c.kind==='no'?'rowno':'', c.k==='description'?'c-title':'',
                 locked(node,c)?'ro':'',
                 inBox&&c.kind!=='no'?'sel':'', isCur?'cur':''].filter(Boolean).join(' ');
      h+='<td class="'+cls+'" data-r="'+ri+'" data-c="'+ci+'">'+cellHTML(node,c)+'</td>';
    });
    h+='<td class="spacer"></td></tr>';
  });
  return h;
}
function armButtons(){

/* Selection changes must NOT rebuild the table. Replacing the tbody on
   mousedown destroys the element the mouseup would land on, so the browser
   never raises the click or the double-click and no cell can be opened.
   Toggle the classes on the existing cells instead. */
function paintSel(){
  const box=selBox(), gb=$('gbody');

    const r=+tr.dataset.r;

/* the Description column is frozen just right of the row numbers, so its sticky

function pinFrozen(){

function selBox(){
  return {r1:Math.min(CUR.r,ANC.r), r2:Math.max(CUR.r,ANC.r),
          c1:Math.max(FIRSTC,Math.min(CUR.c,ANC.c)), c2:Math.max(CUR.c,ANC.c)};

/* ============================================================
   Writing
   ============================================================ */
function coerce(c,val){
  let v=String(val==null?'':val).replace(/\r/g,'').trim();
  if(c.kind==='date'){
    if(!v)return '';
    const d=parseDate(v)||v;
    return sensibleDate(d)?d:'';           /* never store a half-typed year */
  }
  if(c.k==='priority'){const n=parseInt(v,10);return (n>=1&&n<=4)?n:4;}
  if(c.k==='status'){
    if(!v)return 'Open';
    const hit=STATUSES.find(s=>s.toLowerCase()===v.toLowerCase());
    if(hit)return hit;
    if(/^(done|complete|completed|closed)$/i.test(v))return 'Closed';
    if(/^(wip|ongoing|in-progress)$/i.test(v))return 'In progress';
    return v;
  }
  return v;
}
function parseDate(v){
  v=String(v).trim();
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(v);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];
    return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  if(/^\d{5}$/.test(v)){
    const d=new Date(Date.UTC(1899,11,30+ +v));
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'
          +String(d.getUTCDate()).padStart(2,'0');
  }
  const d=new Date(v); return isNaN(d)?'':isoDay(d);
}
const findRec=(kind,id)=>(kind==='item'?ITEMS:ACTS).find(r=>r.id===id);
async function applyEdits(list,label){
  const back=[], pend={};
  list.forEach(e=>{
    const c=COLS[e.c], node=e.node;
    if(locked(node,c))return;
    const nv=coerce(c,e.v);
    const f=(c.k==='closed')?'done_at':c.k;      /* the column is stored as done_at */
    if(String(node.rec[f]??'')===String(nv))return;
    back.push({kind:node.kind,id:node.rec.id,k:f,v:node.rec[f]});
    node.rec[f]=nv;
    const key=node.kind+':'+node.rec.id;
    (pend[key]=pend[key]||{})[f]=nv;
  });
  if(!back.length)return;
  UNDO.push({t:'cells',back,label:label||'edit'});
  if(UNDO.length>60)UNDO.shift();
  repaintBody();
  await push(pend);
  await refreshAfterAction(list);
  paint();
}
async function push(pend){
  for(const key in pend){
    const i=key.indexOf(':'), kind=key.slice(0,i), id=key.slice(i+1);
    const tbl=kind==='item'?'task_items':'task_actions';
    try{
      const out=await api(tbl+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(pend[key])});
      if(out&&out[0])Object.assign(findRec(kind,+id)||{},out[0]);
    }catch(err){toast('Could not save: '+err.message);}
  }
}
/* an action's due date or closure moves its item, so re-read the items */
async function refreshAfterAction(list){
  if(!list.some(e=>e.node.kind==='action'))return;
  await refreshItems();
}
async function refreshItems(){
  try{
    const it=await api('task_items?select='+IFIELDS+'&deleted_at=is.null&order=sort.asc,id.asc');
    if(it)ITEMS=it.map(r=>({...r,description:r.description||r.title||''}));
  }catch(e){}
}
async function reload(){ await loadAll(); await loadLogCounts(); paint(); }
async function undo(){
  const step=UNDO.pop(); if(!step)return;
  armButtons();
  if(step.t==='cells'){
    const pend={};
    step.back.forEach(b=>{
      const rec=findRec(b.kind,b.id); if(!rec)return;
      rec[b.k]=b.v; (pend[b.kind+':'+b.id]=pend[b.kind+':'+b.id]||{})[b.k]=b.v;
    });
    repaintBody(); await push(pend); await refreshItems();
  }else if(step.t==='add'){
    for(const r of step.made){
      const tbl=r.kind==='item'?'task_items':'task_actions';
      try{await api(tbl+'?id=eq.'+r.id,{method:'PATCH',
        body:JSON.stringify({deleted_at:new Date().toISOString()})});}catch(e){}
    }
    await loadAll();
  }else if(step.t==='del'){
    for(const r of step.rows){
      const tbl=r.kind==='item'?'task_items':'task_actions';
      try{await api(tbl+'?id=eq.'+r.id,{method:'PATCH',
        body:JSON.stringify({deleted_at:null})});}catch(e){}
    }
    await loadAll();
  }else if(step.t==='acts'){
    for(const id of step.created)
      try{await api('task_actions?id=eq.'+id,{method:'PATCH',
        body:JSON.stringify({deleted_at:new Date().toISOString()})});}catch(e){}
    for(const id of step.deleted)
      try{await api('task_actions?id=eq.'+id,{method:'PATCH',
        body:JSON.stringify({deleted_at:null})});}catch(e){}
    for(const b of step.textBack)
      try{await api('task_actions?id=eq.'+b.id,{method:'PATCH',
        body:JSON.stringify({text:b.text})});}catch(e){}
    await loadAll(); await loadLogCounts();
  }else if(step.t==='split'){
    try{await api('task_actions?id=eq.'+step.actionId,{method:'PATCH',
      body:JSON.stringify({item_id:step.fromItem})});}catch(e){}
    try{await api('task_items?id=eq.'+step.newItem,{method:'PATCH',
      body:JSON.stringify({deleted_at:new Date().toISOString()})});}catch(e){}
    await loadAll(); paint(); toast('Split undone'); return;
  }
  paint(); toast('Undone');
}

/* ============================================================
   Editing a cell
   ============================================================ */
const tdAt=(r,c)=>$('gbody').querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
function suggestions(k){
  const s=new Set();
  ITEMS.forEach(r=>{const v=(r[k]||'').trim(); if(v)s.add(v);});
  ACTS.forEach(r=>{const v=(r[k]||'').trim(); if(v)s.add(v);});
  return [...s].sort();
}
/* the filter menu should offer single names, not the run-together strings */
function nameValues(){
  const s=new Set();
  VIEW.forEach(nd=>{
    if((nd.acts||[]).length)
      nd.acts.filter(a=>a.status!=='Closed')
        .forEach(a=>{const v=(a.responsible||'').trim(); s.add(v);});
    else s.add((nd.rec.responsible||'').trim());
  });
  return [...s];
}
function beginEdit(seed){
  if(EDIT)return;
  const c=COLS[CUR.c], node=VIEW[CUR.r];
  if(!node||locked(node,c))return;
  const td=tdAt(CUR.r,CUR.c); if(!td)return;
  let el;
  if(c.kind==='acts'){
    openActions(node.rec.id,seed!=null);   /* a window, not a text box */
    return;
  }
  if(c.kind==='sel'){
    el=document.createElement('select'); el.className='cellin';
    const cur=get(node,c);
    c.opts.forEach(o=>{
      const op=document.createElement('option'); op.value=o; op.textContent=o;
      if(o===cur)op.selected=true; el.appendChild(op);
    });
  }else if(c.kind==='text'){
    /* a box rather than a single-line input, so Alt+Enter can break the line
       the way it does in Excel. Enter still commits. */
    el=document.createElement('textarea');
    el.className='cellin textin';
    el.value=seed!=null?seed:get(node,c);
    el.rows=Math.max(1,el.value.split('\n').length);
    if(c.suggest){
      const id='dl-'+c.k; let dl=$(id);
      if(!dl){dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl);}
      dl.innerHTML=suggestions(c.k).map(v=>'<option value="'+esc(v)+'">').join('');
      el.setAttribute('list',id);
    }
  }else{
    el=document.createElement('input'); el.className='cellin';
    el.type='date';
    el.value=seed!=null?seed:get(node,c);
  }
  td.appendChild(el);
  EDIT={r:CUR.r,c:CUR.c,el,node};
  el.focus();
  if(el.tagName==='TEXTAREA'&&seed==null)el.select();
  el.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&(ev.altKey||ev.shiftKey)&&el.tagName==='TEXTAREA'){
      ev.preventDefault();
      const a=el.selectionStart, b=el.selectionEnd;
      el.value=el.value.slice(0,a)+'\n'+el.value.slice(b);
      el.selectionStart=el.selectionEnd=a+1;
      el.rows=Math.max(1,el.value.split('\n').length);
      ev.stopPropagation(); return;
    }
    if(ev.key==='Enter'){ev.preventDefault();commitEdit();move(1,0,false);}
    else if(ev.key==='Escape'){ev.preventDefault();cancelEdit();}
    else if(ev.key==='Tab'){ev.preventDefault();commitEdit();move(0,ev.shiftKey?-1:1,false);}
    ev.stopPropagation();
  });
  if(c.kind==='sel')el.addEventListener('change',()=>commitEdit());
  el.addEventListener('blur',()=>{setTimeout(()=>{if(EDIT&&EDIT.el===el)commitEdit();},120);});
}
function commitEdit(){
  if(!EDIT)return;
  const el=EDIT.el, node=EDIT.node, ci=EDIT.c, v=el.value;
  EDIT=null;
  if(el.parentNode)el.parentNode.removeChild(el);
  applyEdits([{node,c:ci,v}]);
  $('gwrap').focus();
}
/* Reconcile the typed list against the actions already stored.
   Lines are matched to actions IN ORDER: an existing line keeps its action —
   and therefore its dates and its history — a new line creates one, and a line
   you removed soft-deletes its action so Undo can bring it back intact. */
async function syncActions(it,lines){
  const cur=kidsOf(it.id).slice().sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));
  const want=lines.map(t=>String(t).replace(/^\s*\d+\s*[.)\-]\s*/,'').trim())
                  .filter(t=>t.length);
  const step={t:'acts',created:[],deleted:[],textBack:[]};
  const stamp=new Date().toISOString();
  let touched=false;
  for(let i=0;i<Math.max(want.length,cur.length);i++){
    const t=want[i], a=cur[i];
    try{
      if(a&&t!==undefined){
        if(a.text!==t){
          step.textBack.push({id:a.id,text:a.text});
          const out=await api('task_actions?id=eq.'+a.id,{method:'PATCH',
            body:JSON.stringify({text:t,sort:i+1})});
          if(out&&out[0])Object.assign(a,out[0]);
          touched=true;
        }else if(a.sort!==i+1){
          await api('task_actions?id=eq.'+a.id,{method:'PATCH',
            body:JSON.stringify({sort:i+1})});
          a.sort=i+1;
        }
      }else if(!a&&t!==undefined){
        const out=await api('task_actions',{method:'POST',body:JSON.stringify([{
          item_id:it.id,text:t,status:'Open',responsible:it.responsible||'',
          due:'',sort:i+1}])});
        if(out&&out[0]){ACTS.push(out[0]);step.created.push(out[0].id);touched=true;}
      }else if(a&&t===undefined){
        await api('task_actions?id=eq.'+a.id,{method:'PATCH',
          body:JSON.stringify({deleted_at:stamp})});
        step.deleted.push(a.id);
        ACTS=ACTS.filter(x=>x.id!==a.id);
        touched=true;
      }
    }catch(e){toast('Could not save the actions: '+e.message);}
  }
  if(!touched)return;
  UNDO.push(step);
  if(UNDO.length>60)UNDO.shift();
  await refreshItems(); await loadLogCounts(); paint();
}
function cancelEdit(){
  if(!EDIT)return;
  const el=EDIT.el; EDIT=null;
  if(el.parentNode)el.parentNode.removeChild(el);
  paintSel(); $('gwrap').focus();
}

/* ============================================================
   Moving about
   ============================================================ */
function move(dr,dc,extend){
  const r=Math.max(0,Math.min(VIEW.length-1,CUR.r+dr));
  const c=Math.max(FIRSTC,Math.min(COLS.length-1,CUR.c+dc));
  CUR={r,c}; if(!extend)ANC={r,c};
  paintSel(); scrollIntoView();
}
function goto_(r,c,extend){
  CUR={r:Math.max(0,Math.min(VIEW.length-1,r)),c:Math.max(FIRSTC,Math.min(COLS.length-1,c))};
  if(!extend)ANC={...CUR};
  paintSel(); scrollIntoView();
}
function scrollIntoView(){
  const td=tdAt(CUR.r,CUR.c); if(!td||!td.getBoundingClientRect)return;
  const w=$('gwrap'), tr=td.getBoundingClientRect(), wr=w.getBoundingClientRect();
  if(tr.top<wr.top+38)w.scrollTop-=(wr.top+38-tr.top);
  if(tr.bottom>wr.bottom)w.scrollTop+=(tr.bottom-wr.bottom);
  if(tr.left<wr.left+200)w.scrollLeft-=(wr.left+200-tr.left);
  if(tr.right>wr.right)w.scrollLeft+=(tr.right-wr.right);
}

/* ============================================================
   Clipboard
   ============================================================ */
function selTSV(){
  const b=selBox(), out=[];
  for(let r=b.r1;r<=b.r2;r++){
    const line=[], node=VIEW[r];
    for(let c=b.c1;c<=b.c2;c++){
      const col=COLS[c];
      const v=col.kind==='no'?(node?String(node.no):'')
              :(node?get(node,col):'');
      line.push(String(v).replace(/\t/g,' ').replace(/\r?\n/g,'; '));
    }
    out.push(line.join('\t'));
  }
  return out.join('\n');
}
async function doCopy(){
  const t=selTSV();
  try{await navigator.clipboard.writeText(t);}
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e2){} ta.remove();
  }
  toast('Copied');
}
async function doPasteText(text){
  if(!text)return;
  const grid=text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  const b=selBox();
  const need=b.r1+grid.length-VIEW.length;
  if(need>0){await addItems(need,false);rebuild();}
  const edits=[], actEdits=[];
  grid.forEach((line,i)=>{
    const node=VIEW[b.r1+i]; if(!node)return;
    line.forEach((v,j)=>{
      const ci=b.c1+j; if(ci>=COLS.length)return;
      if(locked(node,COLS[ci]))return;
      if(COLS[ci].kind==='acts'){
        actEdits.push({it:node.rec,lines:String(v).split(/\s*;\s*/)});
        return;
      }
      edits.push({node,c:ci,v});
    });
  });
  await applyEdits(edits,'paste');
  for(const ae of actEdits)await syncActions(ae.it,ae.lines);
  ANC={r:b.r1,c:b.c1};
  CUR={r:Math.min(VIEW.length-1,b.r1+grid.length-1),
       c:Math.min(COLS.length-1,b.c1+grid[0].length-1)};
  paintSel();
  toast('Pasted '+grid.length+' row'+(grid.length>1?'s':''));
}
async function doPasteButton(){
  try{const t=await navigator.clipboard.readText(); await doPasteText(t);}
  catch(e){toast('Press Ctrl+V (or ⌘V) — the browser will not let a button read the clipboard');}
}
async function clearSel(){
  const b=selBox(), edits=[], wipe=[];
  for(let r=b.r1;r<=b.r2;r++)for(let c=b.c1;c<=b.c2;c++){
    const node=VIEW[r]; if(!node||locked(node,COLS[c]))continue;
    if(COLS[c].kind==='acts'){ if((node.acts||[]).length)wipe.push(node.rec); continue; }
    edits.push({node,c,v:''});
  }
  await applyEdits(edits,'clear');
  for(const it of wipe)await syncActions(it,[]);
}
async function fillDown(){
  const b=selBox(); if(b.r2===b.r1)return;
  const edits=[];
  for(let c=b.c1;c<=b.c2;c++){
    const top=VIEW[b.r1]; if(!top)continue;
    const src=get(top,COLS[c]);
    if(COLS[c].kind==='acts')continue;      /* an action list is not copyable */
    for(let r=b.r1+1;r<=b.r2;r++){
      const node=VIEW[r]; if(!node||locked(node,COLS[c]))continue;
      edits.push({node,c,v:src});
    }
  }
  await applyEdits(edits,'fill down');
  toast('Filled down');
}

/* ============================================================
   Items and actions
   ============================================================ */
async function addItems(n,focus=true,at){
  const base=ITEMS.length?Math.max(...ITEMS.map(r=>r.sort||0)):0;
  const payload=[];
  for(let i=0;i<n;i++)
    payload.push({description:'',title:'',status:'Open',priority:4,raised:TODAY(),
      sort:(at!=null?at+(i+1)/(n+1):base+i+1)});
  try{
    const out=await api('task_items',{method:'POST',body:JSON.stringify(payload)});
    (out||[]).forEach(r=>ITEMS.push({...r,description:r.description||''}));
    UNDO.push({t:'add',made:(out||[]).map(r=>({kind:'item',id:r.id}))});
    rebuild();
    if(focus&&out&&out[0]){
      const ri=VIEW.findIndex(nd=>nd.kind==='item'&&nd.rec.id===out[0].id);
      if(ri>=0){CUR={r:ri,c:colOf('description')};ANC={...CUR};}
    }
    paint();
    if(focus){scrollIntoView();beginEdit('');}
  }catch(e){toast('Could not add: '+e.message);}
}
async function insertAbove(){
  const node=VIEW[CUR.r];
  if(!node)return addItems(1);
  const it=node.rec;
  const idx=ITEMS.findIndex(r=>r.id===it.id);
  const prev=idx>0?ITEMS[idx-1]:null;
  await addItems(1,true,prev?(prev.sort+it.sort)/2-0.5:it.sort-1);
}
/* an action always belongs to the item of whichever row you are standing on */
/* open the item's actions window with the form ready to fill in */
function addAction(){
  const node=VIEW[CUR.r]; if(!node)return;
  if(EDIT)commitEdit();
  CUR={r:CUR.r,c:colOf('__acts')}; ANC={...CUR};
  paintSel(); scrollIntoView();
  openActions(node.rec.id,true);
}
/* promote an action to an item of its own, history and all */
async function splitAction(actionId){
  const a=ACTS.find(x=>x.id===actionId);
  if(!a)return toast('Open an action first — click its number');
  const from=a.item_id, parent=ITEMS.find(i=>i.id===from)||{};
  const ok=await confirmBox('Split this action into its own item?',
    'It leaves "'+(parent.description||'the item')
    +'" and becomes a row of its own, keeping its dates and its history.');
  if(!ok)return;
  const base=ITEMS.length?Math.max(...ITEMS.map(r=>r.sort||0)):0;
  try{
    const made=await api('task_items',{method:'POST',body:JSON.stringify([{
      description:a.text||'',title:a.text||'',project:parent.project||'',
      responsible:a.responsible||'',priority:parent.priority||4,
      status:a.status||'Open',raised:parent.raised||TODAY(),due:a.due||'',
      notes:parent.notes||'',sort:base+1}])});
    if(!made||!made[0])throw new Error('the new item was not created');
    await api('task_actions?id=eq.'+a.id,{method:'PATCH',
      body:JSON.stringify({item_id:made[0].id})});
    UNDO.push({t:'split',actionId:a.id,fromItem:from,newItem:made[0].id});
    await loadAll(); await loadLogCounts(); paint();
    const ri=VIEW.findIndex(nd=>nd.rec.id===made[0].id);
    if(ri>=0){CUR={r:ri,c:colOf('description')};ANC={...CUR};paintSel();scrollIntoView();}

async function deleteRows(){
  const b=selBox();
  const nodes=VIEW.slice(b.r1,b.r2+1);
  if(!nodes.length)return;
  const nAct=nodes.reduce((t,n)=>t+(n.acts||[]).length,0);
  const ok=await confirmBox('Delete '+nodes.length+' row'+(nodes.length>1?'s':'')+'?',
    (nAct?'That takes '+nAct+' action'+(nAct>1?'s':'')+' with it. ':'')
    +'Everything goes to the bin — Undo brings it straight back.');
  if(!ok)return;
  const keep=[], stamp=new Date().toISOString();
  for(const n of nodes){
    try{await api('task_items?id=eq.'+n.rec.id,{method:'PATCH',
      body:JSON.stringify({deleted_at:stamp})});}catch(e){}
    keep.push({kind:'item',id:n.rec.id});
    for(const k of kidsOf(n.rec.id)){
      try{await api('task_actions?id=eq.'+k.id,{method:'PATCH',
        body:JSON.stringify({deleted_at:stamp})});}catch(e){}
      keep.push({kind:'action',id:k.id});
    }
  }
  UNDO.push({t:'del',rows:keep});
  await loadAll(); await loadLogCounts(); paint();
  toast('Deleted '+nodes.length+' row'+(nodes.length>1?'s':''),'Undo',undo);

/* One action's detail: its own responsible, due date, status, closure and
   history — everything that no longer fits on the item's single row. */
/* wait for a complete date, then a beat, before saving it */
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function sensibleDate(v){
  if(!v)return true;                       /* clearing is allowed */
  if(!DATE_RE.test(v))return false;
  const y=+v.slice(0,4);
  return y>=2000&&y<=2100;
}
function dateField(el,save,ms=450){
  if(!el)return;
  let t=null, last=el.value;
  const fire=()=>{
    clearTimeout(t); t=null;
    const v=el.value;
    if(v===last)return;
    if(!sensibleDate(v))return;            /* still half-typed */
    last=v; save(v);
  };
  el.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(fire,ms);});
  el.addEventListener('change',()=>{clearTimeout(t);t=setTimeout(fire,ms);});
  el.addEventListener('blur',fire);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fire();}});
}
function closedHint(a){
  return a.status==='Closed'
    ? 'Closed on is set to today when you close an action — change it here if it '
      +'was really finished on another day.'
    : 'Closed on fills in when the status becomes Closed.';
}

  sh.classList.add('on');
  const dl=$('dl-responsible')||(()=>{const x=document.createElement('datalist');
    x.id='dl-responsible';document.body.appendChild(x);return x;})();
  dl.innerHTML=suggestions('responsible').map(v=>'<option value="'+esc(v)+'">').join('');

    if(!isMobile())$('gwrap').focus();};
  $('hclose').onclick=close;
  if($('hback'))$('hback').onclick=()=>openActions(backTo,false,BACK_TO_ITEM);

    const rows=LOGS[actionId]||[];
    $('hlist').innerHTML=rows.length?rows.map(r=>
      '<div class="hrow"><i class="hk k-'+esc(r.kind)+'"></i><div>'
      +'<div class="hn">'+esc(r.note)+'</div>'
      +'<div class="ht">'+esc(whenTxt(r.at))+'</div></div></div>').join('')
      :'<p style="color:var(--ink3)">Nothing recorded yet.</p>';
  };
  await loadLog(actionId); draw();
  const patch=async(fields)=>{
    try{
      const out=await api('task_actions?id=eq.'+actionId,{method:'PATCH',
        body:JSON.stringify(fields)});
      if(out&&out[0])Object.assign(a,out[0]);
      await refreshItems(); await loadLog(actionId); draw(); paint();
      const cl=$('sheet').querySelector('#pst');
      if(cl)cl.value=a.status;
      const cd=$('sheet').querySelector('#pclosed');
      if(cd){cd.value=a.closed_at||'';cd.disabled=(a.status!=='Closed');}
      const ph=$('sheet').querySelector('#phint');

    }catch(e){toast('Could not save: '+e.message);}

  $('ptext').onblur=()=>{const v=$('ptext').value.trim();

  $('pres').onblur=()=>{const v=$('pres').value.trim();
    if(v!==(a.responsible||''))patch({responsible:v});};
  /* A date input raises `change` on EVERY keystroke of the year, so typing 2026
     went through 0002, 0020 and 0202 first — each one saved, each one logged, and
     the year 2 briefly stored. Only take a whole, sane date, and only once the
     typing has stopped. */
  dateField($('pdue'),v=>patch({due:v}));
  dateField($('pclosed'),v=>{
    if($('pst').value!=='Closed')return toast('Set the status to Closed first');
    if(!v)return toast('A closed action needs a date — reopen it instead');

  $('pdel').onclick=async()=>{
    const ok=await confirmBox('Delete this action?',
      'It goes to the bin with its history — Undo brings it back.');

        body:JSON.stringify({deleted_at:new Date().toISOString()})});
      ACTS=ACTS.filter(x=>x.id!==actionId);
      UNDO.push({t:'acts',created:[],deleted:[actionId],textBack:[]});
      await refreshItems(); await loadLogCounts(); paint();
      if(backTo)openActions(backTo); else close();
      toast('Action deleted','Undo',undo);

    +'<textarea id="idesc" rows="3">'+esc(it.description||'')+'</textarea></div>'
    +'<div class="two">'
    +'<div class="fld"><label>Project</label>'

    +'<div class="fld"><label>Priority</label><select id="iprio">'
    +['1','2','3','4'].map(o=>'<option'+(+o===+it.priority?' selected':'')+'>'+o+'</option>').join('')
    +'</select></div></div>'
    +'<div class="fld"><label>Responsible'+(has?' — from the open actions':'')+'</label>'
    +'<input id="ires" value="'+esc(get(node,COLS[colOf('responsible')]))+'"'
    +(has?' disabled':' list="dl-responsible"')+'></div>'
    +'<div class="two">'
    +'<div class="fld"><label>Status'+(has?' — from the actions':'')+'</label>'
    +'<select id="istat"'+(has?' disabled':'')+'>'
    +STATUSES.map(o=>'<option'+(o===it.status?' selected':'')+'>'+o+'</option>').join('')
    +'</select></div>'
    +'<div class="fld"><label>Due'+(has?' — longest open':'')+'</label>'
    +'<input id="idue" type="date" value="'+esc(it.due||'')+'"'+(has?' disabled':'')+'></div>'
    +'</div><div class="two">'
    +'<div class="fld"><label>Raised on</label>'
    +'<input id="iraised" type="date" value="'+esc(it.raised||'')+'"></div>'
    +'<div class="fld"><label>Closed on</label>'
    +'<input id="iclosed" type="date" value="'+esc(it.done_at||'')+'"'
    +((has||it.status!=='Closed')?' disabled':'')+'></div></div>'
    +'<div class="fld"><label>Notes</label>'
    +'<textarea id="inotes" rows="2">'+esc(it.notes||'')+'</textarea></div>'
    +'<div class="prow">'
    +'<button class="tbtn primary" id="iacts">Actions'+(has?' ('+has+')':'')+' ›</button>'
    +'<button class="tbtn danger" id="idel">Delete</button></div>'
    +'</div>';
  sh.classList.add('on');
  ['project','responsible'].forEach(k=>{
    const id='dl-'+k;
    const dl=$(id)||(()=>{const x=document.createElement('datalist');
      x.id=id;document.body.appendChild(x);return x;})();
    dl.innerHTML=suggestions(k).map(v=>'<option value="'+esc(v)+'">').join('');
  });
  const close=()=>{sh.classList.remove('on');};
  $('iclose').onclick=close;
  const patch=async(fields)=>{
    try{
      const out=await api('task_items?id=eq.'+itemId,{method:'PATCH',
        body:JSON.stringify(fields)});
      if(out&&out[0])Object.assign(it,out[0],{description:out[0].description||''});
      paint();
      const ic=$('sheet').querySelector('#iclosed');
      if(ic&&!has){ic.disabled=(it.status!=='Closed');ic.value=it.done_at||'';}
    }catch(e){toast('Could not save: '+e.message);}
  };
  $('idesc').onblur=()=>{const v=$('idesc').value.trim();
    if(v!==(it.description||''))patch({description:v,title:v});};
  $('inotes').onblur=()=>{const v=$('inotes').value.trim();
    if(v!==(it.notes||''))patch({notes:v});};
  $('iproj').onblur=()=>{const v=$('iproj').value.trim();
    if(v!==(it.project||''))patch({project:v});};
  $('iprio').onchange=()=>patch({priority:+$('iprio').value});
  if(!has){
    $('ires').onblur=()=>{const v=$('ires').value.trim();
      if(v!==(it.responsible||''))patch({responsible:v});};
    $('istat').onchange=()=>patch({status:$('istat').value});
    dateField($('idue'),v=>patch({due:v}));
    dateField($('iclosed'),v=>{
      if(it.status!=='Closed')return toast('Set the status to Closed first');
      patch({done_at:v});
    });
  }
  dateField($('iraised'),v=>patch({raised:v}));
  $('iacts').onclick=()=>openActions(itemId,!has,()=>openItem(itemId));
  $('idel').onclick=async()=>{
    const ok=await confirmBox('Delete this item?',
      (has?'Its '+has+' action'+(has>1?'s go':' goes')+' with it. ':'')
      +'It goes to the bin — Undo brings it back.');
    if(!ok)return;
    const stamp=new Date().toISOString(), keep=[{kind:'item',id:itemId}];
    try{
      await api('task_items?id=eq.'+itemId,{method:'PATCH',
        body:JSON.stringify({deleted_at:stamp})});
      for(const k of kidsOf(itemId)){
        await api('task_actions?id=eq.'+k.id,{method:'PATCH',
          body:JSON.stringify({deleted_at:stamp})});
        keep.push({kind:'action',id:k.id});
      }
      UNDO.push({t:'del',rows:keep});
      close(); await loadAll(); paint();
      toast('Deleted','Undo',undo);
    }catch(e){toast('Could not delete: '+e.message);}
  };
  if(fresh)$('idesc').focus();
}

/* ============================================================
   Column width, autofit
   ============================================================ */
function setW(i,w){
  COLS[i].w=Math.max(46,Math.min(680,Math.round(w)));
  const th=$('ghead').querySelector('th[data-c="'+i+'"]');
  if(th)th.style.width=COLS[i].w+'px';
  savePrefs(); pinFrozen();
}
function autofit(i){
  const c=COLS[i];
  const cv=document.createElement('canvas').getContext('2d');
  cv.font='13px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif';
  let w=cv.measureText(c.lb).width+46;
  VIEW.slice(0,500).forEach(nd=>{
    const t=c.kind==='no'?'000.0':get(nd,c);
    w=Math.max(w,cv.measureText(t).width+(c.k==='text'?46:30));
  });
  setW(i,w);
}
function autofitAll(){COLS.forEach((c,i)=>{if(c.kind!=='no')autofit(i);});toast('Columns fitted');}
function wireRowResize(){
  const gb=$('gbody');
  gb.addEventListener('mousedown',e=>{
    const g=e.target.closest('[data-rgrip]'); if(!g)return;
    e.preventDefault(); e.stopPropagation();
    const tr=g.closest('tr'), node=VIEW[+tr.dataset.r]; if(!node)return;
    const all=e.shiftKey, y0=e.clientY, h0=tr.getBoundingClientRect().height;
    const mv=ev=>setRowH(node,h0+(ev.clientY-y0),all);
    const up=()=>{document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  gb.addEventListener('dblclick',e=>{
    const g=e.target.closest('[data-rgrip]'); if(!g)return;
    e.preventDefault(); e.stopPropagation();
    const tr=g.closest('tr'), node=VIEW[+tr.dataset.r]; if(!node)return;
    resetRowH(node,e.shiftKey);
  });
}
function wireResize(){
  $('ghead').addEventListener('mousedown',e=>{
    const h=e.target.closest('[data-rsz]'); if(!h)return;
    e.preventDefault(); e.stopPropagation();
    const i=+h.dataset.rsz, x0=e.clientX, w0=COLS[i].w;
    const mv=ev=>setW(i,w0+(ev.clientX-x0));
    const up=()=>{document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  $('ghead').addEventListener('dblclick',e=>{
    const h=e.target.closest('[data-rsz]'); if(!h)return;
    e.preventDefault(); e.stopPropagation(); autofit(+h.dataset.rsz);
  });
}
