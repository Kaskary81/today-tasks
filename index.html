    MOB.f=f.fx||''; MOB.fs=f.fs||''; MOB.fd=f.fd||'';
    MOB.fage=f.fage||null; MOB.fageL=f.fageL||'';
    if(f.fh)MOB.f={'HESCO':'hesco','AWPT':'awpt',"Maaden":'maaden'}[f.fh]||'';
    const b=document.getElementById('mbody'); if(b)b.scrollTop=0;
    mobRender(); return;
  }
  if(!GRID||!WINS.has(GRID.win.id))openRegister();
  Object.assign(GRID,{q:'',fd:'',fs:'',fx:'',fh:'',fage:null,fageL:'',...f});
  renderGrid(); focusWin(GRID.win.id);
  toast('Showing '+([f.fh,f.fd,f.fs,f.fageL].filter(Boolean).join(' · ')||'everything'));
}

const creditOf=r=>(CREDIT[r.status]!=null?CREDIT[r.status]:0);
/* Days in the current court, counted live from the date that party received it.
   Falls back to the imported figure only where no start date is known. */
function heldDays(r){
  if(isHold(r))return null;          /* held: the clock is not running on anyone */
  if(r.holder==='Closed')return null;
  if(r.heldSince)return days(r.heldSince,today);
  return (r.daysHeld==null||r.daysHeld==='')?null:+r.daysHeld;
}
const inBase=r=>r.inProgressBase!==false;
function hasCycle(r,leg){
  const h=HIST[r.id]||[];          /* HIST is the live history; REVS is legacy */
  return h.some(x=>x.leg===leg && (x.submitted||'').trim()!=='');
}
function stats(){
  const SET=DOCS();
  const base=SET.filter(inBase);
  const avg=list=>list.length?list.reduce((t,r)=>t+creditOf(r),0)/list.length:0;
  const byH=h=>SET.filter(r=>r.holder===h).length;
  return {
    t:SET.length, scored:base.length,
    pct:Math.round(avg(base)*10)/10,
    basePct:Math.round(avg(base.filter(r=>r.scope==='Base'))*10)/10,
    optPct:Math.round(avg(base.filter(r=>r.scope==='Optional'))*10)/10,
    baseN:base.filter(r=>r.scope==='Base').length,
    optN:base.filter(r=>r.scope==='Optional').length,
    /* issued from HESCO to AWPT = it has left HESCO at least once */
    issuedBase:base.filter(r=>r.scope==='Base'&&r.status!=='Not issued').length,
    issuedOpt:base.filter(r=>r.scope==='Optional'&&r.status!=='Not issued').length,
    issuedAll:base.filter(r=>r.status!=='Not issued').length,
    hesco:byH('HESCO'), awpt:byH('AWPT'), maaden:byH("Maaden"), closed:byH('Closed'),
    open:SET.length-byH('Closed'),
    approved:SET.filter(r=>APPROVED.includes(r.status)).length,
    review:SET.filter(r=>r.status==='Under review').length,
    rejected:SET.filter(r=>r.status==='Rejected').length,
    notIssued:SET.filter(r=>r.status==='Not issued').length,
    /* The three gates a document passes through. Each is counted from the
       submission history, not from the current status, so a document that has
       moved on still counts as having passed the gate behind it. */
    subAwpt: SET.filter(r=>hasCycle(r,'HESCO')).length,
    okAwpt:  SET.filter(r=>hasCycle(r,'Maaden')).length,
    okMaaden:SET.filter(r=>((HIST[r.id]||[]).some(h=>h.leg==='Maaden'
                && (h.status==='Code A'||h.status==='Code B')))
                || r.status==='Deemed').length
  };
}
function kpiHTML(){
  const s=stats(), pc=n=>s.t?Math.round(n/s.t*100):0;
  const tile=(k,v,p,col,f)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>
    <div class="p">${p}</div><div class="bar"><i style="width:${f}%;background:${col}"></i></div></div>`;
  /* four by default — the scope and issued splits are detail, not headline */
  if(LEG==='hesco'){
    const n=s.t, sub=s.subAwpt, ans=DOCS().filter(r=>legReplied(r,'HESCO')).length;
    return tile('Submitted to AWPT',pc(sub)+'%',sub+' of '+n+' issued by HESCO','#2a78d6',pc(sub))+
      tile('AWPT has answered',pc(ans)+'%',ans+' of '+n+' reviewed','#6fc38a',pc(ans))+
      tile('Sitting with AWPT',s.awpt,'awaiting AWPT’s reply now','#f0b429',pc(s.awpt))+
      tile('Still with HESCO',s.hesco,'to produce or resubmit','#d64545',pc(s.hesco))+
      tile('Never submitted',s.notIssued,'no cycle at all','#8c9aa8',pc(s.notIssued));
  }
  if(LEG==='maaden'){
    const set=CLIENT(), n=set.length;
    const p=v=>n?Math.round(v/n*100):0;
    const sent=set.filter(r=>hasCycle(r,'Maaden')).length;
    const ok=set.filter(r=>((HIST[r.id]||[]).some(h=>h.leg==='Maaden'
             &&(h.status==='Code A'||h.status==='Code B')))||r.status==='Deemed').length;
    const wait=set.filter(r=>r.holder==='Maaden').length;
    return tile('Sent to Maaden',p(sent)+'%',sent+' of '+n+' in Client scope','#2a78d6',p(sent))+
      tile('Approved by Maaden',p(ok)+'%',ok+' Code A, Code B or deemed','#0f9d58',p(ok))+
      tile('Sitting with Maaden',wait,'awaiting the Client’s reply now','#f0b429',p(wait))+
      tile('Never sent to Maaden',n-sent,'of the '+n+' the Client must see','#d64545',p(n-sent))+
      tile('AWPT-only',AB.filter(r=>!isClientScope(r)).length,
        'never issued to the Client','#8c9aa8',0);
  }
  const core =
    tile('Overall progress',s.pct+'%',
      /* a fixed colour, not the theme accent: as var(--accent) this bar was
         violet on the desktop and mint on the phone, and an accent on a figure
         is the thing we agreed it must never be */
      s.scored+' of '+s.t+' scored · '+(s.t-s.scored)+' have no planned date',
      '#4a90d9',s.pct)+
    tile('Submitted to AWPT', pc(s.subAwpt)+'%',
      s.subAwpt+' of '+s.t+' issued by HESCO','#2a78d6', pc(s.subAwpt))+
    tile('Approved by AWPT',
      (CLIENT().length?Math.round(s.okAwpt/CLIENT().length*100):0)+'%',
      /* was #7c5cd6 — the last violet on the phone, and it broke the tiles' own
         logic besides: every other bar is blue for in-transit, green for
         approved, red with HESCO, amber with AWPT. This one IS an approval. */
      s.okAwpt+' of '+CLIENT().length+' cleared onward to Maaden','#6fc38a',
      CLIENT().length?s.okAwpt/CLIENT().length*100:0)+
    tile("Approved by Maaden",
      (CLIENT().length?Math.round(s.okMaaden/CLIENT().length*100):0)+'%',
      s.okMaaden+' of '+CLIENT().length+' in Client scope','#0f9d58',
      CLIENT().length?s.okMaaden/CLIENT().length*100:0)+
    tile('With HESCO',s.hesco,'to produce or resubmit','#d64545',pc(s.hesco))+
    tile('With AWPT',s.awpt,'to review and issue','#f0b429',pc(s.awpt))+
    tile("With Maaden",s.maaden,'awaiting the Client','#2a78d6',pc(s.maaden))+
    tile('Closed',s.closed,'approved, no action','#0f9d58',pc(s.closed));
  return core;
  /* the scope and issued splits live in the register's own filters now */
  return core+
    tile('Base scope',s.basePct+'%',s.baseN+' documents','#0f9d58',s.basePct)+
    tile('Optional scope',s.optPct+'%',s.optN+' documents','#f0b429',s.optPct)+
    tile('Issued to AWPT · base',
      s.baseN?Math.round(s.issuedBase/s.baseN*100)+'%':'—',
      s.issuedBase+' of '+s.baseN+' issued','#2a78d6',
      s.baseN?s.issuedBase/s.baseN*100:0)+
    tile('Issued to AWPT · optional',
      s.optN?Math.round(s.issuedOpt/s.optN*100)+'%':'—',
      s.issuedOpt+' of '+s.optN+' issued','#7c5cd6',
      s.optN?s.issuedOpt/s.optN*100:0);
}

/* ---------- ball in court ---------- */
function issuedChart(){
  const s=stats();
  const row=(label,done,total,col)=>{
    const pct=total?Math.round(done/total*1000)/10:0;
    return `<div class="drow"><div class="dlab">${esc(label)}</div>
      <div class="dtrack"><div class="dbar" style="width:${pct}%;background:${col}"></div></div>
      <div class="dn">${pct}%</div><div class="dp">${done} of ${total}</div></div>`;};
  return `<div class="chart dbars" data-chart="issued">
    ${row('Base',s.issuedBase,s.baseN,'#2a78d6')}

    <div class="hint" style="margin-top:8px">Documents HESCO has issued to AWPT at least once —

/* issue throughput to Maaden, by month */
function curveChart(){
  const m={}; AB.forEach(r=>{ if(r.issuedDate)m[r.issuedDate.slice(0,7)]=(m[r.issuedDate.slice(0,7)]||0)+1; });
  const ms=Object.keys(m).sort();
  if(!ms.length)return '<div class="empty"><b>No issue dates recorded yet</b>Fill in the Issued column and the curve will build itself.</div>';
  let c=0; const D=ms.map(k=>{c+=m[k];return {m:k,n:m[k],cum:c};});
  const W=920,H=250,PL=42,PR=16,PT=16,PB=32;
  const max=Math.max(AB.length,...D.map(d=>d.cum))||1;
  const X=i=>PL+(W-PL-PR)*(D.length<2?.5:i/(D.length-1)), Y=v=>H-PB-(H-PT-PB)*(v/max);
  const line=D.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.cum).toFixed(1)).join(' ');
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;
    g+=`<line class="gl" x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}"/>
        <text class="ax" x="${PL-8}" y="${Y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`;}
  D.forEach((d,i)=>{g+=`<text class="ax" x="${X(i)}" y="${H-11}" text-anchor="middle">${d.m.slice(2).replace('-','/')}</text>`;});
  return `<div class="chart plot" data-chart="curve">
    <svg viewBox="0 0 ${W} ${H}" class="plotsvg">${g}
      <path class="ln act" d="${line}"/>
      <g class="pts">${D.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.cum)}" r="3"/>`).join('')}</g></svg>
    <div class="legend"><span><i class="sw act"></i>Cumulative issued</span>
      <span class="rt">${D[D.length-1].cum} of ${AB.length} issued</span></div></div>`;
}

/* ============================================================
   Recovery plan — committed dates against what has actually
   gone to AWPT. This is the dashboard now; everything else is
   behind "Show more detail".
   ============================================================ */
let RECOV={loaded:false,items:[],loading:false};
async function loadRecovery(){
  if(RECOV.loading)return;                 /* one read at a time */
  RECOV.loading=true;
  try{
    /* THE PHONE DRAWS BEFORE SIGN-IN FINISHES. The dashboard is rendered once
       on load, when PLANS is still empty, and this used to latch loaded:true
       with nothing in it — so the panel said "no recovery plan loaded" for the
       rest of the session even though the plan was there all along. Fetch the
       plan list if it has not arrived, and do not call it loaded until we have
       actually been able to look. */
    if((!PLANS||!PLANS.length)&&LIVE)await loadPlanning();
    const plans=(PLANS||[]).filter(p=>/^Recovery plan/i.test(p.name||''));
    if(!plans.length){ RECOV={loaded:!!LIVE,items:[],loading:false}; return; }
    let out=[];
    for(const p of plans){
      const its=await api('lod_plan_items?planId=eq.'+p.id+'&order=plannedDate.asc');
      (its||[]).forEach(i=>out.push({...i, week:p.weekStart}));
    }
    RECOV={loaded:true,items:out,loading:false};
  }catch(e){ RECOV={loaded:!!LIVE,items:[],loading:false}; }
  finally{ RECOV.loading=false; }
}
/* This panel answers the PLAIN question — has the document gone to AWPT — the
   same one the report's first donut asks, so the two read alike. The stricter
   "was the commitment kept" test still governs the Days late column, the curve
   and the plan window, where it is labelled as such.
   Known limit: a document submitted before the commitment was written scores as
   on time here, because its submission date precedes the committed date. Nine
   of them do. */
function recovState(it){
  const d=AB.find(x=>x.id===it.docId);
  /* A document moved to the bin is not an unmet commitment. Without this the
     lookup returned undefined, the item read as never submitted, and it stayed
     in the denominator — so binning one document turned a kept commitment into
     a nameless overdue row and moved the headline percentage. planUniverse
     drops them and reports the count; this now does the same. */
  if(!d) return {k:'gone', sent:'', doc:null};
  const sent=(d.awptSubmitted||'').trim();
  if(sent) return {k: sent<=it.plannedDate?'ontime':'late', sent, doc:d};
  return {k: it.plannedDate<today?'overdue':'due', sent:'', doc:d};
}
function recoveryHTML(){
  if(!RECOV.loaded){
    /* redraw whichever screen asked for it, not just the desktop one */
    if(!RECOV.loading)loadRecovery().then(()=>{ MOBILE?mobRender():renderDash(); });
    return '<div class="empty">Reading the plan…</div>'; }
  const all=RECOV.items;
  if(!all.length)
    return '<div class="empty">No recovery plan loaded. Create a submission plan named '+
           '"Recovery plan" to see the comparison here.</div>';
  /* commitments whose document has since been deleted leave the population
     entirely — counting them as unmet would punish HESCO for our own bin */
  const kept=all.map(it=>({it,s:recovState(it)})).filter(x=>x.s.k!=='gone');
  const gone=all.length-kept.length;
  const items=kept.map(x=>x.it), st=kept.map(x=>x.s);
  if(!items.length)
    return '<div class="empty">Every document on this plan has been deleted.</div>';
  const n=k=>st.filter(x=>x.k===k).length;
  const done=n('ontime')+n('late'), pct=Math.round(done/items.length*100);

  const bar=`<div class="rcbar">
      <i class="ontime" style="flex:${n('ontime')||0.001}"></i>
      <i class="late"   style="flex:${n('late')||0.001}"></i>
      <i class="overdue"style="flex:${n('overdue')||0.001}"></i>
      <i class="due"    style="flex:${n('due')||0.001}"></i></div>
    <div class="rclegend">
      <span><i class="ontime"></i>${n('ontime')} on time</span>
      <span><i class="late"></i>${n('late')} submitted late</span>
      <span><i class="overdue"></i>${n('overdue')} overdue, not submitted</span>
      <span><i class="due"></i>${n('due')} still to come</span>${gone
        ?`<span class="rcgone">${gone} deleted, left out</span>`:''}</div>`;

  /* by committed date */
  const byDate={};
  items.forEach((it,i)=>{ const d=it.plannedDate;
    (byDate[d]=byDate[d]||{d,total:0,done:0,overdue:0});
    byDate[d].total++;
    if(st[i].k==='ontime'||st[i].k==='late')byDate[d].done++;
    if(st[i].k==='overdue')byDate[d].overdue++; });
  const dates=Object.values(byDate).sort((a,b)=>a.d<b.d?-1:1);
  const table=`<table class="rctbl"><thead><tr>
      <th>Committed</th><th class="n">Docs</th><th class="n">Sent</th>
      <th class="n">Left</th><th class="n">%</th></tr></thead><tbody>
    ${dates.map(r=>`<tr${r.d<today&&r.done<r.total?' class="hot"':''}>
      <td><b>${niceDateWD(r.d)}</b></td>
      <td class="n">${r.total}</td>
      <td class="n good">${r.done||'—'}</td>
      <td class="n ${r.total-r.done?'bad':''}">${r.total-r.done||'—'}</td>
      <td class="n">${Math.round(r.done/r.total*100)}%</td></tr>`).join('')}
    <tr class="tot"><td><b>Total</b></td><td class="n"><b>${items.length}</b></td>
      <td class="n good"><b>${done}</b></td><td class="n bad"><b>${items.length-done}</b></td>
      <td class="n"><b>${pct}%</b></td></tr></tbody></table>`;

  /* what is late right now */
  const lateList=items.map((it,i)=>({it,s:st[i]}))
    .filter(x=>x.s.k==='overdue')
    .sort((a,b)=>a.it.plannedDate<b.it.plannedDate?-1:1);
  const late=lateList.length?`<h3 style="margin-top:16px">Committed but not submitted</h3>
    <table class="rctbl stack"><thead><tr><th>Document</th><th>Committed</th>
      <th class="n">Days late</th><th>Agreed action</th></tr></thead><tbody>
    ${lateList.map(x=>`<tr data-go="${x.it.docId}">
      <td>${esc((x.s.doc&&x.s.doc.title)||'—')}</td>
      <td>${niceDateWD(x.it.plannedDate)}</td>
      <td class="n bad">${days(x.it.plannedDate,today)}</td>
      <td class="${x.it.note?'act':''}">${esc(x.it.note||'')}</td></tr>`).join('')}</tbody></table>`:'';

  return `<div class="rchead"><div class="rcpct">${pct}%</div>
      <div class="rcsub"><b>${done} of ${items.length} submitted to AWPT</b>
        <span>against the dates HESCO committed in the recovery plan</span></div></div>
    ${bar}${table}${late}`;
}
function niceDate(d){
  if(!d)return '';
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
/* The weekday is what pushed "Wed 26 Aug" onto two lines on a phone and made
   every row double height. It is worth having on the desktop, so it is wrapped
   rather than dropped, and the phone hides it in CSS. */
function niceDateWD(d){
  if(!d)return '';
  const dt=new Date(d+'T00:00:00');
  const wd=dt.toLocaleDateString('en-GB',{weekday:'short'});
  const rest=dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return '<span class="wd">'+esc(wd)+' </span>'+esc(rest);
}

/* ============================================================
   A dashboard per phase. Each leg is a closed population: every
   document on it is in exactly one state, so the cards add up to
   the register's own total and the percentages close at 100.
   The recovery plan is a HESCO-to-AWPT commitment, so it appears
   on that leg only.
   ============================================================ */
/* "Reviewed" is not a stage of the work — it is the gap where a reply date was
   logged and the verdict never was. On AWPT-only documents the code is inferred
   from the resubmission pattern, so they cannot land here either, and in 566
   cycles nothing ever has. A permanent 0% card teaches people to read past it,
   so it is hidden until it actually has something in it — at which point it
   reappears, named for what it is, and the cards still close at 100%. */
const HESCO_STATES=
    [{k:'RNC',           t:'Cleared by AWPT',  s:'reviewed with no comments',        c:'#0f9d58'},
     {k:'RWC',           t:'Back with HESCO',  s:'returned with comments to resolve',c:'#d64545'},
     {k:'Replied',       t:'Reply logged',     s:'no code recorded — needs a verdict',c:'#6b7f92'},
     {k:'Awaiting reply',t:'With AWPT now',    s:'submitted, awaiting the review',   c:'#f0b429'},
     {k:'On hold',       t:'On hold',          s:'held pending prerequisites',       c:HOLDCOLOR},
     {k:'Not submitted', t:'Never submitted',  s:'no cycle to AWPT at all',          c:'#8c9aa8'}];
/* judged over every document, not the filtered view, so the card does not
   appear and vanish as somebody changes a filter */
const LEGSTATE=leg=>leg==='hesco'
  ? HESCO_STATES.filter(x=>x.k!=='Replied'
      ||(AB||[]).some(r=>legState(r,'HESCO')==='Replied'))
  : [{k:'Code A',   t:'A — Accepted',              s:'accepted',                          c:'#0f9d58'},
     {k:'Code B',   t:'C — Proceed with exceptions',s:'to the next submission and revision',c:'#6fc38a'},
     {k:'Rejected', t:'R — Do not proceed',         s:'revise as noted and resubmit',      c:'#d64545'},
     {k:'Replied',  t:'I — For information',        s:'issued for information',            c:'#6b7f92'},
     {k:'Under Client review',t:'With Maaden now',  s:'sent, awaiting the grade',          c:'#f0b429'},
     {k:'On hold',            t:'On hold',          s:'held pending prerequisites',        c:HOLDCOLOR},
     {k:'Not submitted',      t:'Not submitted',    s:'the Client has not seen it',        c:'#cbd2d8'}];
const legOf=(r,leg)=>legState(r,leg==='hesco'?'HESCO':'Maaden');
/* THE RULE, IN ONE PLACE: on a leg every figure, filter and label speaks that
   leg's own vocabulary; on "Everything" they speak the document's. Anything that
   counts or names a state must go through these. */
const legOpen=(r,leg)=>legCourt(r,leg)!=='Closed';
const legLate=(r,leg)=>!!(r.plannedDate&&r.plannedDate<today&&legOpen(r,leg));
const legCourts=leg=>leg==='hesco'?['HESCO','AWPT','Maaden','Closed','On hold']
                                  :['Maaden','HESCO','Closed','On hold'];
/* the quick presets, worded for the leg you are on */
const LEGFX={
  hesco:[['','Everything'],['open','Open on this leg'],['ur','Out for AWPT review'],
         ['late','Past planned, still open'],['ns','Never submitted to AWPT'],
         ['win','Past the review window']],
  maaden:[['','Everything'],['open','Open on this leg'],['ur','Out for Client review'],
          ['late','Past planned, still open'],['ns','Not submitted to Maaden'],
          ['win','Past the review window']],
  all:[['','Everything'],['open','Open only'],['ur','Under review'],
       ['late','Past target'],['ns','Not issued'],['win','Past the review window']]};
function legFx(r,leg,fx){
  if(fx==='open')return legOpen(r,leg);
  if(fx==='ur')  return legCourt(r,leg)===(leg==='hesco'?'AWPT':'Maaden');
  if(fx==='late')return legLate(r,leg);
  if(fx==='ns')  return legOf(r,leg)==='Not submitted';
  return true;
}
function legCourt(r,leg){
  if(isHold(r))return 'On hold';
  const L=leg==='hesco'?'HESCO':'Maaden', c=lastCycle(r,L);
  if(!c)return leg==='hesco'?'HESCO':(r.holder||'');   /* not yet on this leg */
  if(!(c.responded||''))return leg==='hesco'?'AWPT':'Maaden';   /* out for review */
  const st=c.status||'';
  if(leg==='hesco')
    return st==='RWC' ? 'HESCO'                    /* comments to resolve */
         : (r.holder||'');                          /* cleared — wherever it went next */
  if(APPROVED.includes(st))return 'Closed';
  if(st==='Rejected')return 'HESCO';
  return r.holder||'';
}
/* AWPT-only documents never reach the Client, so nothing evidences a clearance:
   their verdict is inferred from whether HESCO resubmitted (about 77% right on
   the cycles the Client's submissions do grade). Never show it as a plain fact. */
const INFERRED='inferred from resubmission';
const isInferred=c=>!!(c&&(c.source||'')===INFERRED);
/* A code somebody typed outranks the RNC/RWC rule and is left alone by it.
   Clearing the code hands the cycle back to the rule. */
const isHandSet=c=>!!(c&&c.statusLocked);
/* whole percentages that total exactly 100 — largest remainder, so a card row
   never reads 99% or 101% */
function pct100(ns){
  const tot=ns.reduce((a,b)=>a+b,0); if(!tot)return ns.map(()=>0);
  const raw=ns.map(n=>n/tot*100), fl=raw.map(x=>Math.floor(x));
  let rem=100-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rem>0){fl[i]++;rem--;} });
  return fl;
}
function legSplit(leg){
  const SET=DOCS(), states=LEGSTATE(leg);
  const rows=states.map(x=>({...x, n:SET.filter(r=>legOf(r,leg)===x.k).length}));
  const named=rows.reduce((t,x)=>t+x.n,0);
  if(SET.length-named>0)
    rows.push({k:'__other',t:'Other',s:'a state not listed above',c:'#a7b2bd',n:SET.length-named});
  const ps=pct100(rows.map(x=>x.n));
  rows.forEach((x,i)=>x.p=ps[i]);
  return {rows, total:SET.length};
}
function legCards(leg){
  const {rows,total}=legSplit(leg);
  const tiles=rows.map(x=>`<div class="kpi legkpi" data-lstate="${esc(x.k)}">
      <div class="k">${esc(x.t)}</div><div class="v">${x.n}<small>${x.p}%</small></div>
      <div class="p">${esc(x.s)}</div>
      <div class="bar"><i style="width:${x.p}%;background:${x.c}"></i></div></div>`).join('');
  const bar=`<div class="ballbar legbar100">${rows.filter(x=>x.n).map(x=>
      `<i data-lstate="${esc(x.k)}" style="width:${x.n/(total||1)*100}%;background:${x.c}"
          title="${esc(x.t)} — ${x.n}"><b>${x.n}</b></i>`).join('')}</div>`;
  const sum=rows.reduce((t,x)=>t+x.n,0), psum=rows.reduce((t,x)=>t+x.p,0);
  return `<div class="kpis">${tiles}</div>${bar}
    <div class="legtot"><b>${sum} of ${total}</b> documents · <b>${psum}%</b> —
      every document on this leg is in exactly one of these states${
        sum===total&&psum===100?'':' <span class="bad">(does not close — tell Claude)</span>'}</div>`;
}
function legDiscipline(leg){
  const SET=DOCS(), states=LEGSTATE(leg);
  const ds=[...new Set(SET.map(r=>r.discipline))].filter(Boolean)
    .map(d=>({d,n:SET.filter(r=>r.discipline===d).length})).sort((a,b)=>b.n-a.n);
  if(!ds.length)return '<div class="empty">No disciplines recorded.</div>';

  return `<div class="chart dbars" data-chart="legdisc">${ds.map(x=>{

      .filter(p=>p.v);

    return `<div class="drow"><div class="dlab" title="${esc(x.d)}">${esc(x.d)}</div>
      <div class="dtrack"><div class="dbar" style="width:${x.n/max*100}%">${parts.map(p=>
        `<i data-d="${esc(x.d)}" data-lstate="${esc(p.st.k)}"
            title="${esc(x.d)} — ${p.v} ${esc(p.st.t)}"

      <div class="dn">${x.n}</div><div class="dp">${x.n?Math.round(done/x.n*100):0}%</div></div>`;}).join('')}
    <div class="balllg" style="margin-top:10px">${states.map(st=>
      `<button class="blg" data-lstate="${esc(st.k)}"><i style="background:${st.c}"></i>
        <span>${esc(st.t)}</span><b>${SET.filter(r=>legOf(r,leg)===st.k).length}</b></button>`).join('')}</div>
    <div class="hint" style="margin-top:6px">Each discipline adds up to its own total;
      the right-hand figure is the share ${leg==='hesco'?'cleared by AWPT':'approved as Code A'}.</div>`;
}
function legTurnaround(leg){
  const L=leg==='hesco'?'HESCO':'Maaden', SET=DOCS(), cyc=[];
  SET.forEach(r=>(HIST[r.id]||[]).filter(h=>h.leg===L).forEach(h=>cyc.push(h)));
  if(!cyc.length)return '<div class="empty">No submissions recorded on this leg.</div>';
  /* A reply dated after today has not happened. Filtering only on days>=0 let
     two such cycles into the average and printed the future date as fact. */
  const impossible=h=>h.days!=null&&(h.days<0||(h.responded||'')>today);
  const closed=cyc.filter(h=>h.days!=null&&h.days>=0&&(h.responded||'')<=today)
    .map(h=>h.days).sort((a,b)=>a-b);
  const open=cyc.filter(h=>(h.submitted||'')&&!(h.responded||''));
  const bad=cyc.filter(impossible).length;
  const avg=closed.length?Math.round(closed.reduce((a,b)=>a+b,0)/closed.length*10)/10:null;
  const med=closed.length?closed[Math.floor(closed.length/2)]:null;
  const waiting=open.map(h=>days(h.submitted,today)).sort((a,b)=>b-a);
  const cell=(t,v,s)=>`<div class="tcell"><div class="tk">${t}</div><div class="tv">${v}</div>
      <div class="ts">${s||''}</div></div>`;
  return `<div class="tgrid">
      ${cell('Cycles',cyc.length,closed.length+' answered · '+open.length+' still out')}
      ${cell('Average',avg==null?'—':avg+' d','from sent to reply')}
      ${cell('Typical',med==null?'—':med+' d','the middle cycle')}
      ${cell('Longest',closed.length?closed[closed.length-1]+' d':'—','worst answered cycle')}
      ${cell('Waiting now',waiting.length?waiting[0]+' d':'—',
             waiting.length?'the oldest of '+waiting.length+' open':'nothing open')}
    </div>${bad?`<div class="hint bad" style="margin-top:8px">${bad} cycle(s) carry a reply
      dated before the submission, or after today — impossible either way, left out
      of these figures, and the dates need checking.</div>`:''}`;
}
function legDashHTML(leg){
  const plan=leg==='hesco'
    ? `<div class="panel"><h3>Recovery plan — committed against submitted to AWPT</h3>

function wireLegDash(w,leg){

/* ================= excel ================= */
function ensureXLSX(){return new Promise((res,rej)=>{
  if(window.XLSX)return res(window.XLSX);
  const s=document.createElement('script');s.src=XLSX_CDN;
  s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('no xlsx'));document.head.appendChild(s);});}
/* A spreadsheet leaves the building the same way the PDF does, so it has to
   speak the same language. This emitted the STORED value for every column,
   which put the internal vocabulary — 'Code B', 'Deemed', 'Replied' — into 70
   cells of the Status column, grades that do not exist in Maaden's system and
   that no other surface shows. Same treatment the printed report gives. */
function exportCell(r,c){
  let v=c.calc?c.calc(r):(r[c.k]??'');
  if(c.k==='status')v=statusText(v)||v;
  if(c.k==='discipline')v=PRINT_DISC[v]||v;
  if(c.k==='mOut')v=maadenLabel(v);
  if(c.k==='hOut'&&isInferred(lastCycle(r,'HESCO')))v=v+' ~';
  return v;
}
function tableAOA(){
  const cs=visCols(), rows=GRID?GRID.rows:AB;
  return [cs.map(c=>c.t)].concat(rows.map(r=>cs.map(c=>exportCell(r,c))));
}
async function exportXLSX(){
  try{
    const X=await ensureXLSX();
    const ws=X.utils.aoa_to_sheet(tableAOA());
    ws['!cols']=visCols().map(c=>({wpx:colW(c)}));
    const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'As-Builts');
    X.writeFile(wb,'ARJUM_LOD_'+today+'.xlsx');
    toast('Excel file downloaded');
  }catch(e){ toast('Could not load the Excel library — CSV works offline'); exportCSV(); }
}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=tableAOA().map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='ARJUM_LOD_'+today+'.csv';a.click();
  toast('CSV downloaded');
}
function importExcel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const X=await ensureXLSX();
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      if(aoa.length<2)return toast('That sheet looks empty');
      const head=aoa[0].map(h=>String(h).trim().toLowerCase());
      const map=head.map(h=>{const c=COLS.find(c=>c.t.toLowerCase()===h||c.k.toLowerCase()===h);
        return c&&!c.ro?c.k:null;});
      if(!map.some(Boolean))return msgBox('Import from Excel','',
        'None of the headings matched. Use the same headings as the register — '+
        'export it first if you want a template.',[['Close',null,'primary']]);
      /* The key column is 'docNumber'. Looking for 'ref' found nothing, ever —
         no column has that key — so dn was always -1, the "does this document
         already exist" lookup never ran, and re-importing the register's own
         export inserted all 149 rows a second time. */
      const dn=map.indexOf('docNumber');
      if(dn<0)return msgBox('Import from Excel','',
        'The sheet has no <b>Document number</b> column, so there is no way to tell '+
        'an update from a new document. Nothing has been imported. Add that column '+
        '— exporting the register first gives you the right headings — and try again.',
        [['Close',null,'primary']]);
      msgBox('Import '+(aoa.length-1)+' row(s)?','',
        `Matching on <b>Document number</b>: rows that already exist are updated, new numbers are added.
         Columns matched: ${map.filter(Boolean).map(k=>esc(COLBY[k].t)).join(', ')}.`,
        [['Cancel',null,''],['Import',async()=>{
          txBegin('import '+(aoa.length-1)+' row(s)');
          let upd=0,add=0;
          for(let i=1;i<aoa.length;i++){
            const line=aoa[i]; if(!line.join('').trim())continue;
            const no=String(line[dn]||'').trim();
            if(!no)continue;                    /* no key, no safe way to match */
            let row=AB.find(r=>(r.docNumber||'').trim()===no);
            if(!row){
              /* 'Not Submitted' is not one of STATUSES — it would have been an
                 unrecognised value on every imported row */
              const base={sn:String(AB.length+1),docNumber:no,title:'',
                discipline:'',reviewClass:'',status:'Not issued'};
              row=await apiInsert(base); AB.push(row); txPush({t:'add',id:row.id,row:base}); add++;
            } else upd++;
            for(let j=0;j<map.length;j++){
              if(!map[j])continue;
              const v=String(line[j]??'').trim(); if(v==='')continue;
              await setCell(row,map[j],v,true);
            }
          }
          txEnd(); refresh(); toast(add+' added, '+upd+' updated');
        },'primary']]);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  inp.click();
}

function whenSeen(ts){
  if(!ts)return {t:'Never used it',cls:'never'};
  const d=new Date(ts), mins=Math.round((Date.now()-d)/60000);
  if(mins<2)return {t:'Just now',cls:'now'};
  if(mins<60)return {t:mins+' min ago',cls:'now'};
  if(mins<24*60)return {t:Math.round(mins/60)+'h ago',cls:'now'};
  const days=Math.round(mins/1440);
  if(days<8)return {t:days+'d ago',cls:''};
  return {t:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}),cls:''};
}

function newPersonBox(after){

       <option value="admin">Admin — can also manage people</option>
     </select>

     <input class="f" id="nppw" value="${esc(pw)}" autocomplete="off">

       change it. At least 8 characters.</div>
     <div id="nperr" style="margin-top:8px"></div>`,
    [['Cancel',null,''],['Add',async()=>{},'primary']]);
  /* msgBox closes on any button, so the work is wired by hand to keep the box
     open while the server answers */
  const m=document.getElementById('msg');
  const btn=[...m.querySelectorAll('.acts .btn')].pop();
  const err=t=>{const e=m.querySelector('[id="nperr"]');
    if(e)e.innerHTML='<span style="color:var(--critical);font-size:12px">'+esc(t)+'</span>';};
  btn.onclick=async()=>{
    const name=(m.querySelector('[id="npname"]').value||'').trim();
    const email=(m.querySelector('[id="npmail"]').value||'').trim();
    const role=m.querySelector('[id="nprole"]').value;
    const pass=(m.querySelector('[id="nppw"]').value||'').trim();
    if(!name)return err('Enter their name.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err('That does not look like an email address.');
    if(pass.length<8)return err('The password needs at least 8 characters.');

                :(r&&r.action==='updated')?'was already here — details updated'
                :'added';
      toast(name+' '+what);
      if(after)await after();
    }catch(e){
      /* PostgREST wraps the message the function raised */
      let msg=String(e.message||'');
      const j=msg.match(/\{[\s\S]*\}$/);
      if(j){ try{ msg=JSON.parse(j[0]).message||msg; }catch(_){} }
      err(msg.replace(/^\d{3}\s*/,''));
      btn.disabled=false; btn.textContent=label;
    }
  };
  setTimeout(()=>{const i=m.querySelector('[id="npname"]');if(i)i.focus();},40);
}

    ['late','Overdue',()=>AB.filter(r=>r.holder!=='Closed'&&r.plannedDate&&r.plannedDate<today).length],
    ['ns','Not issued',()=>AB.filter(r=>r.status==='Not issued').length]];
  return `<div class="mfilt">${F.map(([v,l,n])=>
    `<button class="${MOB.f===v?'on':''}" data-mf="${v}">${l}<b>${n()}</b></button>`).join('')}</div>`;
}
function mobRows(){
  const q=MOB.q.toLowerCase();
  /* the phone was counting all 148 whatever leg was chosen, and filtering by
     holder rather than by the leg's own states */
  return legRows(AB).filter(r=>{
    if(q&&!((r.ref||'')+' '+(r.title||'')).toLowerCase().includes(q))return false;
    if(LEG==='all'){
      if(MOB.f==='open'&&!isOpen(r))return false;
      if(MOB.f==='hesco'&&r.holder!=='HESCO')return false;
      if(MOB.f==='awpt'&&r.holder!=='AWPT')return false;
      if(MOB.f==='maaden'&&r.holder!=="Maaden")return false;
      if(MOB.f==='ns'&&r.status!=='Not issued')return false;
    }
    if(MOB.fs){
      const st=(LEG==='hesco'||LEG==='maaden')?legState(r,LEG):(r.status||'Not issued');
      if(st!==MOB.fs)return false; }
    if(MOB.fd&&r.discipline!==MOB.fd)return false;
    if(MOB.fage){ const a=heldDays(r); if(a==null)return false;
      if(a<MOB.fage[0]||a>MOB.fage[1])return false; }
    if(MOB.f==='late'&&!(r.holder!=='Closed'&&r.plannedDate&&r.plannedDate<today))return false;
    return true;});
}
function card(r,i){
  if(MOB.pick){
    const k=r.status||'Not Submitted', cls=k==='Not Submitted'?'N':k;
    return `<article class="dcard k-${cls} ${PICKED.has(r.id)?'ticked':''}" data-tick="${r.id}"
        style="animation-delay:${Math.min(i||0,12)*26}ms">
      <div class="dc-h"><input type="checkbox" class="mchk"${PICKED.has(r.id)?' checked':''}>
        <span class="dc-no">${esc(r.ref)}</span>
        <span class="dc-code" title="${esc(cls==='N'?'':statusText(k))}">${
          esc(cls==='N'?'—':statusCode(k))}</span></div>
      <h3 class="dc-t">${esc(r.title)}</h3>
      <div class="dc-m">${esc(SHORT_DISC[r.discipline]||r.discipline||'—')}</div></article>`;
  }
  const onLeg=(LEG==='hesco'||LEG==='maaden');
  const k=onLeg?legState(r,LEG):(r.status||'Not issued');
  const late=(r.holder!=='Closed'&&r.plannedDate&&r.plannedDate<today)?days(r.plannedDate,today):0;
  const out=heldDays(r)||0;
  /* WHAT A CARD IS FOR: which document, what state, how bad — nothing else.
     The old line carried discipline, review class, scope, revision, the full
     sent date, the running day count AND a held badge, and the last two were
     usually the same number said twice ("2d* · 2D HELD"). The class, the scope
     and the sent date are all on the document itself, one tap away. */
  const meta=[];
  if(onLeg){
    const lg=LEG==='hesco'?'HESCO':'Maaden';
    const rev=legRev(r,lg), sent=legSent(r,lg), back=legReplied(r,lg);
    if(rev)meta.push('<span class="rev">'+esc(rev)+'</span>');
    meta.push(esc(SHORT_DISC[r.discipline]||r.discipline||'—'));
    /* one age, in words that say whose desk it is on */
    if(sent&&back)meta.push(days(sent,back)?days(sent,back)+'d turnaround':'same day');
    else if(out)meta.push(out+'d with '+esc(r.holder||(LEG==='hesco'?'AWPT':'Maaden')));
  }else{
    meta.push(esc(SHORT_DISC[r.discipline]||r.discipline||'—'));
    if(out)meta.push(out+'d with '+esc(r.holder||'—'));
  }
  return `<article class="dcard" data-mo="${r.id}"
      style="animation-delay:${Math.min(i||0,12)*26}ms;--edge:${
        onLeg?(COLOR[k]||LCOLOR[k]||'#b9bfc7'):(HCOLOR[r.holder]||'#b9bfc7')}">
    <div class="dc-h"><span class="dc-no">${esc(onLeg?(r.ref||''):(r.holder||''))}</span>
      ${(()=>{ /* the leg's own vocabulary and colours, with Maaden's grade letters */
        const col=COLOR[k]||LCOLOR[k]||'#8c9aa8';
        /* on the Maaden leg and on Everything alike, a Client verdict is
           shown as Maaden wrote it */
        const g=MAADEN_GRADE[k]?maadenLabel(k):k;
        const inf=onLeg&&LEG==='hesco'&&isInferred(lastCycle(r,'HESCO'))?' ~':'';
        return `<span class="dc-code" title="${esc(inf?'inferred from the resubmission':g)}"
          style="background:${col}22;color:${col};border-color:${col}55">${esc(g+inf)}</span>`;})()}</div>
    <h3 class="dc-t">${esc(r.title)}</h3>
    <div class="dc-m">${meta.join('<i class="sep"></i>')}
      ${late?`<span class="late">${late}d overdue</span>`:''}</div></article>`;
}

/* horizontal swipe on a card: left to remove, right to tick.
   Only engages once the movement is clearly sideways, so the list still scrolls. */
function attachSwipe(el,{onLeft,onRight,leftLabel,rightLabel}){
  let x0=0,y0=0,dx=0,live=false,decided=false;
  const TH=64;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    x0=e.clientX;y0=e.clientY;dx=0;live=true;decided=false;});
  el.addEventListener('pointermove',e=>{
    if(!live)return;
    const ax=e.clientX-x0, ay=e.clientY-y0;
    if(!decided){
      if(Math.abs(ay)>Math.abs(ax)){live=false;return;}
      if(Math.abs(ax)<10)return;
      decided=true; el.classList.add('swiping');
    }
    dx=ax;
    if((dx<0&&!onLeft)||(dx>0&&!onRight))dx=0;
    el.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)';
    el.dataset.swipe=dx<-TH?'left':dx>TH?'right':'';
  });
  const end=()=>{
    if(!live){el.style.transform='';el.classList.remove('swiping');return;}
    live=false; el.classList.remove('swiping'); el.style.transform='';
    const hit=el.dataset.swipe; el.dataset.swipe='';
    if(hit==='left'&&onLeft)onLeft();
    if(hit==='right'&&onRight)onRight();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}

/* ================= staying up to date =================
   Until now the register was fetched once at sign-in and never again, so
   somebody else's edit stayed invisible until you reloaded the page. The only
   timer polled the notification list and compared its LENGTH — but that query
   is capped at 100 rows and there are well over a hundred notifications, so the
   length was always exactly 100 and the bell could never fire at all.

   Two paths now, because a websocket is fast but not guaranteed:
     · realtime — a socket to Postgres' replication stream, changes arrive in
       about a second;
     · polling  — one row every 20 seconds asking "what is the newest
       notification id", which costs almost nothing and works even when the
       socket is blocked by a proxy.
   Both funnel into the same syncNow(), so the app behaves identically either
   way and the fast path is a bonus rather than a dependency. */
let NOTIF_MAX=0, LIVEWS=null, LIVE_OK=false, _syncT=null, _pollT=null,
    _wsTries=0, _syncing=false;

/* Reload the data other people can change, then redraw. Deliberately does not
   touch window positions, filters or the current selection. */
async function syncNow(opts){
  if(!LIVE||_syncing)return;
  /* NEVER redraw over an open cell editor. refresh() rebuilds the table, which
     removes the editor input from the DOM; a removed element fires no blur, so
     the commit never ran, the typed text was thrown away, and GRID.editing was
     left set for good — after which the grid took no more keyboard at all.
     Somebody else's edit arrives ~700ms after they make it, so this was a
     coin-toss on every cell typed while another person was working. */
  if(GRID&&GRID.editing){ setTimeout(syncSoon,1500); return; }
  _syncing=true;
  try{
    const before=NOTIF_MAX;
    const [docs,notifs]=await Promise.all([
      api('lod_docs?deletedAt=is.null&order=sn.asc&limit=2000'),
      api('lod_notifs?order=id.desc&limit=100').catch(()=>NOTIFS)]);
    if(Array.isArray(docs)&&docs.length)AB=docs;
    if(Array.isArray(notifs)){
      NOTIFS=notifs;
      NOTIF_MAX=notifs.length?Math.max(...notifs.map(n=>+n.id||0)):NOTIF_MAX;
    }
    await loadLegs();
    await loadRevs();
    /* a fresh notification that this person has not read is what earns a sound */
    const fresh=NOTIFS.filter(n=>+n.id>before&&n.read!=='Yes');
    refresh();
    if(fresh.length&&before)announce(fresh);
  }catch(e){ /* a failed sync is not worth interrupting anyone over */ }
  finally{ _syncing=false; }
}
/* Several rows usually change together, so a burst is collapsed into one sync.
   Note it does NOT restart an armed timer: a trigger that keeps firing — a fast
   poll, or a long edit by somebody else — would otherwise push the sync back
   every time and it would never actually run. */
function syncSoon(){
  if(_syncT)return;
  _syncT=setTimeout(()=>{ _syncT=null; syncNow(); },700);
}

/* ---- the bell ---------------------------------------------------------
   A soft, low two-tone chime built in the browser, so there is no audio file
   to host and nothing to load. Browsers refuse to make noise until the person
   has interacted with the page, so the context is created on the first click
   and simply stays silent before that. */
let AC=null;
function audioCtx(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
  try{ AC=new C(); }catch(e){ return null; }
  return AC;
}
document.addEventListener('pointerdown',()=>{
  const c=audioCtx(); if(c&&c.state==='suspended')c.resume().catch(()=>{});
},{once:false});

function chime(){
  if(!PREFS.sound)return;
  const c=audioCtx(); if(!c||c.state!=='running')return;
  const t=c.currentTime, vol=Math.max(0,Math.min(1,PREFS.vol==null?0.35:PREFS.vol));
  /* two low partials a fifth apart, struck softly and left to ring */
  [[392,0],[587.33,0.09]].forEach(([hz,at],i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=hz;
    const peak=vol*(i?0.5:0.8), s=t+at;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),s+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,s+1.15);
    o.connect(g); g.connect(c.destination);
    o.start(s); o.stop(s+1.2);

/* ---- realtime ---------------------------------------------------------
   The Supabase realtime endpoint speaks the Phoenix channel protocol, which is
   plain JSON over a websocket — no library needed. If anything about it fails
   the polling below carries on regardless. */
function startLive(){
  clearInterval(_pollT);
  /* the safety net runs always, slowly; it is cheap — one row */
  _pollT=setInterval(async()=>{
    if(document.hidden||!LIVE)return;
    try{
      const r=await api('lod_notifs?select=id&order=id.desc&limit=1');
      const top=(r&&r[0])?+r[0].id:0;
      if(top>NOTIF_MAX)syncSoon();
    }catch(e){}
  }, LIVE_OK?60*1000:20*1000);
  connectLive();
}
function connectLive(){
  if(!LIVE||!TOKEN||!window.WebSocket)return;
  try{ if(LIVEWS)LIVEWS.close(); }catch(e){}
  let ws;
  try{
    ws=new WebSocket(SB_URL.replace(/^http/,'ws')+
      '/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0');
  }catch(e){ return; }
  LIVEWS=ws;
  let ref=0, hb=null;
  const send=(topic,event,payload)=>{
    try{ ws.send(JSON.stringify({topic,event,payload:payload||{},ref:String(++ref)})); }catch(e){}
  };
  ws.onopen=()=>{
    send('realtime:lod','phx_join',{
      config:{broadcast:{self:false},presence:{key:''},
        postgres_changes:[
          {event:'*',schema:'public',table:'lod_docs'},
          {event:'*',schema:'public',table:'lod_history'},
          {event:'*',schema:'public',table:'lod_notifs'},
          {event:'*',schema:'public',table:'lod_plan_items'}]},
      access_token:TOKEN});
    hb=setInterval(()=>send('phoenix','heartbeat',{}),25000);
  };
  ws.onmessage=e=>{
    let m=null; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok'&&m.topic==='realtime:lod'){
      LIVE_OK=true; _wsTries=0; renderDock();
      /* the socket is trustworthy, so the poll can slow right down */
      startPollRate(60*1000);
    }
    if(m.event==='postgres_changes'||m.event==='INSERT'||m.event==='UPDATE'||m.event==='DELETE')
      syncSoon();
    if(m.event==='system'&&m.payload&&/error/i.test(m.payload.status||''))LIVE_OK=false;
  };
  const bail=()=>{
    clearInterval(hb); LIVE_OK=false; renderDock();
    startPollRate(20*1000);
    /* back off, but keep trying — a laptop lid or a dropped VPN should heal */
    if(LIVE){ const wait=Math.min(60000,2000*Math.pow(2,Math.min(_wsTries++,4)));
      setTimeout(()=>{ if(LIVE&&(!LIVEWS||LIVEWS.readyState>1))connectLive(); },wait); }
  };
  ws.onclose=bail; ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
function startPollRate(ms){
  clearInterval(_pollT);
  _pollT=setInterval(async()=>{
    if(document.hidden||!LIVE)return;
    try{
      const r=await api('lod_notifs?select=id&order=id.desc&limit=1');
      const top=(r&&r[0])?+r[0].id:0;
      if(top>NOTIF_MAX)syncSoon();
    }catch(e){}
  },ms);
}

/* ---------- log a new submission cycle ---------- */
function revBasis(docId,leg){
  const rows=(HIST[docId]||[]).filter(x=>x.leg===leg&&x.submitted)
    .sort((a,b)=>String(a.submitted).localeCompare(String(b.submitted)));
  const label=leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden';
  if(!rows.length)return 'First '+label+' cycle — starting at '+(leg==='HESCO'?'V0':'A01')+'.';
  const last=rows[rows.length-1];
  return 'Next after '+esc(last.rev)+' on this leg, sent '+esc(last.submitted)+'.';
}
function nextRev(docId,leg){
  const rows=(HIST[docId]||[]).filter(x=>x.leg===leg);
  const nums=rows.map(x=>{const m=/(\d+)/.exec(x.rev||'');return m?+m[1]:-1;});
  const top=nums.length?Math.max(...nums):-1;
  if(leg==='HESCO')return top<0?'V0':'V'+String(top+1).padStart(2,'0');
  return 'A'+String((top<0?0:top)+1).padStart(2,'0');
}

function removeHistRow(r,id){
  const c=(HIST[r.id]||[]).find(x=>x.id===id); if(!c)return;
  const others=(HIST[r.id]||[]).filter(x=>x.id!==id&&x.submitted)
    .sort((a,b)=>String(a.submitted).localeCompare(String(b.submitted)));
  const next=others[others.length-1];
  const after=!next
    ? 'Nothing else has been recorded, so the document goes back to <b>Not issued</b> with no dates.'
    : `The document will follow <b>${esc(next.rev)}</b>
       (${next.leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden'}, sent ${esc(next.submitted)}${
        next.responded?', replied '+esc(next.responded):', no reply yet'}).`;
  msgBox('Remove '+(c.rev||'this cycle')+'?','',
    `<b>${esc(r.title||'')}</b><br><br>
     ${c.leg==='HESCO'?'HESCO → AWPT':'AWPT → Maaden'} · sent ${esc(c.submitted||'—')}${
       c.responded?', replied '+esc(c.responded):''}.<br><br>

function historyHTML(r){
  const all=(HIST[r.id]||[]);
  if(!all.length)return '<div class="empty">No submission history recorded.</div>';
  const block=(rows,label,who)=>{
    if(!rows.length)return '';
    /* Only cycles that could have happened. Without the >=0 and <=today guards
       — which legTurnaround and planAwptReview both have and this did not — a
       reply dated before its own submission dragged the average down, and one
       document printed "5 submissions · -3 days average". The quieter damage was
       worse: a real case averaged 7 days where the honest figure was 14. */
    const bad=rows.filter(x=>x.days!=null&&(x.days<0||(x.responded||'')>today));
    const closed=rows.filter(x=>x.days!=null&&x.days>=0&&(x.responded||'')<=today);
    const avg=closed.length?Math.round(closed.reduce((t,x)=>t+x.days,0)/closed.length):null;
    const head=`<h5>${label}<span>${rows.length} submission${rows.length===1?'':'s'}${
      avg!=null?' · '+avg+' days average':''}${
      bad.length?' · '+bad.length+' cycle'+(bad.length===1?'':'s')+' left out':''}</span></h5>`;
    if(MOBILE){
      // one block per cycle — five columns will not read on a phone
      return `<div class="legblock">${head}<div class="hlist">${rows.map(x=>{
        const out=x.days==null&&x.submitted&&!x.responded;
        return `<div class="hrow" data-hid="${x.id}">
          <div class="hrev">${esc(x.rev)}</div>
          <div class="hmid">
            <div class="hdates"><b>${esc(x.submitted)||'—'}</b><span>→</span>
              <b>${x.responded?esc(x.responded):'<span class="hint">awaiting</span>'}</b></div>
            ${x.status?`<span class="pstate st-due">${esc(x.status)}${
              isInferred(x)?' ~':''}${isHandSet(x)?' ✓':''}</span>`:''}
          </div>
          <div class="hdays ${out?'out':''}">${x.days!=null?x.days+'d'
            :(out?days(x.submitted,today)+'d':'—')}<i>${out?'so far':'days'}</i></div>
        </div>`;}).join('')}</div></div>`;
    }
    return `<div class="legblock">${head}
      <table class="histtbl"><thead><tr><th>Rev</th><th>Sent</th><th>${who}</th>
        <th>Outcome</th><th style="text-align:right">Days</th></tr></thead><tbody>
      ${rows.map(x=>`<tr data-hid="${x.id}" style="cursor:pointer">
        <td class="mono">${esc(x.rev)}</td>
        <td class="mono">${esc(x.submitted)||'—'}</td>
        <td class="mono">${esc(x.responded)||'<span class="hint">awaiting</span>'}</td>
        <td>${x.status?esc(x.status)+(isInferred(x)?
          ' <span class="hint" title="Worked out from the resubmission pattern, not recorded">~ inferred</span>':'')
          +(isHandSet(x)?
          ' <span class="lockmark" title="Set by hand — the RNC/RWC rule will not change it. Clear the code to hand it back to the rule.">✓ yours</span>':'')
          :'<span class="hint">—</span>'}</td>
        <td style="text-align:right" class="mono">${x.days!=null?x.days:
          (x.submitted&&!x.responded?days(x.submitted,today)+'<span class="hint">+</span>':'—')}</td>
      </tr>`).join('')}</tbody></table></div>`;};
  return block(all.filter(x=>x.leg==='HESCO'),'HESCO → AWPT','AWPT replied')+
         block(all.filter(x=>x.leg==='Maaden'),'AWPT → Maaden','Maaden replied')+
         `<div class="hint" style="margin-top:7px">HESCO cycles from the LOD · Maaden cycles from the submittal log</div>`;
}
function _oldHistoryHTML(r){
  const list=revsOf(r.id);
  if(!list.length)return '<div class="empty">Not submitted yet — no history.</div>';
  return `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr><th>Cycle</th><th>Rev</th><th>Submitted</th><th>Returned</th>
      <th>Code</th><th style="text-align:right">Days out</th></tr></thead><tbody>
    ${list.map((c,i)=>{
      const k=c.status||'W';
      return `<tr><td>${i+1}</td><td>${esc(c.rev)||'—'}</td><td>${esc(c.submitted)||'—'}</td>
        <td>${esc(c.received)||'<span class="hint">still out</span>'}</td>
        <td>${statusPill(k,MAADEN_GRADE[k]?maadenLabel(k):k)}</td>
        <td style="text-align:right">${c.turnaround==null?
          (c.submitted?days(c.submitted,today)+' so far':'—'):c.turnaround}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="hint" style="margin-top:7px">${list.length} submission${list.length===1?'':'s'} recorded${
      list.filter(c=>c.turnaround!=null).length?' · average turnaround '+
      Math.round(list.filter(c=>c.turnaround!=null).reduce((a,c)=>a+c.turnaround,0)/
                 list.filter(c=>c.turnaround!=null).length)+' days':''}</div>`;
}
async function boot(){
  try{ const th=localStorage.getItem('ab-theme'); document.documentElement.dataset.theme=(th||'dark'); }catch(e){}
  loadPrefs();   /* whatever this browser last had, so there is no flash of the wrong theme */
  const ok=await resumeSession();
  if(ok){
    try{ await loadData(); startApp(); return; }
    catch(e){ console.warn('Could not load the register',e); }
  }
  document.getElementById('login').classList.add('on');
  loadDirectory();
}

/* topbar wiring */
document.getElementById('b-reg').onclick=()=>openRegister('all');
document.getElementById('b-dash').onclick=()=>openDashboard('all');
document.getElementById('b-hesco').onclick=()=>openLeg('hesco');
document.getElementById('b-maaden').onclick=()=>openLeg('maaden');
document.getElementById('b-plan').onclick=openPlans;
document.getElementById('b-undo').onclick=undo;
document.getElementById('b-redo').onclick=redo;
document.getElementById('b-bell').onclick=openNotifs;
document.getElementById('mbell').onclick=()=>{
  msgBox('Notifications','',NOTIFS.length?NOTIFS.map(n=>
    `<div class="nrow${n.read==='Yes'?'':' unread'}" ${n.docId?`data-mgo="${n.docId}"`:''}>
      <div style="flex:1;min-width:0">${notifTag(n.kind)}<b>${esc(n.title)}</b>
        <div class="hint">${esc(n.ref||'')}${n.ref?' · ':''}${esc(ago(n.ts))}</div>
        <div class="nb">${esc(n.body||'')}</div></div></div>`).join('')
    :'<div class="empty">Nothing needs your attention.</div>',[['Close',null,'primary']]);
  document.querySelectorAll('[data-mgo]').forEach(el=>el.onclick=()=>{
    closeMsg(); MOB.stack=[]; mobGo('one',+el.dataset.mgo);});
  if(LIVE&&USER&&NOTIFS.some(n=>n.read!=='Yes')){
    api('lod_notifs?toUser=eq.'+USER.id,{method:'PATCH',body:JSON.stringify({read:'Yes'})})
      .then(()=>{NOTIFS.forEach(n=>n.read='Yes');updateBell();}).catch(()=>{});
  }};
document.getElementById('mback').onclick=mobBack;
document.getElementById('lgo').onclick=doLogin;
document.getElementById('lreset').onclick=resetPassword;
document.getElementById('lname').onchange=onPickName;
document.getElementById('lother').onclick=function(){useEmailField(!this.dataset.on);};
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
const menu=document.getElementById('menu');
document.getElementById('b-menu').onclick=e=>{e.stopPropagation();menu.classList.toggle('open');};
document.addEventListener('click',()=>menu.classList.remove('open'));
menu.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  menu.classList.remove('open');
  const a=b.dataset.a;
  if(a==='cols')openCols(); else if(a==='pdf')exportPDF(); else if(a==='xlsx')exportXLSX(); else if(a==='csv')exportCSV();
  else if(a==='import')importExcel(); else if(a==='bin')openBin();
  else if(a==='lod_activity')openActivity();
  else if(a==='users')openUsers(); else if(a==='alerts')alertsBox();
  else if(a==='arrange')arrangeWins();
  else if(a==='theme')toggleTheme(); else if(a==='mobile')setMobile(true,true);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('msgwrap').classList.contains('on'))closeMsg();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!GRID?.editing&&e.target===document.body){e.preventDefault();undo();}
});
window.addEventListener('hashchange',()=>setMobile(isPhone(),false));
boot();

</script>
