    if(e.target.closest('[data-pick]'))box.querySelector('[data-file]').click();
  });
  box.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-pick]')){
      e.preventDefault();box.querySelector('[data-file]').click();}
  });
  box.addEventListener('change',e=>{if(e.target.matches('[data-file]')){take(e.target.files);e.target.value='';}});
  box.addEventListener('dragover',e=>{e.preventDefault();});
  box.addEventListener('drop',e=>{e.preventDefault();take(e.dataTransfer&&e.dataTransfer.files);});
  return setPaste(files=>take(files));
}

/* ---------- lightbox ---------- */
let LB=null;
function lbEl(){return $('lb');}
async function openLightbox(shots,i){
  if(!shots||!shots.length)return;
  LB={shots,i:Math.max(0,Math.min(shots.length-1,i||0)),z:0,prev:document.activeElement};
  lbEl().classList.add('on'); drawLightbox();
  $('lbclose').focus();
}
async function drawLightbox(){
  if(!LB)return;
  const s=LB.shots[LB.i];
  LB.tok=(LB.tok||0)+1; const token=LB.tok;
  $('lbcnt').textContent=(LB.i+1)+' / '+LB.shots.length;
  $('lbcap').value=s.caption||'';
  $('lbprev').disabled=LB.i===0; $('lbnext').disabled=LB.i===LB.shots.length-1;
  const img=$('lbimg'); img.alt=s.caption||'Email screenshot';
  img.src=s.thumb_b64||''; img.style.opacity='.6';
  try{
    const full=await fullImage(s);
    if(LB&&LB.tok===token&&full){img.src=full;img.style.opacity='1';}
  }catch(e){toast('Could not load the screenshot: '+e.message);}
  applyZoom();
}
function applyZoom(){
  const st=$('lbstage'), img=$('lbimg'), z=LB?LB.z:0;
  st.classList.toggle('zoom',z>0);
  img.style.width=z>0?Math.round(((LB.shots[LB.i].width)||1200)*z)+'px':'';
}
function lbStep(d){if(!LB)return;const n=LB.i+d;if(n<0||n>=LB.shots.length)return;LB.i=n;LB.z=0;drawLightbox();}
function lbZoom(d){
  if(!LB)return;
  const steps=[0,1,1.5,2,3]; let k=steps.indexOf(LB.z); if(k<0)k=0;
  LB.z=steps[Math.max(0,Math.min(steps.length-1,k+d))]; applyZoom();
}
function closeLightbox(){
  if(!LB)return; const p=LB.prev; LB=null; lbEl().classList.remove('on');
  $('lbimg').src='';
  if(p&&p.focus&&document.contains(p))p.focus();
}
function wireLightbox(){
  $('lbclose').onclick=closeLightbox; $('lbprev').onclick=()=>lbStep(-1); $('lbnext').onclick=()=>lbStep(1);
  $('lbzin').onclick=()=>lbZoom(1); $('lbzout').onclick=()=>lbZoom(-1);
  $('lbimg').onclick=()=>{if(LB){LB.z=LB.z?0:1;applyZoom();}};
  $('lbstage').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();lbZoom(e.deltaY<0?1:-1);}},{passive:false});
  $('lbcap').onchange=async()=>{
    if(!LB)return; const s=LB.shots[LB.i], v=$('lbcap').value.trim();
    if(v===(s.caption||''))return;
    try{await api('task_email_shots?id=eq.'+s.id,{method:'PATCH',body:JSON.stringify({caption:v})});
      s.caption=v; toast('Caption saved');}
    catch(e){toast('Could not save the caption: '+e.message);}
  };
  document.addEventListener('keydown',e=>{
    if(!LB)return;
    if(e.target&&e.target.id==='lbcap'&&e.key!=='Escape')return;
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeLightbox();}
    else if(e.key==='ArrowLeft'){e.preventDefault();lbStep(-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();lbStep(1);}
    else if(e.key==='+'||e.key==='='){lbZoom(1);}
    else if(e.key==='-'){lbZoom(-1);}
  },true);
}

  await loadThumbs([emailId]);

function qfTest(k,node){
  const r=node.rec, acts=node.acts||[], t=TODAY();
  if(k==='all')return true;
  if(k==='open')return r.status!=='Closed';
  if(k==='closed')return r.status==='Closed';
  if(k==='key')return acts.some(isKeyAct)||(!!r.key_origin&&r.status!=='Closed');
  const live=acts.filter(isOpenAct);
  if(k==='overdue')return live.length?live.some(a=>a.due&&a.due<t)
    :(r.status!=='Closed'&&!!r.due&&r.due<t);
  if(k==='week'){
    const e=weekRange(t).end;
    return live.length?live.some(a=>a.due&&a.due>=t&&a.due<=e)
      :(r.status!=='Closed'&&!!r.due&&r.due>=t&&r.due<=e);
  }
  return true;
}

    const b=e.target.closest('[data-ai]'); if(!b)return;
    const x=$('alerts')._l[+b.dataset.ai]; closeAlerts(); if(x)x.go();
  });
  $('alerts').addEventListener('keydown',e=>{if(e.key==='Escape'){closeAlerts();$('bell').focus();}});
  $('qchips').addEventListener('click',e=>{const b=e.target.closest('[data-qf]');if(b)setQF(b.dataset.qf);});
  $('q').oninput=e=>{clearTimeout(wireShell.t);wireShell.t=setTimeout(()=>onSearch(e.target.value),140);};
  $('qx').onclick=()=>{$('q').value='';onSearch('');$('q').focus();};
  document.addEventListener('click',e=>{
    if(!e.target.closest('#ctx'))closeCtx();
    if(!e.target.closest('#alerts')&&!e.target.closest('#bell'))closeAlerts();
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openPalette();}
    else if(e.key==='Escape'&&DR.on&&!LB&&!$('scrim').classList.contains('on')&&!$('pal').classList.contains('on')
      &&!(e.target.closest&&e.target.closest('#sheet'))){closeDrawer();}
  });
  /* the Emails column and the row number open the item */
  $('gbody').addEventListener('click',e=>{
    const m=e.target.closest('[data-mail]');
    if(m){e.stopPropagation();openDrawer('item',+m.dataset.mail,mailCount(+m.dataset.mail)?'emails':'actions');return;}
    const no=e.target.closest('td.rowno .nocell');
    if(no&&!e.target.closest('[data-dgi],[data-rgrip]')){
      const n=VIEW[+no.closest('td').dataset.r]; if(n)openDrawer('item',n.rec.id,'actions');
    }
  },true);
  window.addEventListener('resize',()=>{clearTimeout(wireShell.rt);
    wireShell.rt=setTimeout(()=>{if(VIEWNOW==='dash')renderDash();},200);});
}


/* ============================================================
   The detail drawer: an item (Actions, History, Emails, Points,
   Closures, Notes) or one email
   ============================================================ */
const DR={on:false,kind:'item',id:null,tab:'actions',stack:[],hist:null};
function openDrawer(kind,id,tab){
  if(DR.on&&(DR.kind!==kind||DR.id!==id))DR.stack.push({kind:DR.kind,id:DR.id,tab:DR.tab});
  if(!DR.on)DR.stack=[];
  DR.on=true; DR.kind=kind; DR.id=id; DR.hist=null;
  DR.tab=tab||(kind==='item'?'actions':'main');
  $('drawer').classList.add('on');
  drawDrawer();
  if(kind==='email')loadThumbs([id]);
  $('drawer').focus();
}
function closeDrawer(quiet){
  DR.on=false; DR.stack=[]; $('drawer').classList.remove('on');
  if(!quiet&&VIEWNOW==='register'&&!isMobile())$('gwrap').focus();
}
function drawerBack(){
  const p=DR.stack.pop(); if(!p)return closeDrawer();
  DR.kind=p.kind; DR.id=p.id; DR.tab=p.tab; drawDrawer();
}
function drTabsHTML(list){
  return '<div class="tabs" role="tablist">'+list.map(t=>'<button class="tab" role="tab" data-tab="'+t.k
    +'" aria-selected="'+(DR.tab===t.k)+'">'+esc(t.lb)+(t.n!=null?'<span class="n">'+t.n+'</span>':'')
    +'</button>').join('')+'</div>';
}
function drawDrawer(){
  const d=$('drawer');
  if(DR.kind==='email'){drawEmail(d);return;}
  const it=itemById(DR.id);
  if(!it){d.innerHTML='<div class="dh"><h2>That item is no longer on the register</h2>'
    +'<button class="iconbtn" id="drclose" data-dclose="1" aria-label="Close">'+icon('x')+'</button></div>';return;}
  const acts=kidsOf(it.id).slice().sort((a,b)=>(a.sort-b.sort)||(a.id-b.id));
  const ids=new Set(acts.map(a=>a.id));
  const nEm=mailCount(it.id);
  const pts=PTS.filter(p=>p.item_id===it.id||(p.action_id&&ids.has(p.action_id)));
  const cl=LEDGER.filter(c=>c.item_id===it.id||(c.action_id&&ids.has(c.action_id)));
  const tabs=[{k:'actions',lb:'Actions',n:acts.length},{k:'history',lb:'History'}];
  if(CAPS.emails)tabs.push({k:'emails',lb:'Emails',n:nEm});
  if(CAPS.points)tabs.push({k:'points',lb:'Points',n:pts.length});
  if(CAPS.closures)tabs.push({k:'closures',lb:'Closures',n:cl.length});
  tabs.push({k:'notes',lb:'Notes'});
  if(!tabs.some(t=>t.k===DR.tab))DR.tab='actions';
  let body='';
  if(DR.tab==='actions')body=drActions(it,acts);
  else if(DR.tab==='history')body='<div id="drhist"><p class="muted">Loading the history…</p></div>';
  else if(DR.tab==='emails')body=drEmails(it);
  else if(DR.tab==='points')body=drPoints(pts);
  else if(DR.tab==='closures')body=drClosures(cl);
  else body=drNotes(it);
  d.innerHTML='<div class="dh"><div style="flex:1;min-width:0"><small>Item '+itemNoOf(it.id)
    +(it.project?' · '+esc(it.project):'')+'</small><h2>'+(it.key_origin?'<span class="kstar" title="From a key person">'
    +icon('star',16)+'</span> ':'')+esc(it.description||'(no description yet)')+'</h2></div>'
    +'<button class="iconbtn" id="drclose" data-dclose="1" aria-label="Close details">'+icon('x')+'</button></div>'
    +drTabsHTML(tabs)+'<div class="db" role="tabpanel">'+body+'</div>';
  if(DR.tab==='history')drLoadHistory(it,acts);
  if(DR.tab==='emails')loadThumbs([...(EMBYITEM[it.id]||[])]);
}
function drActions(it,acts){
  if(!acts.length)return '<p class="muted">No actions yet.</p><button class="tbtn primary" data-newact="'+it.id+'">'
    +icon('plus',15)+' Log an action</button>';
  return acts.map((a,i)=>{
    const closed=a.status==='Closed', od=!closed&&a.due&&a.due<TODAY(), c=CLOSBYACT[a.id];
    return '<div class="arow'+(closed?' done':'')+'">'
      +'<span class="an2">'+itemNoOf(it.id)+'.'+(i+1)+'</span>'
      +'<div class="at2"><span class="t">'+(a.key_origin?'<span class="kstar" title="Key: from Charbel">'+icon('star',14)+'</span> ':'')
      +esc(a.text||'—')+'</span><div class="meta">'
      +nameList(a.responsible).map(n=>'<span class="chip">'+esc(n)+'</span>').join('')
      +(a.due?'<span class="chip'+(od?' hot':'')+'">'+(closed?'':'due ')+esc(dayShort(a.due))+'</span>':'')
      +'<select data-dstat="'+a.id+'" aria-label="Status of action '+(i+1)+'">'
      +STATUSES.map(o=>'<option'+(o===a.status?' selected':'')+'>'+o+'</option>').join('')+'</select>'
      +(c?'<span class="chip good" title="'+esc(c.note||'')+'">'+esc(c.reason)+'</span>':'')
      +(a.source&&a.source!=='manual'?'<span class="chip">'+esc(a.source)+'</span>':'')
      +(EMBYACT[a.id]?'<span class="chip acc">'+icon('clip',12)+' '+EMBYACT[a.id].size+'</span>':'')
      +'</div></div><div class="rb">'
      +'<button class="tbtn" data-aopen="'+a.id+'">Open</button>'
      +(closed?'':'<button class="tbtn" data-aclose="'+a.id+'">Close…</button>')
      +(CAPS.links?'<button class="tbtn" data-aattach="'+a.id+'">Attach…</button>':'')
      +(CAPS.closures&&acts.length+ACTS.length>1?'<button class="tbtn" data-amerge="'+a.id+'">Merge…</button>':'')
      +'<button class="tbtn" data-asplit="'+a.id+'">Split</button></div></div>';
  }).join('')+'<div style="margin-top:14px"><button class="tbtn primary" data-newact="'+it.id+'">'
    +icon('plus',15)+' Log an action</button></div>';
}
async function drLoadHistory(it,acts){
  const ids=acts.map(a=>a.id);
  let logs=[];
  if(ids.length){
    try{logs=(await api('task_action_log?select=id,action_id,at,kind,note&action_id=in.('+ids.join(',')
      +')&order=at.desc,id.desc'))||[];}
    catch(e){console.error(e);toast('Could not read the history: '+e.message);}
  }
  if(!DR.on||DR.kind!=='item'||DR.id!==it.id||DR.tab!=='history')return;
  const ev=[];
  logs.forEach(l=>ev.push({t:l.at,k:l.kind==='closed'?'good':l.kind==='reopened'?'warn':l.kind==='note'?'acc':'',
    txt:'<b>'+itemNoOf(it.id)+'.'+(ACTNO[l.action_id]||'?')+'</b> '+esc(l.note||l.kind)}));
  [...(EMBYITEM[it.id]||[])].forEach(id=>{const e=emailById(id);
    if(e)ev.push({t:e.sent_at,k:'mail',txt:'Email from '+esc(e.sender_name||'?')+': '+esc(e.subject||'')});});
  LEDGER.filter(c=>c.item_id===it.id||(c.action_id&&ids.includes(c.action_id))).forEach(c=>
    ev.push({t:c.closed_at,k:'good',txt:'Closure: '+esc(c.reason)+(c.note?' — '+esc(c.note):'')}));
  ev.sort((a,b)=>String(b.t||'').localeCompare(String(a.t||'')));
  $('drhist').innerHTML=(ids.length?'<div class="fld" style="display:flex;gap:8px"><select id="dhact" aria-label="Action for the note" style="width:auto">'
    +acts.map((a,i)=>'<option value="'+a.id+'">'+(i+1)+'</option>').join('')+'</select>'
    +'<input id="dhnote" placeholder="Add a note to the history…"><button class="tbtn primary" id="dhadd">Add</button></div>':'')
    +(ev.length?'<ul class="tl">'+ev.map(x=>'<li><i class="dot '+x.k+'"></i><div><div>'+x.txt+'</div><div class="when">'
      +esc(x.t?dmy(rDay(x.t))+'  '+rTime(x.t):'')+'</div></div></li>').join('')+'</ul>'
      :'<p class="muted">Nothing recorded yet.</p>');
}
function emailLine(e,rels){
  const sh=SHOTS[e.id]||[];
  return '<button class="erow" style="grid-template-columns:minmax(0,1fr) auto" data-email="'+e.id+'">'
    +'<span class="sj"><b>'+esc(e.subject||'(no subject)')+'</b><small>'+esc(e.sender_name||'')+' · '
    +esc(dayShort(rDay(e.sent_at)))+' '+esc(rTime(e.sent_at))+'</small></span><span class="bg">'
    +(rels||[]).map(r=>'<span class="chip">'+esc(r)+'</span>').join('')
    +(sh.length?'<span class="thumb" style="width:54px;height:38px"><img alt="" src="'+sh[0].thumb_b64+'"></span>':'')
    +'</span></button>';
}
function drEmails(it){
  const ids=[...(EMBYITEM[it.id]||[])];
  const acts=new Set(kidsOf(it.id).map(a=>a.id));
  const rows=ids.map(id=>emailById(id)).filter(Boolean)
    .sort((a,b)=>String(b.sent_at||'').localeCompare(String(a.sent_at||'')));
  return (rows.length?rows.map(e=>emailLine(e,LINKS.filter(l=>l.email_id===e.id&&(l.item_id===it.id||acts.has(l.action_id)))
      .map(l=>l.relation+(l.action_id?' '+actNoOf(actById(l.action_id)):'')))).join('')
    :'<p class="muted">No emails are linked to this item yet.</p>')
    +'<div style="margin-top:14px"><button class="tbtn primary" data-attach-item="'+it.id+'">'
    +icon('clip',15)+' Attach email…</button></div>';
}
function drPoints(pts){
  if(!pts.length)return '<p class="muted">No points from Charbel are mapped to this item.</p>';
  return pts.map(p=>{const m=MEET.find(x=>x.id===p.meeting_id);
    return '<div class="prow2" style="grid-template-columns:44px minmax(0,1fr)"><span class="ref">'+esc(p.ref||'')
      +'</span><div class="tx">'+esc(p.text||'')+'<div class="meta"><span class="chip '+pstatCls(p.status)+'">'
      +esc(p.status)+'</span>'+(m?'<span class="chip">'+esc(m.title)+'</span>':'')
      +(p.action_id?'<span class="chip acc">'+esc(actNoOf(actById(p.action_id)))+'</span>':'')+'</div></div></div>';}).join('');
}
function drClosures(cl){
  if(!cl.length)return '<p class="muted">Nothing has been closed on this item yet.</p>';
  return cl.map(c=>{
    return '<div class="arow" style="grid-template-columns:minmax(0,1fr) auto"><div class="at2"><span class="t">'
      +esc(cNum(c)+'  '+cText(c))+'</span><div class="meta"><span class="chip good">'+esc(c.reason)+'</span>'
      +'<span class="chip">'+esc(dmy(cDay(c)))+'</span>'+(c.reopened_at?'<span class="chip warn">reopened '
      +esc(dmy(rDay(c.reopened_at)))+'</span>':'')
      +(c.evidence_subject?'<span class="chip acc">'+icon('clip',12)+' '+esc(clip(c.evidence_subject,40))+'</span>':'')
      +'</div>'+(c.note?'<div class="muted" style="margin-top:6px;font-size:12.5px">'+esc(c.note)+'</div>':'')
      +'</div><div class="rb">'+(!c.reopened_at&&c.action_id&&actById(c.action_id)&&actById(c.action_id).status==='Closed'
        ?'<button class="tbtn" data-areopen="'+c.action_id+'">'+icon('reopen',14)+' Reopen</button>':'')+'</div></div>';
  }).join('');
}
function drNotes(it){
  return '<div class="fld"><label class="l" for="dnotes">Notes on this item</label>'
    +'<textarea id="dnotes" rows="8">'+esc(it.notes||'')+'</textarea></div>'
    +'<p class="muted" style="font-size:12.5px">Raised '+esc(it.raised?dmy(it.raised):'—')+'. '
    +(it.status==='Closed'&&it.done_at?'Closed '+esc(dmy(it.done_at))+'.':'Status '+esc(it.status||'Open')+'.')+'</p>';
}

/* ---------- one email ---------- */

      +esc(s.caption||'')+'</small></div>').join('')+'</div>'
      :(SHOTLOAD[e.id]?'<p class="muted">No screenshot yet.</p>':'<p class="muted">Loading…</p>'))
    +(CAPS.shots?'<div class="dropz" id="edrop" tabindex="0" role="button">Paste a screenshot (Ctrl+V), drop one here, or click to choose</div>'
      +'<input type="file" id="efile" accept="image/*" multiple hidden>':'')
    +'<div class="sub2">Links<span class="hgrow"></span>'
    +(CAPS.links?'<button class="tbtn" data-elink="'+e.id+'">Link to action…</button>'
      +'<button class="tbtn" data-ecreate="'+e.id+'">Create action</button>':'')+'</div>'
    +(links.length?links.map(l=>{
      const a=l.action_id?actById(l.action_id):null, it=itemById(l.item_id||(a&&a.item_id));
      return '<div class="lnk"><span class="chip">'+esc(l.relation)+'</span><span class="t">'
        +(a?'<a href="#" data-gotoitem="'+a.item_id+'">'+esc(actNoOf(a))+'</a> '+esc(clip(a.text,70))
          :(it?'<a href="#" data-gotoitem="'+it.id+'">Item '+itemNoOf(it.id)+'</a> '+esc(clip(it.description,70)):'removed'))
        +'</span><button class="x" data-unlink="'+l.id+'" aria-label="Remove this link">'+icon('x',14)+'</button></div>';}).join('')
      :'<p class="muted">Not linked to any item or action.</p>')
    +'<div class="sub2">Details</div>'
    +inp('subject','Subject')
    +'<div class="two2">'+inp('sender_name','From')+inp('sender_email','Sender address')+'</div>'
    +'<div class="two2">'+f('Sent (Riyadh time)','ef-sent_at','<input id="ef-sent_at" data-ef="sent_at" type="datetime-local" value="'
      +esc(sentLocal(e.sent_at))+'">')
    +f('Importance','ef-importance','<select id="ef-importance" data-ef="importance">'+IMPS.map(o=>'<option'
      +(o===(e.importance||'normal')?' selected':'')+'>'+o+'</option>').join('')+'</select>')+'</div>'
    +f('To','ef-recipients','<textarea id="ef-recipients" data-ef="recipients" rows="2">'+esc(e.recipients||'')+'</textarea>')
    +inp('cc','Cc')
    +f('Summary','ef-summary','<textarea id="ef-summary" data-ef="summary" rows="5">'+esc(e.summary||'')+'</textarea>')
    +inp('attachments','Attachments')

      +esc(e.outlook_url||'')+'">'+(e.outlook_url&&/^https?:\/\//.test(e.outlook_url)?'<a class="tbtn" href="'+esc(e.outlook_url)
      +'" target="_blank" rel="noopener">Open</a>':'')+'</div>')
    +'<div class="fld" style="display:flex;gap:16px;flex-wrap:wrap">'

        +(e[p[0]]?' checked':'')+'> '+p[1]+'</label>';}).join('')+'</div>'
    +'<div class="sub2">Handling</div>'
    +(e.handled?'<p style="font-size:13px">Handled '+esc(e.handled_at?dmy(rDay(e.handled_at)):'')+'.'
        +(e.handled_note?' '+esc(e.handled_note):'')+'</p><button class="tbtn" data-unhandle="'+e.id+'">Mark as not handled</button>'
      :'<div class="fld"><textarea id="hnote2" rows="2" placeholder="Note (what was done)"></textarea></div>'

    +'</div>';
  const dz=$('edrop');
  if(dz){

    dz.onclick=pick; dz.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick();}};
    $('efile').onchange=ev=>{addShotsToEmail(e.id,ev.target.files);ev.target.value='';};
    dz.ondragover=ev=>{ev.preventDefault();dz.classList.add('over');};
    dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=ev=>{ev.preventDefault();dz.classList.remove('over');addShotsToEmail(e.id,ev.dataTransfer&&ev.dataTransfer.files);};
  }
}
async function addShotsToEmail(emailId,files){
  const list=imageFiles(files); if(!list.length)return;
  let n=0;
  for(const f of list){
    try{const img=await compressShot(f);await addShot(emailId,img,'');n++;}
    catch(e){console.error(e);toast('Could not add that screenshot: '+e.message);}
  }
  if(n){toast(n+' screenshot'+(n>1?'s':'')+' added');
    if(DR.on&&DR.kind==='email'&&DR.id===emailId)drawDrawer();
    renderView(VIEWNOW);}
}
async function patchEmail(id,fields){
  const out=await api('task_emails?id=eq.'+id,{method:'PATCH',body:JSON.stringify(fields)});
  const e=emailById(id);
  if(e)Object.assign(e,fields,out&&out[0]?out[0]:{});
  return e;
}
async function markHandled(id,note,undo){
  await patchEmail(id,undo?{handled:false,handled_at:null,handled_note:''}
    :{handled:true,handled_at:nowIso(),handled_note:note||''});
  if(CAPS.vInbox)INBOXV=(await api('v_key_inbox?select=*&order=sent_at.desc.nullslast'))||[];
  buildNav(); renderView(VIEWNOW); if(DR.on)drawDrawer();
}

/* ---------- drawer events ---------- */
function wireDrawer(){
  const d=$('drawer');
  d.addEventListener('click',async e=>{
    const t=e.target.closest('button,a,[data-tab]'); if(!t)return;
    const ds=t.dataset;
    if(ds.dclose)return closeDrawer();
    if(ds.dback)return drawerBack();
    if(ds.tab){DR.tab=ds.tab;return drawDrawer();}
    if(ds.gotoitem!==undefined){e.preventDefault();return openDrawer('item',+ds.gotoitem,'actions');}
    if(ds.aopen)return openAction(+ds.aopen,actById(+ds.aopen).item_id);
    if(ds.aclose)return closeDialog(+ds.aclose);
    if(ds.aattach){const a=actById(+ds.aattach);return attachDialog({itemId:a.item_id,actionId:a.id});}
    if(ds.amerge)return mergeDialog(+ds.amerge);
    if(ds.asplit)return splitAction(+ds.asplit);
    if(ds.areopen)return reopenDialog(+ds.areopen);
    if(ds.newact)return openActions(+ds.newact,true);
    if(ds.attachItem)return attachDialog({itemId:+ds.attachItem});
    if(ds.email)return openDrawer('email',+ds.email);
    if(ds.lbshot!==undefined)return openLightbox(SHOTS[DR.id]||[],+ds.lbshot);
    if(ds.elink)return linkActionDialog(+ds.elink);
    if(ds.ecreate)return createActionDialog({email:emailById(+ds.ecreate)});
    if(ds.unlink){
      try{await api('task_email_links?id=eq.'+ds.unlink,{method:'DELETE'});
        LINKS=LINKS.filter(l=>l.id!==+ds.unlink);buildIdx();drawDrawer();paint();}
      catch(err){toast('Could not remove the link: '+err.message);}
      return;
    }
    if(ds.handle){
      const note=($('hnote2')&&$('hnote2').value.trim())||'';
      try{await markHandled(+ds.handle,note);toast('Marked handled');}
      catch(err){toast('Could not save: '+err.message);}
      return;
    }
    if(ds.unhandle){
      try{await markHandled(+ds.unhandle,'',true);toast('Marked as not handled');}
      catch(err){toast('Could not save: '+err.message);}
      return;
    }
    if(t.id==='dhadd')return addHistoryNote();
  });
  d.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.id==='dhnote'){e.preventDefault();addHistoryNote();}
    if(e.key==='Tab'&&DR.on){          /* keep keyboard focus inside the drawer */
      const f=[...d.querySelectorAll('button,a[href],input:not([type=hidden]),select,textarea')]
        .filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;
      if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
      else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}
    }
  });
  d.addEventListener('change',async e=>{
    const t=e.target;
    if(t.dataset.dstat){
      const id=+t.dataset.dstat, v=t.value, a=actById(id); if(!a||a.status===v)return;
      try{
        const out=await api('task_actions?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:v})});
        if(out&&out[0])Object.assign(a,out[0]);
        await refreshItems(); await loadExtra(); paint(); drawDrawer(); renderView(VIEWNOW);
        if(v==='Closed')offerClosure(id);
      }catch(err){toast('Could not save: '+err.message);}
      return;
    }
    if(t.dataset.ef&&DR.kind==='email'){
      const k=t.dataset.ef; let v=t.type==='checkbox'?t.checked:t.value;
      if(k==='sent_at'){v=fromLocal(v);if(!v)return;}
      try{await patchEmail(DR.id,{[k]:v});
        if(k==='subject'||k==='sent_at'){drawDrawer();renderView(VIEWNOW);}
        buildNav();}
      catch(err){toast('Could not save: '+err.message);}
      return;
    }
    if(t.id==='dnotes'){
      const it=itemById(DR.id), v=t.value.trim(); if(!it||v===(it.notes||''))return;
      try{const out=await api('task_items?id=eq.'+it.id,{method:'PATCH',body:JSON.stringify({notes:v})});
        if(out&&out[0])Object.assign(it,out[0],{description:out[0].description||it.description});
        paint();toast('Notes saved');}
      catch(err){toast('Could not save: '+err.message);}
    }
  });
}

async function closeDialog(actionId,opts){
  const it0=opts&&opts.item?itemById(opts.item):null;
  const a=actionId?actById(actionId):null;
  if(!a&&!it0)return toast('That action is no longer on the register');
  const st={img:null}, c=a?CLOSBYACT[actionId]:null, already=!!(opts&&opts.already)||(a?a.status==='Closed':true);
  const label=a?actNoOf(a):'item '+itemNoOf(it0.id), what=a?a.text:it0.description;
  let restore=null;
  const closedOn=a?a.closed_at:(it0&&it0.done_at);
  const ok=await dialog({
    title:'Close '+label,desc:clip(what,140),ok:already?'Save closure':'Close action',wide:true,
    body:'<div class="two2"><div class="fld"><label class="l" for="cr">Reason</label><select id="cr">'
      +REASONS.map(r=>'<option'+(c&&c.reason===r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'
      +'<div class="fld"><label class="l" for="cd">Closed on</label><input id="cd" type="date" value="'
      +esc(already&&closedOn?closedOn:TODAY())+'"></div></div>'
      +'<div class="fld"><label class="l" for="cn">Note</label><textarea id="cn" rows="3" '
      +'placeholder="What was done, and who confirmed it">'+esc(c?c.note||'':'')+'</textarea></div>'
      +(CAPS.emails?'<div class="fld"><label class="l" for="cevq">Evidence email</label>'
        +'<input id="cevq" type="search" placeholder="Search emails\u2026" style="margin-bottom:8px">'
        +'<select id="cev">'+emailOpts('',c?c.evidence_email_id:null)+'</select></div>'
        +(CAPS.shots?'<div class="fld"><label class="l">or a screenshot as evidence</label><div id="cshot"></div></div>':''):''),
    onOpen:()=>{
      const q=$('cevq'); if(q)q.oninput=()=>{const cur=+$('cev').value||null;$('cev').innerHTML=emailOpts(q.value,cur);};
      if(CAPS.emails&&CAPS.shots)restore=shotInput('cshot',st);
      return()=>{if(restore)restore();};
    },
    onOk:async()=>{
      const reason=$('cr').value, note=$('cn').value.trim(), day=$('cd').value||TODAY();
      if(!sensibleDate(day))throw new Error('Check the closing date');
      let em=$('cev')?(+$('cev').value||null):null;
      if(st.img&&CAPS.closures){
        if(!em){
          em=await rpc('task_ingest_email',{p:{subject:'Evidence: '+clip(what,70),sender_name:'',
            sent_at:nowIso(),folder:'Evidence',direction:'received',handled:true,
            summary:'Screenshot added as evidence when '+label+' was closed.'}});
          await loadExtra();
        }
        await addShot(em,st.img,'Closure evidence');
      }
      if(a&&CAPS.closures){
        await rpc('task_close_action',{p_action:actionId,p_reason:reason,p_note:note,p_email:em,p_closed_on:day});
      }else if(a){
        /* the closure functions are not there: close it the way the grid always has */
        await api('task_actions?id=eq.'+actionId,{method:'PATCH',body:JSON.stringify({status:'Closed',closed_at:day})});
        if(note)await api('task_action_log',{method:'POST',body:JSON.stringify([{action_id:actionId,kind:'note',note:reason+': '+note}])});
      }else{
        /* an item with no actions has nothing to call the function on: the closure row is written directly */
        if(it0.status!=='Closed')await api('task_items?id=eq.'+it0.id,{method:'PATCH',body:JSON.stringify({status:'Closed'})});
        if(CAPS.closures)await api('task_closures',{method:'POST',body:JSON.stringify([{item_id:it0.id,closed_on:day,
          reason,note,evidence_email_id:em}])});
      }

    }
  });

async function createActionFrom(o){
  let itemId=o.itemId;
  const key=!!(o.email||(o.point&&o.point.key));
  const source=o.email?'email':'meeting';
  if(!itemId){
    const base=ITEMS.length?Math.max(...ITEMS.map(r=>r.sort||0)):0;
    const body={description:o.itemDesc,title:o.itemDesc,project:'',status:'Open',priority:key?2:4,
      raised:TODAY(),sort:base+1};
    if(EXT_ON)body.key_origin=key;
    const r=await api('task_items',{method:'POST',body:JSON.stringify([body])});
    if(!r||!r[0])throw new Error('the item was not created');
    itemId=r[0].id;
  }
  const sibs=ACTS.filter(a=>a.item_id===itemId);
  const ab={item_id:itemId,text:o.text,responsible:o.responsible||'',due:o.due||'',status:'Open',
    sort:(sibs.length?Math.max(...sibs.map(a=>a.sort||0)):0)+1};
  if(EXT_ON){ab.source=source;ab.key_origin=key;}
  const out=await api('task_actions',{method:'POST',body:JSON.stringify([ab])});
  if(!out||!out[0])throw new Error('the action was not created');
  const act=out[0];
  if(o.email)await rpc('task_attach_email',{p_email:o.email.id,p_item:itemId,p_action:act.id,p_relation:'source',p_note:''});
  if(o.point)await api('task_points?id=eq.'+o.point.id,{method:'PATCH',
    body:JSON.stringify({action_id:act.id,item_id:itemId,status:'Mapped'})});
  if(o.email&&o.handle)await patchEmail(o.email.id,{handled:true,handled_at:nowIso(),handled_note:'Action created'});
  return {itemId,actionId:act.id};
}

/* ---------- import screenshots named 1.jpg, 2.jpg ... (the number is the email id) ---------- */
async function importShots(files){
  const list=[...(files||[])]; if(!list.length)return;
  await loadShotCounts();
  let done=0,skipped=0,missing=0,failed=0;
  for(const f of list.sort((a,b)=>(parseInt(a.name,10)||0)-(parseInt(b.name,10)||0))){
    const m=/^(\d+)\.[A-Za-z]+$/.exec(f.name||'');
    const id=m?+m[1]:0;
    const e=id?emailById(id):null;
    if(!e){missing++;continue;}
    if(shotCount(id)>0){skipped++;continue;}
    try{
      const img=await compressShot(f);
      await addShot(id,img,clip(e.subject,80));
      SHOTN[id]=1; done++;
    }catch(err){console.error(err);failed++;}
  }
  renderView(VIEWNOW);
  toast('Imported '+done+' screenshot'+(done===1?'':'s')+(skipped?', '+skipped+' already had one':'')
    +(missing?', '+missing+' not matched to an email':'')+(failed?', '+failed+' failed':''));
}

const NOPROJ='';
const NOPROJ_LB='No project';
const isCharbel=e=>!!(e&&(e.from_key||e.to_me||e.mentions_me||e.cc_me));
const isDirect=e=>!!(e&&(e.to_me||e.mentions_me||e.cc_me));
function charbelTag(e){return !e?'':e.mentions_me?'mentions you':e.to_me?'to you':e.cc_me?'cc you':'';}
const projOfItem=id=>{const it=itemById(id);return it?String(it.project||'').trim():NOPROJ;};
const projOfAct=a=>a?projOfItem(a.item_id):NOPROJ;
const projName=k=>k===NOPROJ?NOPROJ_LB:k;
const cmpS=(a,b)=>a<b?-1:a>b?1:0;

/* which projects and open actions an email touches, built once per draw from the links */
function linkIndex(){
  const proj={}, acts={};
  LINKS.forEach(l=>{
    const a=l.action_id?actById(l.action_id):null;
    const itId=l.item_id||(a?a.item_id:null);
    if(!itId||!itemById(itId))return;
    const k=projOfItem(itId);
    (proj[l.email_id]=proj[l.email_id]||new Set()).add(k);
    if(a&&isOpenAct(a))(acts[l.email_id]=acts[l.email_id]||new Set()).add(a.id);
  });
  return {proj,acts};
}
const projKeysOf=(ix,e)=>ix.proj[e.id]?[...ix.proj[e.id]]:[NOPROJ];
function emailRank(e){return isDirect(e)?0:e.from_key?1:2;}
function emailOrder(a,b){return emailRank(a)-emailRank(b)||cmpS(String(b.sent_at||''),String(a.sent_at||''));}

/* one group per project; an email linked to several projects sits in each, counted once per group */
function projectGroups(emails){
  const ix=linkIndex(), m=new Map();
  emails.forEach(e=>{
    projKeysOf(ix,e).forEach(k=>{
      let g=m.get(k); if(!g){g={key:k,name:projName(k),emails:[],actIds:new Set()};m.set(k,g);}
      if(!g.emails.includes(e))g.emails.push(e);
      (ix.acts[e.id]?[...ix.acts[e.id]]:[]).forEach(id=>{if(projOfAct(actById(id))===k)g.actIds.add(id);});
    });
  });
  return finishGroups([...m.values()]);
}
function senderGroups(emails){
  const m=new Map();
  emails.forEach(e=>{const k=e.sender_name||e.sender_email||'Unknown sender';
    let g=m.get(k); if(!g){g={key:k,name:k,emails:[],actIds:new Set()};m.set(k,g);} g.emails.push(e);});
  return finishGroups([...m.values()],true);
}
function finishGroups(gs,keepNone){
  gs.forEach(g=>{
    g.emails.sort(emailOrder);
    g.unhandled=g.emails.filter(e=>!e.handled).length;
    g.charbel=g.emails.filter(isCharbel).length;
    g.newest=g.emails.reduce((m,e)=>String(e.sent_at||'')>m?String(e.sent_at||''):m,'');
    g.cnewest=g.emails.filter(isCharbel).reduce((m,e)=>String(e.sent_at||'')>m?String(e.sent_at||''):m,'');
    g.acts=g.actIds.size;
  });
  gs.sort((a,b)=>(!keepNone&&a.key===NOPROJ?1:0)-(!keepNone&&b.key===NOPROJ?1:0)
    ||cmpS(b.cnewest,a.cnewest)||cmpS(b.newest,a.newest)||cmpS(a.name,b.name));
  return gs;
}

function rnd(s,n){
  let h=2166136261; s=s+':'+n;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return ((h>>>0)%10000)/10000;
}
const cardKey=c=>c.t+':'+c.id;
function cardRank(c){
  if(c.t==='e'){const e=c.e; return e.handled?5:isDirect(e)?0:e.from_key?1:3;}
  const a=c.a; if(a.status==='Closed')return 6;

}
function cardOrder(a,b){
  const ra=cardRank(a), rb=cardRank(b); if(ra!==rb)return ra-rb;
  if(a.t==='e'&&b.t==='e')return cmpS(String(b.e.sent_at||''),String(a.e.sent_at||''));
  if(a.t==='a'&&b.t==='a')return cmpS(a.a.due||'~',b.a.due||'~')||(a.a.id-b.a.id);
  return a.t==='e'?-1:1;
}

function roomAllPiles(){

  EM.forEach(e=>{

function roomMatch(c,q){

/* screen to floor: the four corner markers give the projection, so dragging is exact under perspective */
function roomMapper(){
  const ms=[...document.querySelectorAll('#rfloor .cm')]; if(ms.length<4)return null;
  const W=RM.W, H=RM.H;
  const dst=[[1,1],[W-1,1],[1,H-1],[W-1,H-1]];
  const src=ms.map(m=>{const r=m.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];});
  const A=[];
  for(let i=0;i<4;i++){
    const [x,y]=src[i], [u,v]=dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]); A.push([0,0,0,x,y,1,-v*x,-v*y,v]);
  }
  for(let c=0;c<8;c++){
    let m=c; for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;
    if(Math.abs(A[m][c])<1e-9)return null;
    [A[c],A[m]]=[A[m],A[c]];
    for(let r=0;r<8;r++){if(r===c)continue; const f=A[r][c]/A[c][c]; for(let k=c;k<9;k++)A[r][k]-=f*A[c][k];}
  }
  const h=A.map((r,i)=>r[8]/r[i]);
  return (x,y)=>{const d=h[6]*x+h[7]*y+1; return [(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d];};
}

  const d={mode,pile,card,map,sx:e.clientX,sy:e.clientY,s0:map(e.clientX,e.clientY),moved:false,
    px:+pile.dataset.x,py:+pile.dataset.y,pk:pile.dataset.pk,
    ox:card?parseFloat(card.style.getPropertyValue('--ox'))||0:0,oy:card?parseFloat(card.style.getPropertyValue('--oy'))||0:0};
  RM.drag=d;
  const mv=ev=>roomMove(ev), up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);roomUp(ev);};
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
function roomMove(e){
  const d=RM.drag; if(!d)return;
  if(!d.moved){if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6)return; d.moved=true;
    if(d.mode==='pile')d.pile.classList.add('moving');
    else{d.card.classList.add('drag');d.pile.classList.add('carding');}}
  const c=d.map(e.clientX,e.clientY), dx=c[0]-d.s0[0], dy=c[1]-d.s0[1];
  if(d.mode==='pile'){
    d.cx=Math.min(.97,Math.max(.03,d.px+dx/RM.W)); d.cy=Math.min(.97,Math.max(.08,d.py+dy/RM.H));
    d.pile.style.left=(d.cx*RM.W-CW/2)+'px'; d.pile.style.top=(d.cy*RM.H-CH/2)+'px';
  }else{
    d.card.style.setProperty('--ox',(d.ox+dx)+'px'); d.card.style.setProperty('--oy',(d.oy+dy)+'px');
    d.card.style.setProperty('--r','-3deg');
  }
}
function roomUp(e){
  const d=RM.drag; RM.drag=null; if(!d)return;
  if(!d.moved)return;
  RM.suppress=true; setTimeout(()=>{RM.suppress=false;},60);
  if(d.mode==='pile'){
    d.pile.classList.remove('moving');
    if(d.cx!==undefined){d.pile.dataset.x=d.cx;d.pile.dataset.y=d.cy;RM.pos[d.pk]={x:+d.cx.toFixed(4),y:+d.cy.toFixed(4)};roomSavePos();}
    if(RM.fan===d.pk)roomPose();
    return;
  }
  d.card.classList.remove('drag'); d.pile.classList.remove('carding');
  let target=null;
  try{
    const stack=document.elementsFromPoint(e.clientX,e.clientY)||[];
    for(const el of stack){const p=el.closest&&el.closest('.pile'); if(p&&p.dataset.pk!==d.pk){target=p;break;}}
  }catch(err){console.warn('hit test',err);}
  if(target)roomDrop(d.card.dataset.ck,unpkey(target.dataset.pk),e.clientX,e.clientY);
  else roomPose();
}

async function roomLinkEmail(id,target,x,y){
  const e=emailById(id); if(!e)return;
  if(target===NOPROJ){toast('Drop an email on a project to link it.');return;}
  const ix=linkIndex();
  if(ix.proj[id]&&ix.proj[id].has(target)){toast('Already linked to '+target+'.');return;}
  const its=ITEMS.filter(i=>String(i.project||'').trim()===target);
  const open=its.filter(i=>i.status!=='Closed'), list=open.length?open:its;
  if(!list.length){toast('No item in '+target+' to link to.');return;}
  const doLink=async(it)=>{
    const before=new Set(LINKS.map(l=>l.id));
    try{await rpc('task_attach_email',{p_email:id,p_item:it.id,p_action:null,p_relation:'reference',p_note:''});}
    catch(err){toast('Could not link: '+err.message);return;}

async function roomMoveAction(id,target){

function roomClick(e){
  const t=e.target; if(!t.closest)return;
  const rf=t.closest('[data-rf]');
  if(rf){RM.filter=rf.dataset.rf;renderRoom();const b=document.querySelector('#v-room [data-rf="'+RM.filter+'"]');if(b)b.focus();return;}
  if(t.closest('[data-rtidy]')){roomTidy();return;}
  if(RM.suppress){RM.suppress=false;return;}
  const card=t.closest('.rc'), pile=t.closest('.pile');
  if(card&&card.classList.contains('more')){RM.page++;roomPose();return;}
  if(pile&&pile.classList.contains('fan')){
    if(card&&!card.classList.contains('off'))roomOpenCard(card); else roomUnfan(true);
    return;
  }
  if(pile){roomFanTo(pile.dataset.pk);return;}
  if(RM.fan)roomUnfan(false);
}
function roomKey(e){
  const t=e.target; if(!t.closest||!t.closest('#v-room'))return;
  if(e.key==='Escape'){if(RM.fan){e.preventDefault();roomUnfan(true);}return;}
  const card=t.closest('.rc'), pile=t.closest('.pile');
  if(e.key==='Enter'||e.key===' '){
    if(card&&pile&&pile.classList.contains('fan')){e.preventDefault();
      if(card.classList.contains('more')){RM.page++;roomPose();} else roomOpenCard(card);return;}
    if(pile&&t===pile){e.preventDefault();if(pile.classList.contains('fan'))roomUnfan(true);else roomFanTo(pile.dataset.pk);}
    return;
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowUp')&&card&&pile&&pile.classList.contains('fan')){
    const cs=[...pile.querySelectorAll('.rc:not(.off)')], i=cs.indexOf(card);
    const step=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:-1, nx=cs[i+step];
    if(nx){e.preventDefault();nx.focus();}
    return;
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&pile&&t===pile){
    const ps=[...document.querySelectorAll('#rfloor .pile')], i=ps.indexOf(pile), nx=ps[i+(e.key==='ArrowRight'?1:-1)];
    if(nx){e.preventDefault();nx.focus();}
  }
}

function chartSVG(data,W){
  const labW=Math.max(96,Math.min(170,Math.round(W*.34))), padR=36, rowH=36, top=6;
  const max=Math.max(1,...data.map(d=>Math.max(d.open,d.closed))), bw=Math.max(40,W-labW-padR);
  const H=top+data.length*rowH+22, ticks=[0,Math.ceil(max/2),max].filter((v,i,a)=>a.indexOf(v)===i);
  let s='<svg class="chart" role="img" aria-label="Open and closed actions by project" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  ticks.forEach(v=>{const x=labW+Math.round(bw*v/max);
    s+='<line class="gl" x1="'+x+'" x2="'+x+'" y1="'+top+'" y2="'+(H-18)+'"/><text x="'+x+'" y="'+(H-4)+'" text-anchor="middle" class="val">'+v+'</text>';});
  data.forEach((d,i)=>{
    const y=top+i*rowH, wo=Math.round(bw*d.open/max), wc=Math.round(bw*d.closed/max);
    s+='<text x="'+(labW-10)+'" y="'+(y+21)+'" text-anchor="end"><title>'+esc(d.k)+'</title>'+esc(clip(d.k,Math.floor(labW/7)))+'</text>'

      +'<text class="val" x="'+(labW+wc+6)+'" y="'+(y+29)+'">'+d.closed+'</text>';

  return s+'</svg>';

function reportHTML(kind){
  const t=TODAY();
  const head=(title,sub)=>'<h1>'+esc(title)+'</h1><p class="ps">'+esc(sub)+' · printed '+esc(dmy(t))+' · '+esc(BUILD)+'</p>';
  if(kind==='inbox'){
    const rows=keyEmails();
    return head('Key inbox','Emails from key people or mentioning Karim, not yet handled: '+rows.length)
      +'<h2>1. Emails waiting</h2>'+(rows.length?'<table><thead><tr><th class="w1">No.</th><th>Received</th><th>From</th><th>Subject and summary</th><th>Linked to</th></tr></thead><tbody>'
      +rows.map((e,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(dmy(rDay(e.sent_at))+' '+rTime(e.sent_at))+'</td><td>'+esc(e.sender_name||'')
        +'</td><td><b>'+esc(e.subject||'')+'</b><br>'+esc(e.summary||'')+'</td><td>'+esc(emailLinkText(e.id))+'</td></tr>').join('')
      +'</tbody></table>':'<p>No emails are waiting.</p>');
  }
  if(kind==='points'){
    const rows=pointsFiltered(), groups=[];
    MEET.forEach(m=>{const r=rows.filter(p=>p.meeting_id===m.id);if(r.length)groups.push({m,r});});
    const loose=rows.filter(p=>!p.meeting_id||!MEET.some(m=>m.id===p.meeting_id));
    if(loose.length)groups.push({m:null,r:loose});
    return head('Points register','Points from Charbel'+(PF.newOnly?' (new only)':'')+': '+rows.length)
      +groups.map((g,i)=>'<h2>'+(i+1)+'. '+esc(g.m?g.m.title:'No meeting')+(g.m&&g.m.held_at?' ('+esc(dmy(rDay(g.m.held_at)))+')':'')+'</h2>'
        +'<table><thead><tr><th class="w1">Ref</th><th>Point</th><th>Status</th><th>Mapped to</th></tr></thead><tbody>'
        +g.r.map(p=>{const a=p.action_id?actById(p.action_id):null;
          return '<tr><td>'+esc(p.ref||'')+'</td><td>'+esc(p.text||'')+'</td><td>'+esc(p.status)+'</td><td>'+(a?esc(actNoOf(a)+'  '+clip(a.text,70)):'')+'</td></tr>';}).join('')
        +'</tbody></table>').join('')||'<p>No points.</p>';
  }
  const rows=closureRows();
  const per=CLF.period==='week'?'this week':CLF.period==='month'?'this month':'all dates';
  return head('Closures ledger','Actions closed, '+per+(CLF.reason?', reason '+CLF.reason:'')+': '+rows.length)
    +'<h2>1. Closures</h2>'+(rows.length?'<table><thead><tr><th>Closed</th><th>Action</th><th>Reason</th><th>Note</th><th>Evidence</th><th>Days</th></tr></thead><tbody>'
    +rows.map(c=>{const d=cDays(c);return '<tr><td>'+esc(dmy(cDay(c)))+'</td><td>'+esc(cNum(c)+'  '+cText(c))+'</td><td>'+esc(c.reason)
      +(c.reopened_at?' (reopened)':'')+'</td><td>'+esc(c.note||'')+'</td><td>'+esc(c.evidence_subject||'')+'</td><td>'+(d==null?'':d)+'</td></tr>';}).join('')
    +'</tbody></table>':'<p>Nothing was closed in this period.</p>');
}
function emailLinkText(id){
  const out=[];
  LINKS.filter(l=>l.email_id===id).forEach(l=>{
    const a=l.action_id?actById(l.action_id):null;
    const s=a?actNoOf(a):(l.item_id?String(itemNoOf(l.item_id)):''); if(s&&!out.includes(s))out.push(s);});
  return out.join(', ');
}
function printReport(kind){
  $('printarea').innerHTML=reportHTML(kind);
  if(typeof window.print==='function')window.print();
}

/* ============================================================
   Excel: three more sheets in the same plain style as the register
   ============================================================ */
function plainSheet(wb,name,heads,widths,rows,dateCols){
  const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:1}]});
  ws.columns=heads.map((h,i)=>({header:h,width:widths[i]}));
  const hr=ws.getRow(1); hr.height=22;
  hr.eachCell(c=>{c.fill=solid(XC.head);c.font={bold:true,size:10,color:{argb:XC.headInk},name:'Calibri'};
    c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=edge();});
  rows.forEach(r=>{
    const row=ws.addRow([]);
    r.forEach((v,i)=>{row.getCell(i+1).value=v;});
    row.eachCell({includeEmpty:true},(c,ci)=>{
      const isD=dateCols.indexOf(ci-1)>=0;
      c.fill=solid(XC.row); c.font={size:10,color:{argb:XC.ink},name:'Calibri'};
      c.alignment={wrapText:true,vertical:isD?'middle':'top',horizontal:isD?'center':'left'};
      c.border=edge(); if(isD&&typeof c.value==='number')c.numFmt=XDFMT;
    });
  });
  ws.autoFilter={from:{row:1,column:1},to:{row:Math.max(1,rows.length+1),column:heads.length}};
  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9,
    margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2},printTitlesRow:'1:1'};
  ws.headerFooter={oddFooter:'&L&"Calibri"'+name+'&C&"Calibri"&P of &N&R&"Calibri"&D'};
  return ws;
}
function addExtraSheets(wb){
  if(CAPS.emails&&EM.length){
    plainSheet(wb,'Emails',['Date','Time','From','Subject','Linked items','Screenshots','Handled'],[13,8,24,52,16,12,10],
      EM.slice().sort((a,b)=>String(b.sent_at||'').localeCompare(String(a.sent_at||''))).map(e=>[
        xdate(rDay(e.sent_at)),rTime(e.sent_at),e.sender_name||'',e.subject||'',emailLinkText(e.id),shotCount(e.id),e.handled?'Yes':'No']),[0]);
  }
  if(CAPS.points&&PTS.length){
    plainSheet(wb,'Points',['Meeting','Ref','Point','Topic','Status','Mapped to','Due'],[26,8,60,16,10,34,13],
      PTS.map(p=>{const m=MEET.find(x=>x.id===p.meeting_id),a=p.action_id?actById(p.action_id):null;
        return [m?m.title:'',p.ref||'',p.text||'',p.topic||'',p.status||'',a?actNoOf(a)+'  '+clip(a.text,60):'',xdate(p.due)];}),[6]);
  }
  if(CAPS.closures&&LEDGER.length){
    plainSheet(wb,'Closures',['Closed on','Item','Action','Reason','Note','Evidence','Days to close','Reopened'],[13,28,46,16,40,34,10,13],
      LEDGER.slice().sort((a,b)=>String(b.closed_at||'').localeCompare(String(a.closed_at||''))).map(c=>[
        xdate(cDay(c)),c.item_title||((itemById(c.item_id)||{}).description)||'',cNum(c)+'  '+cText(c),c.reason||'',c.note||'',
        c.evidence_subject||'',cDays(c)==null?'':cDays(c),c.reopened_at?xdate(rDay(c.reopened_at)):'']),[0,7]);
  }
}


/* ---------- small hooks the register calls ---------- */
function actTitle(a){
  const c=CLOSBYACT[a.id];
  if(a.status==='Closed'&&c)return 'Closed '+dmy(cDay(c))+' — '+c.reason+(c.note?': '+c.note:'');
  return 'Open this action';
}
/* an item with no actions closed straight from the grid: the edit has already gone through;
   this only offers the note and evidence afterwards */
function closedFromGrid(list){
  const st=UNDO[UNDO.length-1]; if(!st||st.t!=='cells')return;
  for(const e of list){
    const c=COLS[e.c]; if(c.k!=='status')continue;
    const r=e.node.rec;
    if(r.status==='Closed'&&!(e.node.acts||[]).length
       &&st.back.some(b=>b.kind==='item'&&b.id===r.id&&b.k==='status'&&b.v!=='Closed')){
      if(CAPS.closures)toast('Closed — add note and evidence','Add note',()=>closeDialog(null,{item:r.id}));
      return;
    }
  }
}

/* ============================================================
   Boot
   ============================================================ */
async function startApp(){
  loadPrefs(); readSide();
  await loadAll();
  await loadLogCounts();
  paint();
  wireGrid(); wireDrag(); wireTools(); wireResize(); wireRowResize(); wireMobile();
  wireShell(); wireCtx(); wireDrawer(); wireViews(); wireB30(); wireLightbox(); wirePalette(); wirePaste();
  buildNav();
  $('app').classList.add('ready');
  if(!isMobile())$('gwrap').focus();
  /* the new sections load after the grid is on screen; a missing table only hides its section */
  await loadExtra();
  paint(); buildNav(); renderView(VIEWNOW);
}
async function boot(){
  applyTheme(readTheme(),true);
  $('lgo').onclick=async()=>{
    $('lerr').textContent='';
    const em=$('lem').value.trim(), pw=$('lpw').value;
    if(!em||!pw){$('lerr').textContent='Both fields, please.';return;}
    $('lgo').disabled=true; $('lgo').textContent='Signing in…';
    try{
      await signIn(em,pw);
      $('login').classList.remove('on');
      await startApp();
    }catch(err){
      $('lerr').textContent=err.message;
      $('lgo').disabled=false; $('lgo').textContent='Sign in';
    }
  };
  $('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click();});
  let why='';
  try{
    if(await resume()){
      try{await startApp();return;}
      catch(e){console.error(e);why=offlineish(e)
        ?'Could not reach the server. Check the connection and sign in again.'
        :('Could not load your list: '+(e&&e.message||e));}
    }
  }catch(e){
    console.error(e);
    why='Could not reach the server. Check the connection, then sign in.';
  }
  $('login').classList.add('on');
  if(why)$('lerr').textContent=why;
  $('lem').focus();
}
const offlineish=e=>/offline|failed to fetch|networkerror|load failed/i.test(
  String(e&&e.message||e));
/* whatever happens, the person must end up looking at SOMETHING */
boot().catch(err=>{
  console.error(err);
  try{
    $('login').classList.add('on');
    $('lerr').textContent='Something went wrong starting up: '
      +(err&&err.message||err)+'. Reload to try again.';
  }catch(e){
    document.body.innerHTML='<p style="font:15px sans-serif;padding:28px">'
      +'The app could not start. Reload the page.</p>';
  }
});
