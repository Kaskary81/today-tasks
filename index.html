/* ---------------- api ---------------- */
async function api(path,opts){
  const o={...opts}; o.headers={...H(),...(o.headers||{})};
  const r=await fetch(SB_URL+'/rest/v1/'+path,o);
  if(r.status===401||r.status===403){ signOut('Your session expired — please sign in again'); throw new Error('auth'); }
  if(!r.ok)throw new Error(r.status+' '+await r.text());
  // 201 from an insert, and 204 from an update, both come back with no body —
  // calling .json() on those throws, which used to surface as "could not save"
  if(r.status===204||r.status===205)return null;
  const txt=await r.text();
  if(!txt)return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function auth(path,body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
  return j;
}
/* Writes carry the row version we loaded. If someone else has saved since,
   nothing matches, no rows come back, and we tell the user instead of
   silently overwriting their colleague's work. */
class StaleRow extends Error{ constructor(cur){ super('stale'); this.cur=cur; } }
async function apiUpdate(id,patch){
  if(!LIVE)return;
  const row=AB.find(x=>x.id===id);
  const guard=(row&&row.ver!=null)?'&ver=eq.'+row.ver:'';
  const res=await api('lod_docs?id=eq.'+id+guard,
    {method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)});
  if(Array.isArray(res)&&res.length===0&&guard){
    let cur=null; try{ cur=(await api('lod_docs?id=eq.'+id+'&limit=1'))[0]; }catch(e){}
    throw new StaleRow(cur);
  }
  if(Array.isArray(res)&&res[0]&&row)Object.assign(row,res[0]);
}
async function apiInsert(row){ const r=await api('lod_docs',{method:'POST',
  headers:{Prefer:'return=representation'},body:JSON.stringify(row)}); return r[0]; }
async function apiDelete(id){ if(LIVE) await api('lod_docs?id=eq.'+id,{method:'DELETE'}); }
async function apiBin(id){ if(LIVE) await api('lod_docs?id=eq.'+id,
  {method:'PATCH',body:JSON.stringify({deletedAt:nowTs(),deletedBy:(USER&&USER.email)||''})}); }
async function apiUnbin(id){ if(LIVE) await api('lod_docs?id=eq.'+id,
  {method:'PATCH',body:JSON.stringify({deletedAt:null,deletedBy:''})}); }
async function logAct(action,rec,field,oldV,newV){
  if(!LIVE)return;
  const a={ts:nowTs(),action,tbl:'lod_docs',recId:rec&&rec.id,
    recName:(rec&&rec.ref)||'',field:field||'',oldVal:String(oldV??''),newVal:String(newV??''),
    actor:(USER&&USER.name)||''};
  ACTS.unshift(a);
  try{await api('lod_activity',{method:'POST',body:JSON.stringify(a)});}catch(e){}
}

/* ---------------- undo / redo ---------------- */
let UNDO=[],REDO=[],_tx=null,_replaying=false;
function txBegin(label){if(_tx||_replaying)return false;_tx={label,ops:[]};return true;}
function txPush(op){ if(_replaying)return;
  if(_tx)_tx.ops.push(op); else {UNDO.push({label:'edit',ops:[op]});REDO.length=0;trimUndo();} }
function txEnd(){ if(_tx&&_tx.ops.length){UNDO.push(_tx);REDO.length=0;trimUndo();} _tx=null; updateUndoBtns(); }
function txAbort(){_tx=null;}
function trimUndo(){ while(UNDO.length>60)UNDO.shift(); updateUndoBtns(); }
async function applyOp(op,dir){
  const v=dir<0?op.from:op.to;
  if(op.t==='set'){
    const r=AB.find(x=>x.id===op.id); if(!r)return;
    r[op.k]=v; await apiUpdate(op.id,{[op.k]:v});
  }else if(op.t==='add'){
    if(dir<0){ AB=AB.filter(x=>x.id!==op.id); await apiDelete(op.id); }
    else { const row=await apiInsert(op.row); AB.push(row); op.id=row.id; }
  }else if(op.t==='del'){
    if(dir<0){ await apiUnbin(op.id); AB.push(op.row); }
    else { AB=AB.filter(x=>x.id!==op.id); await apiBin(op.id); }
  }
}
async function undo(){
  if(!UNDO.length)return toast('Nothing to undo');
  const t=UNDO.pop(); _replaying=true;
  for(let i=t.ops.length-1;i>=0;i--) await applyOp(t.ops[i],-1);
  _replaying=false; REDO.push(t); updateUndoBtns(); refresh(); toast('Undid '+t.label);
}
async function redo(){
  if(!REDO.length)return toast('Nothing to redo');
  const t=REDO.pop(); _replaying=true;
  for(const op of t.ops) await applyOp(op,1);
  _replaying=false; UNDO.push(t); updateUndoBtns(); refresh(); toast('Redid '+t.label);
}
function updateUndoBtns(){
  const u=document.getElementById('b-undo'),r=document.getElementById('b-redo');
  if(u)u.disabled=!UNDO.length||!canEdit(); if(r)r.disabled=!REDO.length||!canEdit();
}
async function setCell(row,k,val,silent){
  const before=row[k]??'';
  if(String(before)===String(val))return;
  row[k]=val;
  txPush({t:'set',id:row.id,k,from:before,to:val});
  try{ await apiUpdate(row.id,{[k]:val}); await logAct('edit',row,k,before,val); }
  catch(e){
    row[k]=before;
    if(e instanceof StaleRow){
      const col=COLBY[k], cur=e.cur;
      if(cur)Object.assign(row,cur);
      msgBox('Someone else changed this document','',
        `<b>${esc(row.title)}</b><br><br>
         ${esc((cur&&cur.updatedBy)||'Another user')} saved a change while you had this open,
         so yours was not written.<br><br>
         <b>${esc(col?col.t:k)}</b> now reads <b>${esc((cur?cur[k]:'')||'(blank)')}</b> —
         you typed <b>${esc(val||'(blank)')}</b>.<br><br>
         Their version is on screen now. Make your change again if it still applies.`,
        [['OK',null,'primary']]);
    } else toast('Not saved — check your connection');
    console.error(e); refresh(); return; }
  if(!silent){ await loadRevsFor(row.id); refresh(); }
}

/* ---------------- column prefs ---------------- */
function normOrder(){
  COLS.forEach(c=>{ if(!PREFS.order.includes(c.k))PREFS.order.push(c.k); });
}
function visCols(){
  normOrder();
  const base=PREFS.order.map(k=>COLBY[k]).filter(c=>c&&!PREFS.hidden.includes(c.k));
  /* a leg's own columns follow the same order and the same hiding as the rest */
  const legCols=COLS.filter(c=>c.leg===LEG&&!PREFS.hidden.includes(c.k))
    .sort((a,b)=>PREFS.order.indexOf(a.k)-PREFS.order.indexOf(b.k));
  if(LEG==='all')return base.filter(c=>!c.leg);
  /* on a leg, drop the columns that belong to the other one and the
     derived overall dates, then append this leg's own */
  const drop=['issuedDate','respondedDate','credit','reviewDays','rev'];
  const outK=LEG==='hesco'?'hOut':'mOut';
  const courtK=LEG==='hesco'?'hCourt':'mCourt';
  /* the overall status is the AWPT loop's verdict — on a leg it is replaced,
     in the same position, by that leg's own answer */
  const keep=base.filter(c=>!c.leg&&!drop.includes(c.k))
                 .map(c=>c.k==='status'?COLBY[outK]:(c.k==='holder'?COLBY[courtK]:c));
  return keep.concat(legCols.filter(c=>c.k!==outK&&c.k!==courtK));
}
function colW(c){ return PREFS.w[c.k]||c.w; }
/* Move a column one place left or right along the row you can actually see,
   then write that back into the stored order. */
function moveCol(k,dir){
  const cs=visCols().map(c=>c.k), i=cs.indexOf(k), j=i+dir;
  if(i<0||j<0||j>=cs.length)return;
  const other=cs[j], o=PREFS.order.filter(x=>x!==k), at=o.indexOf(other);
  o.splice(dir<0?at:at+1,0,k);
  PREFS.order=o; savePrefs(); renderAllGrids();
}
function freezeTo(n){ PREFS.freeze=Math.max(0,n); savePrefs(); renderAllGrids(); }
function hideCol(k){
  if(!PREFS.hidden.includes(k))PREFS.hidden=PREFS.hidden.concat([k]);
  const cs=visCols();
  if(PREFS.freeze>cs.length)PREFS.freeze=cs.length;
  savePrefs(); renderAllGrids();
}
/* left offset of a frozen column: the row-number gutter plus everything frozen
   before it */
function frozenLeft(cs,i){
  let x=44; for(let j=0;j<i;j++)x+=colW(cs[j]);
  return x;
}
let _prefTimer=null;
function currentPrefs(){
  /* v and wrap were missing here, so p.v never matched PREFS_V and every reload
     threw the saved column layout away. Anything applyPrefs reads must be saved. */
  return {theme:document.documentElement.dataset.theme==='dark'?'dark':'light',
          order:PREFS.order,hidden:PREFS.hidden,w:PREFS.w,rowh:PREFS.rowh,
          wrap:PREFS.wrap,freeze:PREFS.freeze,
          sound:PREFS.sound,vol:PREFS.vol,v:PREFS_V};
}
async function savePrefs(){

  try{ localStorage.setItem('ab-prefs',JSON.stringify(p)); }catch(e){}
  if(!LIVE||!USER)return;
  clearTimeout(_prefTimer);

function startResize(e,w,ex,ey){
  if(w.max)return;

function dragMove(e){
  if(!_drag)return; const w=_drag.w, D=desk(), g=document.getElementById('snapghost');

    w.x=e.clientX-_drag.dx; w.y=e.clientY-_drag.dy; applyRect(w);
    const r=D.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    let z=null;
    if(px<28)z={left:0,top:0,width:D.clientWidth/2,height:D.clientHeight};
    else if(px>D.clientWidth-28)z={left:D.clientWidth/2,top:0,width:D.clientWidth/2,height:D.clientHeight};

    if(_drag.ex)w.w=Math.max(340,_drag.w0+(e.clientX-_drag.sx));
    if(_drag.ey)w.h=Math.max(190,_drag.h0+(e.clientY-_drag.sy));

function dragEnd(){
  document.removeEventListener('pointermove',dragMove);

  .sort((a,b)=>(a.submitted||'')<(b.submitted||'')?-1:1);

  if(isHold(r))return 'On hold';

     be one of that leg's own card keys. Returning 'Awaiting reply' on the Client
     leg — which has no such card — dropped the document out of every Maaden
     figure, and the dashboard would still have claimed the states covered 100%
     while quietly counting one fewer. */
  const OUT=(leg==='Maaden'||leg==='maaden')?'Under Client review':'Awaiting reply';
  const t=legRow(r,leg);
  if(t){
    if(t.outcome==='Awaiting reply')return OUT;   /* the rollup writes this word */

       and made the gap invisible — the one card meant to catch it could never

function paintSel(){
  const tbl=GQ('[id="gwrap"] table'); if(!tbl||!GRID||!GRID.sel)return;
  GRID.selFresh=true;                     /* chosen against the rows on screen */
  const {r1,c1,r2,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  tbl.querySelectorAll('td[data-c]').forEach(td=>{
    const r=+td.dataset.r,c=+td.dataset.c;
    td.classList.toggle('sel',r>=ra&&r<=rb&&c>=ca&&c<=cb);
    td.classList.toggle('cur',r===GRID.cur.r&&c===GRID.cur.c);});
}
function selCells(){
  if(!GRID.sel)return[];
  const {r1,c1,r2,c2}=GRID.sel, cs=visCols(), out=[];
  for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)
    for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)
      if(GRID.rows[r]&&cs[c])out.push({row:GRID.rows[r],col:cs[c],r,c});
  return out;
}
function beginEdit(r,c){
  const cs=visCols(), col=cs[c], row=GRID.rows[r];
  if(!col||!row)return;
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  if(col.ro)return toast(col.t+' is worked out automatically');
  const td=GQ(`td[data-r="${r}"][data-c="${c}"]`); if(!td)return;
  GRID.editing={r,c};
  const cur=row[col.k]??'';
  let el;
  if(col.opts){ el=document.createElement('select');
    el.innerHTML=col.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)}</option>`).join('');
  }else{ el=document.createElement('input'); el.type=col.date?'date':'text'; el.value=cur; }
  el.className='cellin'; td.appendChild(el); el.focus(); if(el.select)el.select();
  const done=async(commit)=>{
    if(GRID.editing===null)return; GRID.editing=null;
    const v=el.value;
    el.remove();
    if(commit)await setCell(row,col.k,v);
    else renderGrid();
    const wrap=GQ('[id="gwrap"]'); if(wrap)wrap.focus();
  };
  el.addEventListener('blur',()=>done(true));
  el.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();done(true);}
    if(ev.key==='Escape'){ev.preventDefault();done(false);}
    if(ev.key==='Tab'){ev.preventDefault();done(true).then(()=>{
      GRID.cur={r,c:Math.min(c+1,cs.length-1)};GRID.sel={r1:r,c1:GRID.cur.c,r2:r,c2:GRID.cur.c};paintSel();});}
  });
}
async function gridKey(e){
  if(GRID.editing)return;
  /* the search box and the filter menus sit in the same window as the grid */
  if(typingInField(e)&&!(e.target&&e.target.classList&&e.target.classList.contains('cellin')))return;
  const cs=visCols(), maxR=GRID.rows.length-1, maxC=cs.length-1;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,GRID.cur.r+dr)), c=Math.max(0,Math.min(maxC,GRID.cur.c+dc));
    GRID.cur={r,c};
    GRID.sel=ext&&GRID.sel?{...GRID.sel,r2:r,c2:c}:{r1:r,c1:c,r2:r,c2:c};
    paintSel();
    const td=GQ(`td[data-r="${r}"][data-c="${c}"]`);
    if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
  };
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginEdit(GRID.cur.r,GRID.cur.c);}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();await clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    GRID.sel={r1:0,c1:0,r2:maxR,c2:maxC};paintSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k.toLowerCase()==='y'||(e.shiftKey&&k.toLowerCase()==='z'))){e.preventDefault();redo();}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    beginEdit(GRID.cur.r,GRID.cur.c);
    const el=GQ('.cellin');
    if(el&&el.tagName==='INPUT'){el.value=k;}
  }
}
function copySel(){
  const cells=selCells(); if(!cells.length)return;
  const {r1,r2,c1,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  const cs=visCols(), lines=[];
  for(let r=ra;r<=rb;r++){
    const row=GRID.rows[r]; if(!row)continue;
    const cells=[];
    for(let c=ca;c<=cb;c++){const col=cs[c]; cells.push(col.calc?col.calc(row):(row[col.k]??''));}
    lines.push(cells.join('\t'));
  }
  const txt=lines.join('\r\n');
  navigator.clipboard.writeText(txt).then(()=>toast(lines.length+' row(s) copied'))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('Copied');});
}
function parseTSV(txt){
  return txt.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
}
async function pasteIntoSel(txt){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const data=parseTSV(txt); if(!data.length)return;
  const cs=visCols(), {r1,c1,r2,c2}=GRID.sel||{r1:0,c1:0,r2:0,c2:0};
  const ra=Math.min(r1,r2), ca=Math.min(c1,c2);
  txBegin('paste');
  let n=0,skipped=0;
  for(let i=0;i<data.length;i++){
    const row=GRID.rows[ra+i]; if(!row)break;
    for(let j=0;j<data[i].length;j++){
      const col=cs[ca+j]; if(!col)break;
      if(col.ro){skipped++;continue;}
      await setCell(row,col.k,data[i][j].trim(),true); n++;
    }
  }
  txEnd(); renderGrid();
  toast(n+' cell(s) pasted'+(skipped?', '+skipped+' calculated cell(s) skipped':''));
}
async function clearSel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cells=selCells().filter(x=>!x.col.ro); if(!cells.length)return;
  txBegin('clear '+cells.length+' cell(s)');
  for(const {row,col} of cells) await setCell(row,col.k,'',true);
  txEnd(); renderGrid(); toast(cells.length+' cell(s) cleared');

async function addRow(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  /* 'Not Submitted' is not one of STATUSES — 'Not issued' is, and is what the
     other 24 unissued documents carry. The literal only ever existed as a

async function deleteSelected(){

/* Is the person typing into a box of their own? The paste handler below is on
   the document, so without this it swallowed a paste meant for the search field
   — the search stayed empty, and the clipboard was written into a register cell
   instead. Anywhere text can be typed is off limits to the grid. */
function typingInField(e){
  const el=(e&&e.target)||document.activeElement;
  if(!el||!el.tagName)return false;
  if(el.isContentEditable)return true;
  const tag=el.tagName.toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return true;
  /* the cell editor is an input too, but the grid owns that one */
  return false;
}
/* Does the register actually own the keyboard right now? Checking only that the
   event target is not an input was NOT enough: a paste made while reading the
   dashboard, the history window or the plan still landed here, and went into
   whichever cell GRID.sel last pointed at — a cell the person was not looking at
   and may not even have chosen (the selection survives a re-sort). That is how
   real document titles were overwritten. A paste is only for the grid when the
   focus is inside the grid's own window. */
function gridHasFocus(){
  if(!GRID||!GRID.win||!GRID.win.el)return false;
  const a=document.activeElement;
  return !!a&&GRID.win.el.contains(a);
}
document.addEventListener('paste',e=>{
  if(typingInField(e))return;              /* let the field have it */
  if(!GRID||!GRID.win||GRID.editing)return;
  if(!GQ('[id="gwrap"]'))return;
  if(!gridHasFocus())return;               /* not our paste to take */
  if(!GRID.sel||!GRID.selFresh)return;     /* a selection from before a redraw */
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(t){e.preventDefault();pasteIntoSel(t);}
});

let CMTS={}, MEMBERS=[], HIST={};                       // docId -> [comment]
async function loadComments(id){
  try{
    const list=await api('lod_comments?docId=eq.'+id+'&deletedAt=is.null&order=createdAt.asc');
    CMTS[id]=list; return list;

let CCOUNT={};
const ago=ts=>{
  if(!ts)return '';
  const mins=Math.round((Date.now()-new Date(ts))/60000);
  if(mins<1)return 'just now';
  if(mins<60)return mins+' min ago';
  if(mins<1440)return Math.round(mins/60)+'h ago';
  const d=Math.round(mins/1440);
  if(d<8)return d+'d ago';
  return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});
};
const initials=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

function commentsHTML(id){

function findMentions(text){
  const hits=[];
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    const re=new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    if(re.test(text))hits.push(m);
  });
  return hits;
}
function renderMentions(text){
  let out=esc(text);
  MEMBERS.forEach(m=>{
    const n=(m.name||'').trim(); if(!n)return;
    out=out.replace(new RegExp('@'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),
      '<span class="mention">@'+esc(n)+'</span>');

  return out;
}
async function notifyMentions(text,r,commentId){
  const hits=findMentions(text).filter(m=>!USER||m.user_id!==USER.id);
  for(const m of hits){
    try{
      await api('lod_notifs',{method:'POST',body:JSON.stringify({
         ts:nowTs(), kind:'mention',
        title:(USER?USER.name:'Someone')+' mentioned you',
        body:text.slice(0,220), toUser:m.user_id,
        fromName:(USER&&USER.name)||'', ref:r.ref||'',
        docId:r.id, commentId:commentId||null, read:'', cleared:''})});
    }catch(e){ console.warn('could not notify',m.name,e); }
  }
  return hits;
}
async function postComment(id,body){
  if(!body.trim())return;
  const row={docId:id,body:body.trim(),authorId:USER.id,
    authorName:USER.name||USER.email,authorEmail:USER.email};
  const r=await api('lod_comments',{method:'POST',
    headers:{Prefer:'return=representation'},body:JSON.stringify(row)});
  (CMTS[id]=CMTS[id]||[]).push(r[0]);
  const document=AB.find(x=>x.id===id)||{id,ref:''};
  const told=await notifyMentions(body.trim(),document,r[0].id);
  if(told.length)toast('Notified '+told.map(m=>m.name.split(' ')[0]).join(', '));
  CCOUNT[id]=(CCOUNT[id]||0)+1;
  await logAct('comment',AB.find(x=>x.id===id)||{id},'discussion','',body.trim().slice(0,60));
  renderAllGrids();

async function removeComment(id,cid){

function wireComments(root,id,redraw){
  const send=root.querySelector('#csend'), ta=root.querySelector('#cnew');
  if(send)send.onclick=async()=>{
    const v=ta.value; if(!v.trim())return;
    send.disabled=true;
    try{ await postComment(id,v); ta.value=''; redraw(); }
    catch(e){ toast('Could not post that comment'); }
    finally{ send.disabled=false; }
  };
  if(ta){
    const pick=root.querySelector('#mpick');
    let open=false, idx=0, matches=[];
    const close=()=>{open=false;if(pick){pick.style.display='none';pick.innerHTML='';}};
    const paint=()=>{
      if(!pick)return;
      pick.innerHTML=(matches.length?'<div class="mphd">Mention someone</div>':'')+
        matches.map((m,i)=>
        `<button class="mp${i===idx?' on':''}" data-m="${i}">
           <b>${esc(m.name)}</b><i>${esc(m.role)}</i></button>`).join('');
      pick.style.display=matches.length?'block':'none';
      pick.querySelectorAll('[data-m]').forEach(b=>b.onmousedown=e=>{
        e.preventDefault(); insert(matches[+b.dataset.m]);});
    };
    const insert=m=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      ta.value=v.slice(0,at)+'@'+m.name+' '+v.slice(c);
      const np=at+m.name.length+2;
      close(); ta.focus(); ta.setSelectionRange(np,np);
    };
    const scan=()=>{
      const v=ta.value, c=ta.selectionStart;
      const at=v.lastIndexOf('@',c-1);
      if(at<0||(at>0&&/\S/.test(v[at-1]))){close();return;}
      const frag=v.slice(at+1,c);
      if(/\s{2,}|\n/.test(frag)){close();return;}
      matches=MEMBERS.filter(m=>m.user_id!==(USER&&USER.id)
        &&(m.name||'').toLowerCase().includes(frag.toLowerCase())).slice(0,4);
      idx=0; open=matches.length>0; paint();
    };
    ta.addEventListener('input',scan);
    ta.addEventListener('click',scan);
    ta.addEventListener('blur',()=>setTimeout(close,150));
    ta.addEventListener('keydown',e=>{
      if(open&&matches.length){
        if(e.key==='ArrowDown'){e.preventDefault();idx=(idx+1)%matches.length;paint();return;}
        if(e.key==='ArrowUp'){e.preventDefault();idx=(idx-1+matches.length)%matches.length;paint();return;}
        if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insert(matches[idx]);return;}
        if(e.key==='Escape'){close();return;}
      }
      if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send.click();}
    });
  }
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    msgBox('Remove this comment?','','It will no longer be shown to anyone.',
      [['Cancel',null,''],['Remove',async()=>{await removeComment(id,+b.dataset.del);redraw();},'danger']]);});
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{
    const c=(CMTS[id]||[]).find(x=>x.id===+b.dataset.edit); if(!c)return;
    msgBox('Edit your comment','',
      `<textarea id="cedit" rows="4" style="width:100%;padding:9px;border-radius:9px;
        border:1px solid var(--ring);background:var(--field);color:var(--ink);font:inherit">${esc(c.body)}</textarea>`,
      [['Cancel',null,''],['Save',async()=>{
        const v=document.getElementById('cedit').value.trim(); if(!v)return;
        await api('lod_comments?id=eq.'+c.id,{method:'PATCH',
          body:JSON.stringify({body:v,editedAt:nowTs()})});
        c.body=v; c.editedAt=nowTs(); redraw();},'primary']]);});
}

/* ================= weekly submission plan =================
   Pick documents, say who is submitting each and by when. The person
   responsible need not have a login — they are names on a list. */

let ASSIGNEES=[], PLANS=[], PITEMS={};
/* the working week here runs Saturday to Thursday */
const WEEK_DAYS=6;
const weekStartOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+1)%7));
  return isoDay(x);};
const monday=weekStartOf;            /* kept so older calls still work */
const weekEndOf=ws=>{const b=new Date(ws);b.setDate(b.getDate()+WEEK_DAYS-1);
  return isoDay(b);};
/* "22–27 Aug" — the long form does not fit a narrow printed column */
const weekShort=ws=>{
  const x=new Date(ws), y=new Date(weekEndOf(ws));
  const m=d=>d.toLocaleDateString('en-GB',{month:'short'});
  const d=n=>String(n.getDate()).padStart(2,'0');
  return x.getMonth()===y.getMonth()
    ? d(x)+'–'+d(y)+' '+m(y)
    : d(x)+' '+m(x)+' – '+d(y)+' '+m(y);
};
const weekLabel=ws=>{
  const a=new Date(ws), b=new Date(weekEndOf(ws));
  const f=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  return 'Sat '+f(a)+' – Thu '+f(b);
};
function weekOptions(back,fwd,kind){
  const k=kind||PLAN_KIND;
  const out=[], base=new Date(weekStartOf(today));
  for(let i=-back;i<=fwd;i++){
    const d=new Date(base); d.setDate(d.getDate()+i*7);
    const ws=isoDay(d);
    const taken=PLANS.find(p=>p.weekStart===ws&&(p.kind||'submission')===k);
    out.push({ws,label:weekLabel(ws),taken:!!taken,planId:taken?taken.id:null,
      note:i===0?'this week':i===1?'next week':i===-1?'last week'
        :i<0?Math.abs(i)+' weeks ago':'in '+i+' weeks'});
  }
  return out;
}
const planStarted=p=>!!p&&p.weekStart<=today;
const planEnded=p=>!!p&&weekEndOf(p.weekStart)<today;
const planPhase=p=>{
  if(!p)return {k:'none',label:''};
  if(!planStarted(p)){
    const d=days(today,p.weekStart);
    return {k:'future',label:d===1?'Starts tomorrow':'Starts in '+d+' days'};
  }
  if(planEnded(p))return {k:'past',label:'Week finished'};
  return {k:'live',label:'Live this week'};
};
async function loadPlanning(){

    [ASSIGNEES,PLANS]=await Promise.all([

const assigneeName=id=>{const a=ASSIGNEES.find(x=>x.id===id);return a?a.name:'— not assigned —';};
/* the people who do the submitting are kept separately from the login
   accounts — type a name once and it is remembered for next time */

async function resolveAssignee(name){

/* An item counts as achieved when the document has been submitted SINCE it was
   planned — comparing against the submission date captured when it was added,
   so work already done beforehand is not claimed as progress. */
/* THE ONE DEFINITION of a kept commitment, used by the plan, the analysis
   report AND the Overview's recovery panel. They used to disagree: the Overview
   asked only "has this ever been submitted to AWPT", which counted a document
   submitted months BEFORE the commitment was written and since returned RWC —
   nine of them — as delivered, and reported 70% where the honest figure is 52%.
     · a submission made AFTER the commitment — a direct answer to it; or
     · the obligation is already discharged — the latest revision is with AWPT
       awaiting a reply, or AWPT cleared it.
   A revision that came back RWC is neither: the ball is with HESCO. */
function commitmentMet(r,it){
  r=r||{}; it=it||{};
  const sub=(r.awptSubmitted||'').trim(), base=(it.baseAwptSub||'').trim();
  const answered=!!sub&&sub!==base;
  const last=lastCycle(r,'HESCO');
  const discharged=!!last&&(last.submitted||'')!==''&&
    (!(last.responded||'') || last.status==='RNC' || APPROVED.includes(last.status||''));
  const done=answered||discharged;
  /* the date it actually went out, whichever of the two applies */
  return {done, on: done?(answered?sub:((last&&last.submitted)||sub||'')):''};
}
function itemState(it,plan){
  const r=AB.find(a=>a.id===it.docId)||{};
  if(plan&&!planStarted(plan))
    return {k:'pending',label:'Planned',cls:'st-none'};

  if(plan&&plan.kind==='review'){
    // whoever was reviewing it when it was planned has since responded
    const was=(it.baseHolder||'');
    const moved=r.holder&&was&&r.holder!==was;
    if(moved){
      const late=it.plannedDate&&(r.heldSince||today)>it.plannedDate;
      const where=r.holder==='Closed'?'Approved'
        :r.holder==='Maaden'?'Passed to Maaden'
        :r.holder==='AWPT'?'Back with AWPT'
        :'Returned to HESCO';
      return {k:late?'late':'done',label:where+(late?' (late)':''),
              cls:late?'st-late':'st-done'};
    }
    if(it.plannedDate&&it.plannedDate<today)
      return {k:'overdue',label:days(it.plannedDate,today)+'d overdue',cls:'st-over'};
    if(it.plannedDate)return {k:'due',label:'Due '+it.plannedDate,cls:'st-due'};
    return {k:'nodate',label:'No target date',cls:'st-none'};
  }

  /* A submission plan is about GETTING IT OUT THE DOOR, so it is finished the
     moment HESCO issues the document to AWPT — not when Maaden later sees it,
     and not when anyone approves it.

     Asking only "has the submission date moved since the plan was written" is
     not enough. Some of these documents had already been issued days before the
     plan was drafted — the plan listed them because the register said otherwise
     — so nothing moved afterwards and they read as overdue while sitting on
     AWPT's desk. Two things each mean the commitment is met:
       · a submission made AFTER the commitment was written — a direct answer
         to it, even if AWPT has since sent it back; or
       · the obligation is already discharged — the latest revision is with AWPT
         awaiting a reply, or AWPT cleared it.
     A revision that came back RWC is neither: the ball is with HESCO and the
     committed revision is still owed. */
  const {done,on:onDate}=commitmentMet(r,it);
  if(done){
    const on=onDate;
    const late=it.plannedDate&&on&&on>it.plannedDate;
    return {k:late?'late':'done',label:(late?'Submitted late':'Submitted')+' '+on,
            cls:late?'st-late':'st-done',sub:on,
            days:(it.plannedDate&&on)?days(it.plannedDate,on):null};
  }
  if(it.plannedDate&&it.plannedDate<today)
    return {k:'overdue',label:days(it.plannedDate,today)+'d overdue',cls:'st-over'};
  if(it.plannedDate)return {k:'due',label:'Due '+it.plannedDate,cls:'st-due'};
  return {k:'nodate',label:'No target date',cls:'st-none'};
}
function planProgress(planId){
  const items=PITEMS[planId]||[];
  const plan=PLANS.find(p=>p.id===planId);
  const st=items.map(it=>itemState(it,plan));
  const done=st.filter(x=>x.k==='done'||x.k==='late').length;
  return {total:items.length,done,
    onTime:st.filter(x=>x.k==='done').length,
    late:st.filter(x=>x.k==='late').length,
    overdue:st.filter(x=>x.k==='overdue').length,
    open:st.filter(x=>x.k==='due'||x.k==='nodate'||x.k==='pending').length,
    pct:items.length?Math.round(done/items.length*100):0,
    started:planStarted(plan),phase:planPhase(plan),
    kind:plan?plan.kind:'submission',verb:planVerb(plan)};
}
const planKindLabel=p=>(p&&p.kind==='review')?'Review':'Submission';
const KINDS=[['submission','HESCO submissions'],['review','AWPT review']];
const plansOfKind=k=>PLANS.filter(p=>(p.kind||'submission')===k);
/* keep the selected week inside the selected category */
function syncPlanKind(){
  const list=plansOfKind(PLAN_KIND);
  if(!list.some(p=>p.id===PLAN_CUR))PLAN_CUR=list.length?list[0].id:null;
  return list;
}
const planVerb=p=>(p&&p.kind==='review')?'answered':'submitted to AWPT';
function progressBar(p){
  const w=n=>p.total?(n/p.total*100):0;
  if(!p.started)return `<div class="pgwrap">
    <div class="pgnum"><b>—</b><span>${p.total} document(s) planned · ${esc(p.phase.label)}</span></div>
    <div class="pgbar"></div>
    <div class="pglg"><span>Progress starts being measured on the first day of the week.</span></div></div>`;
  return `<div class="pgwrap">
    <div class="pgnum"><b>${p.pct}%</b><span>${p.done} of ${p.total} ${p.verb||'submitted to AWPT'}${
      p.phase.k==='past'?' · week finished':''}</span></div>
    <div class="pgbar">
      <i class="on" style="width:${w(p.onTime)}%"></i>
      <i class="lt" style="width:${w(p.late)}%"></i>
      <i class="ov" style="width:${w(p.overdue)}%"></i>
    </div>
    <div class="pglg">
      <span><i class="on"></i>On time ${p.onTime}</span>
      <span><i class="lt"></i>Late ${p.late}</span>
      <span><i class="ov"></i>Overdue ${p.overdue}</span>
      <span><i class="op"></i>Still to come ${p.open}</span>
    </div></div>`;
}

function openPicker(planId,draw){

    if(only==='inreview'&&!(r.holder==='AWPT'||r.holder==='Maaden'))return false;

    if(only==='maaden'&&r.holder!=='Maaden')return false;
    if(only==='hesco'&&r.holder!=='HESCO')return false;
    if(only==='open'&&!isOpen(r))return false;
    if(only==='ns'&&r.status!=='Not issued')return false;

  };

      <label class="pk"><input type="checkbox" data-p="${r.id}"${chosen.has(r.id)?' checked':''}>

      ||'<div class="empty">Nothing matches.</div>'}</div>

  const m=msgBox('Add documents to the plan','',body(),
    [['Cancel',null,''],['Add selected',async()=>{
      let added=0,already=0;
      for(const id of chosen){
        try{ await api('lod_plan_items',{method:'POST',body:JSON.stringify({planId,docId:id})}); added++; }
        catch(e){ already++; }
      }
      delete PITEMS[planId]; await draw();
      toast(added+' added to the plan'+(already?', '+already+' already there':''));
    },'primary']]);
  const wire=()=>{
    const box=document.getElementById('msg');
    box.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{
      const id=+cb.dataset.p; cb.checked?chosen.add(id):chosen.delete(id);
      const s=document.getElementById('pksum'); if(s)s.textContent=chosen.size+' selected';});
    const qi=document.getElementById('pkq');
    if(qi)qi.oninput=()=>{q=qi.value.trim().toLowerCase();redraw(qi.selectionStart);};
    const fi=document.getElementById('pkf');
    if(fi)fi.onchange=()=>{only=fi.value;redraw();};
  };
  const redraw=(caret)=>{
    const box=document.getElementById('msg');
    box.querySelector('.body').innerHTML=body(); wire();
    const qi=document.getElementById('pkq');
    if(qi&&caret!=null){qi.focus();qi.setSelectionRange(caret,caret);}
  };
  wire();

/* ================= plan as a Gantt =================
   One bar per document, running from the start of the plan week (or today,
   whichever is later) to its target date, with the target marked. Colour
   carries the state, so slippage is visible without reading a table. */
let PLAN_VIEW='table';
let PLAN_KIND='submission';

function ganttHTML(planId){
  const plan=PLANS.find(p=>p.id===planId), items=PITEMS[planId]||[];
  if(!plan||!items.length)
    return '<div class="empty"><b>Nothing to chart</b>Add documents to the plan first.</div>';

  const ws=plan.weekStart, we=weekEndOf(ws);
  const dates=items.map(i=>i.plannedDate).filter(Boolean);
  const lo=[ws,...dates].sort()[0];
  const hiRaw=[we,...dates,today].sort().pop();
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return isoDay(x);};
  const start=addDays(lo,-1), end=addDays(hiRaw,1);
  const span=Math.max(1,days(start,end));
  const pos=d=>Math.max(0,Math.min(100,days(start,d)/span*100));

  // day columns, labelled every other day when the span is long
  let grid='', labels='';
  for(let i=0;i<=span;i++){
    const d=addDays(start,i), x=i/span*100;
    const dow=new Date(d).getDay();               // 5=Fri 6=Sat
    const rest=(dow===5);                          // Friday is the day off
    grid+=`<i class="gl${rest?' rest':''}" style="left:${x}%;width:${100/span}%"></i>`;
    if(span<=10||i%2===0)
      labels+=`<span style="left:${x}%">${new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</span>`;
  }
  const todayX=(today>=start&&today<=end)?pos(today):null;

  const rows=items.map(it=>{
    const r=AB.find(a=>a.id===(it.docId!=null?it.docId:it.asbuiltId))||{};
    const st=itemState(it,plan);
    const from=(ws>today?ws:today);
    const to=it.plannedDate||we;
    const a=pos(from<to?from:to), b=pos(to);
    const w=Math.max(1.2,b-a);
    const cls={done:'g-done',late:'g-late',overdue:'g-over',due:'g-due',
               nodate:'g-none',pending:'g-plan'}[st.k]||'g-due';
    return `<div class="grow" data-pi="${it.id}">
      <div class="glab" title="${esc(r.title||'')}">${esc(r.title||'—')}
        <i>${esc(r.discipline||'')}${it.assigneeId?' · '+esc(assigneeName(it.assigneeId)):''}</i></div>
      <div class="gtrack">
        ${grid}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>`:''}
        <div class="gbar ${cls}" style="left:${a}%;width:${w}%">
          <b>${esc(st.label)}</b></div>
        ${it.plannedDate?`<i class="gdia ${cls}" style="left:${b}%"
           title="${esc(it.plannedDate)}"></i>`:''}
      </div>
      <div class="gdate">${esc(it.plannedDate||'—')}</div></div>`;}).join('');

  return `<div class="gantt" data-chart="gantt">
    <div class="ghead"><div class="glab"></div>
      <div class="gtrack gaxis">${grid}${labels}
        ${todayX!=null?`<i class="gnow" style="left:${todayX}%"></i>
          <span class="gnowlab" style="left:${todayX}%">today</span>`:''}</div>
      <div class="gdate">Target</div></div>
    ${rows}
    <div class="legend" style="margin-top:10px">
      <span><i class="sw" style="background:#0f9d58"></i>Done</span>
      <span><i class="sw" style="background:#f0b429"></i>Late</span>
      <span><i class="sw" style="background:#d64545"></i>Overdue</span>
      <span><i class="sw" style="background:var(--accent)"></i>Due</span>
      <span><i class="sw" style="background:var(--muted)"></i>Planned</span>
      <span class="rt">Fridays shaded</span></div></div>`;
}

/* ================= overall plan analysis =================
   One PDF covering EVERY week of the selected category, not a single week.
   It answers the three questions a progress meeting actually asks: are we
   keeping the commitments, who is behind, and what is overdue right now.
   Every figure below is derived from itemState(), the same function the
   screen uses, so paper and screen can never disagree. */

/* one flat row per plan item, with the plan it belongs to */
function planUniverse(kind){
  const out=[];
  for(const p of PLANS){
    if((p.kind||'submission')!==kind)continue;
    for(const it of (PITEMS[p.id]||[])){
      const r=AB.find(a=>a.id===it.docId);
      /* a document that has since been deleted is no longer part of the
         programme; without this it printed as a blank row with no name */
      if(!r){ out.push({skipped:true}); continue; }
      out.push({it,plan:p,doc:r,st:itemState(it,p)});
    }
  }
  /* the count has to ride on the array that is RETURNED — setting it on `out`
     and then returning a filtered copy silently threw it away */
  const kept=out.filter(x=>!x.skipped);
  kept.dropped=out.length-kept.length;
  return kept;
}
/* count a set of rows into the five buckets the progress bar uses */
function planTally(rows){
  const k=f=>rows.filter(f).length;
  const done=k(x=>x.st.k==='done'||x.st.k==='late');
  const late=rows.filter(x=>x.st.k==='late');
  /* how far past target the late ones landed, and how far past target the
     still-open ones are today — the two halves of "slip" */
  const slip=late.map(x=>days(x.it.plannedDate,x.st.sub)).filter(n=>n>0);
  const overdue=rows.filter(x=>x.st.k==='overdue');
  const age=overdue.map(x=>days(x.it.plannedDate,today)).filter(n=>n>0);
  const avg=a=>a.length?Math.round(a.reduce((t,n)=>t+n,0)/a.length):0;
  return {n:rows.length,done,onTime:k(x=>x.st.k==='done'),late:late.length,
    overdue:overdue.length,open:k(x=>['due','nodate','pending'].includes(x.st.k)),
    pct:rows.length?Math.round(done/rows.length*100):0,
    avgSlip:avg(slip),worstSlip:slip.length?Math.max(...slip):0,
    avgAge:avg(age),worstAge:age.length?Math.max(...age):0};
}
/* group rows by a key and tally each group, biggest problem first */
function planGroup(rows,keyOf){
  const m=new Map();
  for(const x of rows){const k=keyOf(x)||'—';(m.get(k)||m.set(k,[]).get(k)).push(x);}
  return [...m.entries()].map(([k,v])=>({k,t:planTally(v)}))
    .sort((a,b)=>(b.t.overdue-a.t.overdue)||(b.t.late-a.t.late)||(b.t.n-a.t.n));
}
/* What AWPT actually said about the documents these weeks committed.
   Counted per DOCUMENT, deduplicated — a document carried across two weeks is
   one document, not two — and read from the same leg state the AWPT register
   and dashboard use, so the three can never disagree. */
function planAwptReview(rows){
  const seen=new Map();
  for(const x of rows) if(x.doc&&x.doc.id!=null&&!seen.has(x.doc.id))seen.set(x.doc.id,x.doc);
  const docs=[...seen.values()];
  const states=LEGSTATE('hesco').map(st=>({
    k:st.k, t:st.t, s:st.s, n:docs.filter(r=>legOf(r,'hesco')===st.k).length}));
  /* every AWPT cycle those documents have been through */
  const cyc=[];
  docs.forEach(r=>(HIST[r.id]||[]).filter(h=>h.leg==='HESCO').forEach(h=>cyc.push(h)));
  const answered=cyc.filter(h=>(h.responded||'').trim()!=='');
  /* the same bound the leg panel now uses: a reply dated after today cannot have
     happened, so it cannot be part of an average that goes to the client */
  const closed=answered.filter(h=>h.days!=null&&h.days>=0&&(h.responded||'')<=today)
    .map(h=>h.days).sort((a,b)=>a-b);
  const open=cyc.filter(h=>(h.submitted||'').trim()!==''&&!(h.responded||'').trim());
  const waiting=open.map(h=>days(h.submitted,today)).filter(n=>n>=0);
  return {docs:docs.length, states,
    rnc:answered.filter(h=>h.status==='RNC').length,
    rwc:answered.filter(h=>h.status==='RWC').length,
    cycles:cyc.length, answered:answered.length, open:open.length,
    /* answers nobody recorded — deduced from the resubmission pattern */
    inferred:answered.filter(isInferred).length,
    avg:closed.length?Math.round(closed.reduce((a,b)=>a+b,0)/closed.length*10)/10:null,
    med:closed.length?closed[Math.floor(closed.length/2)]:null,
    worst:closed.length?closed[closed.length-1]:null,
    waiting:waiting.length?Math.max(...waiting):null,
    /* how many attempts each document needed before AWPT cleared it */
    reworked:docs.filter(r=>(HIST[r.id]||[])
      .filter(h=>h.leg==='HESCO'&&h.status==='RWC').length>0).length};
}
/* Every revision a document went through inside the plan week, with the code
   it came back with. A document with three revisions is three rows; everything
   that describes the document itself is merged down those rows, the way it
   would be in a spreadsheet. */
/* Where the document already stood when the recovery week opened: how many
   times it had been round before, and the last revision it reached. Without
   this a first submission and a tenth look identical on the page. */
function planPrior(x){
  const a=x.plan.weekStart;
  const before=(HIST[x.doc.id]||[])
    .filter(h=>(h.submitted||'')&&h.submitted<a)
    .sort((m,n)=>m.submitted<n.submitted?-1:m.submitted>n.submitted?1:(m.id||0)-(n.id||0));
  const last=before.length?before[before.length-1]:null;
  return {n:before.length, last,
    /* the answer that revision came back with, in the reviewer's own words */
    code:last?((last.responded||'')
      ? (last.status?(MAADEN_GRADE[last.status]?MAADEN_GRADE[last.status].g:last.status):'—')
      : 'out') : ''};
}
function planRevs(x){
  const p=x.plan, a=p.weekStart, b=weekEndOf(p.weekStart);
  return (HIST[x.doc.id]||[])
    .filter(h=>(h.submitted||'')>=a&&(h.submitted||'')<=b)
    .sort((m,n)=>(m.submitted<n.submitted?-1:m.submitted>n.submitted?1:(m.id||0)-(n.id||0)));
}
/* One plain sentence per document: what was asked, what happened, where it is. */
function planComment(x,revs){
  const it=x.it, r=x.doc, st=x.st, bits=[];
  /* name the leg the plan measures: a document can have gone to Maaden this
     week and still be "not submitted" against a HESCO submission plan */
  const leg=(x.plan.kind==='review')?'':' to AWPT';
  if(isHold(r))return 'On hold'+(r.holdNote?' — '+r.holdNote:'')+'; the clock is stopped.';
  const tgt=it.plannedDate||'';
  if(st.k==='done'||st.k==='late'){
    const n=st.days;
    bits.push('Submitted'+leg+' '+st.sub+(tgt?(n>0?', '+n+' day'+(n===1?'':'s')+' after the '+tgt+' target'
                                        :n<0?', '+(-n)+' day'+(n===-1?'':'s')+' early'
                                        :', on the target date'):''));
  } else if(st.k==='overdue'){
    bits.push('Not submitted'+leg+' — '+days(tgt,today)+' day'+(days(tgt,today)===1?'':'s')+' past the '+tgt+' target');
  } else if(st.k==='due'){
    bits.push('Due '+tgt+', not submitted'+leg+' yet');
  } else if(st.k==='pending'){ bits.push('Planned for a week that has not started');
  } else bits.push('No target date set');
  /* what the reviewer said about the last revision inside the week */
  const last=revs.length?revs[revs.length-1]:null;
  if(last){
    const to=last.leg==='HESCO'?'AWPT':'Maaden';
    if(!(last.responded||''))bits.push('with '+to+' since '+last.submitted+' ('+days(last.submitted,today)+'d)');
    else if(last.status)bits.push(to+' returned '+last.rev+' on '+last.responded+
      ' as '+(MAADEN_GRADE[last.status]?maadenLabel(last.status):last.status));
    else bits.push(to+' replied on '+last.responded);
  }
  /* and where it sits now, in the words of whoever holds it */
  const court=r.holder||'';
  if(court==='Closed')bits.push('closed');
  else if(court)bits.push('now with '+court);
  return bits.join('; ')+'.';
}
/* The document type, read off the number's own type code — the same column the
   recovery-plan workbook carries. */
const DOCTYPE={RPT:'Report',DED:'Drawing',GAD:'Drawing',LAD:'Layout',SLD:'Diagram',
  PID:'Diagram',PFD:'Diagram',STD:'Standard detail',CAL:'Calculation',DAT:'Datasheet',
  SPC:'Specification',CRT:'Design criteria',LST:'List',BOM:'BOQ',BOQ:'BOQ',MOD:'Model',
  PLN:'Plan',PRO:'Procedure',MOM:'Minutes'};
function docType(num){
  const m=/-([A-Z]{3})-AWPT/.exec(num||'')||/-([A-Z]{3})-[0-9]/.exec(num||'');
  return m?(DOCTYPE[m[1]]||m[1]):'';
}
/* Where a document stands against the date HESCO committed to in the plan. */
function planLine(x){
  const r=x.doc, it=x.it;
  const cyc=(HIST[r.id]||[]).filter(h=>h.leg==='HESCO'&&(h.submitted||''))
    .sort((a,b)=>a.submitted<b.submitted?-1:a.submitted>b.submitted?1:(a.id||0)-(b.id||0));
  const last=cyc.length?cyc[cyc.length-1]:null;
  const committed=it.plannedDate||'';
  /* late against the committed date: by the day it actually went, or by today
     if it still has not gone */
  let late='–';
  if(committed){
    const gone=x.st.sub||'';
    if(gone) late=days(committed,gone)>0?days(committed,gone):0;
    else if(committed<today) late=days(committed,today);
    else late='–';
  }
  /* what AWPT said about that last revision — the whole point of the column */
  /* "awaiting" did not say awaiting what. The dashboard calls this state
     "With AWPT now"; the report says the same thing in the space it has. */
  /* Every other surface — the register, the phone card, the history window and
     the spreadsheet export — suffixes an inferred verdict with "~". The report
     that leaves the building was the only one stating a guess as a fact. */
  const lastCode=!last ? ''
    : ((last.responded||'') ? ((last.status||'—')+(isInferred(last)?' ~':''))
                            : 'with AWPT');
  return {cyc, last, lastCode,
    lastRev:last?(last.rev||'?'):'Not submitted',
    cycles:cyc.length||'–',
    late, committed,
    issued:last?(last.submitted||'–'):'–',
    returned:last&&(last.responded||'')?last.responded:'–'};
}
/* Every revision the document has been through, as a V0 / V1 / V2 … grid with
   the pair of dates under each — the shape of the Review History sheet. */
function reviewGrid(rows){
  const per=rows.map(x=>{
    const cyc=(HIST[x.doc.id]||[]).filter(h=>(h.submitted||''))
      .sort((a,b)=>a.submitted<b.submitted?-1:a.submitted>b.submitted?1:(a.id||0)-(b.id||0));
    return {x,cyc};
  });
  const wide=per.reduce((m,p)=>Math.max(m,p.cyc.length),0);
  return {per,wide:Math.max(1,wide)};
}
function buildPlanAnalysis(kind){
  const rows=planUniverse(kind);
  const T=planTally(rows), A=planAwptReview(rows);
  const weeks=PLANS.filter(p=>(p.kind||'submission')===kind)
    .slice().sort((a,b)=>a.weekStart<b.weekStart?-1:1);
  const stamp=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const title=kind==='review'?'AWPT Review Plan':'Recovery Plan';
  /* A donut per group instead of a row of boxes — the same three numbers in a
     fraction of the height. Radius 15.9155 gives a circumference of 100, so a
     segment's dash length IS its percentage and nothing has to be scaled.
     Every segment is named in the legend with its count and share, so identity
     never rests on colour alone — which also covers a black-and-white print.
     Colours: the app's own status set, checked for colour-blind separation
     (worst adjacent pair ΔE 10.2 protan, 20.8 normal); the neutral is
     deliberately desaturated so the coloured segments carry the meaning. */
  /* Planned against actual is a race between two running totals, not a slice of
     anything, so it gets the form that shows a gap: two cumulative lines across
     the committed dates. The distance between them at today IS the shortfall,
     which a donut can only imply. Both lines are labelled at their end, so the
     chart reads without the legend and without colour. */
  const curve=(title,rs)=>{
    const set=new Set(rs.map(x=>x.it.plannedDate).filter(Boolean));
    if(!set.size)return `<div class="rdo"><h4>${esc(title)}</h4>
      <div class="rdempty">No committed dates yet.</div></div>`;
    set.add(today);                       /* today is always a point on the line */
    const dts=[...set].sort();
    const done=rs.filter(x=>x.st.k==='done'||x.st.k==='late');
    const P=dts.map(d=>rs.filter(x=>x.it.plannedDate&&x.it.plannedDate<=d).length);
    const A=dts.map(d=>done.filter(x=>(x.st.sub||'')&&x.st.sub<=d).length);
    const top=Math.max(1,P[P.length-1]);
    /* viewBox units; room on the right for the end labels */
    const L=13,R=26,Tp=9,B=13,W=200,H=70;
    /* A REAL time axis, not one step per date. Spacing the dates evenly put the
       today line on the next committed date instead of on today, and it also
       lied about the shape — three days and one day were drawn the same width. */
    const t=d=>Date.parse(d), t0=t(dts[0]), t1=t(dts[dts.length-1]);
    const span=Math.max(1,t1-t0);
    const px=d=>L+((t(d)-t0)/span)*(W-L-R);
    const py=v=>H-B-(v/top)*(H-Tp-B);
    /* The planned line runs the whole programme; the ACTUAL line stops at today,
       because there is no actual beyond today. Drawing it on to the last
       committed date claimed we already knew what would be submitted in the
       future — a forecast dressed as a fact. */
    const upto=dts.filter(d=>d<=today);
    const iNow=upto.length-1;
    const path=(a,ds)=>ds.map((d,i)=>(i?'L':'M')+px(d).toFixed(1)+' '+py(a[i]).toFixed(1)).join(' ');
    const dot=(a,ds,c)=>ds.map((d,i)=>`<circle cx="${px(d).toFixed(1)}" cy="${py(a[i]).toFixed(1)}"
      r="1.5" fill="${c}"/>`).join('');
    const nowX=px(today);
    const day=d=>{const x=new Date(d);return String(x.getDate()).padStart(2,'0')+' '+
      x.toLocaleDateString('en-GB',{month:'short'});};
    const lastP=P[P.length-1];
    /* the legend measures WHAT IS DUE BY TODAY — the line runs on to the end of
       the programme, and reading one against the other would flatter the figure */
    const dueP=rs.filter(x=>x.it.plannedDate&&x.it.plannedDate<=today).length;
    const dueA=done.filter(x=>x.it.plannedDate&&x.it.plannedDate<=today).length;
    /* what the red bar spans: the two lines as they stand at today */
    const gap=Math.max(0,P[iNow]-A[iNow]);
    return `<div class="rdo"><h4>${esc(title)}</h4>
      <svg class="cv" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="${A[iNow]} submitted of the ${P[iNow]} due by today, ${lastP} committed in all">
        <line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>
        <line class="ax" x1="${L}" y1="${Tp}" x2="${L}" y2="${H-B}"/>
        <text class="cvy" x="${L-2}" y="${py(top)+2}">${top}</text>
        <text class="cvy" x="${L-2}" y="${H-B+2}">0</text>
        <line class="now" x1="${nowX.toFixed(1)}" y1="${Tp}" x2="${nowX.toFixed(1)}" y2="${H-B}"/>
        <text class="cvx" x="${nowX.toFixed(1)}" y="${H-B+9}" text-anchor="middle">${day(today)}</text>
        <text class="cvx" x="${L}" y="${H-B+9}">${day(dts[0])}</text>
        ${(dts[dts.length-1]!==today && (W-R)-nowX>22)
           ?`<text class="cvx" x="${W-R}" y="${H-B+9}"
             text-anchor="end">${day(dts[dts.length-1])}</text>`:''}
        <path class="pl" d="${path(P,dts)}"/>${dot(P,dts,'#6b7f92')}
        <path class="ac" d="${path(A.slice(0,iNow+1),upto)}"/>${
          dot(A.slice(0,iNow+1),upto,'#0a7a44')}
        ${gap>0?`<line class="gap" x1="${nowX.toFixed(1)}" y1="${py(A[iNow]).toFixed(1)}"
            x2="${nowX.toFixed(1)}" y2="${py(P[iNow]).toFixed(1)}"/>
          <line class="gapc" x1="${(nowX-1.8).toFixed(1)}" y1="${py(P[iNow]).toFixed(1)}"
            x2="${(nowX+1.8).toFixed(1)}" y2="${py(P[iNow]).toFixed(1)}"/>
          <text class="cve gp-t" x="${(nowX+3.4).toFixed(1)}"
            y="${((py(A[iNow])+py(P[iNow]))/2+2).toFixed(1)}">${gap} behind</text>`:''}
        <circle class="nowdot" cx="${nowX.toFixed(1)}" cy="${py(A[iNow]).toFixed(1)}" r="2.4"/>
        <text class="cve pl-t" x="${(W-R+3)}" y="${py(lastP)+2}">${lastP} planned</text>
        <text class="cve ac-t" x="${(nowX-3).toFixed(1)}" y="${(py(A[iNow])+8).toFixed(1)}"
          text-anchor="end">${A[iNow]} actual</text>
      </svg>
      <div class="rdleg">
        <div class="lg"><i style="background:#6b7f92"></i><span>Due by today</span>
          <b>${dueP}</b><u>100%</u></div>
        <div class="lg"><i style="background:#0a7a44"></i><span>Submitted by today</span>
          <b>${dueA}</b><u>${dueP?Math.round(dueA/dueP*100):0}%</u></div>
        <div class="lg"><i style="background:#b3241f"></i><span>Behind by today</span>
          <b>${dueP-dueA}</b><u>${dueP?Math.round((dueP-dueA)/dueP*100):0}%</u></div>
        <div class="lgnote">${dueP} of ${lastP} committed dates have passed</div>
      </div></div>`;
  };
  const donut=(title,base,baseNote,segs,foot)=>{
    const tot=base||segs.reduce((t,x)=>t+x.n,0);
    const GAP=segs.filter(x=>x.n>0).length>1?1.2:0;   /* surface gap between fills */
    let off=25;                                        /* start at twelve o'clock */
    const ring=segs.map(x=>{
      const p=tot?x.n/tot*100:0;
      if(p<=0)return '';
      const dash=Math.max(0.4,p-GAP);
      const c=`<circle class="sg" cx="21" cy="21" r="15.9155" stroke="${x.c}"
        stroke-dasharray="${dash.toFixed(2)} ${(100-dash).toFixed(2)}"
        stroke-dashoffset="${off.toFixed(2)}"></circle>`;
      off-=p;                                          /* clockwise */
      return c;
    }).join('');
    /* a state nobody is in is noise, not information */
    const shown=segs.filter(x=>x.n>0);
    /* Largest remainder, the same helper the dashboard cards use. Rounding each
       share on its own let a legend print 101% — the second donut did exactly
       that — which invites the reader to distrust every other figure. */
    const shares=pct100(segs.map(x=>x.n));
    segs.forEach((x,i)=>{x._p=shares[i];});
    const legend=(shown.length?shown:segs.slice(0,1)).map(x=>
      `<div class="lg"><i style="background:${x.c}"></i>
      <span>${esc(x.t)}</span><b>${x.n}</b><u>${x._p}%</u></div>`).join('');
    return `<div class="rdo"><h4>${esc(title)}</h4>
      <div class="rdrow">
        <svg class="dn" viewBox="0 0 42 42" role="img" aria-label="${esc(title)}">
          <circle class="bg" cx="21" cy="21" r="15.9155"></circle>${ring}
          <text x="21" y="20.6" class="dnv">${tot}</text>
          <text x="21" y="25.4" class="dnl">${esc(baseNote)}</text>
        </svg>
        <div class="rdleg">${legend}${foot
          ?`<div class="lgnote">${esc(foot)}</div>`:''}</div>
      </div></div>`;
  };
  /* how many DOCUMENTS stand at this AWPT answer today */
  const stAt=k=>{const r=A.states.find(x=>x.k===k);return r?r.n:0;};
  /* Both donuts split the SAME population — every document on the plan — so the
     two can be read against each other. They previously used different bases:
     one counted documents that met this plan's commitment, the next counted
     documents that had ever been to AWPT, and the second was the larger. Two
     different meanings of "submitted" side by side is not a summary, it is a
     contradiction, so they now say plainly which question each answers. */
  const nTotal=T.n;
  /* THE PLAIN QUESTION FIRST: has this document gone to AWPT at all, yes or no.
     This donut used to answer a subtler one — was the commitment kept — which
     put a document submitted in May and returned RWC on the "not met" side. That
     is a fair thing to measure, and the curve and the Days-late column still do
     it, but it is not what "submitted" means to somebody reading a summary. */
  const nSent=rows.filter(x=>((x.doc&&x.doc.awptSubmitted)||'').trim()!=='').length;
  const nNot=T.n-nSent;
  /* AND SAY SO ON THE PAGE. The table below this donut, the Days late column and
     the curve all count only a submission that answers THIS commitment, which is
     a smaller number. Printing 31 above a table showing 23 with no explanation is
     the single thing a reader would seize on, and the tooltip that explained it
     does not exist on paper. */
  const nKept=T.done;
  /* where each of the same documents stands with AWPT today */
  const rnc=stAt('RNC'), rwc=stAt('RWC'), ur=stAt('Awaiting reply'),
        repl=stAt('Replied'), hold=stAt('On hold'), never=stAt('Not submitted');
  const nWith=rnc+rwc+ur+repl+hold+never;     /* closes on the same total */
  /* what the programme asked for by today, against what actually went */
  const dueByNow=rows.filter(x=>x.it.plannedDate&&x.it.plannedDate<=today);
  const goneByNow=dueByNow.filter(x=>x.st.k==='done'||x.st.k==='late');
  const nPlanned=dueByNow.length, nActual=goneByNow.length;

  /* oldest committed date first */
  const SHORT={done:'Submitted',late:'Submitted late',overdue:'Overdue',
               due:'Due',nodate:'No date',pending:'Planned'};
  /* GROUPED BY PROGRESS, outstanding first. A flat run of 44 rows in date order
     made the reader do the sorting: what is late is what the meeting is about,
     and it was scattered through the table. Within a group the oldest committed
     date still leads, so the worst case in each group is the first line of it. */
  const GRP=[['overdue','Overdue — committed date passed, nothing sent'],
             ['due','Due — the committed date has not passed yet'],
             ['pending','Planned — the week has not started'],
             ['late','Submitted late — sent after the committed date'],
             ['done','Submitted on time'],
             ['nodate','No committed date']];
  const rank=k=>{const i=GRP.findIndex(g=>g[0]===k);return i<0?GRP.length:i;};
  const ord=rows.slice().sort((a,b)=>{
    const ra=rank(a.st.k), rb=rank(b.st.k);
    if(ra!==rb)return ra-rb;
    const A1=a.it.plannedDate||'9999', B1=b.it.plannedDate||'9999';
    if(A1!==B1)return A1<B1?-1:1;
    return (a.doc.ref||'')<(b.doc.ref||'')?-1:1;
  });

  let n=0, lastK=null;
  const body=ord.map(x=>{
    n++; const L=planLine(x), r=x.doc, st=x.st;
    let head='';
    if(st.k!==lastK){
      lastK=st.k;
      const g=GRP.find(y=>y[0]===st.k);
      const cnt=ord.filter(y=>y.st.k===st.k).length;
      head=`<tr class="grp"><td colspan="10"><b>${esc(g?g[1]:(SHORT[st.k]||st.k))}</b>
        <span>${cnt} of ${T.n} · ${T.n?Math.round(cnt/T.n*100):0}%</span></td></tr>`;
    }
    const rowHead=head;
    const lateCls=L.late==='–'?'':(L.late>0?'p-over':'p-ok');
    return rowHead+`<tr>
      <td class="c-idx">${n}</td>
      <td class="c-ref">${esc((r.docNumber||'').split('\n')[0]||r.ref||'—')}</td>
      <td class="c-title">${esc(r.title||'')}</td>
      <td class="c-discipline">${esc(PRINT_DISC[r.discipline]||r.discipline||'')}</td>
      <td class="c-plannedDate">${esc(L.committed||'—')}</td>
      <td class="c-hSent">${esc(st.sub||'—')}</td>
      <td class="c-hOut">${esc(L.lastRev)}${L.lastCode
        ? ' <b class="'+(L.lastCode==='RNC'?'p-ok':L.lastCode==='with AWPT'?'p-wait':'p-over')+
          '">'+esc(L.lastCode)+'</b>' : ''}</td>
      <td class="c-hDays">${esc(String(L.cycles))}</td>
      <td class="c-hDays ${lateCls}">${L.late==='–'?'—':L.late}</td>
      <td class="c-status">${esc(SHORT[st.k]||st.k)}</td></tr>`;
  }).join('');

  return `<div class="rhead">
      <div class="rt"><h1>Taif Ar Rjum Package B — ${esc(title)}</h1>
        <div class="rs">Delayed design deliverables · Sub-Contract 111051/2026/0022</div></div>
      <div class="rd">${stamp}<br><span>${T.n} deliverable${T.n===1?'':'s'}</span></div>
    </div>
    <div class="rfilt"><b>Scope:</b> every ${kind==='review'?'review':'submission'} week on
      record${weeks.length?', '+esc(weekLabel(weeks[0].weekStart))+' to '+
      esc(weekLabel(weeks[weeks.length-1].weekStart)):''}, grouped by progress with
      what is outstanding first, and the oldest committed date first within each group.
      Across every revision these documents have ever been through, AWPT has
      answered ${A.answered} time${A.answered===1?'':'s'} — ${A.rwc} with comments
      and ${A.rnc} with none.${A.inferred?` Of those, ${A.inferred} verdict${
      A.inferred===1?' was':'s were'} not recorded by AWPT but worked out from
      whether HESCO resubmitted; they are marked ~ in the table and should be
      confirmed before this is relied on.`:''}</div>
    <div class="rdset">
      ${donut('Submitted to AWPT',nTotal,'on the plan',[

/* ================= review clock =================
   The Client's review window is counted in working days, Sunday to Thursday.
   An IFI document with no response inside 10 working days is deemed approved;
   IFR carries a 3 working-day target. Both are computed live from the date the
   document was issued, so the escalation list writes itself. */
const WD_START=0, WD_END=4;                 // Sun..Thu are working days
function workingDays(from,to){
  if(!from||!to)return null;
  const a=new Date(from), b=new Date(to);
  if(isNaN(a)||isNaN(b)||b<a)return null;
  let n=0; const d=new Date(a);
  d.setDate(d.getDate()+1);                 // the day of issue does not count
  while(d<=b){ const w=d.getDay(); if(w>=WD_START&&w<=WD_END)n++; d.setDate(d.getDate()+1); }
  return n;
}
const WINDOW={'IFI':10,'IFR':3,'AWPT-only':3};
function reviewClock(r){
  if(r.status!=='Under review')return null;
  /* THE CLOCK NEEDS A SUBMISSION TO RUN FROM. One document's rollup said 'Under
     review' with the ball in Maaden's court while both the Client leg table and
     the history showed it had never been sent to them — and on that alone it
     would have appeared in the client-facing escalation PDF as deemed approved.
     A deeming claim against the Client has to rest on a submission we can show. */
  if(!hasCycle(r,'Maaden'))return null;
  const from=r.issuedDate||r.heldSince;
  if(!from)return null;
  const used=workingDays(from,today);
  if(used==null)return null;
  const limit=WINDOW[r.reviewClass]||10;
  const over=used-limit;
  return {used,limit,over,from,
    k: over>0 ? (r.reviewClass==='IFI'?'deemed':'overdue') : (over>=-1?'due':'ok'),
    label: over>0 ? (r.reviewClass==='IFI'
              ? 'Deemed approved — '+over+' wd past the 10-day window'
              : over+' wd past the '+limit+'-day window')
            : (limit-used)+' wd left'};
}
function clockHTML(){
  const rows=AB.map(r=>({r,c:reviewClock(r)})).filter(x=>x.c)
    .sort((a,b)=>b.c.over-a.c.over);
  /* dropped from the clock because no Client submission evidences them — named
     here so the contradiction gets fixed rather than quietly disappearing */
  const unevidenced=AB.filter(r=>r.status==='Under review'&&!hasCycle(r,'Maaden'));
  const warn=unevidenced.length?`<div class="hint bad" style="margin-top:8px">${
    unevidenced.length} document${unevidenced.length===1?' is':'s are'} marked
    under Client review with no submission to the Client on record — ${
    unevidenced.slice(0,3).map(r=>esc(r.ref)).join(', ')}${
    unevidenced.length>3?' and others':''}. They are left off this clock until
    the submission is logged or the status is corrected.</div>`:'';
  if(!rows.length)return '<div class="empty">Nothing is with a reviewer.</div>'+warn;
  const past=rows.filter(x=>x.c.over>0), deemed=past.filter(x=>x.c.k==='deemed');
  return `<div class="chart" data-chart="clock">
    <div class="pgnum" style="margin-bottom:10px"><b>${past.length}</b>
      <span>past their review window${deemed.length?' · '+deemed.length+' IFI now deemed approved':''}</span></div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr><th>Document</th><th>Class</th><th>Issued</th>
        <th style="text-align:right">Working days</th><th>Position</th></tr></thead><tbody>
      ${rows.slice(0,25).map(({r,c})=>`<tr data-go="${r.id}" style="cursor:pointer">
        <td>${esc(r.title)}</td>
        <td class="ctr">${esc(r.reviewClass)}</td>
        <td class="mono">${esc(c.from)}</td>
        <td style="text-align:right" class="mono">${c.used} <span class="hint">/ ${c.limit}</span></td>
        <td><span class="pstate ${c.k==='deemed'?'st-done':c.k==='overdue'?'st-over':
             c.k==='due'?'st-late':'st-due'}">${esc(c.label)}</span></td></tr>`).join('')}
    </tbody></table>
    ${rows.length>25?`<div class="hint" style="margin-top:7px">Showing 25 of ${rows.length}.</div>`:''}
    <div class="hint" style="margin-top:8px">Working days counted Sunday to Thursday, from the day after issue.
      IFI is deemed approved after 10; IFR carries a 3-day target.</div>${warn}</div>`;

function trendHTML(){
  if(SNAPS.length<2)
    return `<div class="empty"><b>${SNAPS.length?'One snapshot so far':'No snapshots yet'}</b>
      Record one each week and the curve builds itself.</div>`;
  const W=920,H=210,PL=40,PR=16,PT=14,PB=28;
  const vals=SNAPS.map(s=>+s.pct||0);
  const max=Math.min(100,Math.max(20,Math.ceil(Math.max(...vals)/10)*10+10));
  const X=i=>PL+(W-PL-PR)*(SNAPS.length<2?.5:i/(SNAPS.length-1));
  const Y=v=>H-PB-(H-PT-PB)*(v/max);
  const line=k=>SNAPS.map((s,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+s[k]||0).toFixed(1)).join(' ');
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;
    g+=`<line class="gl" x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}"/>
        <text class="ax" x="${PL-8}" y="${Y(v)+3.5}" text-anchor="end">${Math.round(v)}%</text>`;}
  SNAPS.forEach((s,i)=>{const step=Math.ceil(SNAPS.length/8);
    if(SNAPS.length<10||i%step===0)
      g+=`<text class="ax" x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(s.takenOn.slice(5))}</text>`;});
  const last=SNAPS[SNAPS.length-1], prev=SNAPS[SNAPS.length-2];
  const move=(+last.pct-+prev.pct).toFixed(1);
  return `<div class="chart plot" data-chart="trend">
    <div class="pgnum" style="margin-bottom:8px"><b>${(+last.pct).toFixed(1)}%</b>
      <span>${move>=0?'up':'down'} ${Math.abs(move)} points since ${esc(prev.takenOn)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="plotsvg">${g}
      <path class="ln pln" d="${line('optPct')}"/>
      <path class="ln ret" d="${line('basePct')}"/>
      <path class="ln act" d="${line('pct')}"/>
      <g class="pts">${SNAPS.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(+s.pct||0)}" r="3"/>`).join('')}</g></svg>

      <span><i class="sw ret"></i>Base</span><span><i class="sw pln"></i>Optional</span>

}

/* ================= PDF report =================
   Rendered as a print stylesheet rather than a PDF library, so it needs no
   CDN, keeps the exact layout, and works on a phone (Share → Save to Files)
   as well as on a desktop (Print → Save as PDF). Landscape A4, tables only. */

function filterLabel(){
  const bits=[], S=MOBILE?{fd:MOB.fd,fs:MOB.fs,fx:MOB.f,q:MOB.q,fh:''}
                        :{fd:GRID.fd,fs:GRID.fs,fx:GRID.fx,q:GRID.q,fh:GRID.fh};
  if(LEG!=='all')bits.push(LEG==='hesco'?'HESCO → AWPT':'AWPT → Maaden');
  if(S.fd)bits.push(S.fd);
  /* say the state in the leg's own words — "Code Awaiting reply" was nonsense */
  if(S.fs)bits.push(LEG==='maaden'?maadenLabel(S.fs):statusText(S.fs));
  if(S.fh)bits.push('with '+S.fh);
  const fx=(LEGFX[LEG]||LEGFX.all).find(x=>x[0]===S.fx);
  if(S.fx&&fx&&fx[0])bits.push(fx[1]);
  if(S.q)bits.push('Search: "'+S.q+'"');
  return bits.length?bits.join(' · ')
    :'Complete register — no filter applied';
}
function reportRows(){ return MOBILE?mobRows():(GRID&&GRID.rows?GRID.rows:AB); }
function reportCols(){
  /* The report follows the leg you are printing, or it tells you about the wrong
     submission. A landscape page holds about eleven columns. */
  const set = LEG==='hesco'
    ? ['docNumber','title','discipline','reviewClass','hOut','hCourt',
       'plannedDate','hSent','hBack','hDays','toClient']
    : LEG==='maaden'
    ? ['docNumber','title','discipline','reviewClass','mOut','mCourt',
       'plannedDate','mSent','mBack','mDays']
    : ['docNumber','title','discipline','reviewClass','scope','status','holder',
       'plannedDate','awptSubmitted','issuedDate','respondedDate'];
  return set.map(k=>COLBY[k]).filter(Boolean);
}

const PRINT_DISC=SHORT_DISC;
const PRINT_HEAD={docNumber:'Document number',ref:'Ref',title:'Document',discipline:'Discipline',
  reviewClass:'Class',scope:'Scope',status:'Status',holder:'Ball in court',
  plannedDate:'Planned',issuedDate:'Issued to Maaden',respondedDate:'Response',
  awptSubmitted:'Sent to AWPT',
  hOut:'AWPT status', hSent:'Sent to AWPT', hBack:'AWPT replied', hDays:'Days', toClient:'To Maaden',
  hCourt:'Ball in court', mCourt:'Ball in court',
  mOut:'Maaden status', mSent:'Sent to Maaden', mBack:'Maaden replied', mDays:'Days'};

function buildReport(){
  const rows=reportRows(), cols=reportCols();
  const n=rows.length;
  const base=rows.filter(inBase);
  const pct=base.length?Math.round(base.reduce((t,r)=>t+creditOf(r),0)/base.length*10)/10:0;
  const stamp=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  const cell=(r,c)=>{
    let v=c.calc?c.calc(r):(r[c.k]??'');
    if(c.k==='status')v=statusText(v)||'Not issued';
    if(c.k==='discipline')v=PRINT_DISC[v]||v;
    if(c.k==='mOut')v=maadenLabel(v);
    /* an AWPT-only verdict is worked out, not recorded — say so on paper too */
    if(c.k==='hOut'&&isInferred(lastCycle(r,'HESCO')))v=v+' ~';
    return v||'—';
  };
  const head=cols.map(c=>`<th class="c-${c.k}">${esc(PRINT_HEAD[c.k]||c.t)}</th>`).join('');
  const body=rows.map((r,i)=>`<tr><td class="c-idx">${i+1}</td>`+
      cols.map(c=>`<td class="c-${c.k}">${esc(cell(r,c))}</td>`).join('')+`</tr>`).join('');

  const kpi=(l,v)=>`<div class="rk"><b>${v}</b><span>${l}</span></div>`;
  /* The figures must add up to the rows underneath them. On a leg they count
     that leg's states; on Everything, the document's. */
  const cnt=f=>rows.filter(f).length;
  const heads = LEG==='all'
    ? kpi('In selection',n)+kpi('Progress',pct+'%')+
      kpi('Approved',cnt(r=>APPROVED.includes(r.status)))+
      kpi('Under review',cnt(r=>r.status==='Under review'))+
      kpi('Not issued',cnt(r=>r.status==='Not issued'))+
      kpi('With HESCO',cnt(r=>r.holder==='HESCO'))+
      kpi('With AWPT',cnt(r=>r.holder==='AWPT'))+
      kpi('With Maaden',cnt(r=>r.holder==='Maaden'))+
      kpi('Past planned',cnt(r=>r.holder!=='Closed'&&r.plannedDate&&r.plannedDate<today))
    : LEGSTATE(LEG).map(st=>kpi(st.t,cnt(r=>legOf(r,LEG)===st.k)))
        .join('')+kpi('Past planned',cnt(r=>legLate(r,LEG)));
  const headline = LEG==='all' ? heads : kpi('In selection',n)+heads;
  return `<div class="rhead">
      <div class="rt"><h1>Taif Ar Rjum Package B — Design Deliverables</h1>
        <div class="rs">LOD register · Sub-Contract 111051/2026/0022</div></div>
      <div class="rd">${stamp}<br><span>${n} document${n===1?'':'s'}</span></div>
    </div>
    <div class="rfilt"><b>Selection:</b> ${esc(filterLabel())}</div>
    <div class="rkpis">${headline}</div>
    <table class="rtbl"><thead><tr><th class="c-idx">#</th>${head}</tr></thead>
      <tbody>${body}</tbody></table>
    <div class="rfoot">Taif Ar Rjum LOD Register · ${esc(filterLabel())} · ${stamp}${
      USER?' · issued by '+esc(USER.name):''}</div>`;
}
function exportPDF(){
  const rows=reportRows();
  if(!rows.length)return toast('Nothing to export with those filters');
  let root=document.getElementById('printroot');
  if(!root){ root=document.createElement('div'); root.id='printroot'; document.body.appendChild(root); }
  root.innerHTML=buildReport();
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing');
    window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done,1500); },60);
  toast(rows.length+' rows — set Landscape, then Save as PDF');
}
