let MENUK=null;
function openMenu(k,anchor){
  MENUK=k;
  const c=COLS[colOf(k)];
  const vals=(k==='responsible'?nameValues()
    :[...new Set(ITEMS.map(r=>get({kind:'item',rec:r,kids:0,acts:kidsOf(r.id)},c)))]).sort();
  const f=FILT[k]||{vals:null,text:''};
  let h='<button class="mi" data-act="asc">▲ Sort A → Z</button>'
       +'<button class="mi" data-act="desc">▼ Sort Z → A</button>'
       +'<button class="mi" data-act="nosort">↕ Original order</button>'
       +'<div class="msep"></div>'
       +'<input class="f" id="mfind" placeholder="Contains…" value="'+esc(f.text||'')+'">'
       +'<div class="vals" id="mvals">';
  vals.forEach(v=>{
    const on=!f.vals||f.vals.has(v);
    h+='<label><input type="checkbox" value="'+esc(v)+'"'+(on?' checked':'')+'>'
      +'<span>'+(v===''?'<i style="color:var(--ink3)">(blank)</i>':esc(v))+'</span></label>';
  });
  h+='</div><div class="row"><button data-act="all">All</button>'
    +'<button data-act="none">None</button>'
    +'<button data-act="apply" style="border-color:var(--violet);color:#e9d5ff">Apply</button></div>';
  const m=$('menu'); m.innerHTML=h; m.classList.add('on');
  const b=anchor.getBoundingClientRect();
  m.style.left=Math.min(window.innerWidth-248,Math.max(8,b.left-190))+'px';
  m.style.top=(b.bottom+6)+'px';
}
function closeMenu(){$('menu').classList.remove('on');MENUK=null;}
function menuAct(act){
  const k=MENUK; if(!k)return;
  if(act==='asc'){SORT={k,dir:1};closeMenu();paint();return;}
  if(act==='desc'){SORT={k,dir:-1};closeMenu();paint();return;}
  if(act==='nosort'){SORT=null;closeMenu();paint();return;}
  const boxes=[...$('menu').querySelectorAll('#mvals input')];
  if(act==='all'){boxes.forEach(b=>b.checked=true);return;}
  if(act==='none'){boxes.forEach(b=>b.checked=false);return;}
  if(act==='apply'){
    const text=($('mfind').value||'').trim();
    const on=boxes.filter(b=>b.checked).map(b=>b.value);
    if(on.length===boxes.length&&!text)delete FILT[k];
    else FILT[k]={vals:on.length===boxes.length?null:new Set(on),text};
    closeMenu(); paint();
  }
}

/* ============================================================
   Export and import
   ============================================================ */
const EXCOLS=()=>COLS;
function sheetData(){
  const head=EXCOLS().map(c=>c.lb);
  const rows=VIEW.map(nd=>EXCOLS().map(c=>
    c.kind==='no'?nd.no
    :c.kind==='acts'?(nd.acts||[]).map((a,i)=>(i+1)+'. '+(a.text||'')
        +(a.due?'  (due '+a.due+')':'')+(a.status==='Closed'?'  ✓':'')).join('\n')
    :get(nd,c)));
  return [head,...rows];
}
/* ============================================================
   Excel export — the workbook is meant to look like the register:
   the same violet, the same status colours, the actions numbered inside
   one cell with the closed ones struck through. SheetJS's free build
   drops all styling, so this is built with ExcelJS.
   ============================================================ */
const XC={                                   /* straight from the app's CSS */
  head:'FF241A3F', headInk:'FFE9D5FF',
  row:'FF171029', rowAlt:'FF1B1330', line:'FF332552',
  ink:'FFF5F2FF', ink2:'FFBDB2D8', ink3:'FF8B81A8',
  violet:'FFA855F7', good:'FF6EE7B7', warn:'FFFCD34D', hot:'FFFDA4AF', sky:'FF7DD3FC'
};
/* a translucent chip over the dark card, flattened to one solid colour */
function blend(hex,a){
  const base=[0x1B,0x13,0x30];
  const c=[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
  return 'FF'+c.map((v,i)=>Math.round(base[i]*(1-a)+v*a).toString(16).padStart(2,'0'))
               .join('').toUpperCase();
}
const XSTAT={
  'Open':        {fg:XC.sky,  bg:blend('38BDF8',.15)},
  'In progress': {fg:XC.warn, bg:blend('FBBF24',.15)},
  'On hold':     {fg:'FFC4BCDA', bg:blend('8B81A8',.18)},
  'Closed':      {fg:XC.good, bg:blend('34D399',.15)}
};
const XPRIO={1:{fg:XC.hot,bg:blend('F43F5E',.18)}, 2:{fg:'FFFDBA74',bg:blend('FB923C',.18)},
             3:{fg:XC.sky,bg:blend('38BDF8',.16)}, 4:{fg:'FFB8B0CD',bg:blend('8B81A8',.16)}};
const solid=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});
const edge=()=>({top:{style:'thin',color:{argb:XC.line}},
                 left:{style:'thin',color:{argb:XC.line}},
                 bottom:{style:'thin',color:{argb:XC.line}},
                 right:{style:'thin',color:{argb:XC.line}}});
const colLetter=i=>{let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;
  n=Math.floor((n-1)/26);}return s;};

function buildWorkbook(){
  const EX=(typeof ExcelJS!=='undefined')?ExcelJS:(typeof window!=='undefined'&&window.ExcelJS);
  if(!EX)return null;
  const wb=new EX.Workbook();
  wb.creator='Action list'; wb.created=new Date();
  const ws=wb.addWorksheet('Action list',{
    views:[{state:'frozen',xSplit:2,ySplit:1}],
    properties:{defaultRowHeight:18}
  });
  const cols=COLS;
  /* the header has to be declared WITH the columns — assigning ws.columns
     afterwards blanks a header row that was added separately */
  ws.columns=cols.map(c=>({header:c.lb,width:Math.max(6,Math.round(c.w/7.2))}));

  const hr=ws.getRow(1);
  hr.height=24;
  hr.eachCell(cell=>{
    cell.fill=solid(XC.head);
    cell.font={bold:true,size:10,color:{argb:XC.headInk},name:'Segoe UI'};
    cell.alignment={vertical:'middle',horizontal:'left'};
    cell.border=edge();
  });

  const today=TODAY();
  VIEW.forEach((nd,i)=>{
    const r=nd.rec, acts=nd.acts||[];
    const closed=r.status==='Closed';
    const row=ws.addRow([]);
    const put=(k,v)=>{ const ci=colOf(k)+1; row.getCell(ci).value=v; return row.getCell(ci); };

    put('__no',nd.no).alignment={horizontal:'center',vertical:'top'};
    const dc=put('description',r.description||'');
    dc.font={bold:true,size:11,color:{argb:XC.ink},name:'Segoe UI'};
    dc.alignment={wrapText:true,vertical:'top'};

    /* the action list, numbered, in ONE cell — closed ones struck through,
       overdue dates in red, exactly as the register draws them */
    const ac=row.getCell(colOf('__acts')+1);
    if(acts.length){
      const rich=[];
      acts.forEach((a,j)=>{
        const ad=a.status==='Closed', od=!ad&&a.due&&a.due<today;
        if(j)rich.push({font:{size:10,color:{argb:XC.ink3}},text:'\n'});
        rich.push({font:{size:10,bold:true,
          color:{argb:ad?XC.good:od?XC.hot:XC.violet},name:'Segoe UI'},text:(j+1)+'. '});
        rich.push({font:{size:10,name:'Segoe UI',strike:ad,
          color:{argb:ad?XC.ink3:XC.ink}},text:a.text||'—'});
        if(a.due)rich.push({font:{size:9,name:'Segoe UI',
          color:{argb:od?XC.hot:XC.ink3}},text:'   '+shortDay(a.due)});
      });
      ac.value={richText:rich};
    }else{
      ac.value='— no actions yet —';
      ac.font={size:10,italic:true,color:{argb:XC.ink3},name:'Segoe UI'};
    }
    ac.alignment={wrapText:true,vertical:'top'};

    put('project',r.project||'');
    put('responsible',get(nd,COLS[colOf('responsible')]));
    const pc=put('priority',r.priority?Number(r.priority):null);
    const ps=XPRIO[r.priority]||XPRIO[4];
    pc.fill=solid(ps.bg);
    pc.font={bold:true,size:10,color:{argb:ps.fg},name:'Segoe UI'};
    pc.alignment={horizontal:'center',vertical:'top'};

    const sc=put('status',r.status||'Open');
    const st=XSTAT[r.status]||XSTAT.Open;
    sc.fill=solid(st.bg);
    sc.font={bold:true,size:10,color:{argb:st.fg},name:'Segoe UI'};
    sc.alignment={horizontal:'center',vertical:'top'};

    put('raised',r.raised||'');
    const du=put('due',r.due||'');
    if(r.due&&!closed&&r.due<today)
      du.font={bold:true,size:10,color:{argb:XC.hot},name:'Segoe UI'};
    put('closed',r.done_at||'');
    put('notes',r.notes||'').alignment={wrapText:true,vertical:'top'};

    /* banding, borders, and the default ink for anything not set above */
    row.eachCell({includeEmpty:true},cell=>{
      if(!cell.fill)cell.fill=solid(i%2?XC.rowAlt:XC.row);
      if(!cell.font)cell.font={size:10,color:{argb:XC.ink2},name:'Segoe UI'};
      if(!cell.alignment)cell.alignment={vertical:'top'};
      cell.border=edge();
    });
    /* tall enough for the whole action list, like the row heights on screen */
    const lines=Math.max(acts.length||1,String(r.description||'').split('\n').length,
      Math.ceil((r.description||'').length/38));
    row.height=Math.max(18,Math.min(240,lines*14.5+6));
  });

  const last=VIEW.length+1;
  ws.autoFilter={from:{row:1,column:1},to:{row:last,column:cols.length}};

  /* live rules, so the colours follow the sheet if it is edited in Excel */
  if(VIEW.length){
    const S=colLetter(colOf('status')), D=colLetter(colOf('due'));
    const body='A2:'+colLetter(cols.length-1)+last;
    ws.addConditionalFormatting({ref:S+'2:'+S+last,rules:
      Object.keys(XSTAT).map((k,idx)=>({type:'cellIs',operator:'equal',priority:idx+1,
        formulae:['"'+k+'"'],
        style:{fill:solid(XSTAT[k].bg),font:{bold:true,color:{argb:XSTAT[k].fg}}}}))});
    ws.addConditionalFormatting({ref:D+'2:'+D+last,rules:[
      {type:'expression',priority:1,
       formulae:['AND($'+D+'2<>"",$'+D+'2<TODAY(),$'+S+'2<>"Closed")'],
       style:{font:{bold:true,color:{argb:XC.hot}}}},
      {type:'expression',priority:2,
       formulae:['AND($'+D+'2=TEXT(TODAY(),"yyyy-mm-dd"),$'+S+'2<>"Closed")'],
       style:{font:{bold:true,color:{argb:XC.warn}}}}]});
    ws.addConditionalFormatting({ref:body,rules:[
      {type:'expression',priority:3,formulae:['$'+S+'2="Closed"'],
       style:{font:{color:{argb:XC.ink3}}}}]});
  }

  /* the history, same treatment */
  const anyLog=Object.keys(LOGS).length;
  if(anyLog){
    /* Excel reserves the sheet name "History" for change tracking and refuses
       to open a workbook that uses it */
    const hs=wb.addWorksheet('Action history',{views:[{state:'frozen',ySplit:1}]});
    hs.columns=[{header:'Item',width:30},{header:'Action',width:34},
      {header:'When',width:17},{header:'Kind',width:11},{header:'Entry',width:44}];
    const h=hs.getRow(1);
    h.height=22;
    h.eachCell(c=>{c.fill=solid(XC.head);
      c.font={bold:true,size:10,color:{argb:XC.headInk},name:'Segoe UI'};
      c.border=edge();});
    let k=0;
    ACTS.forEach(a=>{
      const it=ITEMS.find(i=>i.id===a.item_id)||{};
      (LOGS[a.id]||[]).slice().reverse().forEach(l=>{
        const row=hs.addRow([it.description||'',a.text||'',whenTxt(l.at),l.kind||'',l.note||'']);
        const tint=l.kind==='closed'?XC.good:l.kind==='reopened'?XC.warn
                  :l.kind==='note'?XC.violet:XC.ink3;
        row.eachCell({includeEmpty:true},c=>{
          c.fill=solid((k%2)?XC.rowAlt:XC.row);
          c.font={size:10,color:{argb:XC.ink2},name:'Segoe UI'};
          c.alignment={wrapText:true,vertical:'top'};
          c.border=edge();
        });
        row.getCell(4).font={size:10,bold:true,color:{argb:tint},name:'Segoe UI'};
        k++;
      });
    });
  }
  return wb;
}
/* the log is normally read one action at a time, when a panel opens — the
   export needs the lot, so fetch it here rather than on every page load */
async function fetchAllLogs(){
  try{
    const rows=await api('task_action_log?select=id,action_id,at,kind,note&order=id.asc');
    LOGS={};
    (rows||[]).forEach(r=>{(LOGS[r.action_id]=LOGS[r.action_id]||[]).push(r);});
  }catch(e){}
}
async function exportXLSX(){
  if(ACTS.length)await fetchAllLogs();
  const wb=buildWorkbook();
  if(!wb)return toast('The spreadsheet library did not load — try again online');
  try{
    const buf=await wb.xlsx.writeBuffer();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download='Action list '+TODAY()+'.xlsx'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Exported '+VIEW.length+' rows');
  }catch(e){ toast('Could not build the file: '+e.message); }
}
function exportXLSX_old(){
  if(typeof XLSX==='undefined')
    return toast('The spreadsheet library did not load — try again online');
  const ws=XLSX.utils.aoa_to_sheet(sheetData());
  ws['!cols']=EXCOLS().map(c=>({wpx:c.w}));
  ws['!autofilter']={ref:XLSX.utils.encode_range(
    {s:{r:0,c:0},e:{r:VIEW.length,c:EXCOLS().length-1}})};
  /* Actions, Description and Notes can all hold several lines — let Excel wrap */
  const multiCols=[colOf('__acts'),colOf('description'),colOf('notes')];
  VIEW.forEach((nd,i)=>multiCols.forEach(c=>{
    const ref=XLSX.utils.encode_cell({r:i+1,c});
    if(ws[ref])ws[ref].s={alignment:{wrapText:true,vertical:'top'}};
  }));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Action list');
  const hist=[['Item','Action','When','Kind','Entry']];
  ACTS.forEach(a=>{
    const it=ITEMS.find(i=>i.id===a.item_id)||{};
    (LOGS[a.id]||[]).slice().reverse().forEach(l=>
      hist.push([it.description||'',a.text||'',whenTxt(l.at),l.kind||'',l.note||'']));
  });
  if(hist.length>1){
    const hs=XLSX.utils.aoa_to_sheet(hist);
    hs['!cols']=[{wpx:220},{wpx:240},{wpx:120},{wpx:80},{wpx:320}];
    XLSX.utils.book_append_sheet(wb,hs,'History');
  }
  XLSX.writeFile(wb,'Action list '+TODAY()+'.xlsx');
  toast('Exported '+VIEW.length+' rows');
}
function exportCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=sheetData().map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='Action list '+TODAY()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Exported '+VIEW.length+' rows');
}
async function importFile(file){
  if(!file)return;
  if(typeof XLSX==='undefined')
    return toast('The spreadsheet library did not load — try again online');
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
    {header:1,raw:false,defval:''});
  if(!aoa.length)return toast('That file looks empty');
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  let actsCol=-1;
  const map=aoa[0].map((h,i)=>{
    const n=norm(h);
    if(n==='level')return -1;
    if(n==='actions'||n==='action'){actsCol=i;return -1;}
    const c=COLS.find(c=>norm(c.lb)===n||norm(c.k)===n
      ||(n==='task'&&c.k==='description')||(n==='item'&&c.k==='description')
      ||(n==='owner'&&c.k==='responsible')||(n==='duedate'&&c.k==='due'));
    return (c&&c.kind!=='no'&&c.kind!=='acts'&&!c.ro)?colOf(c.k):-1;
  });
  if(!map.some(i=>i>=0)&&actsCol<0)
    return toast('No matching column headings — the first row must name the columns');
  const lines=aoa.slice(1).filter(r=>r.some(v=>String(v).trim()!==''));
  if(!lines.length)return toast('No rows to import');
  const nAct=lines.reduce((t,l)=>t+(actsCol>=0
    ?String(l[actsCol]||'').split(/\n|\s*;\s*/).filter(x=>x.trim()).length:0),0);
  const ok=await confirmBox('Import '+lines.length+' row'+(lines.length>1?'s':'')+'?',
    (nAct?'Their Actions cells hold '+nAct+' action'+(nAct>1?'s':'')
      +', which are created too. ':'')
    +'Everything is added at the bottom; nothing already here is changed.');
  if(!ok)return;
  const base=ITEMS.length?Math.max(...ITEMS.map(r=>r.sort||0)):0;
  const made=[]; let n=0;
  for(const line of lines){
    const vals={};
    map.forEach((ci,j)=>{if(ci<0)return;const c=COLS[ci];vals[c.k]=coerce(c,line[j]);});
    try{
      const d=vals.description||'';
      const out=await api('task_items',{method:'POST',body:JSON.stringify([{
        description:d,title:d,project:vals.project||'',
        responsible:vals.responsible||'',priority:vals.priority||4,
        status:vals.status||'Open',raised:vals.raised||TODAY(),
        due:vals.due||'',notes:vals.notes||'',sort:base+(++n)}])});
      if(!out||!out[0])continue;
      made.push({kind:'item',id:out[0].id});
      if(actsCol>=0){
        const acts=String(line[actsCol]||'').split(/\n|\s*;\s*/)
          .map(t=>t.replace(/^\s*\d+\s*[.)\-]\s*/,'').replace(/\s*\(due [^)]*\)/,'')
                   .replace(/\s*✓\s*$/,'').trim())
          .filter(t=>t.length);
        let k=0;
        for(const t of acts){
          const a=await api('task_actions',{method:'POST',body:JSON.stringify([{
            item_id:out[0].id,text:t,status:'Open',
            responsible:vals.responsible||'',due:'',sort:++k}])});
          if(a&&a[0])made.push({kind:'action',id:a[0].id});
        }
      }
    }catch(e){toast('Import stopped: '+e.message);break;}
  }
  UNDO.push({t:'add',made});
  await loadAll(); await loadLogCounts(); paint();
  toast('Imported '+n+' rows','Undo',undo);
}

/* ============================================================
   Small UI helpers
   ============================================================ */
let toastT=null;
function toast(msg,action,fn){
  const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(action?'<span class="u">'+esc(action)+'</span>':'');
  t.classList.add('on');
  if(action&&fn)t.querySelector('.u').onclick=()=>{t.classList.remove('on');fn();};
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),action?6000:2600);
}
function confirmBox(title,note){
  return new Promise(res=>{
    $('dlg').innerHTML='<h3>'+esc(title)+'</h3><p class="d">'+esc(note||'')+'</p>'
      +'<div class="acts"><button class="tbtn" id="dno">Cancel</button>'
      +'<button class="tbtn primary" id="dyes">Yes</button></div>';
    $('scrim').classList.add('on');
    const done=v=>{$('scrim').classList.remove('on');res(v);};
    $('dno').onclick=()=>done(false);
    $('dyes').onclick=()=>done(true);
    $('scrim').onclick=e=>{if(e.target===$('scrim'))done(false);};
  });
}

/* ============================================================
   Wiring
   ============================================================ */
let DRAG=false, DOWN=null;
/* is this element somewhere text is being typed, rather than the grid? */
function typing(el){
  if(!el||!el.closest)return false;
  if(el.closest('.cellin'))return false;          /* the grid's own editor */
  if(el.isContentEditable)return true;
  const tag=(el.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return true;
  return !!el.closest('#sheet, #scrim, #menu');   /* any panel or dialog */
}
function wireGrid(){
  const gb=$('gbody');
  gb.addEventListener('mousedown',e=>{
    if(e.target.closest('.cellin'))return;
    if(e.target.closest('[data-act]'))return;
    const td=e.target.closest('td'); if(!td||td.dataset.r===undefined)return;
    const r=+td.dataset.r, c=+td.dataset.c;
    if(EDIT)commitEdit();
    if(COLS[c].kind==='no'){CUR={r,c:FIRSTC};ANC={r,c:COLS.length-1};paintSel();return;}
    const was=(CUR.r===r&&CUR.c===c);
    if(e.shiftKey)CUR={r,c}; else {CUR={r,c};ANC={r,c};}
    DOWN={r,c,x:e.clientX,y:e.clientY,was:was&&!e.shiftKey};
    DRAG=true; paintSel(); $('gwrap').focus();
  });
  /* a click that did not move and landed on the cell already under the cursor
     opens it, the way a second click does in a spreadsheet */
  gb.addEventListener('click',e=>{
    const ab=e.target.closest('[data-act]');
    if(ab){e.stopPropagation();
      const a=ACTS.find(x=>x.id===+ab.dataset.act);
      openAction(+ab.dataset.act,a?a.item_id:null); return;}
    if(e.target.closest('.cellin'))return;
    const td=e.target.closest('td');
    if(!td||td.dataset.r===undefined||!DOWN)return;
    const moved=Math.abs(e.clientX-DOWN.x)>4||Math.abs(e.clientY-DOWN.y)>4;
    const same=+td.dataset.r===DOWN.r&&+td.dataset.c===DOWN.c;
    if(DOWN.was&&same&&!moved&&!EDIT)beginEdit();
    DOWN=null;
  });
  gb.addEventListener('mouseover',e=>{
    if(!DRAG)return;
    const td=e.target.closest('td'); if(!td||td.dataset.r===undefined)return;
    const c=+td.dataset.c; if(COLS[c].kind==='no')return;
    CUR={r:+td.dataset.r,c}; paintSel();
  });
  document.addEventListener('mouseup',()=>{DRAG=false;});
  gb.addEventListener('dblclick',e=>{
    const td=e.target.closest('td');
    if(!td||td.dataset.r===undefined||e.target.closest('.cellin'))return;
    CUR={r:+td.dataset.r,c:+td.dataset.c}; ANC={...CUR};
    paintSel(); beginEdit();
  });
  $('ghead').addEventListener('click',e=>{
    const mb=e.target.closest('[data-menu]');
    if(mb){e.stopPropagation();openMenu(mb.dataset.menu,mb);return;}
    const s=e.target.closest('[data-sort]');
    if(s){
      const k=s.dataset.sort;
      SORT=(SORT&&SORT.k===k)?(SORT.dir>0?{k,dir:-1}:null):{k,dir:1};
      paint();
    }
  });
  $('menu').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(b)menuAct(b.dataset.act);
    e.stopPropagation();
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#menu')&&!e.target.closest('[data-menu]'))closeMenu();
  });
  $('gwrap').addEventListener('keydown',onKey);
  /* The grid only claims a paste when nothing else is taking typing. Naming
     the few fields to skip was wrong — every new box in a panel had to be
     remembered, and any one forgotten dumped the clipboard into the grid.
     Ask what has focus instead. */
  document.addEventListener('paste',e=>{
    if(EDIT)return;
    if(typing(e.target)||typing(document.activeElement))return;
    const t=(e.clipboardData||window.clipboardData).getData('text');
    if(t){e.preventDefault();doPasteText(t);}
  });
}
function onKey(e){
  if(EDIT)return;
  const mod=e.ctrlKey||e.metaKey, k=e.key;
  if(mod&&k==='Enter'){e.preventDefault();addAction();return;}
  if(k==='Escape'&&$('sheet').classList.contains('on')){
    $('sheet').classList.remove('on');return;}
  if(mod&&(k==='c'||k==='C')){e.preventDefault();doCopy();return;}
  if(mod&&(k==='x'||k==='X')){e.preventDefault();doCopy().then(clearSel);return;}
  if(mod&&(k==='z'||k==='Z')){e.preventDefault();undo();return;}
  if(mod&&(k==='d'||k==='D')){e.preventDefault();fillDown();return;}
  if(mod&&(k==='a'||k==='A')){e.preventDefault();ANC={r:0,c:FIRSTC};
    CUR={r:VIEW.length-1,c:COLS.length-1};paintSel();return;}
  if(mod&&(k==='f'||k==='F')){e.preventDefault();$('q').focus();return;}
  if(k==='ArrowUp'){e.preventDefault();move(-1,0,e.shiftKey);return;}
  if(k==='ArrowDown'){e.preventDefault();move(1,0,e.shiftKey);return;}
  if(k==='ArrowLeft'){e.preventDefault();move(0,-1,e.shiftKey);return;}
  if(k==='ArrowRight'){e.preventDefault();move(0,1,e.shiftKey);return;}
  if(k==='Tab'){e.preventDefault();move(0,e.shiftKey?-1:1,false);return;}
  if(k==='Home'){e.preventDefault();goto_(mod?0:CUR.r,FIRSTC,e.shiftKey);return;}
  if(k==='End'){e.preventDefault();goto_(mod?VIEW.length-1:CUR.r,COLS.length-1,e.shiftKey);return;}
  if(k==='PageDown'){e.preventDefault();move(12,0,e.shiftKey);return;}
  if(k==='PageUp'){e.preventDefault();move(-12,0,e.shiftKey);return;}
  if(k==='Enter'||k==='F2'){e.preventDefault();beginEdit();return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel();return;}
  if(k==='Escape'){ANC={...CUR};paintSel();return;}
  if(!mod&&!e.altKey&&k.length===1){e.preventDefault();beginEdit(k);}
}
function wireTools(){
  $('badd').onclick=()=>addItems(1);
  $('bact').onclick=addAction;
  $('bsplit').onclick=()=>{
    const node=VIEW[CUR.r];
    if(!node||!(node.acts||[]).length)
      return toast('That row has no actions to split out');
    if(node.acts.length===1)return splitAction(node.acts[0].id);
    openAction(node.acts[0].id);
    toast('Open the action you want, then use Split in the panel');
  };
  $('bins').onclick=insertAbove;
  $('bdel').onclick=deleteRows;
  $('bcopy').onclick=doCopy;
  $('bpaste').onclick=doPasteButton;
  $('bfill').onclick=fillDown;
  $('bundo').onclick=undo;
  $('bxl').onclick=exportXLSX;
  $('bcsv').onclick=exportCSV;
  $('bimp').onclick=()=>$('fimp').click();
  $('fimp').onchange=e=>{importFile(e.target.files[0]);e.target.value='';};
  $('bfit').onclick=autofitAll;
  $('bwrap').onclick=toggleWrap;
  $('bclear').onclick=()=>{FILT={};SEARCH='';SORT=null;$('q').value='';paint();};
  let qt=null;
  $('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{
    SEARCH=e.target.value.trim().toLowerCase();paint();},160);};
  $('qx').onclick=()=>{$('q').value='';SEARCH='';paint();$('q').focus();};
  $('signout').onclick=()=>{
    try{localStorage.removeItem('task-session');}catch(e){}
    location.reload();
  };
}

/* ============================================================
   Boot
   ============================================================ */
async function startApp(){
  loadPrefs();
  await loadAll();
  await loadLogCounts();
  paint();
  wireGrid(); wireTools(); wireResize(); wireRowResize(); wireMobile();
  $('app').classList.add('ready');
  $('gwrap').focus();
}
async function boot(){
  $('lgo').onclick=async()=>{
    $('lerr').textContent='';
    const em=$('lem').value.trim(), pw=$('lpw').value;
    if(!em||!pw){$('lerr').textContent='Both fields, please.';return;}
    $('lgo').disabled=true; $('lgo').textContent='Signing in…';
    try{
      await signIn(em,pw);
      $('login').classList.remove('on');
      await startApp();
    }catch(err){
      $('lerr').textContent=err.message;
      $('lgo').disabled=false; $('lgo').textContent='Sign in';
    }
  };
  $('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click();});
  let why='';
  try{
    if(await resume()){
      try{await startApp();return;}
      catch(e){console.error(e);why=offlineish(e)
        ?'Could not reach the server. Check the connection and sign in again.'
        :('Could not load your list: '+(e&&e.message||e));}
    }
  }catch(e){
    console.error(e);
    why='Could not reach the server. Check the connection, then sign in.';
  }
  $('login').classList.add('on');
  if(why)$('lerr').textContent=why;
  $('lem').focus();
}
const offlineish=e=>/offline|failed to fetch|networkerror|load failed/i.test(
  String(e&&e.message||e));
/* whatever happens, the person must end up looking at SOMETHING */
boot().catch(err=>{
  console.error(err);
  try{
    $('login').classList.add('on');
    $('lerr').textContent='Something went wrong starting up: '
      +(err&&err.message||err)+'. Reload to try again.';
  }catch(e){
    document.body.innerHTML='<p style="color:#f5f2ff;font:15px sans-serif;padding:28px">'
      +'The app could not start. Reload the page.</p>';
  }
});
